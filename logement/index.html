<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture Live — Logement</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf7f1}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fbf7f1}</style></head><body><iframe id="game" src="../hc-live/?resume=1" title="Choix du logement"></iframe><script>(function(){const KEY='haute-couture-current-screen';localStorage.setItem(KEY,'location');const frame=document.getElementById('game');function restore(){try{const w=frame.contentWindow;if(w&&typeof w.displayScreen==='function'){w.displayScreen('location');return}setTimeout(restore,100)}catch(e){setTimeout(restore,100)}}frame.addEventListener('load',restore);})();</script></body></html>
