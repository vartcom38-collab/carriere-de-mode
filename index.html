<title>Haute Couture Live</title>
<style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#fbf7f1;color:#111;font:700 13px Arial,sans-serif;letter-spacing:.18em}</style>
</head>
<body>HAUTE COUTURE ✦ LIVE ✦
<script>
(function(){
  const s=localStorage.getItem('haute-couture-current-screen')||'character';
  if(s==='character'||s==='characters'||s==='creator') location.replace('./character/');
  else if(s==='location'||s==='logement') location.replace('./logement/');
  else location.replace('./hc-live/?resume=1');
})();
</script>
</body>
