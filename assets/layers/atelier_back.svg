<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dfdc"/><stop offset="0.55" stop-color="#efd4cf"/><stop offset="1" stop-color="#d7ad9f"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bcdf5"/><stop offset="0.55" stop-color="#d9e9f5"/><stop offset="1" stop-color="#ffd9bd"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf1" stop-opacity="0.95"/><stop offset="1" stop-color="#f6c58e" stop-opacity="0.18"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#855843"/><stop offset="0.5" stop-color="#b67e5e"/><stop offset="1" stop-color="#744938"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7df9c"/><stop offset="0.45" stop-color="#b98332"/><stop offset="1" stop-color="#f4d48c"/></linearGradient>
</defs>
