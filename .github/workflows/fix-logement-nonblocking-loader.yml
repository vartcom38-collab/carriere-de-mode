name: Fix logement nonblocking loader
on:
  push:
    paths:
      - '.github/workflows/fix-logement-nonblocking-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make housing enhancement non blocking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('logement/index.html')
          s=p.read_text()
          old='<script src="./visual-engine.js"></script>'
          new='<script defer src="./visual-engine.js?v=20260826-recovery1"></script>'
          if old not in s and new not in s:
              raise SystemExit('visual-engine loader not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add logement/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix logement startup by deferring housing enhancement"
          git push origin HEAD:main
