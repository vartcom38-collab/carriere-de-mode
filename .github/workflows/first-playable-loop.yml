name: First Playable Loop

on:
  push:
    branches:
      - nimes-parity-territoires
    paths:
      - 'hc-live/index.html'
      - 'hc-live/start-choice/index.html'
      - 'hc-live/career-welcome/index.html'
      - 'hc-live/logement/index.html'
      - 'hc-live/logement/visual-engine.js'
      - 'hc-live/career-first-day/index.html'
      - 'hc-live/ville/nimes-cafe-gameplay-v3.js'
      - 'hc-live/ville/nimes-client-order-board-v1.js'
      - 'hc-live/client-orders/client-order-engine-v1.js'
      - 'hc-live/ville/client-fitting-lived-v1.js'
      - 'hc-live/ville/client-fitting-generic-bridge-v1.js'
      - 'hc-live/ville/index.html'
      - 'hc-live/client-orders/**'
      - 'hc-live/atelier-raster/atelier-client-*.js'
      - 'hc-live/atelier-raster/atelier-realisation-engine-v1.js'
      - 'hc-live/atelier-raster/atelier-shell-v3-simple.js'
      - 'hc-live/atelier-raster/atelier-realise-scheduler-hotfix-v1.js'
      - 'hc-live/atelier-raster/atelier-production-scheduler-v1.js'
      - 'hc-live/atelier-raster/atelier-realisation-preflight-v1.js'
      - 'hc-live/atelier-raster/atelier-generation-hotfix-v2.js'
      - 'hc-live/atelier-raster/atelier-quote-engine-v1.js'
      - 'hc-live/game-engine.js'
      - 'hc-live/qa/first-playable-start-flow-e2e.mjs'
      - 'hc-live/qa/first-playable-middle-flow-e2e.mjs'
      - 'hc-live/qa/first-playable-client-cycle-e2e.mjs'
      - 'hc-live/qa/first-playable-continuous-e2e.mjs'
      - '.github/workflows/first-playable-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hc-first-playable-http.log 2>&1 &
          sleep 2
      - name: Run first playable start flow
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 120s node hc-live/qa/first-playable-start-flow-e2e.mjs 2>&1 | tee /tmp/hc-first-playable-start-flow.log
      - name: Run first playable middle flow
        if: always()
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 120s node hc-live/qa/first-playable-middle-flow-e2e.mjs 2>&1 | tee /tmp/hc-first-playable-middle-flow.log
      - name: Run first playable client cycle
        if: always()
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 120s node hc-live/qa/first-playable-client-cycle-e2e.mjs 2>&1 | tee /tmp/hc-first-playable-client-cycle.log
      - name: Run continuous first playable journey
        if: always()
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s node hc-live/qa/first-playable-continuous-e2e.mjs 2>&1 | tee /tmp/hc-first-playable-continuous.log
