name: Deploy Haute Couture to Infomaniak

on:
  push:
    branches: [main]
    paths:
      - 'hc-live/**'
      - 'infomaniak/api/**'
      - '.github/workflows/deploy-infomaniak.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INFOMANIAK_FTP_HOST: ng43h.ftp.infomaniak.com
      INFOMANIAK_FTP_USER: ng43h_hautecouture
      INFOMANIAK_FTP_PORT: '21'
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.INFOMANIAK_PASSWORD }}
      INFOMANIAK_FTP_PATH: ${{ secrets.INFOMANIAK_FTP_PATH || '/' }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY || secrets.MAGNIFIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "$INFOMANIAK_FTP_PASSWORD" ]; then
            echo "::error::Mot de passe FTP Infomaniak manquant."
            exit 1
          fi

      - name: Verify game bundle
        shell: bash
        run: |
          test -s hc-live/index.html
          test -s hc-live/start-choice/index.html
          test -s hc-live/server-save-bridge-v1.js
          test -s hc-live/game-engine.js
          test -s infomaniak/api/generate-garment-visual.php

      - name: Prepare optional server secret file
        shell: bash
        run: |
          if [ -n "$MAGNIFIC_API_KEY" ]; then
            umask 077
            cat > infomaniak/api/.env.php <<'PHP'
          <?php
          return ['MAGNIFIC_API_KEY' => getenv('HC_DEPLOY_MAGNIFIC_KEY') ?: ''];
          PHP
            python - <<'PY'
          from pathlib import Path
          import os
          p=Path('infomaniak/api/.env.php')
          s=p.read_text()
          s=s.replace("getenv('HC_DEPLOY_MAGNIFIC_KEY') ?: ''", repr(os.environ['MAGNIFIC_API_KEY']))
          p.write_text(s)
          PY
          else
            echo "MAGNIFIC_API_KEY absent des secrets GitHub : le fichier secret serveur existant, s'il existe, ne sera pas écrasé."
          fi

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test Infomaniak FTPS connection
        shell: bash
        run: |
          timeout 60s lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "ftp://$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 1
          set net:timeout 15
          cd "$INFOMANIAK_FTP_PATH"
          pwd
          cls -1
          bye
          LFTP

      - name: Deploy hc-live to Infomaniak via explicit FTPS
        shell: bash
        run: |
          timeout 480s lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "ftp://$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 3
          cd "$INFOMANIAK_FTP_PATH"
          mirror --reverse --verbose --parallel=3 \
            --no-perms \
            --exclude-glob api/ \
            --exclude-glob config/ \
            --exclude-glob sql/ \
            --exclude-glob uploads/ \
            hc-live/ ./
          bye
          LFTP

      - name: Deploy PHP API without deleting server data
        shell: bash
        run: |
          timeout 180s lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "ftp://$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          cd "$INFOMANIAK_FTP_PATH"
          mkdir -p api
          mirror --reverse --verbose --parallel=2 --no-perms infomaniak/api/ api/
          bye
          LFTP

      - name: Verify production files over FTPS
        shell: bash
        run: |
          timeout 60s lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "ftp://$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 1
          set net:timeout 15
          cd "$INFOMANIAK_FTP_PATH"
          cls -l index.html
          cls -l start-choice/index.html
          cls -l api/generate-garment-visual.php
          bye
          LFTP
