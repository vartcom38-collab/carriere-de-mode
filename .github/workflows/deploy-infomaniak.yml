name: Deploy Haute Couture to Infomaniak

on:
  push:
    branches: [main]
    paths:
      - 'hc-live/**'
      - '.github/workflows/deploy-infomaniak.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INFOMANIAK_FTP_HOST: ng43h.ftp.infomaniak.com
      INFOMANIAK_FTP_USER: ng43h_hautecouture
      INFOMANIAK_FTP_PORT: '21'
      INFOMANIAK_FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.INFOMANIAK_PASSWORD }}
      INFOMANIAK_FTP_PATH: ${{ secrets.INFOMANIAK_FTP_PATH || '/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "$INFOMANIAK_FTP_PASSWORD" ]; then
            echo "::error::Mot de passe FTP Infomaniak manquant. Ajoute un secret nommé INFOMANIAK_FTP_PASSWORD (ou FTP_PASSWORD / INFOMANIAK_PASSWORD)."
            exit 1
          fi

      - name: Verify game bundle
        shell: bash
        run: |
          test -s hc-live/index.html
          test -s hc-live/start-choice/index.html
          test -s hc-live/server-save-bridge-v1.js
          test -s hc-live/game-engine.js

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy hc-live to Infomaniak via explicit FTPS
        shell: bash
        run: |
          lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          cd "$INFOMANIAK_FTP_PATH"
          mirror --reverse --verbose --only-newer \
            --exclude-glob api/ \
            --exclude-glob config/ \
            --exclude-glob sql/ \
            --exclude-glob uploads/ \
            hc-live/ ./
          bye
          LFTP

      - name: Verify production files over FTPS
        shell: bash
        run: |
          lftp -u "$INFOMANIAK_FTP_USER","$INFOMANIAK_FTP_PASSWORD" -p "$INFOMANIAK_FTP_PORT" "$INFOMANIAK_FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          cd "$INFOMANIAK_FTP_PATH"
          cls -1 index.html
          cls -1 start-choice/index.html
          bye
          LFTP
