name: Haute Couture Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean accueil
        run: test -s hc-live/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle PixiJS locally for Atelier
        shell: bash
        run: |
          rm -rf /tmp/pixi-vendor
          mkdir -p /tmp/pixi-vendor hc-live/vendor
          cd /tmp/pixi-vendor
          npm pack pixi.js@8.6.6 >/tmp/pixi-pack-name.txt
          tar -xzf "$(cat /tmp/pixi-pack-name.txt)"
          cp package/dist/pixi.min.js "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"
          test -s "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"

      - name: Restore Atelier Dream visual
        shell: bash
        run: |
          base64 -d hc-live/atelier-dream/atelier-dream-fixed.webp.b64 > hc-live/atelier-dream/atelier-dream.webp
          test -s hc-live/atelier-dream/atelier-dream.webp

      - name: Install HD Atelier raster library
        shell: bash
        run: |
          set -e
          rm -rf hc-live/atelier-raster/pieces /tmp/atelier-hd-fixed.zip
          mkdir -p hc-live/atelier-raster/pieces
          archive="hc-live/atelier-raster/hd-pieces.zip"
          if unzip -t "$archive" >/dev/null 2>&1; then
            unzip -oq "$archive" -d hc-live/atelier-raster/pieces
          else
            echo "HD archive is missing its central directory; rebuilding it from local file records..."
            zip -FF "$archive" --out /tmp/atelier-hd-fixed.zip >/tmp/zip-repair.log 2>&1 || { cat /tmp/zip-repair.log; exit 1; }
            unzip -t /tmp/atelier-hd-fixed.zip
            unzip -oq /tmp/atelier-hd-fixed.zip -d hc-live/atelier-raster/pieces
          fi
          for name in top-drape corset cache jupe plisse pantalon anneau manche noeud; do
            test -s "hc-live/atelier-raster/pieces/${name}.webp"
          done

      - name: Verify Atelier raster library
        shell: bash
        run: |
          test -s hc-live/atelier-raster/index.html
          for name in top-drape corset cache jupe plisse pantalon anneau manche noeud; do
            file "hc-live/atelier-raster/pieces/${name}.webp"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload clean game preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: hc-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
