name: Haute Couture Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean accueil
        run: test -s hc-live/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle PixiJS locally for Atelier
        shell: bash
        run: |
          rm -rf /tmp/pixi-vendor
          mkdir -p /tmp/pixi-vendor hc-live/vendor
          cd /tmp/pixi-vendor
          npm pack pixi.js@8.6.6 >/tmp/pixi-pack-name.txt
          tar -xzf "$(cat /tmp/pixi-pack-name.txt)"
          cp package/dist/pixi.min.js "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"
          test -s "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"

      - name: Restore Atelier Dream visual
        shell: bash
        run: |
          base64 -d hc-live/atelier-dream/atelier-dream-fixed.webp.b64 > hc-live/atelier-dream/atelier-dream.webp
          test -s hc-live/atelier-dream/atelier-dream.webp

      - name: Restore Atelier raster piece library
        shell: bash
        run: |
          rm -rf hc-live/atelier-raster/pieces
          mkdir -p hc-live/atelier-raster/pieces
          for src in hc-live/atelier-raster/pieces-src/*.webp.b64; do
            name="$(basename "$src" .b64)"
            base64 -d "$src" > "hc-live/atelier-raster/pieces/$name"
            test -s "hc-live/atelier-raster/pieces/$name"
          done

      - name: Verify Atelier raster library
        shell: bash
        run: |
          test -s hc-live/atelier-raster/index.html
          for name in top-drape corset cache jupe plisse pantalon anneau manche noeud; do
            test -s "hc-live/atelier-raster/pieces/${name}.webp"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload clean game preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: hc-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
