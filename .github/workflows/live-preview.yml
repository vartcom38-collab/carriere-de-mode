name: Haute Couture Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean accueil
        run: test -s hc-live/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle PixiJS locally for Atelier
        shell: bash
        run: |
          rm -rf /tmp/pixi-vendor
          mkdir -p /tmp/pixi-vendor hc-live/vendor
          cd /tmp/pixi-vendor
          npm pack pixi.js@8.6.6 >/tmp/pixi-pack-name.txt
          tar -xzf "$(cat /tmp/pixi-pack-name.txt)"
          cp package/dist/pixi.min.js "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"
          test -s "$GITHUB_WORKSPACE/hc-live/vendor/pixi.min.js"

      - name: Restore Atelier Dream visual
        shell: bash
        run: |
          base64 -d hc-live/atelier-dream/atelier-dream-fixed.webp.b64 > hc-live/atelier-dream/atelier-dream.webp
          test -s hc-live/atelier-dream/atelier-dream.webp

      - name: Restore Atelier raster piece library
        shell: bash
        run: |
          mkdir -p hc-live/atelier-raster/pieces
          for src in hc-live/atelier-raster/pieces-src/*.webp.b64; do
            name="$(basename "$src" .b64)"
            base64 -d "$src" > "hc-live/atelier-raster/pieces/$name"
            test -s "hc-live/atelier-raster/pieces/$name"
          done

      - name: Wire neutral piece sketches into Atelier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hc-live/atelier-raster/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="./croquis-base.webp" alt="${name}"', 'src="./pieces/${id}.webp" alt="${name}"')
          s = s.replace('src="./croquis-base.webp" alt="${p.name}"', 'src="./pieces/${p.id}.webp" alt="${p.name}"')
          s = s.replace('.thumb img{height:125%;max-width:100%;object-fit:contain;', '.thumb img{width:100%;height:100%;object-fit:contain;')
          p.write_text(s, encoding='utf-8')
          required = [
              'top-drape.webp','corset.webp','cache.webp','jupe.webp','plisse.webp',
              'pantalon.webp','anneau.webp','manche.webp','noeud.webp'
          ]
          for name in required:
              q = Path('hc-live/atelier-raster/pieces') / name
              assert q.exists() and q.stat().st_size > 0, name
          assert './pieces/${id}.webp' in s
          assert './pieces/${p.id}.webp' in s
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload clean game preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: hc-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
