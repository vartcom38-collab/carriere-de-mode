name: Haute Couture Phaser Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild clean home artwork
        run: |
          base64 -d preview/assets/home320.b64 > preview/assets/home-v2.jpg
          file preview/assets/home-v2.jpg
          test "$(stat -c%s preview/assets/home-v2.jpg)" -gt 10000
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Phaser preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
