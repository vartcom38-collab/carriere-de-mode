name: Haute Couture Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify clean accueil
        run: test -s hc-live/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload clean game preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: hc-live
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
