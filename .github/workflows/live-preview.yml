name: Live accueil preview

on:
  push:
    branches: [assistant/accueil-v2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carriere-de-mode-live-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore atelier image when stored as base64 text
        run: |
          set -eux
          if file assets/menu_atelier.webp | grep -qi 'ASCII\|text'; then
            base64 -d assets/menu_atelier.webp > /tmp/menu_atelier.webp
            mv /tmp/menu_atelier.webp assets/menu_atelier.webp
          fi
          file assets/menu_atelier.webp

      - name: Install Godot 4.6.3 and export templates
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Validate project
        run: godot --headless --editor --quit-after 2

      - name: Export web preview
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
