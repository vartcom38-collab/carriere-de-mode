name: Haute Couture Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild approved home artwork
        run: |
          base64 -d webapp/assets/home-valid.b64 > webapp/assets/home.jpg
          file webapp/assets/home.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
