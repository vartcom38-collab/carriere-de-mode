name: Bootstrap accueil master

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-master-art:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Stop if master art is already stored
        id: existing
        run: |
          if [ -f assets/accueil_haute_couture_master.png ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import approved Haute Couture artwork
        if: steps.existing.outputs.exists != 'true'
        env:
          MASTER_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2Ff11282ec-1be3-44b7-9f10-3788332ae8f4/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAAFuORXA3woV3RtutxRTAPNfB_hmG39roT0CMvQiBXUkg&exp=1786910585&osig=AAAAAAAAAAAAAAAAAAAAAOT88YpUi-Rk5Ct-jPr8UEyGzuXUYsKcGQeif43uARFF&signer=media-rpc"
        run: |
          set -eux
          curl --fail --location --retry 3 "$MASTER_URL" -o assets/accueil_haute_couture_master.png
          python3 - <<'PY'
          import struct
          p='assets/accueil_haute_couture_master.png'
          with open(p,'rb') as f:
              sig=f.read(24)
          assert sig[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          w,h=struct.unpack('>II', sig[16:24])
          print('PNG dimensions:', w, h)
          assert w >= 1200 and h >= 900, f'image too small: {w}x{h}'
          PY
          ls -lh assets/accueil_haute_couture_master.png

      - name: Commit approved artwork into the Godot project
        if: steps.existing.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/accueil_haute_couture_master.png
          git commit -m "Ajoute l'illustration maître validée de l'accueil"
          git push
