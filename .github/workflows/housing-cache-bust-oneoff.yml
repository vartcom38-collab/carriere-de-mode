name: Housing cache bust oneoff
on:
  push:
    paths:
      - '.github/workflows/housing-cache-bust-oneoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force fresh housing scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          targets=[Path('logement/index.html'),Path('hc-live/logement/index.html')]
          for p in targets:
              s=p.read_text()
              import re
              s=re.sub(r'<script src="\./visual-engine\.js(?:\?v=[^"]*)?"></script>', '<script src="./visual-engine.js?v=20260826-root-real-housing1"></script>', s)
              p.write_text(s)
          PY
      - name: Commit cache bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add logement/index.html hc-live/logement/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "force fresh root housing real-estate bridge"
          git push origin HEAD:main
# trigger 20260826-root-real-housing1
