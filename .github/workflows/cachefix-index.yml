name: Cachefix live index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cachefix-index.yml'

permissions:
  contents: write

jobs:
  cachefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh live loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hc-live/index.html')
          s = p.read_text(encoding='utf-8')
          old = './main-hub.js?v=cachefix-20260820-2036'
          new = './main-hub.js?v=cachefix-20260820-2042'
          if old not in s:
              raise SystemExit('Expected loader cache key not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cachefix
        run: |
          git config user.name 'haute-couture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hc-live/index.html
          git commit -m 'Force refresh of live game loader 2042'
          git push
