name: Cachefix live index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cachefix-index.yml'

permissions:
  contents: write

jobs:
  cachefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh live loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('hc-live/index.html')
          s = p.read_text(encoding='utf-8')
          new = './main-hub.js?v=cachefix-20260821-1252'
          s2, n = re.subn(r'\./main-hub\.js\?v=cachefix-\d{8}-\d+', new, s, count=1)
          if n != 1:
              raise SystemExit('Live loader cache key not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cachefix
        run: |
          git config user.name 'haute-couture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hc-live/index.html
          git commit -m 'Force refresh of live game loader 1252'
          git push
