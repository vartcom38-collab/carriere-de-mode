name: Cachefix live index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cachefix-index.yml'

permissions:
  contents: write

jobs:
  cachefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh live loader and remove compare at page level
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('hc-live/index.html')
          s = p.read_text(encoding='utf-8')
          new = './main-hub.js?v=cachefix-20260821-1303'
          s, n = re.subn(r'\./main-hub\.js\?v=cachefix-\d{8}-\d+', new, s, count=1)
          if n != 1:
              raise SystemExit('Live loader cache key not found')
          marker = '<style id="hc-no-compare-live">#characters [data-compare],#characters .hc-compare,#characters .hc-compare-panel,.hc-compare-v1{display:none!important}</style>'
          if 'id="hc-no-compare-live"' not in s:
              s = s.replace('</head>', marker + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit live fix
        run: |
          git config user.name 'haute-couture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hc-live/index.html
          git commit -m 'Force consolidated Clara live'
          git push
