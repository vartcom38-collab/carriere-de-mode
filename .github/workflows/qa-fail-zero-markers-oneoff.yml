name: QA fail on zero markers oneoff

on:
  push:
    branches: [territoires-france]
    paths: ['.github/workflows/qa-fail-zero-markers-oneoff.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: territoires-france
      - name: Make zero marker coverage fatal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hc-live/qa/territories-ui-exhaustive-v2.mjs')
          s=p.read_text(encoding='utf-8')
          old="console.log(`CITY ${code} ${city} · ${unique.length} marqueur(s)`);if(!unique.length)warnings.push(`${code} ${city}: aucun marqueur injecté`);"
          new="console.log(`CITY ${code} ${city} · ${unique.length} marqueur(s)`);if(!unique.length)failures.push(`${code} ${city}: aucun marqueur injecté`);"
          if s.count(old)!=1:
              raise SystemExit(f'expected exact QA guard once, got {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          git diff -- hc-live/qa/territories-ui-exhaustive-v2.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hc-live/qa/territories-ui-exhaustive-v2.mjs
          git commit -m "QA territoires: échouer si aucun marqueur n'est capturé"
          git push origin HEAD:territoires-france
