name: Enable spatial housing discovery one-shot
on:
  push:
    paths:
      - '.github/workflows/enable-spatial-housing-oneoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load spatial discovery after legacy housing engine is ready
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hc-live/logement/visual-engine.js')
          s=p.read_text()
          old="    setTimeout(()=>schedulePaint(false),500);\n    window.HCVisualEngine={build:BUILD,paintCards,paintDetail,ensureMain};"
          new="    setTimeout(()=>schedulePaint(false),500);\n    loadScript('./spatial-discovery-v1.js',()=>!!window.HCSpatialHousingDiscovery).catch(e=>console.error('HC spatial discovery failed',e));\n    window.HCVisualEngine={build:BUILD,paintCards,paintDetail,ensureMain};"
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('legacy visual-engine anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit spatial loader
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hc-live/logement/visual-engine.js
          git diff --cached --quiet && exit 0
          git commit -m "enable spatial housing discovery on stable legacy logement"
          git push origin HEAD:main
