name: Territoires France Map E2E

on:
  push:
    branches:
      - carte-france-territoires
    paths:
      - 'hc-live/ville/france.html'
      - 'hc-live/ville/territorial-map-global-browser-v1.js'
      - 'hc-live/qa/territories-france-map-e2e.mjs'
      - '.github/workflows/territoires-france-map-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  france-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hc-http.log 2>&1 &
          sleep 2
      - name: Validate global France territory map
        run: node hc-live/qa/territories-france-map-e2e.mjs
