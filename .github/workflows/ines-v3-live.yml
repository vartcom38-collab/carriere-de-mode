name: Publish Ines v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ines-v3-live.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject Ines controller before app bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('hc-live/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script id="hc-ines-v3-live"[^>]*></script>\s*','\n',s)
          tag='<script id="hc-ines-v3-live" src="./ines-v3.js?v=20260821-1546"></script>\n'
          m=re.search(r'<script[^>]+src="\./main-hub\.js\?v=[^"]+"[^>]*></script>',s)
          if not m:
              raise SystemExit('main-hub loader not found')
          s=s[:m.start()]+tag+s[m.start():]
          s=re.sub(r'\./main-hub\.js\?v=[^"]+','./main-hub.js?v=cachefix-20260821-1546',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit live index
        run: |
          git config user.name 'haute-couture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hc-live/index.html
          git commit -m 'Publish Ines image and side profile 1546' || exit 0
          git push
