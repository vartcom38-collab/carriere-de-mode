name: Validate cinematic toolchain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg Theora support
        run: |
          ffmpeg -hide_banner -encoders | grep -q libtheora
          ffmpeg -hide_banner -encoders | grep -q libvorbis

      - name: Install Godot 4.6.3
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import and validate Godot project
        run: godot --headless --editor --quit-after 8

      - name: Check cinematic files
        run: |
          test -f cinematics/DESIGN.md
          test -f cinematics/PIPELINE.md
          test -f scripts/cinematic_player.gd
          test -f scenes/CinematicPlayer.tscn
          test -f tools/video/convert_for_godot.sh
