name: Territoires UI E2E

# Validation cache-bust AURA — 2026-09-12
on:
  push:
    branches:
      - territoires-france
    paths:
      - 'hc-live/ville/**'
      - 'hc-live/*territor*.js'
      - 'hc-live/*map*.js'
      - 'hc-live/*dense*.js'
      - 'hc-live/qa/territories-ui-e2e.mjs'
      - 'hc-live/qa/territories-ui-cantal-e2e.mjs'
      - 'hc-live/qa/territories-ui-haute-loire-e2e.mjs'
      - 'hc-live/qa/territories-ui-puy-de-dome-e2e.mjs'
      - 'hc-live/qa/territories-ui-drome-ardeche-e2e.mjs'
      - 'hc-live/qa/territories-ui-alpes-e2e.mjs'
      - 'hc-live/qa/territories-ui-isere-loire-rhone-e2e.mjs'
      - 'hc-live/qa/territories-ui-exhaustive-e2e.mjs'
      - 'hc-live/qa/territories-ui-exhaustive-v2.mjs'
      - '.github/workflows/territoires-ui-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hc-http.log 2>&1 &
          echo $! > /tmp/hc-http.pid
          sleep 2
      - name: Run Ain + Allier UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-e2e.mjs 2>&1 | tee /tmp/hc-territories-e2e.log
      - name: Run Cantal UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-cantal-e2e.mjs 2>&1 | tee /tmp/hc-territories-cantal-e2e.log
      - name: Run Haute-Loire UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-haute-loire-e2e.mjs 2>&1 | tee /tmp/hc-territories-haute-loire-e2e.log
      - name: Run Puy-de-Dôme UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-puy-de-dome-e2e.mjs 2>&1 | tee /tmp/hc-territories-puy-de-dome-e2e.log
      - name: Run Drôme + Ardèche UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-drome-ardeche-e2e.mjs 2>&1 | tee /tmp/hc-territories-drome-ardeche-e2e.log
      - name: Run Savoie + Haute-Savoie UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-alpes-e2e.mjs 2>&1 | tee /tmp/hc-territories-alpes-e2e.log
      - name: Run Isère + Loire + Rhône UI E2E
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 90s node hc-live/qa/territories-ui-isere-loire-rhone-e2e.mjs 2>&1 | tee /tmp/hc-territories-isere-loire-rhone-e2e.log
      - name: Exhaustif 01 · Ain
        env:
          HC_DEPT: '01'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-01.log
      - name: Exhaustif 03 · Allier
        env:
          HC_DEPT: '03'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-03.log
      - name: Exhaustif 07 · Ardèche
        env:
          HC_DEPT: '07'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-07.log
      - name: Exhaustif 15 · Cantal
        env:
          HC_DEPT: '15'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-15.log
      - name: Exhaustif 26 · Drôme
        env:
          HC_DEPT: '26'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-26.log
      - name: Exhaustif 38 · Isère
        env:
          HC_DEPT: '38'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-38.log
      - name: Exhaustif 42 · Loire
        env:
          HC_DEPT: '42'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-42.log
      - name: Exhaustif 43 · Haute-Loire
        env:
          HC_DEPT: '43'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-43.log
      - name: Exhaustif 63 · Puy-de-Dôme
        env:
          HC_DEPT: '63'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-63.log
      - name: Exhaustif 69 · Rhône
        env:
          HC_DEPT: '69'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-69.log
      - name: Exhaustif 73 · Savoie
        env:
          HC_DEPT: '73'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-73.log
      - name: Exhaustif 74 · Haute-Savoie
        env:
          HC_DEPT: '74'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 180s node hc-live/qa/territories-ui-exhaustive-v2.mjs 2>&1 | tee /tmp/hc-exhaustive-74.log

# L'exhaustif est volontairement découpé par département : mêmes critères V2, aucun assouplissement,
# mais plus de faux échec global causé par le plafond de 300 secondes.
