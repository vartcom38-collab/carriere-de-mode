<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Cours</title><style>:root{--bg:#f5eee7;--paper:#fffaf4;--ink:#271f1b;--muted:#75655c;--line:#e2d3c7;--teal:#4d8d86;--coral:#df7864;--ok:#5f846e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf7f2,#efe3d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:48px 20px 90px}.crumb{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral);margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.top h1{font:46px/1.02 Georgia,serif;margin:8px 0}.meta{font:13px/1.5 Georgia,serif;color:var(--muted)}.badge{padding:8px 10px;border-radius:999px;background:#edf4f1;color:#456e66;font-size:10px;font-weight:900}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 16px 40px rgba(68,47,38,.08)}.card h2{font:27px/1.1 Georgia,serif;margin:0 0 10px}.card h3{font:20px/1.15 Georgia,serif;margin:20px 0 7px}.card p,.card li{font:14px/1.65 Georgia,serif;color:#5f5048}.lesson{border-left:3px solid #d8b8a7;padding-left:16px;margin:18px 0}.exercise{background:#f4ece6;border-radius:16px;padding:16px}.exercise textarea{width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font:14px/1.5 Georgia,serif}.answers{display:grid;gap:8px;margin:12px 0}.answer{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:13px;padding:13px 15px;background:#29211d;color:white;font-weight:900;cursor:pointer}.btn.alt{background:var(--teal)}.locked{padding:20px;border-radius:18px;background:#fff1ec;border:1px solid #edcabc;font:14px/1.55 Georgia,serif;color:#6f5246}.result{display:none;margin-top:14px;border-radius:14px;padding:14px;background:#edf5ef;color:#416b58;font:13px/1.5 Georgia,serif}.result.show{display:block}.skills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.skill{font-size:9px;font-weight:900;padding:7px 9px;border-radius:999px;background:#f0e8e1}@media(max-width:700px){.top{display:block}.top h1{font-size:38px}}</style></head><body><main class="wrap"><div class="crumb">ÉCOLE · COURS</div><div id="app"></div></main><script src="../school/school-life-v1.js?v=20260903-schoollife1"></script><script>(function(){const app=document.getElementById('app'),q=new URLSearchParams(location.search),id=q.get('id')||'w1-welcome',L=window.HCSchoolLife,c=L.courses.find(x=>x.id===id),s=L.state();if(!c){app.innerHTML='<div class="locked">Cours introuvable.</div>';return}const unlocked=L.isUnlocked(c,s),done=s.completed[c.id];const sections=c.lesson.map(([h,t])=>`<div class="lesson"><h3>${h}</h3><p>${t}</p></div>`).join('');const skills=Object.entries(c.skills||{}).map(([k,v])=>`<span class="skill">${k.toUpperCase()} +${v}</span>`).join('');const prereq=c.prereq.map(pid=>L.courses.find(x=>x.id===pid)?.title||pid);app.innerHTML=`<div class="top"><div><div class="meta">Jour ${c.day} · ${c.time} · ${c.duration} min · ${c.teacher}</div><h1>${c.title}</h1><div class="meta">${c.category}</div><div class="skills">${skills}</div></div><div class="badge">${done?'TERMINÉ':unlocked?'DISPONIBLE':'VERROUILLÉ'}</div></div>${!unlocked?`<div class="locked">Ce cours se débloque après : ${prereq.join(' · ')}</div>`:`<div class="card"><h2>Pourquoi ce cours ?</h2><p>${c.intro}</p>${sections}</div><div class="card"><h2>Exercice</h2><div class="exercise"><p>${c.exercise}</p><textarea id="exercise" placeholder="Tes notes, observations ou réponse de travail…">${done?.exercise||''}</textarea></div></div><div class="card"><h2>Vérification rapide</h2><p>${c.quiz.q}</p><div class="answers">${c.quiz.a.map((a,i)=>`<label class="answer"><input type="radio" name="quiz" value="${i}" ${done&&((done.quizCorrect&&i===c.quiz.correct)||(!done.quizCorrect&&i===0))?'checked':''}><span>${a}</span></label>`).join('')}</div><div class="btns"><button class="btn alt" id="validate">${done?'REFAIRE LA VÉRIFICATION':'VALIDER LE COURS'}</button><button class="btn" onclick="location.href='../school/'">RETOUR À L’ÉCOLE</button></div><div class="result ${done?'show':''}" id="result">${done?`Cours déjà terminé · score ${s.scores[c.id]||0}/100.`:''}</div></div>`}`;const v=document.getElementById('validate');if(v)v.onclick=()=>{const checked=document.querySelector('input[name="quiz"]:checked');if(!checked){alert('Choisis une réponse pour valider.');return}const r=L.completeCourse(c.id,Number(checked.value),document.getElementById('exercise').value);const box=document.getElementById('result');if(!r.ok){box.textContent='Le cours ne peut pas encore être validé.';box.classList.add('show');return}box.textContent=(r.correct?'Bonne réponse. ':'Ce n’était pas la meilleure réponse, mais le cours est enregistré. ')+`Score ${r.score}/100. Tes compétences ont progressé.`;box.classList.add('show');setTimeout(()=>location.reload(),900)}})();</script><script src="../server-save-bridge-v1.js?v=20260903-schoollife1" defer></script><script src="../global-menu-v1.js?v=20260903-schoollife1" defer></script></body></html>
