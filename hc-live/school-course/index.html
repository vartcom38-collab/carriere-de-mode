<style>
:root{--ink:#241b17;--paper:#fffaf5;--muted:#76655d;--rose:#b96f68;--deep:#2a211c;--line:rgba(78,54,43,.16);--glass:rgba(255,250,245,.92);--shadow:0 28px 80px rgba(36,23,18,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17110e;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,textarea{font:inherit}.course{min-height:100vh}.scene{position:relative;min-height:100vh;background:#332922 center/cover no-repeat;overflow:hidden}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,10,8,.72) 0%,rgba(15,10,8,.25) 35%,rgba(15,10,8,.08) 62%,rgba(15,10,8,.46) 100%),linear-gradient(0deg,rgba(17,11,9,.77),transparent 50%)}.topbar{position:absolute;z-index:20;top:20px;left:26px;right:26px;display:flex;justify-content:space-between;gap:14px;align-items:center;color:white}.crumb,.exit{border:1px solid rgba(255,255,255,.28);background:rgba(25,17,13,.38);backdrop-filter:blur(14px);color:#fff;border-radius:999px}.crumb{padding:10px 14px;font:800 9px/1 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.exit{padding:10px 14px;cursor:pointer}.courseTitle{position:absolute;z-index:5;left:48px;bottom:46px;width:min(650px,48vw);color:#fff}.eyebrow{font:800 9px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#efbdb8}.courseTitle h1{font:clamp(44px,4.6vw,76px)/.95 Georgia,serif;font-weight:400;letter-spacing:-.04em;margin:11px 0 13px;text-shadow:0 3px 18px rgba(0,0,0,.3)}.courseTitle p{font:17px/1.5 Georgia,serif;color:rgba(255,255,255,.9);max-width:600px;margin:0}.teacherPresence{position:absolute;z-index:8;right:34px;top:95px;width:min(370px,30vw);padding:20px 22px;border-radius:22px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(17px)}.teacherPresence h2{font:28px/1 Georgia,serif;font-weight:400;margin:3px 0}.teacherPresence .role{font:13px/1.45 Georgia,serif;color:var(--muted)}.teacherPresence .say{font:italic 18px/1.55 Georgia,serif;color:#4f4039;margin:16px 0 0}.teacherTag{display:flex;align-items:center;gap:11px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e8d8cb;border:1px solid #d4bbab;font-size:20px}.stageDock{position:absolute;z-index:10;right:34px;bottom:32px;width:min(370px,30vw);padding:18px 20px;border-radius:21px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(17px)}.stageDock small{font:800 9px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}.stageDock strong{display:block;font:23px/1.15 Georgia,serif;font-weight:400;margin:8px 0}.stageDock p{font:13px/1.48 Georgia,serif;color:var(--muted);margin:0}.dots{display:flex;gap:5px;margin:13px 0}.dot{height:4px;flex:1;border-radius:99px;background:#ddd0c6}.dot.done,.dot.active{background:#4a3931}.continue{width:100%;border:0;border-radius:999px;padding:13px 15px;background:var(--deep);color:#fff;font:800 10px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.objectTray{position:absolute;z-index:9;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:10px;align-items:end}.objectTray.hidden{display:none}.objectCard{width:126px;border:1px solid rgba(255,255,255,.32);border-radius:18px;overflow:hidden;background:rgba(255,250,245,.91);box-shadow:0 16px 40px rgba(0,0,0,.23);cursor:pointer;transition:.18s ease}.objectCard:hover{transform:translateY(-4px)}.objectCard.active{outline:3px solid rgba(239,189,184,.78)}.objectPhoto{height:82px;background:center/cover no-repeat}.objectCard b{display:block;padding:10px 11px 2px;font:15px/1.1 Georgia,serif}.objectCard span{display:block;padding:0 11px 11px;font:10px/1.3 Arial,sans-serif;color:#77665e}.sceneActions{position:absolute;z-index:9;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:520px}.sceneAction{border:1px solid rgba(255,255,255,.42);background:rgba(28,19,15,.48);color:#fff;border-radius:999px;padding:10px 13px;font:800 10px/1 Arial,sans-serif;cursor:pointer;backdrop-filter:blur(12px)}.sceneAction:hover{background:rgba(185,111,104,.9)}.overlay{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(18,12,9,.6);backdrop-filter:blur(7px)}.overlay.open{display:flex}.sheet{width:min(880px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:28px;padding:30px 32px;box-shadow:0 40px 120px rgba(0,0,0,.4)}.sheetHeader{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.sheet h3{font:37px/1.04 Georgia,serif;font-weight:400;margin:6px 0 16px}.sheet p,.sheet li{font:16px/1.7 Georgia,serif;color:#5c4d45}.close{border:0;background:#eee3da;width:40px;height:40px;border-radius:50%;cursor:pointer}.practiceBox{margin-top:18px;padding:20px;border-radius:19px;background:#f1e8e1}.practiceBox textarea{width:100%;min-height:190px;border:1px solid #d7c6ba;border-radius:15px;padding:16px;background:#fffdf9;color:var(--ink);font:15px/1.6 Georgia,serif;resize:vertical}.teacherFeedback{margin:18px 0;padding:18px 20px;border-left:3px solid var(--rose);background:#f7eee8;font:italic 18px/1.55 Georgia,serif;color:#55463f}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.term{padding:13px;border-radius:15px;background:#f1e8e1}.term b{display:block;font-size:16px}.term span{font:12px/1.45 Georgia,serif;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:999px;padding:13px 17px;background:var(--deep);color:white;font:800 10px/1 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.btn.soft{background:#ece2da;color:#42342e}.notebook{position:fixed;z-index:45;right:0;top:0;bottom:0;width:min(470px,94vw);transform:translateX(102%);transition:.26s ease;background:#f8f0e8;box-shadow:-30px 0 85px rgba(0,0,0,.3);padding:28px;overflow:auto}.notebook.open{transform:translateX(0)}.notebook h3{font:36px/1 Georgia,serif;font-weight:400;margin:7px 0}.notebook p{font:14px/1.5 Georgia,serif;color:var(--muted)}.notebook textarea{width:100%;min-height:270px;border:0;border-bottom:1px solid #baa79b;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#d8cbc0 32px);padding:8px 4px;font:16px/2 Georgia,serif;color:var(--ink);outline:none;resize:vertical}.notebookTop{display:flex;justify-content:space-between;gap:12px}.toast{position:fixed;z-index:70;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;background:#251d19;color:#fff;border-radius:999px;padding:12px 17px;font:13px/1 Georgia,serif;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.locked{min-height:100vh;display:grid;place-items:center;padding:30px;background:#f3ebe4}.locked div{max-width:650px;background:#fffaf5;padding:30px;border-radius:24px;font:16px/1.6 Georgia,serif}.trace{padding:15px;border-radius:17px;background:#eef3f0;margin:9px 0}.trace b{display:block;font:800 9px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4e6f65;margin-bottom:6px}@media(max-width:1000px){.teacherPresence,.stageDock{width:330px}.courseTitle{width:46vw}.objectTray{left:46%}}@media(max-width:780px){.scene{min-height:100svh}.teacherPresence{left:16px;right:16px;top:72px;width:auto;padding:15px}.teacherPresence .say{font-size:15px}.courseTitle{left:20px;right:20px;bottom:250px;width:auto}.courseTitle h1{font-size:42px}.courseTitle p{font-size:14px}.stageDock{left:16px;right:16px;bottom:16px;width:auto}.sceneActions,.objectTray{display:none}.vocab{grid-template-columns:1fr}.sheet{padding:23px 20px}}
</style>

<script>
(function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||'w1-welcome',L=window.HCSchoolLife,A=window.HCSchoolAcademic,c=L?.courses.find(x=>x.id===id),academic=A?.state?.();
if(!c){app.innerHTML='<div class="locked"><div>Cours introuvable.</div></div>';return}
const year=Number(c.year||1);if(year!==Number(academic?.year||1)){app.innerHTML=`<div class="locked"><div>Ce cours appartient à l’Année ${year}. Tu es actuellement en Année ${academic?.year||1}.</div></div>`;return}
const state=L.state(),unlocked=L.isUnlocked(c,state),done=state.completed[c.id];if(!unlocked){const pre=(c.prereq||[]).map(pid=>L.courses.find(x=>x.id===pid)?.title||pid).join(' · ');app.innerHTML=`<div class="locked"><div><b>Ce cours n’est pas encore accessible.</b><br><br>À terminer avant : ${pre}<br><br><button class="btn" onclick="location.href='../school-day/'">Retour à ma journée</button></div></div>`;return}
const P=window.HCRealCoursePedagogy?.get(id),fallback={room:'Salle de cours',teacherRole:c.category,promise:c.intro,opening:c.intro,outcomes:(c.lesson||[]).map(x=>x[0]),vocabulary:[],stages:[...(c.lesson||[]).map(([h,t],i)=>({kind:'lesson',title:`${i+1} · ${h}`,text:t,teacher:i===0?'On commence par regarder précisément.':''})),{kind:'practice',title:'Travail de séance',instruction:c.exercise,prompt:'Écris ici ce que tu observes, testes ou construis pendant la séance.',min:40},{kind:'recap',title:'Correction et synthèse',text:'Reprends ce que tu as compris et ce que tu veux retravailler.'}],homework:'Relis tes notes avant le prochain cours.',teacherFeedback:{short:'Tu restes encore trop général·e. Reviens à des faits précis.',good:'Ton raisonnement devient lisible. Continue à relier chaque décision à une observation.',strong:'Tu formules avec précision et tu commences à travailler de manière autonome.'}};
const d=P||fallback,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=(c.teacher||'Professeur').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),K='haute-couture-live-classroom-v3:'+id;
const photos={Méthode:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=2200&q=88',Dessin:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=2200&q=88',Textile:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Matière:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Modélisme:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=2200&q=88',Moulage:'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=2200&q=88',Culture:'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2200&q=88',Montage:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=2200&q=88',Projet:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2200&q=88'};
const welcomeObjects=[{id:'scissors',name:'Ciseaux de tailleur',note:'métal · articulation · tension',photo:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=500&q=80'},{id:'thread',name:'Bobine de fil',note:'répétition · ligne · enroulement',photo:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=500&q=80'},{id:'muslin',name:'Morceau de toile',note:'souplesse · pli · bord',photo:'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=500&q=80'}];
let saved={stage:0,answers:{},notes:'',seen:{},object:null};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(K)||'{}'))}catch(_){}let stage=Math.max(0,Math.min(Number(saved.stage||0),d.stages.length-1));
function persist(){saved.stage=stage;localStorage.setItem(K,JSON.stringify(saved))}
function selectedObject(){return welcomeObjects.find(x=>x.id===saved.object)||null}
function textFeedback(txt){if(id!=='w1-welcome')return null;const t=(txt||'').toLowerCase(),judgment=['beau','belle','joli','jolie','élégant','élégante','moche','j’aime','jadore','j’adore'],facts=['long','court','rond','carré','métal','souple','rigide','pli','bord','ligne','surface','épais','fin','brillant','mat','articulation','répétition','tension'];const j=judgment.filter(x=>t.includes(x)).length,f=facts.filter(x=>t.includes(x)).length;if(j>=2&&f<2)return'« Tu me donnes surtout un jugement. Reviens à ce qui est physiquement observable : forme, surface, proportion, matière, répétition, tension. »';if(f>=4)return'« Là, oui. Tu décris avant d’interpréter. Maintenant seulement, tu peux commencer à transformer ce que tu as vu. »';if(t.length>180)return'« Tu as matière à travailler. Resserre maintenant : quels sont les trois faits les plus utiles pour ton intention ? »';return'« Va encore un peu plus loin. Je veux des faits précis, pas une ambiance générale. »'}
function feedback(){const txt=Object.values(saved.answers||{}).join(' ')+' '+(saved.notes||''),specific=textFeedback(txt);if(specific)return specific;const n=txt.trim().length,f=d.teacherFeedback||fallback.teacherFeedback;return '« '+(n<120?f.short:n<300?f.good:f.strong)+' »'}
function teacherLine(s){if(id==='w1-welcome'&&stage===0)return saved.object?'Très bien. Ne cherche pas encore ce que cet objet pourrait devenir. Décris-le exactement.':'Je pose trois objets sur la table. Choisis-en un. Pas celui que tu trouves le plus beau : celui que tu acceptes de regarder vraiment.';return s.teacher||d.opening||'Prenez votre temps. Je veux voir comment vous raisonnez.'}
function stageSummary(s){if(id==='w1-welcome'&&stage===0)return saved.object?`Objet choisi : ${selectedObject()?.name}. Commence par cinq observations factuelles.`:'Choisis un objet sur la table avant d’ouvrir ton carnet.';if(s.kind==='practice')return s.instruction||c.exercise;if(s.kind==='recap')return'Correction, synthèse et trace de fin de séance.';return s.text||d.promise}
function render(){const s=d.stages[stage],showObjects=id==='w1-welcome'&&stage===0;app.innerHTML=`<main class="course"><section class="scene" style="background-image:url('${photos[c.category]||photos.Projet}')"><div class="topbar"><div class="crumb">École · Année ${year} · ${esc(c.category)} · ${esc(c.time)}</div><button class="exit" id="exit">Quitter la salle</button></div><div class="courseTitle"><div class="eyebrow">${esc(d.room||'Salle de cours')}</div><h1>${esc(c.title)}</h1><p>${esc(d.promise||c.intro)}</p></div><aside class="teacherPresence"><div class="teacherTag"><div class="avatar">${initials}</div><div><div class="eyebrow" style="color:var(--rose)">Professeur·e</div><h2>${esc(c.teacher)}</h2></div></div><div class="role">${esc(d.teacherRole||c.category)}</div><p class="say">« ${esc(teacherLine(s))} »</p></aside><div class="sceneActions"><button class="sceneAction" data-action="notebook">Ouvrir mon carnet</button><button class="sceneAction" data-action="observe">Observer la scène</button><button class="sceneAction" data-action="mates">Écouter les camarades</button><button class="sceneAction" data-action="brief">Revoir la consigne</button></div><div class="objectTray ${showObjects?'':'hidden'}">${welcomeObjects.map(o=>`<button class="objectCard ${saved.object===o.id?'active':''}" data-object="${o.id}"><div class="objectPhoto" style="background-image:url('${o.photo}')"></div><b>${o.name}</b><span>${o.note}</span></button>`).join('')}</div><aside class="stageDock"><small>${stage+1}/${d.stages.length} · séance en cours</small><strong>${esc(s.title)}</strong><p>${esc(stageSummary(s))}</p><div class="dots">${d.stages.map((_,i)=>`<span class="dot ${i<stage?'done':i===stage?'active':''}"></span>`).join('')}</div><button class="continue" id="openStage">${showObjects&&!saved.object?'Choisir un objet':s.kind==='practice'?'Faire l’exercice':s.kind==='recap'?'Passer à la correction':'Continuer la séance'}</button></aside></section></main><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><aside class="notebook" id="notebook"><div class="notebookTop"><div><div class="eyebrow" style="color:var(--rose)">Carnet de séance</div><h3>Mes notes</h3></div><button class="close" id="closeNotebook">×</button></div><p>${selectedObject()?`Objet choisi : ${selectedObject().name}. `:''}Tu peux noter ce que tu observes, une question, un mot de vocabulaire ou une remarque du professeur.</p><textarea id="notes" placeholder="Écris ici pendant le cours…">${esc(saved.notes||'')}</textarea><div class="actions"><button class="btn" id="saveNotes">Garder mes notes</button></div></aside><div class="toast" id="toast"></div>`;bind(s)}
function stageSheet(s){let body='';if(id==='w1-welcome'&&stage===0&&selectedObject())body+=`<div class="practiceBox"><div class="eyebrow" style="color:var(--rose)">Objet choisi</div><h4>${esc(selectedObject().name)}</h4><p>Commence sans interpréter. Écris ce qui est réellement là : forme, matière, surface, proportions, articulation, tension, répétition ou bord.</p></div>`;if(s.text)body+=`<p>${esc(s.text)}</p>`;if(s.example)body+=`<div class="practiceBox"><div class="eyebrow" style="color:var(--rose)">${esc(s.exampleTitle||'Exemple')}</div><p>${esc(s.example)}</p></div>`;if(stage===0&&d.outcomes?.length)body+=`<h4>À la fin de cette séance, tu dois être capable de :</h4><ul>${d.outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if((stage===0||s.kind==='lesson')&&d.vocabulary?.length)body+=`<div class="vocab">${d.vocabulary.slice(0,6).map(v=>`<div class="term"><b>${esc(v[0]||v.term)}</b><span>${esc(v[1]||v.definition)}</span></div>`).join('')}</div>`;if(s.kind==='practice'||(id==='w1-welcome'&&stage===0&&selectedObject())){const val=saved.answers[stage]||'';const instruction=id==='w1-welcome'&&stage===0?'Écris cinq observations factuelles. Évite “beau”, “élégant”, “joli”, “ça me fait penser à…”.':(s.instruction||c.exercise);body+=`<div class="teacherFeedback">« ${esc(teacherLine(s))} »</div><div class="practiceBox"><p><b>${esc(instruction)}</b></p><textarea id="answer" placeholder="${esc(s.prompt||'Écris ton travail ici…')}">${esc(val)}</textarea></div>`}if(s.kind==='recap')body+=`<div class="teacherFeedback">${feedback()}</div><div class="trace"><b>Trace conservée</b>Ton travail, tes notes et la correction restent associés à ce cours.</div><div class="trace"><b>Travail personnel</b>${esc(d.homework||fallback.homework)}</div>`;return body}
function openStage(){const s=d.stages[stage];if(id==='w1-welcome'&&stage===0&&!saved.object){toast('Choisis d’abord un objet sur la table.');return}const sheet=document.getElementById('sheet');sheet.innerHTML=`<div class="sheetHeader"><div><div class="eyebrow" style="color:var(--rose)">Séance · étape ${stage+1}</div><h3>${esc(s.title)}</h3></div><button class="close" id="closeSheet">×</button></div>${stageSheet(s)}<div class="actions"><button class="btn soft" id="backStage" ${stage===0?'disabled':''}>Étape précédente</button><button class="btn" id="nextStage">${stage===d.stages.length-1?'Terminer la séance':'Continuer'}</button></div>`;document.getElementById('overlay').classList.add('open');document.getElementById('closeSheet').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('backStage').onclick=()=>{if(stage>0){stage--;persist();document.getElementById('overlay').classList.remove('open');render()}};document.getElementById('nextStage').onclick=()=>{const a=document.getElementById('answer');if(a){const txt=a.value.trim(),min=id==='w1-welcome'&&stage===0?80:Number(s.min||30);if(txt.length<min){toast(`Maud te demande d’aller un peu plus loin (${min} caractères minimum).`);return}saved.answers[stage]=txt;if(id==='w1-welcome'&&stage===0){const f=textFeedback(txt);toast(f.replace(/[«»]/g,''))}}if(stage<d.stages.length-1){stage++;persist();document.getElementById('overlay').classList.remove('open');render()}else finishCourse()}}
function finishCourse(){persist();const wasDone=!!L.state().completed[c.id],answer=Object.values(saved.answers||{}).join('\n\n'),quizIndex=Number(c.quiz?.correct||0),r=L.completeCourse(c.id,quizIndex,answer);if(r.ok&&!wasDone&&window.HCSchoolGameplay)window.HCSchoolGameplay.complete(c.id);try{const M=window.HCSchoolLearningMemory;if(M?.addResearch)M.addResearch({type:'note',title:`Cours · ${c.title}`,text:[saved.notes,answer].filter(Boolean).join('\n\n').slice(0,4000),tags:[c.category,'cours'],year,source:'school'})}catch(_){}localStorage.removeItem(K);document.getElementById('sheet').innerHTML=`<div class="eyebrow" style="color:var(--rose)">Fin de séance</div><h3>Le cours est terminé.</h3><div class="teacherFeedback">${feedback()}</div><p>Tu repars avec une méthode, des notes, un travail et un retour pédagogique — pas avec un score à collectionner.</p><div class="actions"><button class="btn" onclick="location.href='../school-day/'">Retour à ma journée</button><button class="btn soft" onclick="location.reload()">Revoir le cours</button></div>`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function bind(){document.getElementById('openStage').onclick=openStage;document.getElementById('exit').onclick=()=>location.href='../school-day/';document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{saved.object=b.dataset.object;persist();render();toast('Objet choisi. Maintenant, regarde-le avant de l’interpréter.')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const k=b.dataset.action;if(k==='notebook'){document.getElementById('notebook').classList.add('open');return}if(k==='observe')toast(selectedObject()?`Observe ${selectedObject().name} : cherche forme, surface, proportion, matière, répétition, tension.`:'Regarde la salle, les objets, les gestes. Rien n’est encore une “inspiration” tant que tu ne sais pas le décrire.');if(k==='mates')toast('Autour de toi, certains dessinent déjà. Maud leur demande de poser le crayon et de revenir à l’observation.');if(k==='brief')toast(stageSummary(d.stages[stage]))});document.getElementById('closeNotebook').onclick=()=>document.getElementById('notebook').classList.remove('open');document.getElementById('saveNotes').onclick=()=>{saved.notes=document.getElementById('notes').value;persist();document.getElementById('notebook').classList.remove('open');toast('Notes gardées dans le carnet de séance.')}}
render();
})();
</script>
