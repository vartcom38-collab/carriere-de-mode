<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Cours</title><style>:root{--paper:#fffaf4;--ink:#271f1b;--muted:#75655c;--line:#e2d3c7;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf7f2,#efe3d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:48px 20px 90px}.crumb{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}.top{display:flex;justify-content:space-between;gap:18px}.top h1{font:46px/1.02 Georgia,serif;margin:8px 0}.meta{font:13px/1.5 Georgia,serif;color:var(--muted)}.badge{padding:8px 10px;border-radius:999px;background:#edf4f1;color:#456e66;font-size:10px;font-weight:900;height:max-content}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 16px 40px rgba(68,47,38,.08)}.card h2{font:27px Georgia,serif;margin:0 0 10px}.card h3{font:20px Georgia,serif;margin:20px 0 7px}.card p,.card li{font:14px/1.65 Georgia,serif;color:#5f5048}.lesson{border-left:3px solid #d8b8a7;padding-left:16px;margin:18px 0}.exercise{background:#f4ece6;border-radius:16px;padding:16px}.exercise textarea{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font:14px/1.5 Georgia,serif}.answers{display:grid;gap:8px;margin:12px 0}.answer{display:flex;gap:9px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:13px;padding:13px 15px;background:#29211d;color:white;font-weight:900;cursor:pointer}.btn.alt{background:var(--teal)}.btn.draw{background:#a35f52}.btn.practice{background:#786555}.locked{padding:20px;border-radius:18px;background:#fff1ec;border:1px solid #edcabc;font:14px/1.55 Georgia,serif;color:#6f5246}.result{display:none;margin-top:14px;border-radius:14px;padding:14px;background:#edf5ef;color:#416b58;font:13px/1.5 Georgia,serif}.result.show{display:block}.skills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.skill{font-size:9px;font-weight:900;padding:7px 9px;border-radius:999px;background:#f0e8e1}.timebox{margin-top:14px;padding:12px;border-radius:14px;background:#2d2723;color:#fff;font:12px/1.5 Georgia,serif}@media(max-width:700px){.top{display:block}.top h1{font-size:38px}}</style></head><body><main class="wrap"><div class="crumb">ÉCOLE · COURS</div><div id="app"></div></main><script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/year1-week8-v1.js"></script><script src="../school/year1-week9-v1.js"></script><script src="../school/year1-week10-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../school/deep-course-content-v1.js"></script><script src="../game-engine.js"></script><script>(function(){const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||'w1-welcome',L=HCSchoolLife,c=L.courses.find(x=>x.id===id),s=L.state();if(!c){app.innerHTML='<div class="locked">Cours introuvable.</div>';return}const unlocked=L.isUnlocked(c,s),done=s.completed[c.id],sections=c.lesson.map(([h,t])=>`<div class="lesson"><h3>${h}</h3><p>${t}</p></div>`).join(''),skills=Object.entries(c.skills||{}).map(([k,v])=>`<span class="skill">${k.toUpperCase()} +${v}</span>`).join(''),prereq=c.prereq.map(pid=>L.courses.find(x=>x.id===pid)?.title||pid),isDrawing=c.category==='Dessin'||c.id==='w1-drawing';let practicalButtons='';if(c.practiceRoute)practicalButtons+=`<button class="btn practice" onclick="location.href='${c.practiceRoute}'">OUVRIR L’ATELIER PRATIQUE</button>`;else{if(isDrawing)practicalButtons+=`<button class="btn draw" onclick="location.href='../school-drawing/'">STYLET · NIVEAU 1</button><button class="btn draw" onclick="location.href='../school-drawing-level2/'">STYLET · NIVEAU 2</button>`;if(c.category==='Textile'||c.id==='w1-textile')practicalButtons+=`<button class="btn practice" onclick="location.href='../school-textile-lab/'">ATELIER MATIÈRE</button>`;if(c.category==='Modélisme'||c.id==='w1-pattern')practicalButtons+=`<button class="btn practice" onclick="location.href='../school-pattern-skirt/'">PATRONNAGE · JUPE DROITE</button>`}app.innerHTML=`<div class="top"><div><div class="meta">Jour ${c.day} · ${c.time} · ${c.duration} min de temps de jeu · ${c.teacher}</div><h1>${c.title}</h1><div class="meta">${c.category}</div><div class="skills">${skills}</div></div><div class="badge">${done?'TERMINÉ':unlocked?'DISPONIBLE':'VERROUILLÉ'}</div></div><div class="timebox">Tu peux prendre autant de temps réel que nécessaire. Les ${c.duration} minutes de jeu ne seront comptées qu’au moment où tu valideras ce cours pour la première fois.</div>${!unlocked?`<div class="locked">À terminer avant : ${prereq.join(' · ')}</div>`:`<div class="card"><h2>Introduction</h2><p>${c.intro}</p>${sections}${practicalButtons?`<div class="btns">${practicalButtons}</div>`:''}</div><div class="card"><h2>Travail pratique</h2><div class="exercise"><p>${c.exercise}</p><textarea id="exercise" placeholder="Tes notes, observations, calculs ou réponse de travail…">${done?.exercise||''}</textarea></div>${practicalButtons?`<div class="btns">${practicalButtons}</div>`:''}</div><div class="card"><h2>Vérification</h2><p>${c.quiz.q}</p><div class="answers">${c.quiz.a.map((a,i)=>`<label class="answer"><input type="radio" name="quiz" value="${i}"><span>${a}</span></label>`).join('')}</div><div class="btns"><button class="btn alt" id="validate">${done?'ENREGISTRER UNE NOUVELLE TENTATIVE':'J’AI TERMINÉ CE COURS'}</button><button class="btn" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="result ${done?'show':''}" id="result">${done?`Cours déjà terminé · score ${s.scores[c.id]||0}/100. Le temps de jeu ne sera pas compté une seconde fois.`:''}</div></div>`}`;const v=document.getElementById('validate');if(v)v.onclick=()=>{const checked=document.querySelector('input[name="quiz"]:checked');if(!checked){alert('Choisis une réponse pour terminer le cours.');return}const wasDone=!!L.state().completed[c.id],r=L.completeCourse(c.id,Number(checked.value),document.getElementById('exercise').value),box=document.getElementById('result');if(!r.ok){box.textContent='Le cours ne peut pas encore être validé.';box.classList.add('show');return}if(!wasDone&&window.HCSchoolGameplay)HCSchoolGameplay.complete(c.id);box.textContent=(r.correct?'Bonne réponse. ':'Ta réponse est enregistrée ; tu pourras revenir sur cette notion. ')+`Score ${r.score}/100.`+(wasDone?' Aucun temps supplémentaire n’a été consommé.':` ${c.duration} minutes de jeu sont maintenant comptabilisées et ta présence est enregistrée.`);box.classList.add('show');setTimeout(()=>location.href='../school-day/',1200)}})();</script><script src="./deep-course-ui-v1.js" defer></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
