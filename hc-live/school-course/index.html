<style>
:root{--ink:#241b17;--paper:#fffaf5;--muted:#76655d;--rose:#b96f68;--deep:#2a211c;--line:rgba(78,54,43,.16);--glass:rgba(255,250,245,.93);--green:#526f65;--shadow:0 28px 80px rgba(36,23,18,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17110e;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,textarea{font:inherit}.course,.scene{min-height:100vh}.scene{position:relative;background:#332922 center/cover no-repeat;overflow:hidden}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,10,8,.70),rgba(15,10,8,.18) 42%,rgba(15,10,8,.10) 64%,rgba(15,10,8,.50)),linear-gradient(0deg,rgba(17,11,9,.76),transparent 52%)}.topbar{position:absolute;z-index:20;top:20px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center;color:#fff}.crumb,.exit{border:1px solid rgba(255,255,255,.28);background:rgba(25,17,13,.38);backdrop-filter:blur(14px);color:#fff;border-radius:999px}.crumb{padding:10px 14px;font:800 9px/1 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.exit{padding:10px 14px;cursor:pointer}.courseTitle{position:absolute;z-index:5;left:48px;bottom:46px;width:min(650px,46vw);color:#fff}.eyebrow{font:800 9px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#efbdb8}.courseTitle h1{font:clamp(44px,4.5vw,76px)/.95 Georgia,serif;font-weight:400;letter-spacing:-.04em;margin:11px 0 13px;text-shadow:0 3px 18px rgba(0,0,0,.3)}.courseTitle p{font:17px/1.5 Georgia,serif;color:rgba(255,255,255,.9);max-width:600px;margin:0}.teacherPresence{position:absolute;z-index:8;right:34px;top:95px;width:min(370px,30vw);padding:20px 22px;border-radius:22px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(17px)}.teacherTag{display:flex;align-items:center;gap:11px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#e8d8cb;border:1px solid #d4bbab;font-size:20px}.teacherPresence h2{font:28px/1 Georgia,serif;font-weight:400;margin:3px 0}.teacherPresence .role{font:13px/1.45 Georgia,serif;color:var(--muted)}.teacherPresence .say{font:italic 18px/1.55 Georgia,serif;color:#4f4039;margin:16px 0 0}.stageDock{position:absolute;z-index:10;right:34px;bottom:32px;width:min(370px,30vw);padding:18px 20px;border-radius:21px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(17px)}.stageDock small{font:800 9px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}.stageDock strong{display:block;font:23px/1.15 Georgia,serif;font-weight:400;margin:8px 0}.stageDock p{font:13px/1.48 Georgia,serif;color:var(--muted);margin:0}.dots{display:flex;gap:5px;margin:13px 0}.dot{height:4px;flex:1;border-radius:99px;background:#ddd0c6}.dot.done,.dot.active{background:#4a3931}.continue{width:100%;border:0;border-radius:999px;padding:13px 15px;background:var(--deep);color:#fff;font:800 10px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.objectTray{position:absolute;z-index:9;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:10px}.objectTray.hidden{display:none}.objectCard{width:132px;border:1px solid rgba(255,255,255,.32);border-radius:18px;overflow:hidden;background:rgba(255,250,245,.94);box-shadow:0 16px 40px rgba(0,0,0,.23);cursor:pointer;transition:.18s}.objectCard:hover{transform:translateY(-4px)}.objectCard.active{outline:3px solid #e6aca6}.objectPhoto{height:84px;background:center/cover no-repeat}.objectCard b{display:block;padding:10px 11px 2px;font:15px/1.1 Georgia,serif}.objectCard span{display:block;padding:0 11px 11px;font:10px/1.3 Arial,sans-serif;color:#77665e}.sceneActions{position:absolute;z-index:9;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.sceneAction{border:1px solid rgba(255,255,255,.42);background:rgba(28,19,15,.48);color:#fff;border-radius:999px;padding:10px 13px;font:800 10px/1 Arial,sans-serif;cursor:pointer;backdrop-filter:blur(12px)}.overlay{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(18,12,9,.62);backdrop-filter:blur(7px)}.overlay.open{display:flex}.sheet{width:min(960px,95vw);max-height:91vh;overflow:auto;background:var(--paper);border-radius:28px;padding:30px 32px;box-shadow:0 40px 120px rgba(0,0,0,.42)}.sheetHeader{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.sheet h3{font:37px/1.04 Georgia,serif;font-weight:400;margin:6px 0 16px}.sheet h4{font:24px/1.1 Georgia,serif;font-weight:400;margin:18px 0 8px}.sheet p,.sheet li{font:16px/1.68 Georgia,serif;color:#5c4d45}.close{border:0;background:#eee3da;width:40px;height:40px;border-radius:50%;cursor:pointer}.teacherFeedback{margin:18px 0;padding:18px 20px;border-left:3px solid var(--rose);background:#f7eee8;font:italic 18px/1.55 Georgia,serif;color:#55463f}.practiceBox{margin-top:18px;padding:20px;border-radius:19px;background:#f1e8e1}.practiceBox textarea{width:100%;min-height:180px;border:1px solid #d7c6ba;border-radius:15px;padding:16px;background:#fffdf9;color:var(--ink);font:15px/1.6 Georgia,serif;resize:vertical}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:999px;padding:13px 17px;background:var(--deep);color:white;font:800 10px/1 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.btn.soft{background:#ece2da;color:#42342e}.btn:disabled{opacity:.4}.sortGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0}.sortCol{border:1px solid var(--line);border-radius:17px;padding:14px;background:#f7f0ea}.sortCol b{display:block;margin-bottom:9px}.phrase{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px;margin:7px 0;cursor:pointer;color:var(--ink)}.phrase.good{border-color:#9db7ad;background:#edf5f1}.phrase.bad{border-color:#d7a69f;background:#fff0ed}.exampleRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.exCard{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fff;cursor:pointer;min-height:160px}.exCard strong{display:block;font:800 9px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin-bottom:9px}.exCard.selected{outline:3px solid rgba(185,111,104,.35)}.choiceRow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;cursor:pointer}.chip.active{background:var(--deep);color:#fff}.miniFeedback{margin-top:12px;padding:13px 15px;border-radius:14px;background:#eef4f1;color:#49665d;font:13px/1.5 Georgia,serif}.trace{padding:15px;border-radius:17px;background:#eef3f0;margin:9px 0}.trace b{display:block;font:800 9px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4e6f65;margin-bottom:6px}.notebook{position:fixed;z-index:45;right:0;top:0;bottom:0;width:min(470px,94vw);transform:translateX(102%);transition:.26s ease;background:#f8f0e8;box-shadow:-30px 0 85px rgba(0,0,0,.3);padding:28px;overflow:auto}.notebook.open{transform:translateX(0)}.notebook h3{font:36px/1 Georgia,serif;font-weight:400;margin:7px 0}.notebook textarea{width:100%;min-height:270px;border:0;border-bottom:1px solid #baa79b;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#d8cbc0 32px);padding:8px 4px;font:16px/2 Georgia,serif;color:var(--ink);outline:none;resize:vertical}.notebookTop{display:flex;justify-content:space-between}.toast{position:fixed;z-index:70;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;background:#251d19;color:#fff;border-radius:999px;padding:12px 17px;font:13px/1 Georgia,serif;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.locked{min-height:100vh;display:grid;place-items:center;padding:30px;background:#f3ebe4}.locked div{max-width:650px;background:#fffaf5;padding:30px;border-radius:24px}@media(max-width:1000px){.teacherPresence,.stageDock{width:330px}.courseTitle{width:44vw}}@media(max-width:780px){.teacherPresence{left:16px;right:16px;top:72px;width:auto;padding:15px}.teacherPresence .say{font-size:15px}.courseTitle{left:20px;right:20px;bottom:250px;width:auto}.courseTitle h1{font-size:42px}.stageDock{left:16px;right:16px;bottom:16px;width:auto}.sceneActions,.objectTray{display:none}.sortGrid,.exampleRow{grid-template-columns:1fr}.sheet{padding:23px 20px}}

<script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/year1-week8-v1.js"></script><script src="../school/year1-week9-v1.js"></script><script src="../school/year1-week10-v1.js"></script><script src="../school/year1-weeks11-12-v1.js"></script><script src="../school/year1-weeks13-16-v1.js"></script><script src="../school/year1-weeks17-20-v1.js"></script><script src="../school/year1-weeks21-24-v1.js"></script><script src="../school/year1-weeks25-28-v1.js"></script><script src="../school/year1-weeks29-32-v1.js"></script><script src="../school/year2-weeks1-4-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../school/school-learning-memory-v1.js"></script><script src="../school/school-community-v1.js"></script><script src="../school/school-classroom-social-v1.js"></script><script src="../school/real-course-pedagogy-v1.js"></script><script src="../game-engine.js"></script>
<script>
(function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||'w1-welcome',L=window.HCSchoolLife,A=window.HCSchoolAcademic,c=L?.courses.find(x=>x.id===id),academic=A?.state?.();
if(!c){app.innerHTML='<div class="locked"><div>Cours introuvable.</div></div>';return}const year=Number(c.year||1);if(year!==Number(academic?.year||1)){app.innerHTML=`<div class="locked"><div>Ce cours appartient à l’Année ${year}.</div></div>`;return}const state=L.state(),unlocked=L.isUnlocked(c,state),done=state.completed[c.id];if(!unlocked){app.innerHTML='<div class="locked"><div>Ce cours n’est pas encore accessible.</div></div>';return}
const P=window.HCRealCoursePedagogy?.get(id),fallback={room:'Salle de cours',teacherRole:c.category,promise:c.intro,opening:c.intro,stages:[...(c.lesson||[]).map(([h,t])=>({kind:'lesson',title:h,text:t})),{kind:'practice',title:'Travail de séance',instruction:c.exercise,min:40},{kind:'recap',title:'Synthèse',text:'Reprends ce que tu as appris.'}],homework:'Relis tes notes.'};const d=P||fallback,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=(c.teacher||'Professeur').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),K='haute-couture-live-classroom-v4:'+id;
const photos={Méthode:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=2200&q=88',Dessin:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=2200&q=88',Textile:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Matière:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Modélisme:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=2200&q=88',Moulage:'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=2200&q=88',Culture:'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2200&q=88',Montage:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=2200&q=88',Projet:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2200&q=88'};
const objects=[{id:'scissors',name:'Ciseaux de tailleur',note:'métal · articulation · tension',photo:'https://images.unsplash.com/photo-1500353391678-d7b57979d6d2?auto=format&fit=crop&w=500&q=80'},{id:'thread',name:'Bobine de fil',note:'répétition · ligne · enroulement',photo:'https://images.unsplash.com/photo-1616627547584-bf28cee262db?auto=format&fit=crop&w=500&q=80'},{id:'muslin',name:'Morceau de toile',note:'souplesse · pli · bord',photo:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=500&q=80'}];
let saved={stage:0,answers:{},notes:'',object:null,sort:{},example:null,verb:null};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(K)||'{}'))}catch(_){}const isWelcome=id==='w1-welcome';const welcomeStages=[{kind:'choose',title:'Choisir et regarder'},{kind:'sort',title:'Observation ou interprétation ?'},{kind:'examples',title:'Voir la différence'},{kind:'practice',title:'Décrire précisément'},{kind:'spot',title:'Repérer la formulation utile'},{kind:'intention',title:'Construire une intention'},{kind:'recap',title:'Correction et synthèse'}];const stages=isWelcome?welcomeStages:d.stages;let stage=Math.max(0,Math.min(Number(saved.stage||0),stages.length-1));function persist(){saved.stage=stage;localStorage.setItem(K,JSON.stringify(saved))}function obj(){return objects.find(o=>o.id===saved.object)}
function teacherLine(){if(!isWelcome)return d.stages?.[stage]?.teacher||d.opening||'Prenez votre temps.';return['Choisissez un objet. Pas celui qui vous plaît le plus : celui que vous acceptez de regarder vraiment.','Avant de créer, apprenez à séparer ce qui est visible de ce que votre esprit ajoute.','Regardez les trois niveaux. Le troisième est utile parce qu’il donne des faits exploitables.','Maintenant, décrivez. Aucun mot esthétique ne vous aidera.','Une formulation utile contient quelque chose que vous pouvez montrer du doigt.','Votre intention doit être une action, pas le nom d’un vêtement.','Vous avez maintenant une chaîne : voir → préciser → transformer.'][stage]}
function summary(){if(!isWelcome){const s=stages[stage];return s.instruction||s.text||d.promise}return['Choisis un objet sur la table.','Classe les phrases dans la bonne famille.','Compare mauvais, moyen et bon exemple.','Écris cinq observations factuelles.','Choisis la phrase la plus exploitable.','Formule une intention à partir de ton observation.','Relis la méthode et garde une trace.'][stage]}
function render(){const showObjects=isWelcome&&stage===0;app.innerHTML=`<main class="course"><section class="scene" style="background-image:url('${photos[c.category]||photos.Projet}')"><div class="topbar"><div class="crumb">École · Année ${year} · ${esc(c.category)} · ${esc(c.time)}</div><button class="exit" id="exit">Quitter la salle</button></div><div class="courseTitle"><div class="eyebrow">${esc(d.room||'Salle de cours')}</div><h1>${esc(c.title)}</h1><p>${esc(d.promise||c.intro)}</p></div><aside class="teacherPresence"><div class="teacherTag"><div class="avatar">${initials}</div><div><div class="eyebrow" style="color:var(--rose)">Professeur·e</div><h2>${esc(c.teacher)}</h2></div></div><div class="role">${esc(d.teacherRole||c.category)}</div><p class="say">« ${esc(teacherLine())} »</p></aside><div class="sceneActions"><button class="sceneAction" data-action="notebook">Carnet</button><button class="sceneAction" data-action="observe">Observer</button><button class="sceneAction" data-action="mates">Camarades</button><button class="sceneAction" data-action="brief">Consigne</button></div><div class="objectTray ${showObjects?'':'hidden'}">${objects.map(o=>`<button class="objectCard ${saved.object===o.id?'active':''}" data-object="${o.id}"><div class="objectPhoto" style="background-image:url('${o.photo}')"></div><b>${o.name}</b><span>${o.note}</span></button>`).join('')}</div><aside class="stageDock"><small>${stage+1}/${stages.length} · séance</small><strong>${esc(stages[stage].title)}</strong><p>${esc(summary())}</p><div class="dots">${stages.map((_,i)=>`<span class="dot ${i<stage?'done':i===stage?'active':''}"></span>`).join('')}</div><button class="continue" id="openStage">${showObjects&&!saved.object?'Choisir un objet':'Travailler cette étape'}</button></aside></section></main><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><aside class="notebook" id="notebook"><div class="notebookTop"><div><div class="eyebrow" style="color:var(--rose)">Carnet de séance</div><h3>Mes notes</h3></div><button class="close" id="closeNotebook">×</button></div><p>${obj()?`Objet : ${obj().name}. `:''}Note ce que tu vois, ce que tu comprends et les remarques du professeur.</p><textarea id="notes">${esc(saved.notes||'')}</textarea><div class="actions"><button class="btn" id="saveNotes">Garder mes notes</button></div></aside><div class="toast" id="toast"></div>`;bind()}
function welcomeBody(){if(stage===0)return `<div class="practiceBox"><h4>${obj()?esc(obj().name):'Choisis un objet'}</h4><p>${obj()?'Regarde-le 20 secondes avant de continuer. Cherche forme, matière, direction, répétition, articulation, bord, poids visuel.':'Les trois objets sont sur la table dans la scène.'}</p></div>`;
if(stage===1){const phrases=[['Le métal réfléchit la lumière.','obs'],['Cet objet me paraît agressif.','int'],['Deux branches pivotent autour d’un axe.','obs'],['Ça évoque la précision.','int'],['Je veux répéter un mouvement d’ouverture.','intent'],['La forme se termine par deux pointes.','obs']];return `<p>Pour chaque phrase, choisis sa nature.</p>${phrases.map((p,i)=>`<div class="practiceBox"><b>${esc(p[0])}</b><div class="choiceRow"><button class="chip ${saved.sort[i]==='obs'?'active':''}" data-sort="${i}:obs">Observation</button><button class="chip ${saved.sort[i]==='int'?'active':''}" data-sort="${i}:int">Interprétation</button><button class="chip ${saved.sort[i]==='intent'?'active':''}" data-sort="${i}:intent">Intention</button></div></div>`).join('')}<div class="miniFeedback">Observation = vérifiable. Interprétation = sens/impression. Intention = action que tu veux produire.</div>`}
if(stage===2)return `<p>Lis les trois formulations et clique sur celle qui serait la plus utile dans un carnet de recherche.</p><div class="exampleRow"><button class="exCard ${saved.example===0?'selected':''}" data-example="0"><strong>Trop vague</strong>« Cet objet est beau et très élégant. »</button><button class="exCard ${saved.example===1?'selected':''}" data-example="1"><strong>Mieux, mais encore flou</strong>« Il a une forme intéressante et semble assez rigide. »</button><button class="exCard ${saved.example===2?'selected':''}" data-example="2"><strong>Précis</strong>« Deux lames métalliques longues pivotent autour d’un axe central ; la masse est concentrée près de l’articulation. »</button></div>${saved.example!=null?`<div class="teacherFeedback">${saved.example===2?'« Oui. Cette phrase contient des éléments que vous pouvez montrer et vérifier. »':'« Pas encore. Cherchez ce qui est mesurable, visible ou matériel. »'}</div>`:''}`;
if(stage===3)return `<div class="teacherFeedback">« Décrivez avant de chercher une idée. »</div><div class="practiceBox"><p><b>Écris cinq observations factuelles sur ${esc(obj()?.name||'ton objet')}.</b></p><textarea id="answer" placeholder="Ex. : surface mate ; deux parties reliées par un axe ; bord net…">${esc(saved.answers[3]||'')}</textarea></div>`;
if(stage===4){const opts=['Cet objet est moderne.','Deux éléments identiques se répètent autour d’un axe.','Cet objet me fait penser à une armure.'];return `<p>Quelle phrase donne le meilleur point de départ pour un travail de design ?</p><div class="choiceRow">${opts.map((o,i)=>`<button class="chip ${saved.spot===i?'active':''}" data-spot="${i}">${esc(o)}</button>`).join('')}</div>${saved.spot!=null?`<div class="teacherFeedback">${saved.spot===1?'« Exactement. Vous avez un fait formel exploitable. »':'« Vous êtes encore dans le jugement ou l’association. Revenez à ce qui est visible. »'}</div>`:''}`}
if(stage===5){const verbs=['Allonger','Répéter','Suspendre','Protéger','Fragmenter','Resserrer'];return `<p>Choisis un verbe d’action, puis formule une intention sans nommer directement un vêtement.</p><div class="choiceRow">${verbs.map(v=>`<button class="chip ${saved.verb===v?'active':''}" data-verb="${v}">${v}</button>`).join('')}</div><div class="practiceBox"><textarea id="answer" placeholder="Ex. : Répéter une articulation pour créer un volume qui s’ouvre progressivement.">${esc(saved.answers[5]||'')}</textarea></div>`}
return `<div class="trace"><b>Ce que tu sais maintenant</b>Distinguer observation, interprétation et intention ; décrire sans juger ; partir d’un fait visible ; formuler une intention avec un verbe d’action.</div><div class="exampleRow"><div class="exCard"><strong>À éviter</strong>« C’est joli / moderne / élégant. »</div><div class="exCard"><strong>À viser</strong>« Trois plis verticaux partent du même point d’attache. »</div><div class="exCard"><strong>Transformer</strong>« Répéter cette verticalité pour allonger le corps. »</div></div><div class="teacherFeedback">« Ce n’est pas la quantité d’idées qui compte ici. C’est la qualité du lien entre ce que vous voyez et ce que vous décidez. »</div>`}
function genericBody(){const s=stages[stage];let b='';if(s.text)b+=`<p>${esc(s.text)}</p>`;if(s.example)b+=`<div class="exampleRow"><div class="exCard"><strong>Exemple</strong>${esc(s.example)}</div></div>`;if(s.kind==='practice')b+=`<div class="practiceBox"><p><b>${esc(s.instruction||c.exercise)}</b></p><textarea id="answer">${esc(saved.answers[stage]||'')}</textarea></div>`;if(s.kind==='recap')b+=`<div class="trace"><b>Travail personnel</b>${esc(d.homework||'')}</div>`;return b}
function openStage(){if(isWelcome&&stage===0&&!saved.object){toast('Choisis d’abord un objet sur la table.');return}const sheet=document.getElementById('sheet');sheet.innerHTML=`<div class="sheetHeader"><div><div class="eyebrow" style="color:var(--rose)">Étape ${stage+1}</div><h3>${esc(stages[stage].title)}</h3></div><button class="close" id="closeSheet">×</button></div>${isWelcome?welcomeBody():genericBody()}<div class="actions"><button class="btn soft" id="back" ${stage===0?'disabled':''}>Précédent</button><button class="btn" id="next">${stage===stages.length-1?'Terminer la séance':'Continuer'}</button></div>`;document.getElementById('overlay').classList.add('open');document.getElementById('closeSheet').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('back').onclick=()=>{if(stage>0){stage--;persist();document.getElementById('overlay').classList.remove('open');render()}};document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.sort.split(':');saved.sort[i]=v;persist();openStage()});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{saved.example=Number(b.dataset.example);persist();openStage()});document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{saved.spot=Number(b.dataset.spot);persist();openStage()});document.querySelectorAll('[data-verb]').forEach(b=>b.onclick=()=>{saved.verb=b.dataset.verb;persist();openStage()});document.getElementById('next').onclick=nextStage}
function nextStage(){if(isWelcome){if(stage===1){const correct={0:'obs',1:'int',2:'obs',3:'int',4:'intent',5:'obs'};if(Object.keys(saved.sort).length<6){toast('Classe les six phrases avant de continuer.');return}const ok=Object.keys(correct).filter(k=>saved.sort[k]===correct[k]).length;if(ok<5){toast(`Tu en as ${ok}/6. Relis la différence entre fait, interprétation et intention.`);return}}if(stage===2&&saved.example!==2){toast('Choisis l’exemple réellement précis avant de continuer.');return}if(stage===3){const a=document.getElementById('answer'),txt=a.value.trim();if(txt.length<100){toast('Maud veut cinq observations réellement développées.');return}saved.answers[3]=txt;const low=txt.toLowerCase();if(['joli','beau','élégant','moderne','original'].some(x=>low.includes(x))){toast('Maud : enlève les jugements esthétiques et remplace-les par des faits.');return}}if(stage===4&&saved.spot!==1){toast('Reviens à une formulation directement observable.');return}if(stage===5){const a=document.getElementById('answer'),txt=a.value.trim();if(!saved.verb){toast('Choisis d’abord un verbe d’action.');return}if(txt.length<55){toast('Développe un peu ton intention.');return}saved.answers[5]=txt}}else{const a=document.getElementById('answer');if(a&&a.value.trim().length<Number(stages[stage].min||30)){toast('Le professeur te demande d’aller un peu plus loin.');return}if(a)saved.answers[stage]=a.value.trim()}if(stage<stages.length-1){stage++;persist();document.getElementById('overlay').classList.remove('open');render()}else finish()}
function finish(){persist();const wasDone=!!L.state().completed[c.id],answer=Object.values(saved.answers).join('\n\n'),r=L.completeCourse(c.id,Number(c.quiz?.correct||0),answer);if(r.ok&&!wasDone&&window.HCSchoolGameplay)HCSchoolGameplay.complete(c.id);try{window.HCSchoolLearningMemory?.addResearch?.({type:'note',title:`Cours · ${c.title}`,text:[saved.notes,answer].filter(Boolean).join('\n\n').slice(0,4000),tags:[c.category,'cours'],year,source:'school'})}catch(_){}localStorage.removeItem(K);document.getElementById('sheet').innerHTML=`<div class="eyebrow" style="color:var(--rose)">Fin de séance</div><h3>Le cours est terminé.</h3><div class="teacherFeedback">« Garde cette méthode. Dans les prochains cours, je veux que tu saches toujours dire ce que tu as vu avant de dire ce que tu veux faire. »</div><div class="actions"><button class="btn" onclick="location.href='../school-day/'">Retour à ma journée</button><button class="btn soft" onclick="location.reload()">Revoir le cours</button></div>`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}function bind(){document.getElementById('openStage').onclick=openStage;document.getElementById('exit').onclick=()=>location.href='../school-day/';document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{saved.object=b.dataset.object;persist();render();toast('Objet choisi. Maintenant regarde-le avant de l’interpréter.')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const k=b.dataset.action;if(k==='notebook'){document.getElementById('notebook').classList.add('open');return}if(k==='observe')toast(obj()?`Observe ${obj().name} : forme, matière, direction, répétition, tension.`:'Regarde la scène avant de chercher une idée.');if(k==='mates')toast('À côté de toi, certains dessinent déjà. Maud leur demande de revenir à l’observation.');if(k==='brief')toast(summary())});document.getElementById('closeNotebook').onclick=()=>document.getElementById('notebook').classList.remove('open');document.getElementById('saveNotes').onclick=()=>{saved.notes=document.getElementById('notes').value;persist();document.getElementById('notebook').classList.remove('open');toast('Notes conservées.')}}render();
})();
</script>
