<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Cours</title><style>
:root{--paper:#fffaf5;--ink:#251d19;--muted:#75645b;--line:rgba(82,58,46,.15);--rose:#b96f68;--deep:#2b211c;--soft:#f2e8df;--green:#54766d;--shadow:0 24px 70px rgba(53,35,27,.13)}*{box-sizing:border-box}body{margin:0;background:#f3ebe4;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.shell{width:min(1600px,94vw);margin:auto;padding:28px 0 70px}.crumb{font:800 10px/1 Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#a65c55;margin-bottom:16px}.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.55fr);gap:18px}.scene{min-height:560px;border-radius:30px;overflow:hidden;position:relative;background:#d9cec4 center/cover no-repeat;box-shadow:var(--shadow)}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,20,16,.74) 0%,rgba(28,20,16,.32) 50%,rgba(28,20,16,.08) 100%),linear-gradient(0deg,rgba(22,16,13,.48),transparent 42%)}.sceneCopy{position:absolute;z-index:2;left:42px;bottom:42px;max-width:720px;color:#fff}.eyebrow{font:800 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f2c4bf}.scene h1{font:clamp(48px,5vw,78px)/.96 Georgia,serif;font-weight:400;letter-spacing:-.035em;margin:12px 0 14px}.scene .lead{font:18px/1.5 Georgia,serif;color:rgba(255,255,255,.9);max-width:650px}.side{display:grid;gap:14px;align-content:start}.panel{background:rgba(255,250,245,.96);border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:22px;box-shadow:0 14px 38px rgba(60,40,31,.08)}.teacher{display:flex;gap:13px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#eadbcf;border:1px solid #d9c3b2;font:25px Georgia,serif}.panel h2{font:29px/1.05 Georgia,serif;font-weight:400;margin:6px 0}.panel p{font:14px/1.55 Georgia,serif;color:var(--muted);margin:8px 0}.label{font:800 9px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}.now{border-left:4px solid var(--rose)}.now strong{display:block;font:22px/1.2 Georgia,serif;margin:8px 0}.progressText{font:800 10px/1 Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#5d4b42}.steps{display:grid;gap:0;margin-top:10px}.stepDot{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font:13px/1.35 Georgia,serif;color:#7b695f}.stepDot:first-child{border-top:0}.stepDot i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eee5de;font:800 9px Arial,sans-serif;font-style:normal}.stepDot.active{color:var(--ink)}.stepDot.active i{background:var(--deep);color:#fff}.stepDot.done i{background:#dce9e3;color:#45685e}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;margin-top:18px}.lessonCard{background:var(--paper);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:34px 38px;box-shadow:var(--shadow);min-height:520px}.lessonCard h3{font:40px/1.05 Georgia,serif;font-weight:400;letter-spacing:-.02em;margin:8px 0 18px}.lessonCard p,.lessonCard li{font:16px/1.72 Georgia,serif;color:#5d4e46}.teacherQuote{margin:24px 0;padding:20px 24px;border-left:3px solid var(--rose);background:#f6eee8;font:italic 19px/1.55 Georgia,serif;color:#594942}.example{margin:22px 0;padding:20px;border-radius:18px;background:#eee7df}.example b{display:block;font:800 9px/1 Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--rose);margin-bottom:8px}.practice{margin-top:20px}.practice textarea{width:100%;min-height:180px;border:1px solid #d8c8bb;border-radius:16px;background:#fffdf9;padding:16px;font:15px/1.6 Georgia,serif;color:var(--ink);resize:vertical;outline:none}.practice textarea:focus{border-color:#a96e66;box-shadow:0 0 0 3px rgba(185,111,104,.1)}.hint{font:12px/1.5 Georgia,serif;color:#8a776d;margin-top:8px}.vocab{display:grid;gap:10px}.vocab div{padding:12px 0;border-top:1px solid var(--line)}.vocab div:first-child{border-top:0}.vocab b{display:block;font:17px Georgia,serif;margin-bottom:4px}.vocab span{font:12px/1.5 Georgia,serif;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}button{font-family:Arial,sans-serif}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--deep);color:#fff;font-weight:800;letter-spacing:.04em;cursor:pointer}.btn.secondary{background:#eee4dc;color:#493930}.btn.rose{background:var(--rose)}.btn:disabled{opacity:.35;cursor:not-allowed}.checkCard{margin-top:22px;padding:20px;border-radius:18px;background:#f1e9e2}.answers{display:grid;gap:8px;margin-top:12px}.answer{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:13px;background:#fff;border:1px solid var(--line);font:14px/1.45 Georgia,serif}.feedback{display:none;margin-top:16px;padding:17px;border-radius:16px;background:#eaf2ee;color:#41645a;font:14px/1.55 Georgia,serif}.feedback.show{display:block}.locked{background:#fff7f1;border:1px solid #e7c9bd;border-radius:22px;padding:24px;font:15px/1.6 Georgia,serif}.homework{padding:18px;border-radius:18px;background:#2d2521;color:#fff}.homework p{color:#e7d9cf;margin:8px 0}.courseTools{display:grid;gap:9px}.courseTools button{width:100%;text-align:left;border:1px solid var(--line);background:#fffaf5;border-radius:14px;padding:12px;cursor:pointer;font-weight:800;color:#4c3c34}.courseTools small{display:block;font:11px/1.4 Georgia,serif;color:var(--muted);margin-top:4px}@media(max-width:1050px){.hero,.workspace{grid-template-columns:1fr}.scene{min-height:500px}.side{grid-template-columns:1fr 1fr}.workspace>.side{grid-template-columns:1fr 1fr}.lessonCard{min-height:0}}@media(max-width:720px){.shell{width:min(95vw,720px);padding-top:16px}.scene{min-height:520px}.sceneCopy{left:24px;right:24px;bottom:28px}.side,.workspace>.side{grid-template-columns:1fr}.lessonCard{padding:26px 22px}.lessonCard h3{font-size:33px}.nav{align-items:stretch;flex-direction:column-rev </style></head><body><main class="shell"><div class="crumb">École · cours en séance</div><div id="app"></div></main>
<script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/year1-week8-v1.js"></script><script src="../school/year1-week9-v1.js"></script><script src="../school/year1-week10-v1.js"></script><script src="../school/year1-weeks11-12-v1.js"></script><script src="../school/year1-weeks13-16-v1.js"></script><script src="../school/year1-weeks17-20-v1.js"></script><script src="../school/year1-weeks21-24-v1.js"></script><script src="../school/year1-weeks25-28-v1.js"></script><script src="../school/year1-weeks29-32-v1.js"></script><script src="../school/year2-weeks1-4-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../school/school-learning-memory-v1.js"></script><script src="../school/school-community-v1.js"></script><script src="../school/school-cohort-progress-v1.js?v=20260905-cohort1"></script><script src="../school/school-identity-patch-v1.js"></script><script src="../school/school-classroom-social-v1.js?v=20260905-cohort2"></script><script src="../school/real-course-pedagogy-v1.js"></script><script src="../game-engine.js"></script>
<script>(function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||'w1-welcome',L=window.HCSchoolLife,A=window.HCSchoolAcademic,c=L?.courses.find(x=>x.id===id),academic=A?.state?.();
if(!c){app.innerHTML='<div class="locked">Cours introuvable.</div>';return}
const year=Number(c.year||1);if(year!==Number(academic?.year||1)){app.innerHTML=`<div class="locked">Ce cours appartient à l’Année ${year}. Tu es actuellement en Année ${academic?.year||1}.</div>`;return}
const state=L.state(),unlocked=L.isUnlocked(c,state),done=state.completed[c.id],P=window.HCRealCoursePedagogy?.get(id),K='haute-couture-real-course-progress-v1:'+id;
const fallback={room:'Salle de cours',teacherRole:c.category,durationLabel:`Séance · ${c.duration} min de temps de jeu`,promise:c.intro,opening:c.intro,outcomes:(c.lesson||[]).map(x=>x[0]),vocabulary:[],stages:[...(c.lesson||[]).map(([h,t],i)=>({kind:'lesson',title:`${i+1} · ${h}`,text:t})),{kind:'practice',title:'Travail de séance',instruction:c.exercise,prompt:'Tes notes, observations et essais…',min:40},{kind:'recap',title:'Synthèse',text:'Reprends les notions principales et formule ce que tu veux retenir avant de quitter la séance.'}],homework:'Reviens sur tes notes avant le prochain cours.',teacherFeedback:{short:'Reprends tes notes et précise davantage ton raisonnement.',good:'Ton raisonnement est lisible et relié aux notions de la séance.',strong:'Tu mobilises les notions de façon précise et autonome.'}};
const d=P||fallback,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=(c.teacher||'Professeur').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const photos={Méthode:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1800&q=84',Dessin:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1800&q=84',Textile:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=1800&q=84',Matière:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=1800&q=84',Modélisme:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=1800&q=84',Moulage:'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=1800&q=84',Culture:'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1800&q=84',Montage:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1800&q=84',Projet:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=84'};
let saved={stage:0,answers:{}};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(K)||'{}'))}catch(_){}let stage=Math.max(0,Math.min(Number(saved.stage||0),d.stages.length-1));
function persist(){saved.stage=stage;localStorage.setItem(K,JSON.stringify(saved))}
function teacherFeedback(){const total=Object.values(saved.answers||{}).join(' ').trim().length;const f=d.teacherFeedback||fallback.teacherFeedback;return total<100?f.short:total<260?f.good:f.strong}
function buildHeader(){const steps=d.stages.map((s,i)=>`<div class="stepDot ${i<stage?'done':i===stage?'active':''}"><i>${i<stage?'✓':i+1}</i><span>${esc(s.title.replace(/^\d+\s*·\s*/,''))}</span></div>`).join('');return `<section class="hero"><div class="scene" style="background-image:url('${photos[c.category]||photos.Projet}')"><div class="sceneCopy"><div class="eyebrow">${esc(d.room)} · Année ${year}</div><h1>${esc(c.title)}</h1><div class="lead">${esc(d.promise)}</div></div></div><aside class="side"><section class="panel"><div class="teacher"><div class="avatar">${initials}</div><div><div class="label">Professeur·e</div><h2>${esc(c.teacher)}</h2></div></div><p><b>${esc(d.teacherRole)}</b></p><p>${esc(d.opening)}</p></section><section class="panel now"><div class="label">Aujourd’hui</div><strong>${esc(d.promise)}</strong><p>${esc(d.durationLabel)}</p></section><section class="panel"><div class="progressText">Déroulé de la séance</div><div class="steps">${steps}</div></section></aside></section>`}
function stageHtml(s,i){let body='';if(s.text)body+=`<p>${esc(s.text)}</p>`;if(s.teacher)body+=`<div class="teacherQuote">${esc(s.teacher)}</div>`;if(s.example)body+=`<div class="example"><b>${esc(s.exampleTitle||'Exemple')}</b><p>${esc(s.example)}</p></div>`;if(s.kind==='practice'){const val=saved.answers[i]||'';body+=`<div class="practice"><p><b>${esc(s.instruction||'Travail pratique')}</b></p><textarea id="practice" placeholder="${esc(s.prompt||'Tes notes de travail…')}">${esc(val)}</textarea><div class="hint">Ce travail reste dans ta séance et sera conservé avec le cours.</div></div>`}if(s.kind==='critique')body+=`<div class="example"><b>Ce que le professeur regarde</b><p>${esc(teacherFeedback())}</p></div>`;if(s.kind==='recap'){body+=`<div class="example"><b>Ce que tu dois être capable de faire</b><ul>${(d.outcomes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="homework"><div class="label" style="color:#efb5ad">Travail personnel</div><p>${esc(d.homework||'')}</p></div><div class="checkCard"><div class="label">Dernière vérification de compréhension</div><p>${esc(c.quiz?.q||'Quelle idée veux-tu retenir de cette séance ?')}</p><div class="answers">${(c.quiz?.a||['J’ai compris les notions essentielles']).map((a,n)=>`<label class="answer"><input type="radio" name="quiz" value="${n}"><span>${esc(a)}</span></label>`).join('')}</div><div class="feedback" id="feedback"></div></div>`}
const prev=i>0?`<button class="btn secondary" id="prev">← Étape précédente</button>`:'<button class="btn secondary" onclick="location.href=\'../school-day/\'">← Ma journée</button>';const last=i===d.stages.length-1;return `<section class="workspace"><article class="lessonCard"><div class="label">Étape ${i+1} sur ${d.stages.length}</div><h3>${esc(s.title)}</h3>${body}<div class="nav">${prev}<button class="btn ${last?'rose':''}" id="next">${last?(done?'Revoir la validation':'Terminer la séance'):'Continuer →'}</button></div></article><aside class="side"><section class="panel"><div class="label">Objectifs du cours</div><ul>${(d.outcomes||[]).map(x=>`<li style="font:13px/1.5 Georgia,serif;color:#6f5e55;margin:7px 0">${esc(x)}</li>`).join('')}</ul></section>${d.vocabulary?.length?`<section class="panel"><div class="label">Vocabulaire professionnel</div><div class="vocab">${d.vocabulary.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div></section>`:''}<section class="panel"><div class="label">Navigation</div><div class="courseTools"><button onclick="location.href='../school-day/'">Ma journée<small>Retourner aux cours du jour.</small></button><button onclick="location.href='../school-research-notebook/'">Carnet de recherche<small>Garder une trace personnelle.</small></button></div></section></aside></section>`}
function render(){if(!unlocked){const prereq=(c.prereq||[]).map(pid=>L.courses.find(x=>x.id===pid)?.title||pid).join(' · ');app.innerHTML=`<div class="locked">Ce cours n’est pas encore accessible. À terminer avant : ${esc(prereq||'les étapes précédentes')}.</div>`;return}app.innerHTML=buildHeader()+stageHtml(d.stages[stage],stage);const ta=document.getElementById('practice');if(ta){ta.addEventListener('input',()=>{saved.answers[stage]=ta.value;persist()})}document.getElementById('prev')?.addEventListener('click',()=>{stage--;persist();render();scrollTo({top:0,behavior:'smooth'})});document.getElementById('next')?.addEventListener('click',()=>{const s=d.stages[stage];if(s.kind==='practice'){const v=(document.getElementById('practice')?.value||'').trim();if(v.length<Math.min(Number(s.min||40),60)){alert('Prends encore un peu de temps pour développer ton travail avant de continuer.');return}saved.answers[stage]=v;persist()}if(stage<d.stages.length-1){stage++;persist();render();scrollTo({top:0,behavior:'smooth'});return}finish()})}
function finish(){const checked=document.querySelector('input[name="quiz"]:checked'),fb=document.getElementById('feedback');if(!checked){fb.textContent='Choisis la proposition qui te paraît juste avant de quitter la séance.';fb.classList.add('show');return}const idx=Number(checked.value),wasDone=!!L.state().completed[c.id],exercise=Object.entries(saved.answers||{}).sort((a,b)=>a[0]-b[0]).map(([i,t])=>`Étape ${Number(i)+1}\n${t}`).join('\n\n'),r=L.completeCourse(c.id,idx,exercise);if(!r.ok){fb.textContent='La séance ne peut pas encore être clôturée.';fb.classList.add('show');return}if(!wasDone&&window.HCSchoolGameplay)HCSchoolGameplay.complete(c.id);const correct=idx===Number(c.quiz?.correct);fb.innerHTML=`<b>${correct?'Validation pédagogique':'Point à reprendre'}</b><br>${esc(teacherFeedback())}${correct?'':'<br><br>Relis la notion correspondante : tu peux revenir dans ce cours sans consommer de temps supplémentaire.'}<br><br>${wasDone?'Cette séance était déjà terminée : aucun temps supplémentaire n’est compté.':`${c.duration} minutes de temps de jeu sont comptabilisées et ta présence est enregistrée.`}`;fb.classList.add('show');setTimeout(()=>{if(correct||wasDone)location.href='../school-day/'},1900)}
render();
})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
