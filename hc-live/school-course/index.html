<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haute Couture Live — Cours immersif</title>
<style>
:root{--ink:#251d19;--paper:#fffaf5;--muted:#76665e;--rose:#b96f68;--deep:#2b211c;--line:rgba(79,55,44,.16);--glass:rgba(255,250,245,.92);--shadow:0 28px 80px rgba(49,31,24,.18)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17110e;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,textarea{font:inherit}.course{min-height:100vh;position:relative;overflow:hidden}.scene{position:relative;min-height:100vh;background:#3b302a center/cover no-repeat}.scene:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,13,10,.66) 0%,rgba(20,13,10,.18) 43%,rgba(20,13,10,.16) 70%,rgba(20,13,10,.58) 100%),linear-gradient(0deg,rgba(18,12,10,.72),transparent 46%)}.topbar{position:absolute;z-index:10;top:24px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff}.crumb{font:800 10px/1 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:11px 14px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(28,20,16,.35);backdrop-filter:blur(16px)}.exit{border:1px solid rgba(255,255,255,.28);background:rgba(28,20,16,.35);color:#fff;border-radius:999px;padding:11px 15px;cursor:pointer;backdrop-filter:blur(16px)}.courseTitle{position:absolute;z-index:5;left:54px;bottom:44px;width:min(690px,62vw);color:#fff}.eyebrow{font:800 10px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f0beb8}.courseTitle h1{font:clamp(48px,5vw,82px)/.94 Georgia,serif;font-weight:400;letter-spacing:-.04em;margin:12px 0 16px}.courseTitle p{font:18px/1.55 Georgia,serif;color:rgba(255,255,255,.88);max-width:650px;margin:0}.teacherBubble{position:absolute;z-index:7;right:42px;top:120px;width:min(390px,32vw);padding:22px 24px;border-radius:24px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.teacherHead{display:flex;gap:12px;align-items:center}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e8d8cb;border:1px solid #d5bcaa;font-size:23px}.teacherBubble h2{font:28px/1 Georgia,serif;font-weight:400;margin:3px 0}.teacherBubble p{font:14px/1.55 Georgia,serif;color:#5e4e46;margin:14px 0 0}.teacherBubble .say{font:italic 18px/1.55 Georgia,serif;color:#493b34}.hotspots{position:absolute;z-index:6;inset:0;pointer-events:none}.hotspot{position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.42);background:rgba(28,20,16,.48);color:#fff;border-radius:999px;padding:10px 13px;font:800 10px/1 Arial,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.18);transition:.2s}.hotspot:hover{transform:translateY(-2px);background:rgba(185,111,104,.9)}.hotspot[data-key="desk"]{left:49%;bottom:16%}.hotspot[data-key="object"]{left:62%;bottom:31%}.hotspot[data-key="mate"]{right:24%;bottom:18%}.hotspot[data-key="board"]{left:43%;top:31%}.stageDock{position:absolute;z-index:8;right:42px;bottom:40px;width:min(380px,32vw);padding:18px 20px;border-radius:22px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.stageDock .small{font:800 9px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}.stageDock strong{display:block;font:24px/1.15 Georgia,serif;font-weight:400;margin:8px 0}.stageDock p{font:13px/1.5 Georgia,serif;color:var(--muted);margin:0}.dots{display:flex;gap:6px;margin-top:14px}.dot{height:5px;flex:1;border-radius:99px;background:#ded2c8}.dot.done,.dot.active{background:#4b3b34}.dot.active{box-shadow:0 0 0 2px rgba(185,111,104,.18)}.continue{margin-top:14px;width:100%;border:0;border-radius:999px;padding:13px 16px;background:var(--deep);color:#fff;font:800 10px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.overlay{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(22,14,11,.58);backdrop-filter:blur(6px)}.overlay.open{display:flex}.sheet{width:min(900px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:28px;padding:32px 34px;box-shadow:0 40px 110px rgba(0,0,0,.35)}.sheetHeader{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.sheet h3{font:38px/1.05 Georgia,serif;font-weight:400;margin:6px 0 18px}.sheet p,.sheet li{font:16px/1.72 Georgia,serif;color:#5c4d45}.close{border:0;background:#eee3da;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.term{padding:14px;border-radius:16px;background:#f1e8e1}.term b{display:block;font-size:17px;margin-bottom:4px}.term span{font:13px/1.5 Georgia,serif;color:var(--muted)}.practiceBox{margin-top:18px;padding:20px;border-radius:20px;background:#f2e9e2}.practiceBox textarea{width:100%;min-height:190px;border:1px solid #d8c7ba;border-radius:16px;padding:16px;background:#fffdf9;color:var(--ink);font:15px/1.6 Georgia,serif;resize:vertical}.teacherFeedback{margin:18px 0;padding:18px 20px;border-left:3px solid var(--rose);background:#f7eee8;font:italic 18px/1.55 Georgia,serif;color:#55463f}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--deep);color:#fff;font:800 10px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.btn.soft{background:#ece2da;color:#44362f}.notebook{position:fixed;z-index:35;right:0;top:0;bottom:0;width:min(480px,94vw);transform:translateX(102%);transition:.28s ease;background:#f8f0e8;box-shadow:-28px 0 80px rgba(0,0,0,.28);padding:30px;overflow:auto}.notebook.open{transform:translateX(0)}.notebook h3{font:38px/1 Georgia,serif;font-weight:400;margin:7px 0}.notebook p{font:14px/1.55 Georgia,serif;color:var(--muted)}.notebook textarea{width:100%;min-height:260px;border:0;border-bottom:1px solid #bca99c;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#d8cbc0 32px);padding:8px 4px;font:16px/2 Georgia,serif;color:var(--ink);outline:none;resize:vertical}.notebookTop{display:flex;justify-content:space-between;gap:12px}.toast{position:fixed;z-index:60;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#251d19;color:#fff;border-radius:999px;padding:12px 17px;font:13px/1 Georgia,serif;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.locked{min-height:100vh;display:grid;place-items:center;padding:30px;background:#f3ebe4}.locked div{max-width:650px;background:#fffaf5;padding:30px;border-radius:24px;font:16px/1.6 Georgia,serif}.finish{display:grid;gap:12px}.trace{padding:16px;border-radius:18px;background:#eef3f0}.trace b{display:block;font:800 9px/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4e6f65;margin-bottom:7px}@media(max-width:1050px){.teacherBubble,.stageDock{width:340px}.courseTitle{width:55vw}.hotspot[data-key="mate"]{right:34%}}@media(max-width:780px){.scene{min-height:100svh}.topbar{left:16px;right:16px;top:14px}.courseTitle{left:22px;right:22px;bottom:245px;width:auto}.courseTitle h1{font-size:46px}.courseTitle p{font-size:15px}.teacherBubble{left:18px;right:18px;top:82px;width:auto;padding:16px}.teacherBubble .say{font-size:15px}.stageDock{left:18px;right:18px;bottom:18px;width:auto}.hotspot{display:none}.vocab{grid-template-columns:1fr}.sheet{padding:24px 20px}.sheet h3{font-size:32px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/year1-week8-v1.js"></script><script src="../school/year1-week9-v1.js"></script><script src="../school/year1-week10-v1.js"></script><script src="../school/year1-weeks11-12-v1.js"></script><script src="../school/year1-weeks13-16-v1.js"></script><script src="../school/year1-weeks17-20-v1.js"></script><script src="../school/year1-weeks21-24-v1.js"></script><script src="../school/year1-weeks25-28-v1.js"></script><script src="../school/year1-weeks29-32-v1.js"></script><script src="../school/year2-weeks1-4-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../school/school-learning-memory-v1.js"></script><script src="../school/school-community-v1.js"></script><script src="../school/school-classroom-social-v1.js"></script><script src="../school/real-course-pedagogy-v1.js"></script><script src="../game-engine.js"></script>
<script>
(function(){
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||'w1-welcome',L=window.HCSchoolLife,A=window.HCSchoolAcademic,c=L?.courses.find(x=>x.id===id),academic=A?.state?.();
if(!c){app.innerHTML='<div class="locked"><div>Cours introuvable.</div></div>';return}
const year=Number(c.year||1);if(year!==Number(academic?.year||1)){app.innerHTML=`<div class="locked"><div>Ce cours appartient à l’Année ${year}. Tu es actuellement en Année ${academic?.year||1}.</div></div>`;return}
const state=L.state(),unlocked=L.isUnlocked(c,state),done=state.completed[c.id];if(!unlocked){const pre=(c.prereq||[]).map(pid=>L.courses.find(x=>x.id===pid)?.title||pid).join(' · ');app.innerHTML=`<div class="locked"><div><b>Ce cours n’est pas encore accessible.</b><br><br>À terminer avant : ${pre}<br><br><button class="btn" onclick="location.href='../school-day/'">Retour à ma journée</button></div></div>`;return}
const P=window.HCRealCoursePedagogy?.get(id),fallback={room:'Salle de cours',teacherRole:c.category,promise:c.intro,opening:c.intro,outcomes:(c.lesson||[]).map(x=>x[0]),vocabulary:[],stages:[...(c.lesson||[]).map(([h,t],i)=>({kind:'lesson',title:`${i+1} · ${h}`,text:t,teacher:i===0?'On commence par regarder précisément. Ne cherche pas à aller vite.':''})),{kind:'practice',title:'Travail de séance',instruction:c.exercise,prompt:'Écris ici ce que tu observes, testes ou construis pendant la séance.',min:40},{kind:'recap',title:'Correction et synthèse',text:'Reprends ce que tu as compris et ce que tu veux retravailler.'}],homework:'Relis tes notes avant le prochain cours.',teacherFeedback:{short:'Tu restes encore trop général·e. Reviens à des faits précis.',good:'Ton raisonnement devient lisible. Continue à relier chaque décision à une observation.',strong:'Tu formules avec précision et tu commences à travailler de manière autonome.'}};
const d=P||fallback,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=(c.teacher||'Professeur').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),K='haute-couture-live-classroom-v2:'+id;
const photos={Méthode:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=2200&q=88',Dessin:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=2200&q=88',Textile:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Matière:'https://images.unsplash.com/photo-1604014237800-1c9102c219da?auto=format&fit=crop&w=2200&q=88',Modélisme:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=2200&q=88',Moulage:'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?auto=format&fit=crop&w=2200&q=88',Culture:'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2200&q=88',Montage:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=2200&q=88',Projet:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2200&q=88'};
let saved={stage:0,answers:{},notes:'',seen:{}};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(K)||'{}'))}catch(_){}let stage=Math.max(0,Math.min(Number(saved.stage||0),d.stages.length-1));
const hotspotCopy={desk:['Mon carnet','Ouvrir les notes de séance'],object:['Objet / matière','Observer ce qui est sur la table'],mate:['Camarade','Écouter ce qui se passe autour'],board:['Tableau','Revoir la consigne du professeur']};
function persist(){saved.stage=stage;localStorage.setItem(K,JSON.stringify(saved))}
function feedback(){const n=Object.values(saved.answers||{}).join(' ').trim().length+(saved.notes||'').trim().length,f=d.teacherFeedback||fallback.teacherFeedback;return n<120?f.short:n<300?f.good:f.strong}
function teacherLine(s){return s.teacher||[d.opening,'Prenez votre temps. Je veux voir comment vous raisonnez, pas seulement le résultat.','Ne cherchez pas à faire joli trop vite. Faites d’abord quelque chose de juste.','Regardez votre travail comme si ce n’était pas le vôtre : qu’est-ce qui est réellement visible ?'][Math.min(stage,3)]||d.opening}
function stageSummary(s){if(s.kind==='practice')return s.instruction||c.exercise;if(s.kind==='recap')return'On corrige, on formule ce qui a été compris, puis on garde une trace.';return s.text||d.promise}
function render(){const s=d.stages[stage];app.innerHTML=`<main class="course"><section class="scene" style="background-image:url('${photos[c.category]||photos.Projet}')"><div class="topbar"><div class="crumb">École · Année ${year} · ${esc(c.category)} · ${esc(c.time)}</div><button class="exit" id="exit">Quitter la salle</button></div><div class="courseTitle"><div class="eyebrow">${esc(d.room||'Salle de cours')}</div><h1>${esc(c.title)}</h1><p>${esc(d.promise||c.intro)}</p></div><aside class="teacherBubble"><div class="teacherHead"><div class="avatar">${initials}</div><div><div class="eyebrow" style="color:var(--rose)">Professeur·e</div><h2>${esc(c.teacher)}</h2></div></div><p><b>${esc(d.teacherRole||c.category)}</b></p><p class="say">« ${esc(teacherLine(s))} »</p></aside><div class="hotspots"><button class="hotspot" data-key="desk">Carnet</button><button class="hotspot" data-key="object">Observer</button><button class="hotspot" data-key="mate">Camarades</button><button class="hotspot" data-key="board">Consigne</button></div><aside class="stageDock"><div class="small">Étape ${stage+1} sur ${d.stages.length}</div><strong>${esc(s.title)}</strong><p>${esc(stageSummary(s))}</p><div class="dots">${d.stages.map((_,i)=>`<span class="dot ${i<stage?'done':i===stage?'active':''}"></span>`).join('')}</div><button class="continue" id="openStage">${s.kind==='practice'?'Commencer le travail':s.kind==='recap'?'Passer à la correction':'Écouter / travailler'}</button></aside></section></main><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><aside class="notebook" id="notebook"><div class="notebookTop"><div><div class="eyebrow" style="color:var(--rose)">Carnet de séance</div><h3>Mes notes</h3></div><button class="close" id="closeNotebook">×</button></div><p>Ce carnet reste lié à ce cours. Tu peux écrire librement pendant la séance.</p><textarea id="notes" placeholder="Observation, question, mot de vocabulaire, remarque du professeur…">${esc(saved.notes||'')}</textarea><div class="actions"><button class="btn" id="saveNotes">Garder mes notes</button></div></aside><div class="toast" id="toast"></div>`;bind(s)}
function stageSheet(s){let body='';if(s.text)body+=`<p>${esc(s.text)}</p>`;if(s.example)body+=`<div class="practiceBox"><div class="eyebrow" style="color:var(--rose)">${esc(s.exampleTitle||'Exemple')}</div><p>${esc(s.example)}</p></div>`;if(stage===0&&d.outcomes?.length)body+=`<h4>À la fin de cette séance, tu dois être capable de :</h4><ul>${d.outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if((stage===0||s.kind==='lesson')&&d.vocabulary?.length)body+=`<div class="vocab">${d.vocabulary.slice(0,6).map(v=>`<div class="term"><b>${esc(v[0]||v.term)}</b><span>${esc(v[1]||v.definition)}</span></div>`).join('')}</div>`;if(s.kind==='practice'){const val=saved.answers[stage]||'';body+=`<div class="teacherFeedback">« ${esc(teacherLine(s))} »</div><div class="practiceBox"><p><b>${esc(s.instruction||c.exercise)}</b></p><textarea id="answer" placeholder="${esc(s.prompt||'Écris ton travail ici…')}">${esc(val)}</textarea><p style="font-size:12px;color:var(--muted)">Ici, il n’y a pas de “bonne réponse” instantanée : le professeur regarde surtout la précision de ton raisonnement.</p></div>`}if(s.kind==='recap'){body+=`<div class="teacherFeedback">« ${esc(feedback())} »</div><div class="finish"><div class="trace"><b>Trace conservée</b>Ton travail, tes notes et la correction restent associés à ce cours.</div><div class="trace"><b>Travail personnel</b>${esc(d.homework||fallback.homework)}</div></div>`}return body}
function openStage(){const s=d.stages[stage],sheet=document.getElementById('sheet');sheet.innerHTML=`<div class="sheetHeader"><div><div class="eyebrow" style="color:var(--rose)">Séance · étape ${stage+1}</div><h3>${esc(s.title)}</h3></div><button class="close" id="closeSheet">×</button></div>${stageSheet(s)}<div class="actions"><button class="btn soft" id="backStage" ${stage===0?'disabled':''}>Étape précédente</button><button class="btn" id="nextStage">${stage===d.stages.length-1?'Terminer la séance':'Continuer'}</button></div>`;document.getElementById('overlay').classList.add('open');document.getElementById('closeSheet').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('backStage').onclick=()=>{if(stage>0){stage--;persist();document.getElementById('overlay').classList.remove('open');render();openStage()}};document.getElementById('nextStage').onclick=()=>{const a=document.getElementById('answer');if(a){const txt=a.value.trim(),min=Number(s.min||30);if(txt.length<min){toast(`Le professeur te demande d’aller un peu plus loin (${min} caractères minimum pour cette étape).`);return}saved.answers[stage]=txt}if(stage<d.stages.length-1){stage++;persist();document.getElementById('overlay').classList.remove('open');render()}else finishCourse()}}
function finishCourse(){persist();const wasDone=!!L.state().completed[c.id],answer=Object.values(saved.answers||{}).join('\n\n'),quizIndex=Number(c.quiz?.correct||0),r=L.completeCourse(c.id,quizIndex,answer);if(r.ok&&!wasDone&&window.HCSchoolGameplay)window.HCSchoolGameplay.complete(c.id);try{const M=window.HCSchoolLearningMemory;if(M?.addResearch)M.addResearch({type:'note',title:`Cours · ${c.title}`,text:[saved.notes,answer].filter(Boolean).join('\n\n').slice(0,4000),tags:[c.category,'cours'],year,source:'school'})}catch(_){}localStorage.removeItem(K);document.getElementById('sheet').innerHTML=`<div class="eyebrow" style="color:var(--rose)">Fin de séance</div><h3>Le cours est terminé.</h3><div class="teacherFeedback">« ${esc(feedback())} »</div><p>Tu ne gagnes pas un score à afficher : tu gardes une méthode, des notes, un travail et un retour pédagogique.</p><div class="actions"><button class="btn" onclick="location.href='../school-day/'">Retour à ma journée</button><button class="btn soft" onclick="location.reload()">Revoir le cours</button></div>`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function hotspot(key){saved.seen[key]=true;persist();if(key==='desk'){document.getElementById('notebook').classList.add('open');return}const copy={object:`Observe avant de nommer. Dans ce cours de ${c.category.toLowerCase()}, cherche ce qui est précis : forme, matière, tension, proportion, comportement ou usage.`,mate:'Autour de toi, les autres élèves ne travaillent pas tous de la même manière. Tu peux regarder leur démarche sans chercher à les classer.',board:`Consigne actuelle : ${stageSummary(d.stages[stage])}`};toast(copy[key]||hotspotCopy[key]?.[1]||'')}
function bind(){document.getElementById('openStage').onclick=openStage;document.getElementById('exit').onclick=()=>location.href='../school-day/';document.querySelectorAll('.hotspot').forEach(b=>b.onclick=()=>hotspot(b.dataset.key));document.getElementById('closeNotebook').onclick=()=>document.getElementById('notebook').classList.remove('open');document.getElementById('saveNotes').onclick=()=>{saved.notes=document.getElementById('notes').value;persist();toast('Notes gardées dans le carnet de séance.');document.getElementById('notebook').classList.remove('open')}}
render();
})();
</script>
<script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script>
</body></html>
