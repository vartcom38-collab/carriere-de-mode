<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Jury mi-année</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:9px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:11px;font-weight:900}.field textarea{width:100%;min-height:110px;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.5 Georgia,serif}.rubric{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font:13px/1.5 Georgia,serif}.rubric input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.dark{background:#29211d}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · JURY MI-ANNÉE</div><h1>Présenter ta progression</h1><p class="lead">Le jury ne récompense pas seulement un résultat. Il regarde ce que tu as compris, comment tu travailles, ce que tu corriges et ce que tu dois encore développer.</p><section class="card"><div class="grid"><div class="field"><label>TRAVAIL 1 — POURQUOI TU LE MONTRES</label><textarea id="w1"></textarea></div><div class="field"><label>TRAVAIL 2</label><textarea id="w2"></textarea></div><div class="field"><label>TRAVAIL 3</label><textarea id="w3"></textarea></div><div class="field"><label>TRAVAIL 4</label><textarea id="w4"></textarea></div><div class="field"><label>ERREUR OU DIFFICULTÉ IMPORTANTE</label><textarea id="difficulty"></textarea></div><div class="field"><label>CE QUE TU AS CORRIGÉ</label><textarea id="correction"></textarea></div><div class="field"><label>3 AXES POUR LA SUITE</label><textarea id="next"></textarea></div><div class="field"><label>CE QUE TU VEUX ENCORE DÉCOUVRIR</label><textarea id="discover"></textarea></div></div></section><section class="card"><h2 style="font:26px Georgia,serif;margin:0 0 10px">Grille d’évaluation</h2><div id="rubrics"></div><p id="total" class="lead"></p><button class="btn" id="save">ENREGISTRER LE JURY</button> <button class="btn dark" onclick="location.href='../school-day/'">RETOUR</button><p id="msg" class="lead"></p></section></main><script>(function(){const K='haute-couture-school-midyear-review-v1',fields=['w1','w2','w3','w4','difficulty','correction','next','discover'],rubrics=[['progress','Progression'],['research','Recherche'],['development','Développement'],['technical','Construction / volume / surface'],['material','Relation à la matière'],['correctionScore','Capacité à corriger'],['presentation','Présentation et recul']];let d={texts:{},scores:{}};try{d=JSON.parse(localStorage.getItem(K)||'null')||d}catch(_){}fields.forEach(k=>document.getElementById(k).value=d.texts?.[k]||'');document.getElementById('rubrics').innerHTML=rubrics.map(([k,l])=>`<div class="rubric"><span>${l}</span><input type="number" min="0" max="20" data-score="${k}" value="${d.scores?.[k]??''}"></div>`).join('');function total(){const vals=[...document.querySelectorAll('[data-score]')].map(x=>Math.max(0,Math.min(20,Number(x.value)||0))),avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;document.getElementById('total').textContent='Moyenne de jury : '+avg.toFixed(1)+'/20';return avg}[...document.querySelectorAll('[data-score]')].forEach(x=>x.oninput=total);document.getElementById('save').onclick=()=>{const texts={};fields.forEach(k=>texts[k]=document.getElementById(k).value);const scores={};document.querySelectorAll('[data-score]').forEach(x=>scores[x.dataset.score]=Math.max(0,Math.min(20,Number(x.value)||0)));d={texts,scores,average:total(),savedAt:new Date().toISOString()};localStorage.setItem(K,JSON.stringify(d));document.getElementById('msg').textContent='Jury mi-année enregistré.';if(window.HCKnowledge)HCKnowledge.practice('school:midyear-review',{source:'school',label:'Jury mi-année'})};total()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
