<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic Studio Vercel</title><style>body{font-family:Arial,sans-serif;background:#f6efe7;color:#211a16;padding:24px}.card{max-width:900px;margin:auto;background:#fffaf4;border:1px solid #e4d4c8;border-radius:20px;padding:20px}h1{font-family:Georgia,serif}.ok{color:#176b3a}.bad{color:#a33}.row{padding:12px 0;border-top:1px solid #eee}pre{white-space:pre-wrap;background:#f3ece6;padding:12px;border-radius:12px}.btn{border:0;background:#211a16;color:#fff;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class="card"><h1>Diagnostic Studio Lumière</h1><p>Ce test ne lance aucune génération et ne consomme aucun crédit Magnific.</p><button class="btn" id="run">LANCER LE TEST</button><div id="out"></div></div><script>const BASE='https://carriere-de-mode-visuals-vartcom38-7358s-projects.vercel.app';const out=document.getElementById('out');function row(name,ok,data){const d=document.createElement('div');d.className='row';d.innerHTML='<b class="'+(ok?'ok':'bad')+'">'+name+' — '+(ok?'OK':'ÉCHEC')+'</b><pre>'+String(data).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>';out.appendChild(d)}async function run(){out.innerHTML='';try{const r=await fetch(BASE+'/api/health?diag='+Date.now(),{cache:'no-store'});const t=await r.text();row('GET /api/health',r.ok,'HTTP '+r.status+'\n'+t)}catch(e){row('GET /api/health',false,e.name+': '+e.message)}try{const r=await fetch(BASE+'/api/generate-listing-visual?diag='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({}),cache:'no-store'});const t=await r.text();row('POST /api/generate-listing-visual',r.status===400,'HTTP '+r.status+'\n'+t+'\n\nAttendu: HTTP 400 listing_id_required (cela prouve que CORS + POST fonctionnent).')}catch(e){row('POST /api/generate-listing-visual',false,e.name+': '+e.message)} }document.getElementById('run').onclick=run;run();</script></body></html>
