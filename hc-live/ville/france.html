<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Haute Couture Live — Carte France</title>
  <style>html,body{margin:0;min-height:100%;background:#f6efe7}</style>
</head>
<body>
  <div id="bootFrance" style="padding:24px;font-family:Georgia,serif">Chargement de la carte France…</div>
  <script>
  (async function(){
    'use strict';
    try{
      const res=await fetch('./index.html',{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      let html=await res.text();
      html=html.replace(
        "s.src='../territorial-map-registry-v2.js?v=20260910-presence1'",
        "s.src='./territorial-map-global-browser-v1.js?v=20260914-france-direct1'"
      );
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      console.error('[HC France boot]',err);
      const el=document.getElementById('bootFrance');
      if(el)el.textContent='Impossible de charger la carte France.';
    }
  })();
  </script>
</body>
</html>
