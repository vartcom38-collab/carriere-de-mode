<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Haute Couture Live — Carte France</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6efe7}
    #mapFrame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="mapFrame" title="Carte France — territoires integres" src="./index.html"></iframe>
  <script>
  (function(){
    'use strict';
    const frame=document.getElementById('mapFrame');
    function injectWhenReady(){
      let doc,win,path='';
      try{
        doc=frame.contentDocument;
        win=frame.contentWindow;
        path=win?.location?.pathname||'';
      }catch(_){return setTimeout(injectWhenReady,50)}
      if(!doc||!doc.body||!/\/ville\/index\.html$/.test(path)||!win?.HCLocalMap){
        return setTimeout(injectWhenReady,50);
      }
      if(doc.getElementById('hc-global-map-browser'))return;
      const script=doc.createElement('script');
      script.id='hc-global-map-browser';
      script.src='./territorial-map-global-browser-v1.js?v=20260914-france3';
      doc.body.appendChild(script);
    }
    frame.addEventListener('load',injectWhenReady);
    injectWhenReady();
  })();
  </script>
</body>
</html>
