<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Manches & cols</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:9px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:850px}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:#fff}.step b{font-size:11px}.step p{font:11px/1.45 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.82}.theory{padding:14px;border-radius:14px;background:#edf4f2;font:13px/1.6 Georgia,serif}.task{margin-top:12px;padding:14px;border-radius:14px;background:#f4ece6;font:13px/1.6 Georgia,serif}.work textarea{width:100%;min-height:170px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.actions .dark{background:#29211d}.mini{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed var(--line);font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · MODÉLISME · MANCHES & COLS</div><h1>Faire dialoguer l’emmanchure, la manche et l’encolure</h1><p class="lead">Une manche et un col ne sont pas des accessoires ajoutés après coup. Ils dépendent directement du corsage. Ici on apprend les relations entre lignes, longueurs, aisance et volume.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="work"><div class="theory" id="theory"></div><div class="task" id="task"></div><textarea id="notes" placeholder="Tes observations, schémas mentaux, erreurs et corrections…"></textarea><div class="mini" id="mini"></div><div class="actions"><button id="save">ENREGISTRER</button><button id="next">ÉTAPE SUIVANTE</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-sleeves-collars-v1';const steps=[{id:'sleeveRelation',title:'01 · Relation manche/emmanchure',desc:'Deux courbes qui doivent travailler ensemble.',theory:'La tête de manche doit correspondre à l’emmanchure tout en intégrant la forme nécessaire au bras et au mouvement. La longueur de couture, les crans et la répartition d’aisance servent à assembler deux courbes différentes de manière contrôlée.',task:'Dessine schématiquement une emmanchure et une tête de manche. Place devant, dos, sommet de manche et crans. Explique pourquoi un simple “même périmètre” ne suffit pas à garantir une bonne manche.',mini:'À vérifier : orientation devant/dos, sommet de manche, longueur de couture, aisance, crans.'},{id:'basicSleeve',title:'02 · Manche de base',desc:'Longueur, largeur, tête.',theory:'Une manche de base articule plusieurs dimensions : tour de bras, longueur de manche, hauteur de tête et largeur au poignet. Modifier une dimension influence souvent les autres et peut changer mobilité et silhouette.',task:'Compare trois manches : près du bras, classique, ample. Pour chacune, explique ce qui change dans la largeur, la tête de manche et le confort.',mini:'Ne cherche pas encore les variantes décoratives : stabilise d’abord une manche qui fonctionne.'},{id:'sleeveTransform',title:'03 · Transformer une manche',desc:'Volume sans perdre les repères.',theory:'On peut créer fronces, ballon, gigot, évasement ou volume au poignet en ouvrant le patron de manière contrôlée. Les lignes d’ouverture indiquent où le volume sera ajouté.',task:'Imagine une manche ballon. Indique où ouvrir le patron si tu veux du volume surtout en tête, surtout au poignet, ou sur toute la hauteur.',mini:'Question clé : où veux-tu que le volume apparaisse ?'},{id:'collarBase',title:'04 · Comprendre un col',desc:'Encolure = base du col.',theory:'Un col part de l’encolure finie. Sa longueur de montage doit correspondre à cette ligne, puis sa hauteur et sa forme déterminent comment il se dresse, se couche ou s’écarte du cou.',task:'Trace une encolure simple puis imagine trois cols : ras du cou, col chemise, col plus ouvert. Décris ce qui change dans hauteur, ouverture et tombé.',mini:'Un col n’est pas une forme isolée : il dépend de l’encolure réelle.'},{id:'shirtCollar',title:'05 · Col chemise',desc:'Pied de col + tombant.',theory:'Un col chemise classique peut être séparé en pied de col et tombant. Le pied organise la relation au cou ; le tombant crée la forme visible. Les deux pièces doivent se raccorder proprement au milieu devant, au dos et aux extrémités.',task:'Liste les contrôles avant montage d’un col chemise : longueurs, symétrie, crans, pointes, pied de col, milieu dos, valeurs de couture.',mini:'Le montage propre dépend énormément de la précision des repères.'},{id:'styleTest',title:'06 · Même corsage, trois identités',desc:'Observer l’impact du détail.',theory:'Manche et col peuvent modifier fortement le caractère d’un vêtement sans changer le corps du corsage. Cette étape sert à comprendre comment un détail technique devient une décision de design.',task:'Sur un même corsage, imagine trois versions : manche droite + col simple ; manche volumineuse + petit col ; sans manche + col très présent. Explique l’effet produit.',mini:'Objectif : relier technique, proportion et intention de style.'}];let current=0;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}function render(){const d=read(),s=steps[current];document.getElementById('steps').innerHTML=steps.map((x,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${x.title}</b><p>${x.desc}</p></div>`).join('');document.getElementById('theory').innerHTML='<b>À COMPRENDRE</b><br>'+s.theory;document.getElementById('task').innerHTML='<b>EXERCICE</b><br>'+s.task;document.getElementById('mini').textContent=s.mini;document.getElementById('notes').value=d[s.id]?.notes||'';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{save(false);current=Number(x.dataset.i);render()})}function save(show=true){const d=read(),s=steps[current];d[s.id]={notes:document.getElementById('notes').value,savedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d));if(show)document.getElementById('msg').textContent='Étape enregistrée.';if(window.HCKnowledge)HCKnowledge.practice('pattern:sleeves-collars:'+s.id,{source:'school',label:s.title})}document.getElementById('save').onclick=()=>save(true);document.getElementById('next').onclick=()=>{save(false);if(current<steps.length-1)current++;render()};render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
