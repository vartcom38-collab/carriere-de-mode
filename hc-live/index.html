<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5efe5;font-family:Arial,sans-serif}.screen{position:fixed;inset:0}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.menu{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);display:flex;gap:12px;align-items:center}.btn{border:1px solid rgba(73,65,54,.36);background:rgba(255,252,246,.88);color:#2f2a24;border-radius:12px;padding:14px 24px;font-size:15px;letter-spacing:.12em;min-width:170px;box-shadow:0 8px 24px rgba(40,30,20,.1);backdrop-filter:blur(3px);cursor:pointer}.btn:hover{background:rgba(233,239,226,.95)}.btn[disabled]{opacity:.46;cursor:default}.gear{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(73,65,54,.28);background:rgba(255,252,246,.7);cursor:pointer}.panel{display:none;position:fixed;inset:0;background:rgba(246,240,230,.97);padding:8vh 8vw;color:#34302b;overflow:auto}.panel.active{display:block}.panel h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,6vw,82px);margin:.15em 0}.panel p{max-width:720px;font-size:18px;line-height:1.6}.back{margin-top:30px}@media(max-width:800px){.menu{bottom:4%;gap:8px;flex-direction:column}.btn{min-width:210px;padding:12px 18px;font-size:13px}.gear{right:12px;top:12px}}</style></head><body><section class="screen" id="home"><img class="bg" alt="Accueil Haute Couture" src="./ChatGPT%20Image%2017%20ao%C3%BBt%202026%2C%2015_43_40.png"><div class="menu"><button class="btn" disabled>Continuer</button><button class="btn" id="newgame">Nouvelle partie</button><button class="btn" id="options">Options</button></div><button class="gear" id="gear" aria-label="Paramètres">⚙</button></section><section class="panel" id="prologue"><p style="letter-spacing:.16em;font-weight:700;color:#72846c">NOUVELLE PARTIE</p><h1>Ton premier chemin</h1><p>Une histoire de couture commence par quelques choix simples. Ils deviendront les premières pages de ton carnet.</p><button class="btn back" id="back">Retour</button></section><section class="panel" id="optionsPanel"><p style="letter-spacing:.16em;font-weight:700;color:#72846c">OPTIONS</p><h1>Réglages</h1><p>Les réglages son, musique et affichage arriveront ici.</p><button class="btn back" id="closeOptions">Fermer</button></section><script>const home=document.getElementById('home'),prologue=document.getElementById('prologue'),optionsPanel=document.getElementById('optionsPanel');function showHome(){home.style.display='block';prologue.classList.remove('active');optionsPanel.classList.remove('active')}document.getElementById('newgame').onclick=()=>{home.style.display='none';prologue.classList.add('active')};document.getElementById('back').onclick=showHome;function openOptions(){home.style.display='none';optionsPanel.classList.add('active')}document.getElementById('options').onclick=openOptions;document.getElementById('gear').onclick=openOptions;document.getElementById('closeOptions').onclick=showHome;</script></body></html>
