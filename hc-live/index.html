<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Couture</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5efe5;font-family:Arial,sans-serif}*{box-sizing:border-box}.screen{position:fixed;inset:0}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.menu{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:2}.btn{border:1px solid rgba(73,65,54,.36);background:rgba(255,252,246,.88);color:#2f2a24;border-radius:12px;padding:14px 24px;font-size:15px;letter-spacing:.12em;min-width:170px;box-shadow:0 8px 24px rgba(40,30,20,.1);backdrop-filter:blur(3px);cursor:pointer}.btn:hover{background:rgba(233,239,226,.95)}.btn[disabled]{opacity:.46;cursor:default}.gear{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(73,65,54,.28);background:rgba(255,252,246,.75);cursor:pointer;z-index:2}.panel{display:none;position:fixed;inset:0;background:rgba(246,240,230,.97);padding:8vh 8vw;color:#34302b;z-index:5;overflow:auto}.panel.active{display:block}.panel h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,6vw,82px);margin:.15em 0}.panel p{max-width:720px;font-size:18px;line-height:1.6}.back{margin-top:30px}@media(max-width:800px){.menu{bottom:4%;gap:8px;flex-direction:column}.btn{min-width:210px;padding:12px 18px;font-size:13px}.gear{right:12px;top:12px}}
</style>
</head>
<body>
<section class="screen" id="home">
  <img class="bg" alt="Accueil Haute Couture" src="./accueil.png">
  <div class="menu">
    <button class="btn" disabled>Continuer</button>
    <button class="btn" id="newGame">Nouvelle partie</button>
    <button class="btn" id="optionsBtn">Options</button>
  </div>
  <button class="gear" id="gear" aria-label="Paramètres">⚙</button>
</section>
<section class="panel" id="prologue">
  <p style="letter-spacing:.18em;font-size:12px;color:#6f8f6b;font-weight:700">NOUVELLE PARTIE</p>
  <h1>Ton histoire commence ici.</h1>
  <p>Quelques choix simples deviendront les premières pages de ton carnet : ton personnage, ta ville, ton premier logement et les débuts de ta carrière dans la mode.</p>
  <button class="btn back" id="backHome">Retour</button>
</section>
<dialog id="options"><form method="dialog" style="padding:28px;border:0;border-radius:18px;background:#fffdf8"><h2 style="font-family:Georgia,serif;font-weight:400">Options</h2><p>Les réglages du jeu seront ajoutés ici.</p><button class="btn">Fermer</button></form></dialog>
<script>
const prologue=document.getElementById('prologue');
document.getElementById('newGame').onclick=()=>prologue.classList.add('active');
document.getElementById('backHome').onclick=()=>prologue.classList.remove('active');
const options=document.getElementById('options');
document.getElementById('optionsBtn').onclick=()=>options.showModal();
document.getElementById('gear').onclick=()=>options.showModal();
</script>
</body>
</html>
