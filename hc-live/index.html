<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Couture</title>
<style>
:root{--paper:#f7f1e7;--ink:#38322c;--sage:#7f9275;--sage2:#dfe7d7;--line:rgba(82,68,52,.27);--card:rgba(255,252,245,.94)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe8dc;color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.screen,.panel{position:fixed;inset:0}.panel{display:none}.panel.active{display:block}.bg,.carnet-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.menu{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);display:flex;gap:12px;align-items:center}.btn{border:1px solid rgba(73,65,54,.36);background:rgba(255,252,246,.88);color:#2f2a24;border-radius:12px;padding:14px 24px;font:15px Arial,sans-serif;letter-spacing:.12em;min-width:170px;box-shadow:0 8px 24px rgba(40,30,20,.1);backdrop-filter:blur(3px);cursor:pointer}.btn:hover{background:rgba(233,239,226,.95)}.btn[disabled]{opacity:.46;cursor:default}.gear{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(73,65,54,.28);background:rgba(255,252,246,.7);cursor:pointer}
.carnet-actions{position:absolute;right:9%;bottom:7%;z-index:3}.character-btn,.soft-btn{border:1px solid rgba(88,70,52,.38);background:rgba(255,251,241,.92);color:#514638;border-radius:10px;padding:14px 22px;font:15px Georgia,'Times New Roman',serif;letter-spacing:.05em;box-shadow:0 6px 20px rgba(55,40,25,.12);backdrop-filter:blur(4px);cursor:pointer;transition:.18s ease}.character-btn:hover,.soft-btn:hover{background:rgba(229,238,218,.97);transform:translateY(-1px)}.carnet-back,.selection-back{position:absolute;left:22px;top:22px;z-index:5;border:1px solid rgba(88,70,52,.32);background:rgba(255,251,241,.82);color:#514638;border-radius:999px;padding:10px 15px;font:15px Georgia,serif;cursor:pointer}
.optionsPanel{display:none;position:fixed;inset:0;background:rgba(246,240,230,.97);padding:8vh 8vw;color:#34302b;overflow:auto}.optionsPanel.active{display:block}.optionsPanel h1{font-weight:400;font-size:clamp(42px,6vw,82px);margin:.15em 0}.optionsPanel p{max-width:720px;font-size:18px;line-height:1.6}
/* SELECTION */
#characters{background:#e9dfd0;overflow:hidden}.selection-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:1vh 1vw}.selection-stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;overflow:hidden;box-shadow:0 18px 60px rgba(45,35,25,.18)}.selection-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hit-grid{position:absolute;left:12.7%;right:10.5%;top:14.5%;bottom:14.2%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:1.2% 1%;z-index:3}.char-hit{border:1px solid transparent;background:transparent;border-radius:14px;cursor:pointer;transition:.18s ease;position:relative}.char-hit::after{content:attr(data-name);position:absolute;left:50%;bottom:2%;transform:translate(-50%,8px);opacity:0;background:rgba(247,242,232,.94);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;box-shadow:0 6px 18px rgba(60,45,30,.12);transition:.18s ease}.char-hit:hover,.char-hit:focus-visible,.char-hit.selected{outline:none;border-color:rgba(116,139,102,.9);background:rgba(219,232,210,.16);box-shadow:inset 0 0 0 2px rgba(131,153,116,.28),0 8px 24px rgba(55,45,35,.10);transform:translateY(-2px)}.char-hit:hover::after,.char-hit:focus-visible::after,.char-hit.selected::after{opacity:1;transform:translate(-50%,0)}
.profile-dim{display:none;position:absolute;inset:0;background:rgba(51,43,35,.22);z-index:8;backdrop-filter:blur(1px)}.profile-dim.open{display:block}.profile-card{position:absolute;z-index:9;right:2.1%;top:5%;bottom:4%;width:min(33%,500px);min-width:360px;background:linear-gradient(180deg,rgba(255,253,248,.98),rgba(248,241,230,.98));border:1px solid rgba(98,80,58,.28);border-radius:24px;box-shadow:0 24px 70px rgba(40,30,22,.28);padding:22px 22px 18px;display:flex;flex-direction:column;overflow:auto;transform:translateX(112%);transition:.26s ease}.profile-card.open{transform:translateX(0)}.profile-close{position:absolute;right:16px;top:13px;border:0;background:transparent;font-size:31px;font-family:Georgia,serif;color:#615548;cursor:pointer}.profile-top{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;padding-right:28px}.portrait-crop{height:150px;border-radius:13px;border:1px solid rgba(98,80,58,.22);background:linear-gradient(135deg,#f4eadb,#ede1cf);display:grid;place-items:center;font-size:48px}.profile-name{font-size:38px;line-height:1;margin:0 0 6px;font-weight:400}.profile-vibe{font-style:italic;color:#6d755f;font-size:17px;margin:0}.bio{font-size:15px;line-height:1.5;margin:16px 0;color:#50473e}.section-title{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:#675c50}.section-title::after{content:"";height:1px;background:rgba(91,76,58,.18);flex:1}.knowledge{background:rgba(255,251,243,.75);border:1px solid rgba(93,76,57,.18);border-radius:14px;padding:11px 12px;font-size:14px;line-height:1.45}.traits{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:7px 11px;border-radius:999px;background:#efe2d0;border:1px solid rgba(103,84,61,.10);font-size:13px}.skill-list{display:grid;gap:8px}.skill-row{display:grid;grid-template-columns:108px 1fr 36px;gap:8px;align-items:center;font-size:13px}.bar{height:8px;border-radius:999px;background:#e7dfd3;overflow:hidden}.bar>i{display:block;height:100%;background:#899a78;border-radius:999px}.weakness{font-size:14px;line-height:1.45;padding:10px 12px;background:rgba(238,226,208,.55);border-radius:12px}.choose-btn{margin-top:15px;width:100%;border:0;border-radius:11px;background:#7f8f70;color:white;padding:13px 18px;font:17px Georgia,serif;cursor:pointer;box-shadow:0 8px 20px rgba(78,92,65,.20)}.choose-btn:hover{filter:brightness(1.04)}.toast{position:absolute;z-index:12;left:50%;bottom:3%;transform:translate(-50%,25px);opacity:0;pointer-events:none;background:rgba(67,77,59,.94);color:#fff;padding:11px 18px;border-radius:999px;font:14px Georgia,serif;transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.menu{bottom:4%;gap:8px;flex-direction:column}.btn{min-width:210px;padding:12px 18px;font-size:13px}.gear{right:12px;top:12px}.carnet-actions{right:50%;bottom:4%;transform:translateX(50%)}.character-btn{white-space:nowrap;font-size:13px;padding:12px 16px}.carnet-back,.selection-back{left:12px;top:12px}.profile-card{right:2%;top:3%;bottom:3%;width:52%;min-width:0;padding:16px}.profile-top{grid-template-columns:82px 1fr}.portrait-crop{height:112px}.profile-name{font-size:28px}.skill-row{grid-template-columns:82px 1fr 30px}}
@media(max-width:620px){.selection-stage{width:100vw;height:100vh;aspect-ratio:auto}.selection-art{object-fit:cover}.hit-grid{left:5%;right:5%;top:16%;bottom:15%;gap:1%}.profile-card{left:4%;right:4%;width:auto;top:8%;bottom:4%}.profile-dim{background:rgba(51,43,35,.38)}}
</style>
</head>
<body>
<section class="screen" id="home">
  <img class="bg" alt="Accueil Haute Couture" src="./ChatGPT%20Image%2017%20ao%C3%BBt%202026%2C%2015_43_40.png">
  <div class="menu"><button class="btn" disabled>Continuer</button><button class="btn" id="newgame">Nouvelle partie</button><button class="btn" id="options">Options</button></div>
  <button class="gear" id="gear" aria-label="Paramètres">⚙</button>
</section>

<section class="panel" id="prologue">
  <img class="carnet-bg" src="./a_top_down_angled_illustration_style_scene_of_an_o.png" alt="Carnet de bienvenue Haute Couture">
  <button class="carnet-back" id="back">← Retour</button>
  <div class="carnet-actions"><button class="character-btn" id="chooseCharacter">Choisir son personnage</button></div>
</section>

<section class="panel" id="characters">
  <div class="selection-wrap">
    <div class="selection-stage" id="selectionStage">
      <img class="selection-art" src="./a_high_resolution_illustrated_game_visual_novel_st.png" alt="Sélection des personnages Haute Couture">
      <button class="selection-back" id="characterBack">← Retour</button>
      <div class="hit-grid" id="hitGrid"></div>
      <div class="profile-dim" id="profileDim"></div>
      <aside class="profile-card" id="profileCard" aria-live="polite">
        <button class="profile-close" id="profileClose" aria-label="Fermer">×</button>
        <div class="profile-top"><div class="portrait-crop" id="portraitCrop">✦</div><div><h2 class="profile-name" id="profileName"></h2><p class="profile-vibe" id="profileVibe"></p></div></div>
        <p class="bio" id="profileBio"></p>
        <div class="section-title">Connaissances de départ</div><div class="knowledge" id="profileKnowledge"></div>
        <div class="section-title">Compétences de départ</div><div class="skill-list" id="profileSkills"></div>
        <div class="section-title">Personnalité</div><div class="traits" id="profileTraits"></div>
        <div class="section-title">Point de vigilance</div><div class="weakness" id="profileWeakness"></div>
        <button class="choose-btn" id="confirmCharacter"></button>
      </aside>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</section>

<section class="optionsPanel" id="optionsPanel"><p style="letter-spacing:.16em;font-weight:700;color:#72846c">OPTIONS</p><h1>Réglages</h1><p>Les réglages son, musique et affichage arriveront ici.</p><button class="btn" id="closeOptions">Fermer</button></section>

<script>
const characters=[
{id:'clara',name:'Clara',vibe:'Rêveuse & romantique',bio:'Clara voit la beauté partout. Elle aime les détails délicats, les matières naturelles et les pièces qui racontent une histoire.',knowledge:'Lin, indiennes provençales, couleurs ocre, artisanat textile du Sud et premières références florales.',traits:['Sensible','Créative','Idéaliste'],weakness:'Elle doute facilement de ses choix et manque encore d’assurance quand il faut s’imposer.',skills:{'Couture':3,'Détail':4,'Croquis':2,'Couleurs':3,'Patronage':2}},
{id:'ines',name:'Inès',vibe:'Solaire & spontanée',bio:'Inès fonctionne à l’instinct. Elle adore assembler les couleurs et créer des silhouettes vivantes, lumineuses et faciles à porter.',knowledge:'Lumière méditerranéenne, céramiques, palettes chaudes, contrastes colorés et motifs du Sud.',traits:['Solaire','Intuitive','Expressive'],weakness:'Son enthousiasme peut la pousser à aller trop vite et à négliger certaines finitions.',skills:{'Couture':2,'Couleurs':4,'Croquis':3,'Matières':2,'Finitions':2}},
{id:'maya',name:'Maya',vibe:'Ambitieuse & déterminée',bio:'Maya observe, analyse et veut comprendre les codes de la mode. Elle possède déjà une vraie culture des silhouettes et des maisons de couture.',knowledge:'Histoire de la haute couture, grands ateliers, vocabulaire des silhouettes et premières références de collections.',traits:['Curieuse','Observatrice','Ambitieuse'],weakness:'Elle connaît beaucoup de choses mais manque encore de pratique manuelle.',skills:{'Croquis':4,'Culture mode':4,'Couture':1,'Patronage':2,'Présentation':3}},
{id:'elise',name:'Élise',vibe:'Rigoureuse & élégante',bio:'Élise aime comprendre comment une pièce est construite. Elle prend son temps, mesure, vérifie et cherche la précision.',knowledge:'Soierie, jacquard, tissage, histoire des canuts et bases du vocabulaire textile lyonnais.',traits:['Précise','Patiente','Discrète'],weakness:'Elle peut rester trop longtemps dans la technique et hésiter à prendre des risques créatifs.',skills:{'Patronage':4,'Couture':3,'Matières':3,'Croquis':2,'Créativité':2}},
{id:'salome',name:'Salomé',vibe:'Libre & inspirée',bio:'Salomé puise son inspiration dans les paysages, les matières brutes et les détails simples. Elle aime créer avec ce qu’elle voit autour d’elle.',knowledge:'Toile brute, sel, cuir, paysages camarguais, costume arlésien et premières associations autour de la nature.',traits:['Libre','Instinctive','Naturelle'],weakness:'Elle travaille beaucoup à l’intuition et manque parfois d’organisation.',skills:{'Matières':4,'Inspiration':4,'Couture':2,'Croquis':2,'Organisation':1}},
{id:'anais',name:'Anaïs',vibe:'Pratique & authentique',bio:'Anaïs aime les vêtements utiles, solides et bien pensés. Elle préfère une belle coupe fonctionnelle à un effet gratuit.',knowledge:'Laine, rayures, vêtements marins, vêtements de travail et culture textile liée au littoral.',traits:['Fiable','Pragmatique','Persévérante'],weakness:'Elle ose encore peu sortir de palettes sobres et de formes très fonctionnelles.',skills:{'Couture':3,'Construction':3,'Matières':3,'Couleurs':2,'Croquis':2}},
{id:'jade',name:'Jade',vibe:'Passionnée & artisanale',bio:'Jade adore manipuler les matières et comprendre comment un objet est fait. Elle a déjà un œil pour les détails en cuir et les accessoires.',knowledge:'Cuir, sellerie, accessoires, artisanat du Sud-Ouest et premiers repères sur les finitions main.',traits:['Débrouillarde','Franche','Tactile'],weakness:'Elle est plus à l’aise avec les accessoires qu’avec les pièces très fluides ou sophistiquées.',skills:{'Accessoires':4,'Cuir':4,'Couture':2,'Croquis':2,'Drapé':1}},
{id:'camille',name:'Camille',vibe:'Créative & vintage',bio:'Camille adore détourner, récupérer et transformer. Elle voit le potentiel d’une pièce là où d’autres voient quelque chose de dépassé.',knowledge:'Friperies, vêtements anciens, récupération textile, transformation et premières bases d’upcycling.',traits:['Spontanée','Inventive','Curieuse'],weakness:'Ses idées sont nombreuses mais ses finitions manquent parfois de régularité.',skills:{'Upcycling':4,'Créativité':4,'Couture':2,'Finitions':1,'Couleurs':3}},
{id:'louise',name:'Louise',vibe:'Douce & passionnée',bio:'Louise est fascinée par les vêtements qui racontent une époque ou un personnage. Elle observe particulièrement les volumes et la mise en scène.',knowledge:'Costume historique, théâtre, volumes, corsets et premiers repères sur les silhouettes de scène.',traits:['Raffinée','Imaginative','Exigeante'],weakness:'Elle peut chercher trop vite l’effet spectaculaire au lieu de partir d’un besoin simple.',skills:{'Volumes':4,'Croquis':3,'Culture costume':4,'Couture':2,'Quotidien':1}},
{id:'margaux',name:'Margaux',vibe:'Romantique & intuitive',bio:'Margaux aime le travail patient et les petits détails. Les motifs floraux, rubans et broderies l’attirent naturellement.',knowledge:'Broderie, rubans, motifs floraux, linge ancien et premières références d’artisanat textile de l’Est.',traits:['Patiente','Romantique','Minutieuse'],weakness:'Elle avance lentement et peut avoir du mal à simplifier une idée.',skills:{'Broderie':4,'Détail':4,'Couture':2,'Croquis':2,'Vitesse':1}},
{id:'juliette',name:'Juliette',vibe:'Sensible & naturelle',bio:'Juliette aime les matières douces, les tons calmes et les vêtements qui paraissent simples mais très justes.',knowledge:'Dentelle, lin, tons naturels, linge ancien et premières références de patrimoine textile normand.',traits:['Calme','Sensible','Élégante'],weakness:'Elle a tendance à rester dans un univers très doux et doit apprendre à prendre davantage de risques.',skills:{'Matières':4,'Harmonie':3,'Couture':2,'Croquis':3,'Audace':1}},
{id:'romane',name:'Romane',vibe:'Énergique & sportive',bio:'Romane aime les vêtements qui bougent, résistent et accompagnent la vie quotidienne. Elle privilégie le confort sans négliger l’allure.',knowledge:'Laine, feutre, matières robustes, superpositions et premières références liées aux vêtements de montagne.',traits:['Énergique','Directe','Résistante'],weakness:'Elle connaît peu les matières très délicates et les techniques de couture fine.',skills:{'Construction':3,'Matières':3,'Praticité':4,'Couture fine':1,'Croquis':2}}
];
const home=document.getElementById('home'),prologue=document.getElementById('prologue'),charactersPanel=document.getElementById('characters'),optionsPanel=document.getElementById('optionsPanel');
const SCREEN_KEY='haute-couture-current-screen',PROFILE_KEY='haute-couture-open-profile',CHARACTER_KEY='haute-couture-character';
function displayScreen(name,save=true){home.style.display=name==='home'?'block':'none';prologue.classList.toggle('active',name==='prologue');charactersPanel.classList.toggle('active',name==='characters');optionsPanel.classList.toggle('active',name==='options');if(save)localStorage.setItem(SCREEN_KEY,name)}
function showHome(){closeProfile(false);displayScreen('home')}
document.getElementById('newgame').onclick=()=>displayScreen('prologue');
document.getElementById('back').onclick=showHome;
document.getElementById('chooseCharacter').onclick=()=>displayScreen('characters');
document.getElementById('characterBack').onclick=()=>{closeProfile();displayScreen('prologue')};
function openOptions(){displayScreen('options')}document.getElementById('options').onclick=openOptions;document.getElementById('gear').onclick=openOptions;document.getElementById('closeOptions').onclick=showHome;
const hitGrid=document.getElementById('hitGrid');characters.forEach(c=>{const b=document.createElement('button');b.className='char-hit';b.dataset.id=c.id;b.dataset.name=c.name;b.setAttribute('aria-label','Voir le profil de '+c.name);b.onclick=()=>openProfile(c.id);hitGrid.appendChild(b)});
const profileCard=document.getElementById('profileCard'),profileDim=document.getElementById('profileDim');
function openProfile(id,save=true){const c=characters.find(x=>x.id===id);if(!c)return;document.querySelectorAll('.char-hit').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));document.getElementById('profileName').textContent=c.name;document.getElementById('profileVibe').textContent=c.vibe;document.getElementById('profileBio').textContent=c.bio;document.getElementById('profileKnowledge').textContent=c.knowledge;document.getElementById('profileWeakness').textContent=c.weakness;document.getElementById('portraitCrop').textContent=c.name.charAt(0);const t=document.getElementById('profileTraits');t.innerHTML='';c.traits.forEach(v=>{const s=document.createElement('span');s.className='tag';s.textContent=v;t.appendChild(s)});const sl=document.getElementById('profileSkills');sl.innerHTML='';Object.entries(c.skills).forEach(([k,v])=>{const r=document.createElement('div');r.className='skill-row';r.innerHTML='<span>'+k+'</span><span class="bar"><i style="width:'+(v*20)+'%"></i></span><strong>'+v+'/5</strong>';sl.appendChild(r)});const btn=document.getElementById('confirmCharacter');btn.textContent='Choisir '+c.name+' ♡';btn.onclick=()=>confirmChoice(c.id);profileDim.classList.add('open');profileCard.classList.add('open');if(save)localStorage.setItem(PROFILE_KEY,id)}
function closeProfile(save=true){profileDim.classList.remove('open');profileCard.classList.remove('open');document.querySelectorAll('.char-hit').forEach(b=>b.classList.remove('selected'));if(save)localStorage.removeItem(PROFILE_KEY)}document.getElementById('profileClose').onclick=()=>closeProfile();profileDim.onclick=()=>closeProfile();
function confirmChoice(id){const c=characters.find(x=>x.id===id);localStorage.setItem(CHARACTER_KEY,id);const toast=document.getElementById('toast');toast.textContent=c.name+' est choisie — prochaine étape : choisir où t’installer.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
const savedScreen=localStorage.getItem(SCREEN_KEY);if(['prologue','characters','options'].includes(savedScreen))displayScreen(savedScreen,false);else displayScreen('home',false);if(savedScreen==='characters'){const p=localStorage.getItem(PROFILE_KEY);if(p)setTimeout(()=>openProfile(p,false),80)}
</script>
</body>
</html>
