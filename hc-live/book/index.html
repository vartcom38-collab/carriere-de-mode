<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture Live — Mon Book</title><style>:root{--paper:#f7f1e9;--ink:#171513;--muted:#7a6f68;--line:#ddd0c4;--coral:#d8826d;--shadow:0 18px 45px rgba(74,48,34,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8ded3;color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:1550px;margin:auto;padding:18px}.book{background:var(--paper);border:1px solid #d8c9bb;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}.brand{font-size:10px;font-weight:900;letter-spacing:.18em}.top h1{font:700 clamp(42px,5vw,72px)/.9 Georgia,serif;margin:5px 0}.top h1 em{font-weight:400;color:var(--coral)}.top p{margin:0;font:13px Georgia,serif;color:var(--muted)}.back{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}.search{min-width:250px;flex:1;border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:10px 14px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;cursor:pointer}.filters button.active{background:#201b18;color:#fff}.grid{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{background:#fffaf4;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(60,40,30,.07);cursor:pointer}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e9ddd1}.body{padding:12px}.tag{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);font-weight:900}.body h3{font:20px Georgia,serif;margin:4px 0}.meta{font-size:9px;color:var(--muted);margin-bottom:8px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip,.color{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;background:white}.color{display:inline-flex;align-items:center;gap:5px}.color i{width:12px;height:12px;border-radius:50%;border:1px solid #0002}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);font:18px/1.5 Georgia,serif}.overlay{position:fixed;inset:0;z-index:9000;background:#1c1511aa;display:none;place-items:center;padding:18px}.overlay.open{display:grid}.page{width:min(1120px,97vw);max-height:94vh;overflow:auto;background:#f7f0e6;border-radius:24px;box-shadow:0 25px 70px #0005}.hero{height:360px;background:#d8cdc2 center/cover;position:relative}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#17110dc5)}.heroText{position:absolute;z-index:2;left:24px;right:24px;bottom:20px;color:white}.heroText small{font-size:9px;font-weight:900;letter-spacing:.14em}.heroText h2{font:52px/.9 Georgia,serif;margin:5px 0}.pagebody{padding:20px;display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.section{background:#fffaf4;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.section h3{font:25px Georgia,serif;margin:0 0 8px}.section h4{font:18px Georgia,serif;margin:12px 0 6px}.section p,.section li{font:12px/1.55 Georgia,serif;color:#5b4f47}.palette{display:flex;gap:7px;flex-wrap:wrap}.objects{display:grid;grid-template-columns:1fr 1fr;gap:8px}.obj{border:1px solid var(--line);border-radius:12px;padding:10px;background:white}.obj b{display:block;font:16px Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.dark{background:#211a16;color:white}.soft{background:#e9ded4}.closeX{position:sticky;top:10px;float:right;z-index:10;margin:10px;border:0;border-radius:999px;width:38px;height:38px;background:#fff9;color:#111;font-size:18px;cursor:pointer}@media(max-width:760px){.shell{padding:0}.book{border-radius:0}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr;padding:10px;gap:9px}.pagebody{grid-template-columns:1fr}.objects{grid-template-columns:1fr}.hero{height:300px}.heroText h2{font-size:38px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><main class="book"><header class="top"><div><div class="brand">HAUTE COUTURE ✦ LIVE</div><h1>MON <em>book</em></h1><p>Ton atlas personnel : lieux, histoire, objets, matières, silhouettes et idées pour tes futures collections.</p></div><button class="back" onclick="location.href='../chez-moi/'">← CHEZ MOI</button></header><div class="toolbar"><input class="search" id="search" placeholder="Rechercher : romanité, mosaïque, drapé, Nîmes…"><nav class="filters" id="filters"></nav></div><section class="grid" id="grid"></section></main></div><div class="overlay" id="overlay"><article class="page"><button class="closeX" id="close">×</button><div class="hero" id="hero"><div class="heroText"><small id="ptype">PAGE DE BOOK</small><h2 id="ptitle"></h2><div id="pplace"></div></div></div><div class="pagebody"><div id="left"></div><div id="right"></div></div></article></div><script src="./book-engine.js?v=20260824-book2"></script><script>(function(){const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let filter='Tout',query='';const cats=['Tout','Favoris','Lieux','Mode','Matieres','Motifs','Palettes','Silhouettes','Photos','Secrets'];function pchip(x){return typeof x==='object'?`<span class="color"><i style="background:${esc(x.hex||'#ddd')}"></i>${esc(x.name||'couleur')}</span>`:`<span class="chip">${esc(x)}</span>`}function render(){let items=query?HCBook.search(query):HCBook.get().items;items=items.filter(x=>filter==='Tout'||filter==='Favoris'&&x.favorite||x.category===filter);$('#filters').innerHTML=cats.map(c=>`<button class="${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('');$('#grid').innerHTML=items.length?items.map(x=>`<article class="card" data-open="${esc(x.id)}"><img src="${esc(x.image||x.images?.[0]||'../accueil.png')}" alt=""><div class="body"><div class="tag">${esc(x.category||x.type)}</div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.place||x.source||'Inspiration personnelle')}</div><div class="chips">${[...(x.palette||[]),...(x.materials||[]),...(x.motifs||[])].slice(0,7).map(pchip).join('')}</div></div></article>`).join(''):`<div class="empty">Aucune page pour ce filtre.<br>Continue d’explorer la carte et d’ajouter tes découvertes.</div>`}function arr(a){return(a||[]).length?`<ul>${a.map(v=>`<li>${esc(typeof v==='string'?v:(v.title||v.observe||''))}${typeof v==='object'&&v.observe?` — ${esc(v.observe)}`:''}</li>`).join('')}</ul>`:'<p>Pas encore découvert.</p>'}function openPage(id){const x=HCBook.get().items.find(i=>i.id===id);if(!x)return;$('#ptitle').textContent=x.title;$('#ptype').textContent=(x.category||x.type||'PAGE DE BOOK').toUpperCase();$('#pplace').textContent=x.place||'';$('#hero').style.backgroundImage=`url("${String(x.image||x.images?.[0]||'../accueil.png').replace(/"/g,'%22')}")`;$('#left').innerHTML=`<section class="section"><h3>Le lieu raconté</h3><p>${esc(x.summary||'')}</p>${x.history?`<h4>Histoire</h4><p>${esc(x.history)}</p>`:''}<h4>Anecdotes</h4>${arr(x.anecdotes)}</section><section class="section"><h3>Objets, œuvres & détails</h3><div class="objects">${(x.objects||[]).map(o=>`<div class="obj"><b>${esc(o.title||o)}</b><p>${esc(o.observe||'')}</p></div>`).join('')||'<p>À découvrir lors d’une prochaine visite.</p>'}</div></section><section class="section"><h3>Architecture / visite</h3>${arr(x.architecture)}${arr(x.visitAsIfThere)}</section>`;$('#right').innerHTML=`<section class="section"><h3>Lecture mode</h3><h4>Palette</h4><div class="palette">${(x.palette||[]).map(pchip).join('')}</div><h4>Matières</h4><div class="chips">${(x.materials||[]).map(pchip).join('')}</div><h4>Motifs</h4><div class="chips">${(x.motifs||[]).map(pchip).join('')}</div><h4>Silhouettes</h4>${arr(x.silhouettes)}<h4>Bijoux & accessoires</h4>${arr([...(x.jewelry||[]),...(x.accessories||[])])}</section><section class="section"><h3>Tags atelier</h3><div class="chips">${(x.tags||[]).map(pchip).join('')}</div><p>Ces tags servent de passerelle avec tes futures recherches de collection dans l’atelier.</p></section><section class="section"><div class="actions"><button class="dark" data-fav="${esc(x.id)}">${x.favorite?'★ ÉPINGLÉ':'☆ ÉPINGLER'}</button><button class="soft" data-del="${esc(x.id)}">SUPPRIMER</button></div></section>`;$('#overlay').classList.add('open')}document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const o=e.target.closest('[data-open]');if(o){openPage(o.dataset.open);return}const fav=e.target.closest('[data-fav]');if(fav){HCBook.toggleFavorite(fav.dataset.fav);openPage(fav.dataset.fav);render();return}const del=e.target.closest('[data-del]');if(del){HCBook.remove(del.dataset.del);$('#overlay').classList.remove('open');render()}});$('#search').addEventListener('input',e=>{query=e.target.value;render()});$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')});window.addEventListener('hc-book-state',render);render()})();</script></body></html>
