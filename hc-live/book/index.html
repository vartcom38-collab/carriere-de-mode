<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture Live — Mon Book</title><style>:root{--paper:#f7f1e9;--ink:#171513;--muted:#7a6f68;--line:#ddd0c4;--coral:#d8826d;--shadow:0 18px 45px rgba(74,48,34,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8ded3;color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:1500px;margin:auto;padding:18px}.book{background:var(--paper);border:1px solid #d8c9bb;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}.brand{font-size:10px;font-weight:900;letter-spacing:.18em}.top h1{font:700 clamp(42px,5vw,72px)/.9 Georgia,serif;margin:5px 0}.top h1 em{font-weight:400;color:var(--coral)}.top p{margin:0;font:13px Georgia,serif;color:var(--muted)}.back{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.filters{display:flex;gap:7px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}.filters button{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;cursor:pointer}.filters button.active{background:#201b18;color:#fff}.grid{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#fffaf4;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(60,40,30,.07)}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e9ddd1}.body{padding:12px}.tag{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);font-weight:900}.body h3{font:20px Georgia,serif;margin:4px 0}.meta{font-size:9px;color:var(--muted);margin-bottom:8px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px}.note{width:100%;min-height:66px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;font-size:10px;resize:vertical}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;border:0;border-radius:8px;padding:8px;font-size:9px;font-weight:800;cursor:pointer;background:#eee4db}.actions .fav.on{background:#201b18;color:#fff}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);font:18px/1.5 Georgia,serif}@media(max-width:700px){.shell{padding:0}.book{border-radius:0}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr;padding:10px;gap:9px}.body h3{font-size:16px}.card img{aspect-ratio:1/1}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><main class="book"><header class="top"><div><div class="brand">HAUTE COUTURE ✦ LIVE</div><h1>MON <em>book</em></h1><p>Ton carnet personnel de lieux, matières, silhouettes, photos, secrets et idées de collection.</p></div><button class="back" onclick="location.href='../chez-moi/'">← CHEZ MOI</button></header><nav class="filters" id="filters"></nav><section class="grid" id="grid"></section></main></div><script src="./book-engine.js?v=20260824-book1"></script><script>(function(){const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let filter='Tout';const cats=['Tout','Favoris','Lieux','Mode','Matieres','Motifs','Palettes','Adresses','Silhouettes','Photos','Posts','Secrets'];function render(){const s=HCBook.get(),items=s.items.filter(x=>filter==='Tout'||filter==='Favoris'&&x.favorite||x.category===filter);$('#filters').innerHTML=cats.map(c=>`<button class="${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('');$('#grid').innerHTML=items.length?items.map(x=>`<article class="card"><img src="${esc(x.image||x.images?.[0]||'../accueil.png')}" alt=""><div class="body"><div class="tag">${esc(x.category||x.type)}</div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.place||x.source||'Inspiration personnelle')}</div><div class="chips">${[...(x.palette||[]),...(x.materials||[]),...(x.motifs||[])].slice(0,8).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><textarea class="note" data-note="${esc(x.id)}" placeholder="Ajouter une note personnelle…">${esc(x.note||'')}</textarea><div class="actions"><button class="fav ${x.favorite?'on':''}" data-fav="${esc(x.id)}">${x.favorite?'★ ÉPINGLÉ':'☆ ÉPINGLER'}</button><button data-del="${esc(x.id)}">SUPPRIMER</button></div></div></article>`).join(''):`<div class="empty">Ton book est encore vide.<br>Depuis la carte et les carnets de lieux, utilise “Ajouter à mon book”.</div>`}document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}const fav=e.target.closest('[data-fav]');if(fav){HCBook.toggleFavorite(fav.dataset.fav);render()}const del=e.target.closest('[data-del]');if(del){HCBook.remove(del.dataset.del);render()}});document.addEventListener('change',e=>{if(e.target.matches('[data-note]'))HCBook.updateNote(e.target.dataset.note,e.target.value)});window.addEventListener('hc-book-state',render);render()})();</script></body></html>
