<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Bilan de trimestre</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:9px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:850px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}.card h2{font:25px Georgia,serif;margin:0 0 10px}.row{border-top:1px solid var(--line);padding:11px 0;font:13px/1.55 Georgia,serif}.field{margin-top:12px}.field label{font-size:10px;font-weight:900}.field textarea{width:100%;min-height:110px;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.summary{background:#2d2723;color:#fff;border-radius:18px;padding:18px}.summary b{font:26px Georgia,serif}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 9px;border-radius:999px;background:#f0e8e1;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.dark{background:#29211d}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · BILAN 01</div><h1>Premier trimestre</h1><p class="lead">Le but n’est pas de fabriquer une identité définitive. On regarde des preuves concrètes de progression, les difficultés qui reviennent et ce que tu veux vraiment travailler ensuite.</p><div class="grid"><section class="card"><h2>Ce que tu as déjà traversé</h2><div id="stats"></div></section><section class="summary"><div>PROGRESSION</div><b id="doneCount">—</b><div class="chips" id="skills"></div></section></div><section class="card"><h2>Ton propre bilan</h2><div class="field"><label>3 PREUVES DE PROGRESSION</label><textarea id="proofs" placeholder="Un exercice, un projet, une correction, un dessin…"></textarea></div><div class="field"><label>2 DIFFICULTÉS QUI REVIENNENT</label><textarea id="difficulties" placeholder="Ce qui reste difficile ou incertain…"></textarea></div><div class="field"><label>3 OBJECTIFS CONCRETS POUR LA SUITE</label><textarea id="goals" placeholder="Ex. mieux lire un essayage, dessiner des mains plus lisibles, mieux sélectionner mes références…"></textarea></div><div class="field"><label>CE QUE TU NE CONNAIS PAS ENCORE ET QUE TU AS ENVIE DE DÉCOUVRIR</label><textarea id="unknown" placeholder="Sans chercher la liste complète : juste les questions qui t’attirent aujourd’hui."></textarea></div><div class="actions"><button class="btn" id="save">ENREGISTRER MON BILAN</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><p class="lead" id="msg"></p></section></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-term-review-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}['proofs','difficulties','goals','unknown'].forEach(k=>document.getElementById(k).value=data[k]||'');const s=window.HCSchoolLife?.state?.()||{completed:{},skills:{}};const completed=Object.keys(s.completed||{});document.getElementById('doneCount').textContent=completed.length+' activités/cours terminés';document.getElementById('skills').innerHTML=Object.entries(s.skills||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<span class="chip">${k} · ${v}</span>`).join('')||'<span class="chip">Progression en cours</span>';document.getElementById('stats').innerHTML=`<div class="row"><b>${completed.length}</b> cours ou activités validés dans la progression actuelle.</div><div class="row">Le bilan ne transforme aucune connaissance en “maîtrisée” automatiquement.</div><div class="row">Tes objectifs serviront ensuite de pistes de travail ; ils ne bloquent pas la découverte libre dans le monde.</div>`;document.getElementById('save').onclick=()=>{const out={};['proofs','difficulties','goals','unknown'].forEach(k=>out[k]=document.getElementById(k).value);out.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(out));document.getElementById('msg').textContent='Bilan enregistré dans ta progression scolaire.'}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
