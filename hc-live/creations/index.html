<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Studio</title><style>
:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#7b685d;--line:#e4d4c8;--coral:#e57f68;--green:#6c8c72;--dark:#2b221d;--shadow:0 18px 42px rgba(64,41,30,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20}.brand small{display:block;font:900 8px Arial;letter-spacing:.17em;color:var(--coral)}.brand h1{margin:4px 0 0;font:46px/.9 Georgia,serif}.brand h1 em{font-weight:400;color:var(--coral)}.nav,.mode-tabs,.tabs{display:flex;gap:7px;flex-wrap:wrap}.nav button,.mode-tabs button,.tabs button,.soft{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.nav .dark,.mode-tabs button.active,.tabs button.active{background:var(--dark);color:#fff;border-color:var(--dark)}.mode-tabs{margin:14px 0 10px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}.stat small{font:900 8px Arial;letter-spacing:.1em;color:var(--muted)}.stat b{display:block;font:32px Georgia,serif;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 9px 24px rgba(74,48,34,.06)}.card[draggable="true"]{cursor:grab}.card-head{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:start}.thumb{width:86px;height:112px;border-radius:14px;background:#eadfd6;overflow:hidden;display:grid;place-items:center;font:28px Georgia,serif;color:#9f8070}.thumb img{width:100%;height:100%;object-fit:cover}.k{font:900 8px Arial;letter-spacing:.12em;color:var(--coral)}.card h2{margin:4px 0 3px;font:28px/.95 Georgia,serif}.meta{font:11px/1.45 Georgia,serif;color:var(--muted)}.status{border-radius:999px;padding:7px 10px;background:#efe5dd;font:900 8px Arial;white-space:nowrap}.status.good{background:#edf5ee;color:#4d7456}.status.wait{background:#fff0e4;color:#9a634e}.progress{height:8px;background:#eee2d9;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress i{display:block;height:100%;background:var(--dark);border-radius:999px}.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}.step{border-top:3px solid #ded0c5;padding-top:6px;font:800 7px/1.2 Arial;color:#9a887d}.step.done{border-color:#6e8d73;color:#56735b}.step.current{border-color:var(--coral);color:#b85e49}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.detail{border:1px solid #eaded5;background:#fff;border-radius:12px;padding:9px}.detail small{display:block;font:900 7px Arial;color:#9b7e6e;letter-spacing:.08em}.detail b{display:block;font:13px Georgia,serif;margin-top:3px}.next{margin-top:10px;border:1px dashed #d8b6a5;border-radius:13px;padding:10px;background:#fff7f1;font:11px/1.45 Georgia,serif}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.card-actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font:900 7px Arial;cursor:pointer}.folders-layout{display:grid;grid-template-columns:290px 1fr;gap:12px}.folder-side,.library{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px}.folder-side h2,.library h2{font:28px Georgia,serif;margin:0 0 6px}.folder-create{display:flex;gap:6px;margin:10px 0}.folder-create input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px}.folder-list{display:grid;gap:7px}.folder{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer}.folder.active{background:#2b221d;color:#fff}.folder.drop{outline:2px dashed var(--coral)}.folder b{display:block;font:16px Georgia,serif}.folder small{font-size:9px;color:inherit;opacity:.7}.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.file-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:9px;cursor:grab}.file-card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;background:#eee}.file-card .placeholder{width:100%;aspect-ratio:3/4;border-radius:11px;background:#eee;display:grid;place-items:center;font:36px Georgia,serif}.file-card b{display:block;font:16px Georgia,serif;margin:7px 0 2px}.file-card small{font-size:9px;color:var(--muted)}.empty{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center;font:18px Georgia,serif;color:var(--muted);grid-column:1/-1}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(30,22,18,.5);z-index:100;display:grid;place-items:center;padding:20px}.modal-card{width:min(850px,96vw);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:12px}.modal-head h2{font:34px Georgia,serif;margin:0}.modal-close{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer}.folder-hint{font:11px/1.5 Georgia,serif;color:var(--muted);margin:0 0 10px}@media(max-width:950px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.folders-layout{grid-template-columns:1fr}.library-grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(4,1fr)}.details{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>MON <em>studio</em></h1></div><div class="nav"><button onclick="location.href='../chez-moi/'">← CHEZ MOI</button><button onclick="location.href='../agenda/'">AGENDA</button><button class="dark" onclick="location.href='../atelier-raster/index-v2.html'">ATELIER</button></div></header>
<div class="mode-tabs"><button id="modeTracking" data-mode="tracking">MES CRÉATIONS</button><button id="modeFolders" data-mode="folders">MES DOSSIERS</button></div>
<section id="trackingView"><section class="summary" id="summary"></section><div class="tabs"><button class="active" data-tab="active">EN COURS</button><button data-tab="waiting">EN ATTENTE</button><button data-tab="done">TERMINÉES</button><button data-tab="all">TOUTES</button></div><main class="grid" id="grid"></main></section>
<section id="foldersView" class="hidden"><div class="folders-layout"><aside class="folder-side"><div class="k">CLASSEMENT PERSONNEL</div><h2>Mes dossiers</h2><p class="folder-hint">Crée tes propres dossiers puis glisse les créations dedans. Le dossier réalisation reste inchangé.</p><div class="folder-create"><input id="folderName" placeholder="Ex. Collection été 2027"><button class="soft" id="newFolder">+ DOSSIER</button></div><div class="folder-list" id="folderList"></div></aside><section class="library"><div class="k">FICHIERS VISUELS</div><h2 id="folderTitle">Toutes mes créations</h2><p class="folder-hint" id="folderHint">Glisse une création sur un dossier pour la classer.</p><div class="library-grid" id="libraryGrid"></div></section></div></section></div>
<div class="modal hidden" id="modal"><div class="modal-card"><div class="modal-head"><div><div class="k">DOSSIER RÉALISATION</div><h2 id="modalTitle">Création</h2></div><button class="modal-close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<script src="../game-engine.js?v=20260825-technique-progression2"></script><script>
(function(){'use strict';const $=s=>document.querySelector(s),read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch(_){return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FKEY='haute-couture-creative-folders-v1',STAGES=[['brief','Brief'],['sketch','Croquis'],['proposal','Devis'],['approved','Validation'],['production','Production'],['fitting','Essayage'],['finishing','Finitions'],['delivered','Livraison']];
function orders(){return read('haute-couture-client-orders-v1',[])}function plans(){return read('haute-couture-atelier-production-plans-v1',[])}function creations(){return read('haute-couture-atelier-creations-v1',[])}function folders(){const x=read(FKEY,null);if(Array.isArray(x))return x;const d=[{id:'clients',name:'Clientes',system:true,items:[]},{id:'collections',name:'Collections',system:true,items:[]},{id:'concours',name:'Concours',system:true,items:[]},{id:'defiles',name:'Défilés',system:true,items:[]}];write(FKEY,d);return d}function saveFolders(x){write(FKEY,x)}
function stageIndex(o){const s=String(o.status||o.progress||'').toLowerCase();if(/delivered|completed/.test(s))return 7;if(/finish|quality|retouch/.test(s))return 6;if(/fitting|essay/.test(s))return 5;if(/production|realised|ready_for_fitting/.test(s))return 4;if(/approved|accepted/.test(s))return 3;if(/proposal|quote|devis|sent/.test(s))return 2;if(o.design||o.sketch||o.selectedSketch)return 1;return 0}function bucket(o){const s=String(o.status||'');if(/delivered|completed|cancelled/.test(s))return'done';if(/waiting|proposal|sent|revision|alterations|offered/.test(s))return'waiting';return'active'}
function selectedImage(o){return o?.design?.sketch?.url||o?.design?.url||o?.sketch?.url||o?.selectedSketch?.url||read('haute-couture-atelier-selected-sketch-v2',null)?.url||''}
function currentProgress(o,p){const idx=stageIndex(o);if(idx<4||!p?.events?.length)return Math.round(idx/7*100);const now=new Date(window.HCGame?.get?.().clock?.iso||Date.now()).getTime(),events=p.events,total=events.reduce((a,e)=>a+Math.max(1,new Date(e.end)-new Date(e.start)),0),done=events.reduce((a,e)=>a+Math.max(0,Math.min(new Date(e.end).getTime(),now)-new Date(e.start).getTime()),0);return Math.max(Math.round(idx/7*100),Math.min(85,Math.round(done/Math.max(1,total)*60)+35))}
function humanStatus(o){const s=String(o.status||o.progress||'');const map={production_scheduled:'Fabrication planifiée',approved_for_production:'Prête à produire',accepted:'Commande validée',proposal_sent:'Proposition envoyée',fitting:'Essayage',alterations_needed:'Retouches demandées',ready_for_fitting:'Prête pour essayage',delivered:'Livrée',completed:'Terminée'};return map[s]||s.replaceAll('_',' ')||'En préparation'}function nextText(o,p){const idx=stageIndex(o);if(String(o.status)==='production_scheduled'&&p?.lastEnd)return`Production en cours · fin prévue ${new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(p.lastEnd))}. Ensuite : essayage / contrôle.`;return['Compléter le brief.','Choisir le croquis.','Envoyer le devis.','Obtenir la validation.','Suivre la fabrication.','Organiser l’essayage.','Effectuer les finitions.','Création terminée et archivée.'][idx]}
function orderCard(o){const p=plans().find(x=>x.orderId===o.id),idx=stageIndex(o),prog=currentProgress(o,p),worker=o.production?.worker||p?.worker||{},q=p?.quote||o.proposal||{},price=Number(o.proposal?.price||q.price||o.price||0),img=selectedImage(o),cls=bucket(o)==='done'?'good':bucket(o)==='waiting'?'wait':'';return`<article class="card" draggable="true" data-file-id="order:${esc(o.id)}"><div class="card-head"><div class="thumb">${img?`<img src="${esc(img)}" alt="croquis">`:'✦'}</div><div><div class="k">${esc(o.clientName||o.client||'CRÉATION PERSONNELLE')}</div><h2>${esc(o.garment||o.name||'Création sur mesure')}</h2><div class="meta">${esc(o.occasion||o.brief?.style||'Projet couture')}</div></div><span class="status ${cls}">${esc(humanStatus(o))}</span></div><div class="progress"><i style="width:${prog}%"></i></div><div class="steps">${STAGES.map((x,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}">${x[1]}</div>`).join('')}</div><div class="details"><div class="detail"><small>PRIX CLIENTE</small><b>${price?fmt(price):'À définir'}</b></div><div class="detail"><small>FABRICATION</small><b>${esc(worker.name||'À attribuer')}</b></div><div class="detail"><small>DIRECTION</small><b>${q.creativeHours?esc(q.creativeHours+' h'):'—'}</b></div><div class="detail"><small>CONFECTION</small><b>${q.sewingHours?esc(q.sewingHours+' h'):'—'}</b></div></div><div class="next"><b>PROCHAINE ÉTAPE</b><br>${esc(nextText(o,p))}</div><div class="card-actions"><button data-open-order="${esc(o.id)}">OUVRIR LE DOSSIER RÉALISATION</button></div></article>`}
function files(){const out=orders().map(o=>({id:'order:'+o.id,type:'order',ref:o.id,name:o.garment||o.name||'Création sur mesure',owner:o.clientName||o.client||'Cliente',img:selectedImage(o),status:humanStatus(o)}));for(const c of creations()){const linked=c.orderId&&out.some(x=>x.ref===c.orderId);if(linked)continue;out.push({id:'creation:'+(c.id||c.createdAt||Math.random()),type:'creation',ref:c.id,name:c.name||c.garment||'Création personnelle',owner:'Création personnelle',img:c.sketch?.url||c.image||c.url||'',status:c.status||'Création'})}return out}
function fileCard(f){return`<article class="file-card" draggable="true" data-file-id="${esc(f.id)}">${f.img?`<img src="${esc(f.img)}" alt="${esc(f.name)}">`:'<div class="placeholder">✦</div>'}<b>${esc(f.name)}</b><small>${esc(f.owner)} · ${esc(f.status)}</small></article>`}
let tab='active',mode=new URLSearchParams(location.search).get('view')==='folders'?'folders':'tracking',folderId='all';function setMode(m){mode=m;$('#trackingView').classList.toggle('hidden',m!=='tracking');$('#foldersView').classList.toggle('hidden',m!=='folders');$('#modeTracking').classList.toggle('active',m==='tracking');$('#modeFolders').classList.toggle('active',m==='folders');if(m==='folders')renderFolders()}
function renderTracking(){const all=orders(),cs=creations(),active=all.filter(x=>bucket(x)==='active').length,waiting=all.filter(x=>bucket(x)==='waiting').length,done=all.filter(x=>bucket(x)==='done').length;$('#summary').innerHTML=`<div class="stat"><small>EN COURS</small><b>${active}</b></div><div class="stat"><small>EN ATTENTE</small><b>${waiting}</b></div><div class="stat"><small>TERMINÉES</small><b>${done}</b></div><div class="stat"><small>CRÉATIONS FABRIQUÉES</small><b>${cs.length}</b></div>`;let list=all;if(tab!=='all')list=all.filter(x=>bucket(x)===tab);$('#grid').innerHTML=list.length?list.map(orderCard).join(''):'<div class="empty">Aucune création dans cette catégorie pour le moment.</div>';bindDrag()}
function renderFolders(){const fs=folders(),allFiles=files();$('#folderList').innerHTML=`<div class="folder ${folderId==='all'?'active':''}" data-folder="all"><b>Tout le Studio</b><small>${allFiles.length} créations</small></div>`+fs.map(f=>`<div class="folder ${folderId===f.id?'active':''}" data-folder="${esc(f.id)}"><b>▤ ${esc(f.name)}</b><small>${(f.items||[]).length} fichier(s)</small></div>`).join('');const current=fs.find(f=>f.id===folderId),ids=current?.items||null,list=ids?allFiles.filter(x=>ids.includes(x.id)):allFiles;$('#folderTitle').textContent=current?.name||'Toutes mes créations';$('#folderHint').textContent=current?'Glisse d’autres créations ici ou ouvre leur dossier réalisation depuis Mes créations.':'Glisse une création sur un dossier à gauche pour la classer.';$('#libraryGrid').innerHTML=list.length?list.map(fileCard).join(''):'<div class="empty">Ce dossier est vide.</div>';bindDrag();bindFolders()}
function bindDrag(){document.querySelectorAll('[draggable="true"][data-file-id]').forEach(el=>el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.fileId);e.dataTransfer.effectAllowed='move'})}
function bindFolders(){document.querySelectorAll('.folder[data-folder]').forEach(el=>{el.onclick=()=>{folderId=el.dataset.folder;renderFolders()};if(el.dataset.folder==='all')return;el.ondragover=e=>{e.preventDefault();el.classList.add('drop')};el.ondragleave=()=>el.classList.remove('drop');el.ondrop=e=>{e.preventDefault();el.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');if(!id)return;const fs=folders(),f=fs.find(x=>x.id===el.dataset.folder);if(!f)return;f.items=f.items||[];if(!f.items.includes(id))f.items.push(id);saveFolders(fs);folderId=f.id;renderFolders()}})}
function openOrder(id){const o=orders().find(x=>String(x.id)===String(id));if(!o)return;const p=plans().find(x=>x.orderId===o.id),idx=stageIndex(o),q=p?.quote||o.proposal||{},img=selectedImage(o);$('#modalTitle').textContent=o.garment||o.name||'Création';$('#modalBody').innerHTML=`<div style="display:grid;grid-template-columns:160px 1fr;gap:14px;margin-top:14px">${img?`<img src="${esc(img)}" style="width:160px;border-radius:16px">`:'<div class="thumb" style="width:160px;height:210px">✦</div>'}<div><div class="k">${esc(o.clientName||o.client||'CRÉATION PERSONNELLE')}</div><p class="meta">${esc(o.occasion||o.brief?.style||'Projet couture')}</p><div class="steps" style="margin-top:18px">${STAGES.map((x,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}">${x[1]}</div>`).join('')}</div><div class="details"><div class="detail"><small>STATUT</small><b>${esc(humanStatus(o))}</b></div><div class="detail"><small>PRIX</small><b>${q.price?fmt(q.price):'—'}</b></div><div class="detail"><small>DIRECTION</small><b>${q.creativeHours||'—'} h</b></div><div class="detail"><small>CONFECTION</small><b>${q.sewingHours||'—'} h</b></div></div><div class="next"><b>PROCHAINE ÉTAPE</b><br>${esc(nextText(o,p))}</div></div></div>`;$('#modal').classList.remove('hidden')}
$('.tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));renderTracking()};$('.mode-tabs').onclick=e=>{const b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode)};$('#newFolder').onclick=()=>{const name=$('#folderName').value.trim();if(!name)return;const fs=folders();const id='folder-'+Date.now().toString(36);fs.push({id,name,items:[]});saveFolders(fs);$('#folderName').value='';folderId=id;renderFolders()};document.addEventListener('click',e=>{const b=e.target.closest('[data-open-order]');if(b)openOrder(b.dataset.openOrder)});$('#modalClose').onclick=()=>$('#modal').classList.add('hidden');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.add('hidden')};window.addEventListener('storage',()=>{renderTracking();if(mode==='folders')renderFolders()});window.addEventListener('hc-game-state',()=>{renderTracking();if(mode==='folders')renderFolders()});renderTracking();setMode(mode)})();
</script></body></html>
