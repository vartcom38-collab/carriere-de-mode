<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Mes créations</title><style>
:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#7b685d;--line:#e4d4c8;--coral:#e57f68;--green:#6c8c72;--shadow:0 18px 42px rgba(64,41,30,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:10}.brand small{display:block;font:900 8px Arial;letter-spacing:.17em;color:var(--coral)}.brand h1{margin:4px 0 0;font:46px/.9 Georgia,serif}.brand h1 em{font-weight:400;color:var(--coral)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 14px;font:900 8px Arial;cursor:pointer}.nav .dark{background:#2b221d;color:#fff;border-color:#2b221d}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}.stat small{font:900 8px Arial;letter-spacing:.1em;color:var(--muted)}.stat b{display:block;font:32px Georgia,serif;margin-top:4px}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{border:1px solid var(--line);background:#fffaf4;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.tabs button.active{background:#2b221d;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 9px 24px rgba(74,48,34,.06)}.card-head{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:start}.thumb{width:86px;height:112px;border-radius:14px;background:#eadfd6;overflow:hidden;display:grid;place-items:center;font:28px Georgia,serif;color:#9f8070}.thumb img{width:100%;height:100%;object-fit:cover}.k{font:900 8px Arial;letter-spacing:.12em;color:var(--coral)}.card h2{margin:4px 0 3px;font:28px/.95 Georgia,serif}.meta{font:11px/1.45 Georgia,serif;color:var(--muted)}.status{border-radius:999px;padding:7px 10px;background:#efe5dd;font:900 8px Arial;white-space:nowrap}.status.good{background:#edf5ee;color:#4d7456}.status.wait{background:#fff0e4;color:#9a634e}.progress{height:8px;background:#eee2d9;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress i{display:block;height:100%;background:#2b221d;border-radius:999px}.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}.step{border-top:3px solid #ded0c5;padding-top:6px;font:800 7px/1.2 Arial;color:#9a887d}.step.done{border-color:#6e8d73;color:#56735b}.step.current{border-color:var(--coral);color:#b85e49}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.detail{border:1px solid #eaded5;background:#fff;border-radius:12px;padding:9px}.detail small{display:block;font:900 7px Arial;color:#9b7e6e;letter-spacing:.08em}.detail b{display:block;font:13px Georgia,serif;margin-top:3px}.next{margin-top:10px;border:1px dashed #d8b6a5;border-radius:13px;padding:10px;background:#fff7f1;font:11px/1.45 Georgia,serif}.empty{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center;font:18px Georgia,serif;color:var(--muted);grid-column:1/-1}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.card-head{grid-template-columns:70px 1fr}.card-head .status{grid-column:1/-1;justify-self:start}.thumb{width:70px;height:92px}.steps{grid-template-columns:repeat(4,1fr)}.details{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>MES <em>créations</em></h1></div><div class="nav"><button onclick="location.href='../chez-moi/'">← CHEZ MOI</button><button onclick="location.href='../agenda/'">AGENDA</button><button class="dark" onclick="location.href='../atelier-raster/index-v2.html'">ATELIER</button></div></header><section class="summary" id="summary"></section><div class="tabs"><button class="active" data-tab="active">EN COURS</button><button data-tab="waiting">EN ATTENTE</button><button data-tab="done">TERMINÉES</button><button data-tab="all">TOUTES</button></div><main class="grid" id="grid"></main></div><script src="../game-engine.js?v=20260825-technique-progression2"></script><script>
(function(){'use strict';const $=s=>document.querySelector(s),read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch(_){return f}},fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGES=[['brief','Brief'],['sketch','Croquis'],['proposal','Devis'],['approved','Validation'],['production','Production'],['fitting','Essayage'],['finishing','Finitions'],['delivered','Livraison']];
function orders(){return read('haute-couture-client-orders-v1',[])}function plans(){return read('haute-couture-atelier-production-plans-v1',[])}function creations(){return read('haute-couture-atelier-creations-v1',[])}function gallery(){return read('haute-couture-atelier-sketch-gallery-v1',[])||read('haute-couture-atelier-generated-sketches-v1',[])}
function stageIndex(o){const s=String(o.status||o.progress||'').toLowerCase();if(/delivered|completed/.test(s))return 7;if(/finish|quality|retouch/.test(s))return 6;if(/fitting|essay/.test(s))return 5;if(/production|realised|ready_for_fitting/.test(s))return 4;if(/approved|accepted/.test(s))return 3;if(/proposal|quote|devis|sent/.test(s))return 2;if(o.design||o.sketch||o.selectedSketch)return 1;return 0}
function bucket(o){const s=String(o.status||'');if(/delivered|completed|cancelled/.test(s))return'done';if(/waiting|proposal|sent|revision|alterations|offered/.test(s))return'waiting';return'active'}
function selectedImage(o){const direct=o?.design?.sketch?.url||o?.design?.url||o?.sketch?.url||o?.selectedSketch?.url;if(direct)return direct;const sel=read('haute-couture-atelier-selected-sketch-v2',null);return sel?.url||''}
function currentProgress(o,p){const idx=stageIndex(o);if(idx<4||!p?.events?.length)return Math.round(idx/7*100);const g=window.HCGame?.get?.(),now=new Date(g?.clock?.iso||Date.now()).getTime(),events=p.events,total=events.reduce((a,e)=>a+Math.max(1,new Date(e.end)-new Date(e.start)),0),done=events.reduce((a,e)=>a+Math.max(0,Math.min(new Date(e.end).getTime(),now)-new Date(e.start).getTime()),0);return Math.max(Math.round(idx/7*100),Math.min(85,Math.round(done/Math.max(1,total)*60)+35))}
function humanStatus(o){const s=String(o.status||o.progress||'');const map={production_scheduled:'Fabrication planifiée',approved_for_production:'Prête à produire',accepted:'Commande validée',proposal_sent:'Proposition envoyée',fitting:'Essayage',alterations_needed:'Retouches demandées',ready_for_fitting:'Prête pour essayage',delivered:'Livrée',completed:'Terminée'};return map[s]||s.replaceAll('_',' ')||'En préparation'}
function nextText(o,p){const idx=stageIndex(o);if(String(o.status)==='production_scheduled'&&p?.lastEnd)return`Production en cours · fin prévue ${new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(p.lastEnd))}. Ensuite : essayage / contrôle.`;return['Compléter le brief et préparer la direction créative.','Choisir le croquis à présenter.','Envoyer le devis à la cliente.','Obtenir le bon pour création.','Suivre la fabrication dans le planning.','Organiser l’essayage et noter les corrections.','Effectuer les finitions et le contrôle qualité.','Commande terminée et archivée.'][idx]}
function card(o){const p=plans().find(x=>x.orderId===o.id),idx=stageIndex(o),prog=currentProgress(o,p),worker=o.production?.worker||p?.worker||{},q=p?.quote||o.proposal||{},price=Number(o.proposal?.price||q.price||o.price||0),img=selectedImage(o),cls=bucket(o)==='done'?'good':bucket(o)==='waiting'?'wait':'';return`<article class="card"><div class="card-head"><div class="thumb">${img?`<img src="${esc(img)}" alt="croquis">`:'✦'}</div><div><div class="k">${esc(o.clientName||o.client||'CRÉATION PERSONNELLE')}</div><h2>${esc(o.garment||o.name||'Création sur mesure')}</h2><div class="meta">${esc(o.occasion||o.brief?.style||'Projet couture')} ${o.id?`· #${esc(String(o.id).slice(-6))}`:''}</div></div><span class="status ${cls}">${esc(humanStatus(o))}</span></div><div class="progress"><i style="width:${prog}%"></i></div><div class="meta">Progression estimée : <b>${prog}%</b></div><div class="steps">${STAGES.map((x,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}">${x[1]}</div>`).join('')}</div><div class="details"><div class="detail"><small>PRIX CLIENTE</small><b>${price?fmt(price):'À définir'}</b></div><div class="detail"><small>FABRICATION</small><b>${esc(worker.name||'À attribuer')}</b></div><div class="detail"><small>DIRECTION</small><b>${q.creativeHours?esc(q.creativeHours+' h'):'—'}</b></div><div class="detail"><small>CONFECTION</small><b>${q.sewingHours?esc(q.sewingHours+' h'):'—'}</b></div></div><div class="next"><b>PROCHAINE ÉTAPE</b><br>${esc(nextText(o,p))}</div></article>`}
let tab='active';function render(){const all=orders(),cs=creations(),active=all.filter(x=>bucket(x)==='active').length,waiting=all.filter(x=>bucket(x)==='waiting').length,done=all.filter(x=>bucket(x)==='done').length;$('#summary').innerHTML=`<div class="stat"><small>EN COURS</small><b>${active}</b></div><div class="stat"><small>EN ATTENTE</small><b>${waiting}</b></div><div class="stat"><small>TERMINÉES</small><b>${done}</b></div><div class="stat"><small>CRÉATIONS FABRIQUÉES</small><b>${cs.length}</b></div>`;let list=all;if(tab!=='all')list=all.filter(x=>bucket(x)===tab);$('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Aucune création dans cette catégorie pour le moment.</div>'}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()};window.addEventListener('storage',render);window.addEventListener('hc-game-state',render);render();})();
</script></body></html>
