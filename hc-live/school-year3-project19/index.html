<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 19</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:46px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.16em;color:var(--coral)}h1{font:50px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.65 Georgia,serif;color:var(--muted);max-width:850px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:15px}.hero{background:#2d2723;color:#fff}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ded1c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card h2{font:23px Georgia,serif;margin:4px 0 8px}.step{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--coral)}p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.looks textarea{min-height:150px}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:850px){.looks{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:560px){.looks{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · ANNÉE 3 · PROJET 19</div><h1 id="title">Collection · 6 looks</h1><p class="lead" id="lead"></p><section class="hero"><h2>Une collection n’est pas six bons looks.</h2><p>Tu dois pouvoir expliquer pourquoi chaque proposition existe, ce qui relie les familles, où la collection respire, où elle se tend et ce que tu as volontairement supprimé.</p></section><section class="grid" id="before"></section><section class="looks" id="looks"></section><section class="grid" id="after"></section><div class="btns"><button class="btn" id="save">ENREGISTRER LE PROJET</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year3-project19-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 19 — collection construite · 6 looks',lead:'Développe six looks organisés en familles constructives, avec une architecture commune, des prototypes prioritaires et une édition claire.'};else if(id==='ifm-paris')profile={title:'Projet 19 — collection matière & corps · 6 états',lead:'Développe six états portés organisés en familles matérielles, avec comportements comparés, limites et relation au corps.'};else profile={title:'Projet 19 — collection surface, coupe & volume · 6 looks',lead:'Développe six looks répartis en familles, transitions et rupture, avec une séquence qui reste lisible à distance et en mouvement.'};const before=[['territory','01 · TERRITOIRE','Question de collection, intention et ce qui doit rester lisible dans tout l’ensemble.'],['constants','02 · CONSTANTES','Quatre principes qui relient toute la collection.'],['variables','03 · VARIABLES','Ce qui peut changer entre les looks : proportion, intensité, matière, coupe, volume, usage ou rythme.'],['families','04 · FAMILLES','Définis deux familles ou pôles et explique ce qui les relie.'],['lineup0','05 · PREMIER LINE-UP','Décris l’ordre initial des 6 looks et le rôle de chacun.'],['risks','06 · RISQUES','Quels éléments peuvent fragiliser plusieurs looks ou toute la collection ?']];const after=[['prototype','13 · PROTOTYPE CLÉ','Quel prototype ou test est prioritaire et qu’a-t-il révélé ?'],['compare','14 · COMPARAISON','Compare les six propositions selon des critères communs.'],['weak','15 · LOOK / ÉTAT LE PLUS FAIBLE','Lequel est le moins nécessaire et pourquoi ?'],['transitions','16 · TRANSITIONS','Comment passes-tu d’une famille, intensité ou logique à une autre ?'],['rupture','17 · RUPTURE','Où se situe la rupture principale et quel rôle joue-t-elle ?'],['edits','18 · ÉDITION','Qu’as-tu supprimé, simplifié, déplacé ou fusionné ?'],['lineup1','19 · LINE-UP RÉVISÉ','Décris le nouvel ordre et ce qui le rend plus fort.'],['limits','20 · LIMITES','Qu’est-ce qui reste fragile, non maîtrisé ou demanderait plus de développement ?'],['jury','21 · PRÉSENTATION MI-ANNÉE','Prépare : territoire, familles, 6 looks, prototype clé, faiblesse, édition, limites et prochaines priorités.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;function esc(v){return String(v||'').replace(/</g,'&lt;')}function card([k,n,p]){return`<section class="card"><div class="step">${n}</div><h2>${p.split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${esc(s[k])}</textarea></section>`}document.getElementById('before').innerHTML=before.map(card).join('');document.getElementById('looks').innerHTML=Array.from({length:6},(_,i)=>{const k='look'+(i+1);return`<section class="card"><div class="step">${String(i+7).padStart(2,'0')} · LOOK / ÉTAT ${i+1}</div><h2>Proposition ${i+1}</h2><p>Rôle dans l’ensemble, famille, intention, différences, matière/technique connue, problème à tester.</p><textarea data-key="${k}">${esc(s[k])}</textarea></section>`}).join('');document.getElementById('after').innerHTML=after.map(card).join('');const keys=[...before.map(x=>x[0]),...Array.from({length:6},(_,i)=>'look'+(i+1)),...after.map(x=>x[0])];document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,9000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=keys.filter(k=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Projet enregistré · ${filled}/${keys.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('collection-editing',{source:'school-year3-project19'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
