<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Ma vie d’école</title><style>:root{--ink:#2b1d19;--muted:#77665d;--paper:rgba(255,249,242,.94);--line:rgba(104,71,59,.18);--wine:#7d343d;--rose:#b26370;--green:#52756d;--shadow:0 24px 70px rgba(45,28,23,.2)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:linear-gradient(90deg,rgba(37,24,20,.58),rgba(37,24,20,.12)),url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&fm=jpg&q=88&w=2400') center/cover fixed}.nav{height:72px;padding:0 min(4vw,64px);display:flex;align-items:center;justify-content:space-between;background:rgba(43,29,24,.48);border-bottom:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);color:#fff}.brand{font:24px/1 Georgia,serif;letter-spacing:.08em}.brand small{display:block;text-align:center;font:800 8px Arial;letter-spacing:.3em;margin-top:4px}.links{display:flex;gap:28px}.links a{color:#fff;text-decoration:none;font:14px Georgia,serif}.page{width:min(1380px,92vw);margin:auto;padding:48px 0 70px}.hero{min-height:300px;display:flex;align-items:flex-end}.hero-copy{color:#fff;max-width:760px;text-shadow:0 2px 18px rgba(0,0,0,.26)}.ey{font:800 10px Arial;letter-spacing:.16em;text-transform:uppercase;color:#f1c7c4}.hero h1{font:clamp(58px,6vw,92px)/.9 Georgia,serif;font-weight:400;margin:12px 0}.hero p{font:17px/1.6 Georgia,serif;color:rgba(255,255,255,.88)}.panel{margin-top:26px;background:var(--paper);border:1px solid rgba(255,255,255,.55);border-radius:28px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.status{padding:13px 15px;border-radius:15px;background:rgba(238,228,219,.85);font:13px/1.5 Georgia,serif;color:var(--muted)}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fffaf5;border-radius:999px;padding:10px 14px;font:800 10px Arial;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}.tab.active{background:linear-gradient(135deg,#914653,#6f2f39);color:#fff;border-color:transparent}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{position:relative;overflow:hidden;background:rgba(255,250,245,.96);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 14px 38px rgba(45,28,23,.12)}.card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--rose),transparent)}.card h3{font:27px/1.05 Georgia,serif;font-weight:400;margin:8px 0}.meta{font:800 9px Arial;letter-spacing:.1em;color:var(--green);text-transform:uppercase}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font:10px Arial;background:#f0e6de;padding:6px 8px;border-radius:999px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:999px;padding:10px 12px;background:#2a211d;color:#fff;font:800 9px Arial;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}.btn.alt{background:var(--green)}.btn:disabled{opacity:.35}.memory,.progress{margin-top:11px;padding:12px;border-radius:14px;background:#f4ebe4;font:12px/1.5 Georgia,serif;color:var(--muted)}.progress.fragile{background:#fff0eb}.progress.strong{background:#edf5ef}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.links{display:none}}@media(max-width:620px){.grid{grid-template-columns:1fr}.hero h1{font-size:50px}}</style></head><body><nav class="nav"><div class="brand">HAUTE COUTURE<small>LIVE</small></div><div class="links"><a href="../school-home/">Chez moi</a><a href="../school-day/">Ma journée</a><a href="../school-campus/">Mon école</a><a href="../school-city/">La ville</a></div></nav><main class="page"><section class="hero"><div class="hero-copy"><div class="ey">École · rencontres & moments</div><h1>Ma vie d’école</h1><p>Les cours comptent, mais les pauses, les discussions, les désaccords, les ateliers tardifs et les rencontres construisent aussi ton parcours.</p></div></section><section class="panel"><div class="status" id="status"></div><div class="tabs"><button class="tab active" data-tab="events">Moments d’école</button><button class="tab" data-tab="promo">Ma promo</button><button class="tab" data-tab="teachers">Mes profs</button></div><section class="section active" id="events"><div class="grid" id="eventGrid"></div></section><section class="section" id="promo"><div class="grid" id="studentGrid"></div></section><section class="section" id="teachers"><div class="grid" id="teacherGrid"></div></section></section></main><script src="../game-engine.js?v=20260905-community1"></script><script src="../school/school-academic-v1.js?v=20260905-community1"></script><script src="../school/school-learning-memory-v1.js?v=20260905-community1"></script><script src="../school/school-community-v1.js?v=20260905-community1"></script><script src="../school/school-cohort-progress-v1.js?v=20260905-cohort1"></script><script>(function(){const C=window.HCSchoolCommunity,A=window.HCSchoolAcademic,P=window.HCSchoolCohortProgress,S=document.getElementById('status');if(!C){S.textContent='La vie d’école n’a pas pu être chargée.';return}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function progressClass(o){return o?.status==='fragile'?'fragile':o?.status==='très abouti'?'strong':''}function render(){const a=A?.state?.()||{year:1,week:1};P?.ensureWeek?.(Number(a.year),Number(a.week));S.textContent=`Année ${a.year} · semaine ${a.week}. Chacun suit sa trajectoire : pas de classement général, seulement des progrès, des difficultés et des reprises.`;const state=C.state();document.getElementById('eventGrid').innerHTML=C.availableEvents().map(e=>`<article class="card"><div class="meta">${esc(e.type)} · ${e.duration} min de jeu</div><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p>${e.people?.length?`<div class="chips">${e.people.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}<div class="actions"><button class="btn alt" data-event="${e.id}" ${e.status==='done'?'disabled':''}>${e.status==='done'?'Déjà vécu':'Y participer'}</button></div></article>`).join('')||'<p>Aucun moment particulier n’est encore apparu cette semaine.</p>';document.getElementById('studentGrid').innerHTML=C.students.map(p=>{const r=state.relationships[p.id],v=P?.studentView?.(p.id),o=v?.lastOutcome||P?.outcomeFor?.(p,Number(a.year),Number(a.week),'semaine');return`<article class="card"><div class="meta">${r.met?'Déjà rencontrée':'Pas encore vraiment rencontrée'} · affinité ${r.affinity}</div><h3>${esc(p.name)}</h3><p><b>Point fort :</b> ${esc(p.strength)}</p><p><b>Fragilité :</b> ${esc(p.fragility)}</p><p>${esc(p.temper)}</p>${o?`<div class="progress ${progressClass(o)}"><b>Cette semaine : ${esc(o.status)}</b><br>${esc(o.text)}<br>${esc(o.strength)}<br>${esc(o.watch)}</div>`:''}<div class="actions"><button class="btn" data-person="${p.id}" data-kind="discuter">Discuter · 15 min</button><button class="btn alt" data-person="${p.id}" data-kind="demander-avis">Demander un avis · 15 min</button><button class="btn" data-person="${p.id}" data-kind="aider">Aider · 30 min</button></div>${r.history?.[0]?`<div class="memory">Dernière trace : ${esc(r.history[0].text)}</div>`:''}</article>`}).join('');document.getElementById('teacherGrid').innerHTML=C.teachers.map(t=>{const v=C.teacherView(t.id),m=v?.memory,notes=m?.notes||[];const strengths=Object.entries(m?.strengths||{}).sort((a,b)=>b[1]-a[1]).slice(0,3),watch=Object.entries(m?.watch||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);return`<article class="card"><div class="meta">${esc(t.role)}</div><h3>${esc(t.name)}</h3><p>${esc(t.style)}</p><div class="chips">${t.focus.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="memory">${notes.length?`<b>Ce que ce professeur retient de toi :</b> ${esc(notes[0].text||'Retour enregistré.')}`:'Ce professeur n’a pas encore enregistré de retour personnel.'}${strengths.length?`<br><b>Forces repérées :</b> ${strengths.map(x=>esc(x[0])).join(', ')}`:''}${watch.length?`<br><b>À surveiller :</b> ${watch.map(x=>esc(x[0])).join(', ')}`:''}</div></article>`}).join('')}document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===tab.dataset.tab));return}const ev=e.target.closest('[data-event]');if(ev){C.attendEvent(ev.dataset.event);render();return}const p=e.target.closest('[data-person]');if(p){C.interact(p.dataset.person,p.dataset.kind);render()}});render()})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
