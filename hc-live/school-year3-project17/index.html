<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 17</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:46px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:820px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:23px Georgia,serif;margin:0 0 7px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · ANNÉE 3 · PROJET 17</div><h1 id="title">Projet collaboratif</h1><p class="lead" id="lead"></p><section class="hero"><h2>Règle de collaboration</h2><p>Le partenaire est fictif, mais le travail demandé ne l’est pas : rôles, responsabilités, retours, désaccords et arbitrages doivent être documentés. Un compromis flou ne compte pas comme une décision.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year3-project17-v1',school=HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let p=esmod?{title:'Projet 17 — duo créatif · pièce négociée',lead:'Construis une pièce avec une collaboration simulée entre design et construction, en rendant visibles les responsabilités et les arbitrages.'}:id==='ifm-paris'?{title:'Projet 17 — collaboration matière · protocole partagé',lead:'Développe un système matière à deux voix : protocole commun, essais parallèles, écarts et décisions partagées.'}:{title:'Projet 17 — collaboration visuelle · deux signatures, un système',lead:'Fais coexister deux écritures dans une proposition portée cohérente sans les fondre artificiellement.'};const defs=[['brief','01 · BRIEF COMMUN','Question commune, résultat attendu et critères de réussite.'],['roles','02 · RÔLES','Qui propose, qui décide, qui exécute, qui valide ?'],['boundaries','03 · PÉRIMÈTRES','Zones de décision individuelles, partagées et non négociables.'],['proposalA','04 · PROPOSITION A','Première contribution ou direction.'],['proposalB','05 · PROPOSITION B','Deuxième contribution ou interprétation.'],['interface','06 · INTERFACE','Où et comment les deux contributions se rencontrent-elles ?'],['disagreement','07 · DÉSACCORD','Décris un désaccord réel de projet, pas un faux conflit décoratif.'],['arguments','08 · ARGUMENTS','Quels arguments soutiennent chaque position ?'],['arbitration','09 · ARBITRAGE','Quelle décision est prise et selon quel critère ?'],['prototype','10 · PROTOTYPE / ESSAI COMMUN','Version suffisamment avancée pour tester la décision.'],['feedback','11 · RETOUR CROISÉ','Constats, questions et retours exploitables des deux côtés.'],['revision','12 · VERSION RÉVISÉE','Ce qui change après retour et pourquoi.'],['contributions','13 · CONTRIBUTIONS','Ce que chaque personne a réellement apporté au projet.'],['gainloss','14 · GAIN / PERTE','Ce que la collaboration a enrichi, et ce qu’elle a rendu plus difficile.'],['final','15 · RESTITUTION','Projet actuel, responsabilités, décision majeure et limite restante.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();title.textContent=p.title;lead.textContent=p.lead;steps.innerHTML=defs.map(([k,n,d])=>`<section class="card"><div class="step">${n}</div><h2>${d.split('.')[0]}</h2><p>${d}</p><textarea data-key="${k}">${(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');save.onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;status.textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
