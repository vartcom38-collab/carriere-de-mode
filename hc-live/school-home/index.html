<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Ma chambre étudiante</title><style>:root{--ink:#251e1a;--muted:#75665d;--line:#decfc3;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ede2d8,#f9f4ee);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:48px 22px 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.17em;color:var(--coral)}h1{font:46px/1 Georgia,serif;margin:10px 0}.sub{font:14px/1.5 Georgia,serif;color:var(--muted)}.room{min-height:470px;border-radius:30px;border:1px solid var(--line);background:radial-gradient(circle at 75% 22%,#fff9ee 0 11%,transparent 12%),linear-gradient(180deg,#e9d8c8 0 62%,#cda98d 62% 100%);position:relative;overflow:hidden;box-shadow:0 25px 70px rgba(67,47,37,.16)}.window{position:absolute;right:8%;top:12%;width:24%;height:36%;background:linear-gradient(#b9d8df,#e8f2ef);border:12px solid #f1e3d7;box-shadow:0 0 0 2px #bda998}.bed{position:absolute;left:7%;bottom:10%;width:45%;height:26%;background:#efe3da;border-radius:20px 20px 8px 8px;box-shadow:0 12px 25px rgba(70,46,35,.18)}.bed:before{content:'';position:absolute;left:3%;top:8%;width:28%;height:38%;border-radius:12px;background:#fffaf4}.desk{position:absolute;right:8%;bottom:12%;width:28%;height:8%;background:#856955}.desk:before,.desk:after{content:'';position:absolute;top:100%;width:8px;height:92px;background:#6c5546}.desk:before{left:8%}.desk:after{right:8%}.board{position:absolute;right:12%;top:54%;width:19%;height:15%;background:#c59f7d;border:6px solid #e7d2bd;transform:rotate(-1deg)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.btn{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px;text-align:left;cursor:pointer}.btn b{display:block;font-size:11px;margin-bottom:5px}.btn span{font:11px/1.35 Georgia,serif;color:var(--muted)}.btn.notebook{background:#f2f7f4;border-color:#cdded8}.btn.progress{background:#fff4ef;border-color:#efd0c5}@media(max-width:760px){.actions{grid-template-columns:1fr 1fr}.room{min-height:390px}h1{font-size:38px}.top{display:block}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">CHEZ MARION · VIE ÉTUDIANTE</div><h1>Ma chambre</h1><div class="sub" id="where">Résidence étudiante</div></div></div><section class="room" aria-label="Chambre étudiante"><div class="window"></div><div class="bed"></div><div class="desk"></div><div class="board"></div></section><section class="actions"><button class="btn" id="schedule"><b>EMPLOI DU TEMPS</b><span>Voir les cours et les prochains rendus.</span></button><button class="btn notebook" id="notebook"><b>MON CARNET DE RECHERCHE</b><span>Garder idées, essais, observations, retours et découvertes.</span></button><button class="btn progress" id="progress"><b>MON DOSSIER SCOLAIRE</b><span>Notes, grilles, mémoire des profs, projets et portfolio.</span></button><button class="btn" id="work"><b>TRAVAILLER</b><span>Reprendre un exercice ou préparer un projet.</span></button><button class="btn" id="school"><b>ALLER À L’ÉCOLE</b><span>Rejoindre le campus et les ateliers.</span></button><button class="btn" id="city"><b>SORTIR</b><span>Explorer la ville et faire des découvertes.</span></button></section></main><script>(function(){const K='haute-couture-current-screen';localStorage.setItem(K,'school-home');let s=null,h=null;try{s=JSON.parse(localStorage.getItem('haute-couture-school-choice-v1')||'null');h=JSON.parse(localStorage.getItem('haute-couture-school-housing-v1')||'null')}catch(_){}document.getElementById('where').textContent=(h?.type==='colocation'?'Colocation étudiante':'Résidence étudiante')+(s?` · ${s.name} · ${s.city}`:'');document.getElementById('school').onclick=()=>location.href='../school/';document.getElementById('city').onclick=()=>location.href='../ville/';document.getElementById('schedule').onclick=()=>location.href='../agenda/';document.getElementById('work').onclick=()=>location.href='../atelier/';document.getElementById('notebook').onclick=()=>location.href='../school-research-notebook/';document.getElementById('progress').onclick=()=>location.href='../school-progress/';})();</script><script src="../game-engine.js?v=20260904-marion-schoolhome2" defer></script><script src="../school/school-learning-memory-v1.js?v=20260904-memory1" defer></script><script src="../server-save-bridge-v1.js?v=20260903-schoolhome1" defer></script><script src="../global-menu-v1.js?v=20260903-schoolhome1" defer></script></body></html>
