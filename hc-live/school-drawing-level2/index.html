<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Haute Couture Live — Dessin niveau 2</title><style>:root{--ink:#251e1a;--muted:#75665d;--line:#ddd0c5;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:#efe5dc;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 16px 70px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}h1{font:42px/1 Georgia,serif;margin:9px 0}.lead{font:13px/1.55 Georgia,serif;color:var(--muted);max-width:820px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:18px}.panel,.paper{background:var(--paper);border:1px solid var(--line);border-radius:20px}.panel{padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:#fff}.step b{font-size:11px}.step p{font:11px/1.4 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.85}.paper{padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar button,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:800}.canvasWrap{position:relative;width:100%;aspect-ratio:4/5;background:white;border:1px solid #e7ddd5;border-radius:12px;overflow:hidden;touch-action:none}.guide,.draw{position:absolute;inset:0;width:100%;height:100%}.guide{pointer-events:none}.draw{touch-action:none}.task{margin-top:12px;padding:14px;border-radius:14px;background:#edf4f2;font:13px/1.55 Georgia,serif}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.actions .dark{background:#29211d}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · DESSIN AU STYLET · NIVEAU 2</div><h1>Construire une silhouette vivante</h1><p class="lead">Progression inspirée des objectifs d’illustration de mode : proportions, attitudes, mouvement, médiums et rendu du vêtement. Ici, on travaille surtout la structure et le geste avant le style personnel.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="paper"><div class="toolbar"><select id="width"><option value="2">Fin</option><option value="4" selected>Moyen</option><option value="7">Épais</option></select><button id="undo">ANNULER</button><button id="clear">EFFACER</button><button id="guideBtn">GUIDE</button></div><div class="canvasWrap"><canvas id="guide" class="guide"></canvas><canvas id="draw" class="draw"></canvas></div><div class="task" id="task"></div><div class="actions"><button id="save">ENREGISTRER</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="saved" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-drawing-level2-v1';const steps=[{id:'block',title:'01 · Bloc tête / thorax / bassin',desc:'Simplifier avant de détailler.',task:'Dessine 8 figures avec seulement tête, cage thoracique, bassin et ligne d’action. Cherche la direction et l’équilibre, pas l’anatomie détaillée.',guide:'blocks'},{id:'contrapposto',title:'02 · Appui et contrapposto',desc:'Faire sentir le poids du corps.',task:'Dessine 6 poses avec une jambe porteuse claire. Incline légèrement bassin et épaules en sens opposés.',guide:'pose'},{id:'motion',title:'03 · Mouvement',desc:'Marche, torsion, élan.',task:'Fais 10 croquis de 60 secondes : marche, demi-tour, bras levé, torsion, pas croisé. Une ligne d’action forte d’abord.',guide:'axis'},{id:'garment',title:'04 · Vêtement sur le corps',desc:'Le vêtement réagit à la pose.',task:'Sur 4 poses, ajoute un vêtement ample. Observe où il s’accroche au corps et où il tombe librement.',guide:'figure'},{id:'folds',title:'05 · Plis de tension et plis de chute',desc:'Différencier traction et gravité.',task:'Dessine 3 manches pliées puis 3 jupes longues. Sur les manches, cherche les plis de tension ; sur les jupes, les plis de chute.',guide:'figure'},{id:'texture',title:'06 · Rendre une matière',desc:'Même silhouette, trois comportements.',task:'Dessine la même robe trois fois : tissu léger, tissu raide, tissu lourd. Ne change pas le modèle, seulement le comportement graphique.',guide:'figure'}];let current=0,strokes=[],stroke=null,guideOn=true;const draw=document.getElementById('draw'),guide=document.getElementById('guide'),ctx=draw.getContext('2d'),g=guide.getContext('2d');function resize(){for(const c of [draw,guide]){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0)}redraw()}new ResizeObserver(resize).observe(draw.parentElement);function p(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}draw.onpointerdown=e=>{e.preventDefault();stroke=[p(e)];strokes.push(stroke)};draw.onpointermove=e=>{if(!stroke)return;e.preventDefault();stroke.push(p(e));redraw()};draw.onpointerup=draw.onpointercancel=()=>stroke=null;function redraw(){const r=draw.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#2c2622';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Number(document.getElementById('width').value)||4;for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}drawGuide()}function drawGuide(){const r=guide.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);if(!guideOn)return;g.strokeStyle='rgba(86,120,115,.22)';g.setLineDash([6,6]);g.lineWidth=1.5;const cx=r.width/2;g.beginPath();g.moveTo(cx,30);g.lineTo(cx,r.height-30);g.stroke();[.12,.27,.43,.56,.74,.92].forEach(v=>{g.beginPath();g.moveTo(cx-70,r.height*v);g.lineTo(cx+70,r.height*v);g.stroke()});g.setLineDash([]);g.beginPath();g.ellipse(cx,r.height*.08,22,28,0,0,Math.PI*2);g.stroke()}function render(){stepsEl.innerHTML=steps.map((s,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${s.title}</b><p>${s.desc}</p></div>`).join('');task.innerHTML='<b>EXERCICE</b><br>'+steps[current].task;document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{current=Number(el.dataset.i);strokes=[];render();redraw()})}const stepsEl=document.getElementById('steps'),task=document.getElementById('task');undo.onclick=()=>{strokes.pop();redraw()};clear.onclick=()=>{strokes=[];redraw()};guideBtn.onclick=()=>{guideOn=!guideOn;drawGuide()};save.onclick=()=>{let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}data[steps[current].id]={savedAt:new Date().toISOString(),image:draw.toDataURL('image/png'),strokeCount:strokes.length};localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saved').textContent='Exercice enregistré.';if(window.HCKnowledge)HCKnowledge.practice('drawing:'+steps[current].id,{source:'school',label:steps[current].title})};render();resize()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
