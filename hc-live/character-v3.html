<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crée ton personnage</title><style>:root{--c:#ed7059;--bg:#fbf7f1;--l:#ead9cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#111}.p{padding:16px 24px 110px;min-height:100vh}.top{display:flex;justify-content:space-between}.logo{font-weight:900;letter-spacing:.25em}.logo small{display:block;color:var(--c);font-size:10px}.save{border:1px solid #e7a78f;background:#fff;border-radius:999px;padding:10px 16px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(360px,.75fr);gap:24px;max-width:1700px;margin:auto}.pill{display:inline-block;border:1px solid #e8a18b;border-radius:999px;padding:5px 12px;font-size:10px;font-weight:800;margin-top:8px}.hero{display:flex;align-items:end;gap:10px}.hero b{font-size:clamp(44px,4vw,64px);line-height:.9}.hero em{font:italic clamp(48px,4.2vw,68px)/.9 Georgia;color:var(--c)}.intro{font-size:13px}.ink{display:inline-block;background:#111;color:#fff;padding:8px 15px;font-size:12px;font-weight:900}.stage h2{font:400 27px Georgia;margin:8px 0 2px}.sub{font-size:11px;color:#90766a;margin-bottom:8px}.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.look,.pv,.fa{position:relative;overflow:hidden;background:white;border:1px solid var(--l)}.look{height:min(31vh,300px);border-radius:16px}.look.sel{border:2px solid var(--c)}.look.sel:after{content:'✓';position:absolute;right:8px;top:8px;background:var(--c);color:white;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;z-index:3}.crop{position:absolute;inset:0;overflow:hidden}.crop img{position:absolute;width:600%;height:200%;max-width:none;display:block}.book{background:#fffdfa;border-radius:20px;box-shadow:0 12px 30px #6a46331f;padding:16px;min-height:650px;display:flex;flex-direction:column}.pv{width:min(100%,260px);aspect-ratio:116.7/198.5;border-radius:12px;margin:0 auto 12px}.lab{align-self:center;background:#111;color:white;padding:7px 15px;font-weight:900;font-size:11px}.ready{text-align:center;color:#ad7d5c;font:italic 30px Georgia;margin:12px}.facts{display:grid;gap:7px}.fact{border:1px solid #eadfd6;border-radius:10px;padding:8px}.fact b{display:block;font-size:8px}.fact span{font:13px Georgia}.nav{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:auto}.nav button{border:0;padding:12px;font-weight:900}.next{background:#111;color:white}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:820px}.choice{border:1px solid #e4d5ca;background:#fff;border-radius:14px;padding:12px;text-align:left}.choice.sel{border-color:var(--c);background:#fff0e9}.choice b{display:block;font:18px Georgia}.choice small{color:#7c6f68}.impact{display:inline-block;margin-top:7px;background:#f2e7df;border-radius:999px;padding:4px 8px;font-size:9px}.name{width:min(650px,100%);border:0;border-bottom:2px solid #d69f89;background:transparent;font:40px Georgia;padding:10px 0;outline:0}.final{display:grid;grid-template-columns:220px 1fr;gap:16px}.fa{aspect-ratio:116.7/198.5;border-radius:16px}.box{background:white;border:1px solid var(--l);border-radius:16px;padding:15px}.steps{position:fixed;left:3%;right:3%;bottom:8px;height:80px;border:1px solid #e4d5c9;background:#fffdfaf8;border-radius:26px;display:grid;grid-template-columns:repeat(7,1fr);z-index:20}.step{display:grid;place-items:center;text-align:center;font-size:9px}.step i{font-style:normal;width:34px;height:34px;border:1px solid #e5d8ce;border-radius:50%;display:grid;place-items:center;font-size:17px}.step.on{color:var(--c)}@media(max-width:820px){.p{padding:14px 12px 100px}.grid{display:block}.hero{display:block}.hero b{font-size:48px}.hero em{display:block;font-size:52px}.looks{grid-template-columns:repeat(3,1fr)}.look{height:190px}.book{margin-top:22px}.choices{grid-template-columns:1fr}.final{grid-template-columns:1fr}.fa{width:min(78vw,300px);margin:auto}.step{font-size:6px}.step i{width:32px;height:32px}}@media(min-width:821px) and (max-width:1180px){.looks{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 350px}}</style></head><body><div class="p"><div class="top"><div class="logo">HAUTE<br>COUTURE<small>✦ LIVE ✦</small></div><button class="save" id="save">♡ REPRENDRE PLUS TARD</button></div><div class="grid"><main><div class="pill" id="pill">ÉTAPE 1 / 7</div><div class="hero"><b>CRÉE TON</b><em>personnage</em></div><p class="intro">Choisis le look qui te ressemble le plus.<br>Tu pourras tout personnaliser ensuite !</p><div class="stage" id="stage"></div></main><aside><div class="book"><div class="pv" id="pv"></div><div class="lab">TON APERÇU</div><div class="ready">Prête à<br>briller ! ♡</div><div class="facts"><div class="fact"><b>PRÉNOM</b><span id="fn">À choisir</span></div><div class="fact"><b>TEMPÉRAMENT</b><span id="ft">À choisir</span></div><div class="fact"><b>COMPÉTENCE</b><span id="fs">À choisir</span></div><div class="fact"><b>CONNAISSANCE</b><span id="fk">À choisir</span></div><div class="fact"><b>OBJECTIF</b><span id="fg">À choisir</span></div></div><div class="nav"><button id="back">RETOUR</button><button class="next" id="next">CONTINUER →</button></div></div></aside></div></div><div class="steps" id="steps"></div><script>const S='./character-assets/looks-official.webp?v=20260822-v3';const M=[['◉','APPARENCE'],['▣','PRÉNOM'],['♥','TEMPÉRAMENT'],['✂','COMPÉTENCE'],['▱','CONNAISSANCE'],['☆','OBJECTIF'],['◇','RÉSUMÉ']];const G={temperament:[['Solaire','Spontanée et lumineuse','+2 relationnel · +1 confiance'],['Élégante','Raffinée et précise','+2 réputation · +1 précision'],['Audacieuse','Tu assumes les choix forts','+2 audace · +1 créativité'],['Créative','Tu transformes une idée en univers','+2 créativité · +1 inspiration'],['Déterminée','Tu avances avec méthode','+2 discipline · +1 résistance'],['Intuitive','Tu suis ton instinct','+2 intuition · +1 adaptation']],skill:[['Croquis','Imaginer vite une silhouette','+2 croquis'],['Couture','Assembler et retoucher','+2 couture'],['Couleurs','Composer des palettes','+2 couleurs'],['Styling','Raconter une allure','+2 styling'],['Patronage','Construire les volumes','+2 patronage'],['Réseau','Créer des opportunités','+2 réseau']],knowledge:[['Tissus','Reconnaître les matières','bonus matières'],['Moodboards','Construire une direction visuelle','bonus inspiration'],['Retouches','Ajuster une pièce','bonus atelier'],['Imprimés','Associer motifs et couleurs','bonus composition'],['Vintage','Transformer l’existant','bonus upcycling'],['Image de marque','Comprendre une identité visuelle','bonus branding']],goal:[['Haute couture','Maîtriser les finitions','progression couture'],['Direction artistique','Créer une image reconnaissable','progression DA'],['Patronage avancé','Renforcer ta technique','progression patronage'],['Production','Comprendre fabrication et délais','progression production'],['Business','Construire une activité viable','progression business'],['Réseau mode','Multiplier les collaborations','progression réseau']]};let st={step:0,look:0,name:'',temperament:'',skill:'',knowledge:'',goal:''};try{Object.assign(st,JSON.parse(localStorage.getItem('haute-couture-character-builder')||'{}'))}catch(e){}st.step=0;function crop(i){let c=i%6,r=Math.floor(i/6);return `<div class="crop"><img src="${S}" style="left:-${c*100}%;top:-${r*100}%"></div>`}function sv(){localStorage.setItem('haute-couture-character-builder',JSON.stringify(st))}function ok(){return st.step==1?st.name.trim().length>1:st.step==2?!!st.temperament:st.step==3?!!st.skill:st.step==4?!!st.knowledge:st.step==5?!!st.goal:true}function sync(){fn.textContent=st.name||'À choisir';ft.textContent=st.temperament||'À choisir';fs.textContent=st.skill||'À choisir';fk.textContent=st.knowledge||'À choisir';fg.textContent=st.goal||'À choisir';pv.innerHTML=crop(st.look)}function rs(){steps.innerHTML=M.map((m,i)=>`<div class="step ${i==st.step?'on':''}" data-i="${i}"><i>${m[0]}</i><b>${i+1}. ${m[1]}</b></div>`).join('');steps.querySelectorAll('.step').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(i<=st.step||i==0){st.step=i;r()}})}function appearance(){stage.innerHTML=`<div class="ink">1. CHOISIS TON APPARENCE</div><h2>Quel look te ressemble ?</h2><div class="sub">12 silhouettes, 12 énergies différentes.</div><div class="looks">${Array.from({length:12},(_,i)=>`<button class="look ${i==st.look?'sel':''}" data-i="${i}">${crop(i)}</button>`).join('')}</div>`;stage.querySelectorAll('.look').forEach(x=>x.onclick=()=>{st.look=+x.dataset.i;sv();r()})}function name(){stage.innerHTML=`<div class="ink">2. DONNE-LUI UN PRÉNOM</div><h2>Comment s’appelle-t-elle ?</h2><input class="name" id="ni" value="${st.name.replace(/"/g,'&quot;')}" placeholder="Son prénom…">`;ni.oninput=()=>{st.name=ni.value;sv();sync();next.disabled=!ok()}}function choice(k,n,t){stage.innerHTML=`<div class="ink">${n}. ${t}</div><h2>Fais ton choix</h2><div class="sub">Ce choix aura des conséquences dans ta carrière.</div><div class="choices">${G[k].map(a=>`<button class="choice ${st[k]==a[0]?'sel':''}" data-v="${a[0]}"><b>${a[0]}</b><small>${a[1]}</small><span class="impact">${a[2]}</span></button>`).join('')}</div>`;stage.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{st[k]=x.dataset.v;sv();r()})}function final(){stage.innerHTML=`<div class="ink">7. TON PROFIL FINAL</div><h2>Voilà ton personnage ♡</h2><div class="final"><div class="fa">${crop(st.look)}</div><div class="box"><h2>${st.name}</h2><p><b>Tempérament :</b> ${st.temperament}</p><p><b>Compétence :</b> ${st.skill}</p><p><b>Connaissance :</b> ${st.knowledge}</p><p><b>Objectif :</b> ${st.goal}</p></div></div>`}function r(){pill.textContent=`ÉTAPE ${st.step+1} / 7`;if(st.step==0)appearance();if(st.step==1)name();if(st.step==2)choice('temperament',3,'CHOISIS SON TEMPÉRAMENT');if(st.step==3)choice('skill',4,'CHOISIS SA COMPÉTENCE');if(st.step==4)choice('knowledge',5,'CHOISIS SA CONNAISSANCE');if(st.step==5)choice('goal',6,'CHOISIS SON OBJECTIF');if(st.step==6)final();sync();rs();back.disabled=st.step==0;next.disabled=!ok();next.textContent=st.step==6?'COMMENCER MA CARRIÈRE →':'CONTINUER →'}back.onclick=()=>{if(st.step){st.step--;r()}};next.onclick=()=>{if(!ok())return;if(st.step<6){st.step++;sv();r()}else{let gameplay={version:1,goal:st.goal,flags:['temperament_'+st.temperament,'skill_'+st.skill,'knowledge_'+st.knowledge,'goal_'+st.goal],createdAt:new Date().toISOString()};localStorage.setItem('haute-couture-custom-character',JSON.stringify({...st,gameplay}));localStorage.setItem('haute-couture-player-build',JSON.stringify(gameplay));localStorage.setItem('haute-couture-character','custom');localStorage.setItem('haute-couture-current-screen','location');location.href='./?characterDone=1'}};save.onclick=()=>{sv();location.href='./'};r();</script></body></html>
