<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Collections & Archives</title><style>:root{--bg:#eee4da;--paper:#fffaf5;--ink:#251e1a;--muted:#78685e;--line:#decfc3;--wine:#7d414c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(rgba(35,25,21,.32),rgba(35,25,21,.32)),url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&fm=jpg&q=86&w=2200') center/cover fixed;color:var(--ink);font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:28px}.paper{max-width:1240px;margin:auto;background:rgba(255,250,245,.965);border:1px solid rgba(255,255,255,.55);border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(32,21,17,.24)}.top{display:flex;justify-content:space-between;gap:20px}.ey{font:900 9px Arial;letter-spacing:.17em;color:var(--wine)}h1{font:46px/1 Georgia,serif;margin:7px 0}.sub{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:700px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:800 9px Arial;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:24px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.num{font:35px Georgia,serif}.label{font:900 9px Arial;letter-spacing:.08em;color:var(--wine);margin-top:4px}.note{font:11px/1.45 Georgia,serif;color:var(--muted);margin-top:7px}.detail{margin-top:20px;display:grid;grid-template-columns:260px 1fr;gap:14px}.cats,.items{background:white;border:1px solid var(--line);border-radius:20px;padding:14px}.cat{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:12px;font:800 10px Arial;cursor:pointer}.cat.active,.cat:hover{background:#f4ebe4}.item{padding:13px 6px;border-bottom:1px solid #eee4dc}.item:last-child{border-bottom:0}.item h3{font:19px Georgia,serif;margin:0 0 4px}.item p{font:11px Georgia,serif;color:var(--muted);margin:0}.empty{font:italic 16px Georgia,serif;color:var(--muted);padding:20px}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.wrap{padding:12px}.paper{padding:18px}}@media(max-width:600px){.stats{grid-template-columns:1fr}h1{font-size:36px}}</style></head><body><main class="wrap"><section class="paper"><div class="top"><div><div class="ey">MÉMOIRE DE TA PARTIE</div><h1>Collections & Archives</h1><div class="sub">Ce que tu as réellement découvert, appris, visité, rencontré ou créé. Les totaux n’apparaissent que lorsqu’un catalogue est suffisamment défini pour être fiable.</div></div><button class="btn" onclick="history.back()">RETOUR</button></div><div class="stats" id="stats"></div><div class="detail"><aside class="cats" id="cats"></aside><section class="items" id="items"></section></div></section></main><script src="../game-engine.js"></script><script src="collection-engine-v1.js?v=20260908-archives1"></script><script>(function(){let current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const api=window.HCCollectionArchiveV1;if(!api)return setTimeout(render,80);api.scan();const s=api.state(),stats=api.allStats();if(!current&&stats[0])current=stats[0].category;document.getElementById('stats').innerHTML=stats.map(x=>`<div class="stat"><div class="num">${x.discovered}${x.total!=null?' / '+x.total:''}</div><div class="label">${esc(x.label)}</div><div class="note">${x.total==null?'Éléments découverts jusqu’ici. Le total reste ouvert.':'Catalogue actuellement référencé.'}</div></div>`).join('');document.getElementById('cats').innerHTML=stats.map(x=>`<button class="cat ${x.category===current?'active':''}" data-cat="${esc(x.category)}">${esc(x.label)} · ${x.discovered}${x.total!=null?'/'+x.total:''}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;render()});const c=s.categories[current],arr=Object.values(c?.items||{}).sort((a,b)=>String(b.discoveredAt||'').localeCompare(String(a.discoveredAt||'')));document.getElementById('items').innerHTML=arr.length?arr.map(x=>`<article class="item"><h3>${esc(x.title||x.name||x.id)}</h3><p>${esc(x.source||x.subtitle||'Découvert dans ta partie')}${x.state==='used'?' · utilisé':x.state==='familiar'?' · bien connu':''}</p></article>`).join(''):'<div class="empty">Rien n’a encore été découvert dans cette collection.</div>'}window.addEventListener('hc-collection-discovery',render);render()})();</script></body></html>
