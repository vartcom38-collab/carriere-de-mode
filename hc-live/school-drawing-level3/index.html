<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Haute Couture Live — Dessin niveau 3</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:#efe5dc;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 16px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}h1{font:42px/1 Georgia,serif;margin:9px 0}.lead{font:13px/1.55 Georgia,serif;color:var(--muted);max-width:820px}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:18px}.panel,.paper{background:var(--paper);border:1px solid var(--line);border-radius:20px}.panel{padding:15px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:white}.step b{font-size:11px}.step p{font:11px/1.45 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.82}.paper{padding:14px}.theory{background:#edf4f2;border-radius:14px;padding:14px;font:13px/1.55 Georgia,serif;margin-bottom:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar button,.toolbar select{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 11px;font-weight:800}.canvasWrap{position:relative;aspect-ratio:4/5;background:white;border:1px solid #e7ddd5;border-radius:12px;overflow:hidden;touch-action:none}.guide,.draw{position:absolute;inset:0;width:100%;height:100%}.guide{pointer-events:none}.task{margin-top:12px;padding:14px;border-radius:14px;background:#f4ece6;font:13px/1.55 Georgia,serif}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.actions .dark{background:#29211d}@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{order:2}.paper{order:1}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · DESSIN AU STYLET · NIVEAU 3</div><h1>Du corps au vêtement vivant</h1><p class="lead">Après l’axe, les proportions et les masses, on travaille les zones qui rendent une silhouette crédible : tête simplifiée, mains, pieds, posture, plis et détails de vêtement.</p><div class="layout"><aside class="panel" id="steps"></aside><section class="paper"><div class="theory" id="theory"></div><div class="toolbar"><select id="width"><option value="2">Fin</option><option value="4" selected>Moyen</option><option value="7">Épais</option></select><button id="undo">ANNULER</button><button id="clear">EFFACER</button><button id="guideBtn">GUIDE</button></div><div class="canvasWrap"><canvas id="guide" class="guide"></canvas><canvas id="draw" class="draw"></canvas></div><div class="task" id="task"></div><div class="actions"><button id="save">ENREGISTRER</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-drawing-level3-v1';const steps=[{id:'head',title:'01 · Tête simplifiée',desc:'Volume, axe, placement.',theory:'La tête sert de repère de proportion. Commence par un volume simple, place l’axe vertical selon l’orientation puis la ligne des yeux. Évite de dessiner les détails avant la structure.',task:'Dessine 8 têtes simplifiées : face, profil, trois-quarts, inclinée. Seulement volume, axe, yeux, nez et mâchoire.',guide:'head'},{id:'hands',title:'02 · Mains comme masses',desc:'Paume + direction des doigts.',theory:'Une main lisible peut commencer par une forme de paume et une direction générale des doigts. N’essaie pas de dessiner cinq doigts détaillés immédiatement.',task:'Dessine 12 mains en moins de 2 minutes chacune : ouvertes, fermées, posées sur une hanche, tenant un objet.',guide:'hands'},{id:'feet',title:'03 · Pieds & appuis',desc:'Le pied confirme l’équilibre.',theory:'Le pied indique le contact au sol. Sa direction doit être cohérente avec le genou et l’appui. Un pied mal orienté peut rendre toute la pose instable.',task:'Dessine 8 paires de pieds simplifiés. Indique la jambe porteuse et garde la direction genou-pied cohérente.',guide:'feet'},{id:'folds',title:'04 · Plis de tension',desc:'Comprendre d’où part le pli.',theory:'Les plis apparaissent parce qu’une matière est tirée, comprimée, suspendue ou poussée. Cherche d’abord le point de tension ou d’appui avant de tracer les plis.',task:'Dessine un haut simple sur 4 poses. Place un point de tension différent : épaule, coude, taille, poignet. Fais partir les plis de ce point.',guide:'figure'},{id:'details',title:'05 · Détails utiles',desc:'Col, poche, bouton, revers.',theory:'Les détails servent la construction et l’intention. Dessine-les après avoir stabilisé silhouette, volume et lignes principales.',task:'Dessine une même veste 4 fois en changeant seulement le col, les poches et la fermeture. Compare l’effet sur le caractère de la silhouette.',guide:'figure'},{id:'final',title:'06 · Illustration complète',desc:'Hiérarchie du dessin.',theory:'Une illustration complète se construit par couches : geste, corps, vêtement, détails, matière. N’inverse pas cet ordre.',task:'Réalise une silhouette complète : ligne d’action → masses → vêtement → plis → 3 détails maximum → indication de matière.',guide:'figure'}];let current=0,strokes=[],stroke=null,guideOn=true;const draw=document.getElementById('draw'),guide=document.getElementById('guide'),ctx=draw.getContext('2d'),g=guide.getContext('2d');function pt(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function resize(){for(const c of [draw,guide]){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.getContext('2d').setTransform(d,0,0,d,0,0)}redraw()}new ResizeObserver(resize).observe(draw.parentElement);draw.onpointerdown=e=>{e.preventDefault();stroke=[pt(e)];strokes.push(stroke)};draw.onpointermove=e=>{if(!stroke)return;e.preventDefault();stroke.push(pt(e));redraw()};draw.onpointerup=draw.onpointercancel=()=>stroke=null;function redraw(){const r=draw.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.strokeStyle='#2b2521';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Number(document.getElementById('width').value)||4;for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}drawGuide()}function drawGuide(){const r=guide.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);if(!guideOn)return;g.strokeStyle='rgba(77,141,134,.23)';g.lineWidth=1.4;g.setLineDash([6,6]);const cx=r.width/2;if(steps[current].guide==='head'){g.beginPath();g.ellipse(cx,r.height*.25,70,90,0,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(cx,r.height*.12);g.lineTo(cx,r.height*.38);g.stroke();g.beginPath();g.moveTo(cx-70,r.height*.25);g.lineTo(cx+70,r.height*.25);g.stroke()}else{g.beginPath();g.moveTo(cx,30);g.lineTo(cx,r.height-30);g.stroke();[.1,.22,.36,.5,.7,.9].forEach(v=>{g.beginPath();g.moveTo(cx-70,r.height*v);g.lineTo(cx+70,r.height*v);g.stroke()})}}function render(){document.getElementById('steps').innerHTML=steps.map((s,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${s.title}</b><p>${s.desc}</p></div>`).join('');document.getElementById('theory').innerHTML='<b>À COMPRENDRE</b><br>'+steps[current].theory;document.getElementById('task').innerHTML='<b>EXERCICE</b><br>'+steps[current].task;document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{current=Number(x.dataset.i);strokes=[];render();redraw()})}document.getElementById('undo').onclick=()=>{strokes.pop();redraw()};document.getElementById('clear').onclick=()=>{strokes=[];redraw()};document.getElementById('guideBtn').onclick=()=>{guideOn=!guideOn;drawGuide()};document.getElementById('save').onclick=()=>{let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}d[steps[current].id]={savedAt:new Date().toISOString(),image:draw.toDataURL('image/png'),strokes:strokes.length};localStorage.setItem(KEY,JSON.stringify(d));document.getElementById('msg').textContent='Exercice enregistré.';if(window.HCKnowledge)HCKnowledge.practice('drawing:'+steps[current].id,{source:'school',label:steps[current].title})};render();resize()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
