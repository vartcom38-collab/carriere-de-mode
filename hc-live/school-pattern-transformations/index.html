<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Transformations de jupe</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f9f4ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:8px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:820px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:white}.step b{font-size:11px}.step p{font:11px/1.45 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.82}.theory{padding:14px;border-radius:14px;background:#edf4f2;font:13px/1.55 Georgia,serif}.task{margin-top:12px;padding:14px;border-radius:14px;background:#f4ece6;font:13px/1.55 Georgia,serif}.work textarea{width:100%;min-height:150px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.actions .dark{background:#29211d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · MODÉLISME · TRANSFORMATIONS</div><h1>Transformer une jupe droite</h1><p class="lead">Le but n’est pas d’accumuler des recettes. On apprend à comprendre ce qui change dans le patron quand on déplace une pince, ajoute de l’ampleur, ouvre une ligne ou transforme une base.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="work"><div class="theory" id="theory"></div><div class="task" id="task"></div><textarea id="notes" placeholder="Tes calculs, décisions, observations, erreurs et corrections…"></textarea><div class="actions"><button id="save">ENREGISTRER</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-pattern-transformations-v1';const steps=[{id:'dart',title:'01 · Déplacer une pince',desc:'Même volume, autre emplacement.',theory:'Une pince contrôle un excès de matière nécessaire pour passer d’une surface plane à un volume. La déplacer ne supprime pas ce volume : on ferme une zone et on ouvre ailleurs autour du même point de pivot.',task:'Sur une copie de ta base jupe, choisis une pince. Imagine son pivot, ferme visuellement l’ancienne pince et ouvre une nouvelle ligne vers le côté. Note ce qui doit rester inchangé.'},{id:'flare',title:'02 · Ajouter de l’ampleur',desc:'Évaser sans perdre la taille.',theory:'Pour créer une jupe plus évasée, l’ampleur est ajoutée sous la taille. On peut ouvrir des lignes depuis l’ourlet vers la taille, puis répartir l’ouverture. Plus l’ouverture est grande, plus le volume augmente.',task:'Propose trois versions : légèrement évasée, trapèze, très ample. Pour chacune, indique où tu ouvrirais le patron et pourquoi.'},{id:'panel',title:'03 · Découpes',desc:'Transformer une construction en lignes de style.',theory:'Une découpe peut suivre ou absorber une pince. Elle devient alors à la fois une ligne esthétique et une solution de construction. Chaque nouvelle pièce doit conserver des repères de montage cohérents.',task:'Transforme mentalement la jupe en 4 panneaux. Décide quelles pinces peuvent être intégrées dans les découpes et quels crans seraient indispensables.'},{id:'pleat',title:'04 · Pli',desc:'Ajouter du volume contrôlé.',theory:'Un pli ajoute une quantité de matière qui sera repliée ou couchée. Il faut distinguer la ligne visible, la profondeur du pli et la place réelle ajoutée au patron.',task:'Imagine un pli creux au milieu devant. Note la différence entre largeur visible et profondeur nécessaire dans le patron.'},{id:'waist',title:'05 · Ceinture',desc:'Finir le haut de la jupe.',theory:'La ceinture doit correspondre à la longueur de taille finie, tenir compte des valeurs de couture et du système de fermeture. Sa construction influence confort, maintien et finition intérieure.',task:'Liste les informations indispensables avant de dessiner une pièce de ceinture : longueur finie, largeur, entoilage éventuel, fermeture, valeurs de couture.'},{id:'bodice',title:'06 · Vers le corsage',desc:'Préparer la prochaine base.',theory:'Le corsage demande davantage de mesures et de contrôle volumique que la jupe : poitrine, carrure, hauteur de poitrine, encolure, emmanchure et position des pinces. La logique reste la même : traduire un corps 3D en surfaces 2D contrôlées.',task:'Prépare une fiche de mesures nécessaires à un corsage de base. N’invente pas de valeurs : note seulement les mesures à relever.'}];let current=0;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}function render(){const d=read();document.getElementById('steps').innerHTML=steps.map((s,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${s.title}</b><p>${s.desc}</p></div>`).join('');document.getElementById('theory').innerHTML='<b>À COMPRENDRE</b><br>'+steps[current].theory;document.getElementById('task').innerHTML='<b>EXERCICE</b><br>'+steps[current].task;document.getElementById('notes').value=d[steps[current].id]?.notes||'';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{current=Number(x.dataset.i);render()})}document.getElementById('save').onclick=()=>{const d=read(),s=steps[current];d[s.id]={notes:document.getElementById('notes').value,savedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d));document.getElementById('msg').textContent='Travail enregistré.';if(window.HCKnowledge)HCKnowledge.practice('pattern:'+s.id,{source:'school',label:s.title})};render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
