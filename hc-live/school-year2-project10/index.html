<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 10</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:46px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:820px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:32px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:24px Georgia,serif;margin:0 0 8px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;margin-top:7px}textarea{min-height:125px;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · ANNÉE 2 · PROJET 10</div><h1 id="title">Projet long</h1><p class="lead" id="lead"></p><section class="hero"><h2>Règle de travail</h2><p>Tu n’as pas besoin de remplir tout en une seule session. Le dossier garde les traces de ton processus. Une piste abandonnée reste utile si tu peux expliquer ce qu’elle t’a appris.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year2-project10-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 10 — pièce construite, usage et identité',lead:'Développe une pièce construite où usage, essayage, construction et identité personnelle fonctionnent ensemble.'};else if(id==='ifm-paris')profile={title:'Projet 10 — interface matérielle et forme portée',lead:'Développe une proposition portée à partir d’une relation matérielle testée, comparée et documentée.'};else profile={title:'Projet 10 — système de surface traversé par la coupe',lead:'Fais évoluer ensemble langage visuel, découpe, volume et mouvement au lieu de traiter la surface comme un décor ajouté.'};const defs=[['brief','01 · BRIEF','Question, contexte, contraintes, critères de réussite et ce que tu refuses de faire.'],['sources','02 · ENQUÊTE','Tes sources, observations, terrain, archives ou références réellement utiles.'],['tests','03 · PREMIERS ESSAIS','Décris au moins trois essais et la variable testée dans chacun.'],['compare','04 · COMPARAISON','Qu’est-ce qui change entre les essais ? Qu’est-ce que tu peux réellement conclure ?'],['abandon','05 · PISTE ABANDONNÉE','Quelle piste as-tu abandonnée ? Pourquoi ? Qu’est-ce qu’elle t’a appris ?'],['direction','06 · DIRECTION RETENUE','Quelle direction poursuis-tu et quels critères ont guidé ce choix ?'],['material','07 · MATIÈRE / SUPPORT','Quelles matières ou supports déjà connus utilises-tu ? Pourquoi conviennent-ils au projet ?'],['prototype','08 · PROTOTYPE / TOILE','Décris la version de travail, les zones fragiles et ce que tu veux vérifier.'],['diagnosis','09 · DIAGNOSTIC','Décris les défauts, tensions, incohérences ou problèmes observés avant de proposer une correction.'],['corrections','10 · CORRECTIONS','Qu’as-tu modifié ? Quelle preuve t’a conduit à cette décision ?'],['final','11 · VERSION ACTUELLE','Décris la version finale ou la version la plus avancée à ce stade.'],['presentation','12 · PRÉSENTATION','Prépare en quelques phrases : question, méthode, essais, renoncement, correction clé et prochaine question.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('project-long-method',{source:'school-year2-project10'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
