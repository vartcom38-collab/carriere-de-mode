<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture Live — Premier jour de carrière</title><style>:root{--ink:#251d19;--muted:#78665d;--paper:#fffaf4;--rose:#b96863;--teal:#4c8f88;--line:#e5d5ca;--shadow:0 24px 70px rgba(61,39,29,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee3da;color:var(--ink)}body{font-family:Georgia,'Times New Roman',serif}.page{min-height:100vh;background:linear-gradient(90deg,rgba(245,236,227,.96),rgba(255,250,245,.87)),url('https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&fm=jpg&q=84&w=2200') center/cover;padding:5vh 5vw}.shell{max-width:1280px;margin:auto}.ey{font:900 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}h1{font:clamp(52px,7vw,92px)/.9 Georgia,serif;font-weight:400;letter-spacing:-.05em;margin:12px 0 16px;max-width:850px}.lead{font:18px/1.55 Georgia,serif;color:#5e5048;max-width:790px;margin:0 0 30px}.home{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}.pill{border:1px solid var(--line);border-radius:999px;background:rgba(255,250,244,.88);padding:9px 12px;font:800 9px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:rgba(255,250,244,.94);border-radius:22px;padding:23px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:var(--ink);min-height:205px;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#d9a6a0}.card.recommended{outline:2px solid rgba(76,143,136,.36)}.tag{font:900 9px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--rose)}.card h2{font:30px/1.05 Georgia,serif;font-weight:400;margin:8px 0}.card p{font:14px/1.55 Georgia,serif;color:var(--muted);margin:0}.why{margin-top:11px;font:italic 12px/1.45 Georgia,serif;color:#5a746f}.note{margin-top:23px;max-width:900px;border-left:3px solid var(--teal);padding:13px 16px;background:rgba(243,249,247,.8);font:13px/1.55 Georgia,serif;color:#5e6d68}@media(max-width:780px){.grid{grid-template-columns:1fr}.page{padding:35px 18px}h1{font-size:54px}}</style></head><body><main class="page"><div class="shell"><div class="ey">PARCOURS CARRIÈRE · PREMIER JOUR</div><h1 id="title">Tu es installée. Maintenant, la vie commence.</h1><p class="lead" id="lead"></p><div class="home" id="home"></div><section class="grid" id="grid"></section><div class="note">Aucune de ces actions n’est une mission obligatoire. Tu peux commencer par l’une, revenir en arrière, changer d’idée et laisser les opportunités apparaître par ce que tu fais.</div></div></main><script>(function(){const OPEN='haute-couture-career-opening-v1',HOME='haute-couture-home',SCREEN='haute-couture-current-screen',DAY='haute-couture-career-first-day-v1',TERR='haute-couture-current-territory-v1';const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}};const opening=read(OPEN)||{},homeSave=read(HOME)||{},home=homeSave.home||{},city=homeSave.city||home.city||'ta ville',intent=opening.intent||'explore';localStorage.setItem(SCREEN,'career-first-day');localStorage.setItem(TERR,JSON.stringify({city,source:'career-home',setAt:new Date().toISOString()}));document.getElementById('lead').textContent=`Tu as désormais un logement à ${city}. Le jeu ne te donne pas une première cliente par décret : ton réseau, ton travail, ton Book et les lieux que tu fréquentes vont commencer à fabriquer ton parcours.`;document.getElementById('home').innerHTML=`<span class="pill">${city}</span><span class="pill">${home.title||'Mon logement'}</span><span class="pill">Budget de départ sous surveillance</span>`;const data=[{id:'home',tag:'QUOTIDIEN',title:'Prendre possession de chez moi',text:'Poser mes affaires, regarder ce que j’ai réellement à disposition et faire de ce logement mon point d’ancrage.',why:'Un début plus calme, utile si tu veux d’abord installer ton quotidien.',href:'../chez-moi/',for:'explore'},{id:'city',tag:'TERRITOIRE',title:`Sortir découvrir ${city}`,text:'Marcher par la carte, découvrir quelques lieux sans que toute la ville soit déjà connue, et voir ce qui attire ton attention.',why:'Les rencontres et les opportunités peuvent venir des lieux que tu fréquentes.',href:'../ville/',for:'explore'},{id:'atelier',tag:'CRÉATION',title:'Ouvrir mon Atelier',text:'Commencer une recherche, reprendre une idée ou produire quelque chose pour toi avant même d’avoir une commande.',why:'Créer sans cliente peut déjà nourrir ton Book et ton identité.',href:'../atelier/',for:'craft'},{id:'work',tag:'TRAVAIL',title:'Regarder les premières pistes professionnelles',text:'Consulter des opportunités modestes, des demandes, des coups de main ou des missions qui correspondent à ce que tu peux réellement faire maintenant.',why:'Le besoin d’argent oriente ton attention, sans transformer tout le jeu en liste de missions.',href:'../carriere/opportunites.html',for:'income'}];const grid=document.getElementById('grid');grid.innerHTML=data.map(x=>`<button class="card ${x.for===intent?'recommended':''}" data-id="${x.id}"><div class="tag">${x.tag}${x.for===intent?' · RECOMMANDÉ PAR TON ÉTAT D’ESPRIT':''}</div><h2>${x.title}</h2><p>${x.text}</p><div class="why">${x.why}</div></button>`).join('');grid.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const x=data.find(v=>v.id===b.dataset.id),now=new Date().toISOString(),st=read(DAY)||{version:1,startedAt:now,history:[]};st.firstChoice=x.id;st.city=city;st.intent=intent;st.status='started';st.history=[...(st.history||[]),{type:'first-career-action',action:x.id,at:now}];localStorage.setItem(DAY,JSON.stringify(st));opening.status='active-career';opening.firstAction=x.id;opening.firstActionAt=now;localStorage.setItem(OPEN,JSON.stringify(opening));localStorage.setItem(SCREEN,x.id==='home'?'chez-moi':x.id==='city'?'ville':x.id==='atelier'?'atelier':'career-opportunities');location.href=x.href};})();</script><script src="../server-save-bridge-v1.js?v=20260908-careerday1" defer></script><script src="../global-menu-v1.js?v=20260908-careerday1" defer></script></body></html>
