<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Mes révisions</title><style>:root{--ink:#2a201b;--paper:rgba(255,249,243,.95);--muted:#76665e;--rose:#a85363;--line:rgba(88,61,49,.14);--green:#587166;--shadow:0 24px 65px rgba(42,27,21,.18)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}body{background:linear-gradient(rgba(37,26,21,.28),rgba(37,26,21,.18)),url('https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&fm=jpg&q=88&w=2400') center/cover fixed}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:rgba(48,34,28,.56);backdrop-filter:blur(18px);color:#fff;border-bottom:1px solid rgba(255,255,255,.14)}.brand{font:28px/1 Georgia,serif;letter-spacing:.08em}.brand small{font:9px Arial;letter-spacing:.24em;display:block;text-align:center;margin-top:4px}.nav{display:flex;gap:28px}.nav a{color:white;text-decoration:none;font:14px Georgia,serif;opacity:.84}.nav a.active{opacity:1;border-bottom:2px solid white;padding-bottom:8px}.self{font:11px Arial;letter-spacing:.12em;border:1px solid rgba(255,255,255,.35);padding:9px 13px;border-radius:999px}.hero{min-height:390px;display:flex;align-items:flex-end}.hero-in{width:min(1280px,92vw);margin:auto;padding:68px 0 72px;color:white;text-shadow:0 2px 18px rgba(0,0,0,.3)}.ey{font:800 10px Arial;letter-spacing:.16em;text-transform:uppercase;color:#f1c9c3}.hero h1{font:clamp(58px,7vw,94px)/.9 Georgia,serif;font-weight:400;margin:12px 0 16px;letter-spacing:-.04em}.hero p{font:17px/1.55 Georgia,serif;max-width:760px;color:rgba(255,255,255,.9)}.wrap{width:min(1280px,92vw);margin:-46px auto 0;padding-bottom:80px;position:relative;z-index:4}.intro-card{background:var(--paper);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:24px 26px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;cursor:pointer;font:800 10px Arial;letter-spacing:.06em;text-transform:uppercase}.tab.active{background:#2a211c;color:#fff}.list{display:grid;gap:18px;margin-top:18px}.card{background:var(--paper);border:1px solid rgba(255,255,255,.72);border-radius:26px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.head{display:flex;justify-content:space-between;gap:18px}.card h2{font:34px/1.03 Georgia,serif;font-weight:400;margin:7px 0}.meta{font:12px Arial;color:var(--muted)}.due{font:800 9px Arial;letter-spacing:.12em;text-transform:uppercase;color:white;background:var(--rose);border-radius:999px;padding:8px 10px;height:max-content}.teacher{margin:18px 0 0;padding:18px;border-radius:18px;background:rgba(238,226,216,.84);border-left:3px solid var(--rose)}.teacher .quote{font:italic 17px/1.55 Georgia,serif;color:#55463f}.criteria{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.criterion{background:rgba(255,250,245,.9);border:1px solid var(--line);border-radius:14px;padding:11px}.criterion b{display:block;font-size:14px}.criterion span{display:block;margin-top:5px;font:10px Arial;text-transform:uppercase;letter-spacing:.05em;color:var(--green)}.focus{margin-top:11px;font:13px/1.5 Georgia,serif;color:#624f46}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-top:18px}.box{padding:16px;border-radius:18px;background:rgba(244,234,225,.82);border:1px solid rgba(255,255,255,.6)}.box b{display:block;font:800 9px Arial;letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}.box ul{margin:0;padding-left:18px}.box li{margin:6px 0;line-height:1.45}.review{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.answer{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;text-align:left;cursor:pointer;font:13px/1.4 Georgia,serif}.answer.good{background:#edf5f1;border-color:#9db7ad}.answer.bad{background:#fff0ed;border-color:#d7a69f}.feedback{margin-top:10px;font-style:italic;color:#5d4e47}.empty{padding:42px;background:var(--paper);border:1px solid rgba(255,255,255,.72);border-radius:26px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}@media(max-width:900px){.criteria{grid-template-columns:1fr 1fr}.grid,.answers{grid-template-columns:1fr}.nav{display:none}}@media(max-width:620px){.topbar{height:62px}.brand{font-size:22px}.criteria{grid-template-columns:1fr}.hero{min-height:340px}}
</style></head><body><header class="topbar"><div class="brand">HAUTE COUTURE<small>LIVE</small></div><nav class="nav"><a href="../school-campus/">Mon école</a><a href="../school-day/">Ma journée</a><a class="active" href="../school-review/">Mes révisions</a><a href="../school-city/">La ville</a></nav><div class="self">MOI · ÉTUDIANTE</div></header><section class="hero"><div class="hero-in"><div class="ey">Carnet d’apprentissage</div><h1>Mes révisions</h1><p>Les cours ne disparaissent pas une fois terminés. Ici, tu retrouves les idées fortes, les remarques de tes professeurs et les notions qui doivent revenir plus tard.</p></div></section><main class="wrap"><section class="intro-card"><div class="ey" style="color:#a85363;margin-bottom:12px">Mon carnet</div><div class="tabs"><button class="tab active" data-filter="all">Toutes mes fiches</button><button class="tab" data-filter="due">À revoir maintenant</button><button class="tab" data-filter="mastered">Consolidées</button></div></section><section class="list" id="list"></section></main><script src="../school/after-course-review-v1.js"></script><script>(function(){const S='haute-couture-school-review-v1',Q='haute-couture-school-review-seq-v1',list=document.getElementById('list');let filter='all';const read=()=>{try{return JSON.parse(localStorage.getItem(S)||'[]')||[]}catch(_){return[]}},save=v=>localStorage.setItem(S,JSON.stringify(v)),seq=()=>Number(localStorage.getItem(Q)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function status(x){return x.status==='mastered'?'Consolidée':x.dueMarker<=seq()?'À revoir':'Fiche disponible'}function evalHTML(x){const e=x.evaluation;if(!e)return'';return `<section class="teacher"><div class="ey" style="color:#a85363">Retour du professeur</div><div class="quote">${esc(e.summary||'')}</div>${e.criteria?.length?`<div class="criteria">${e.criteria.map(c=>`<div class="criterion"><b>${esc(c.name)}</b><span>${esc(c.level)}</span></div>`).join('')}</div>`:''}${e.focus?.length?`<div class="focus"><b>Prochaine priorité :</b> ${esc(e.focus[0])}</div>`:''}</section>`}function render(){let data=read();if(filter==='due')data=data.filter(x=>x.status!=='mastered'&&x.dueMarker<=seq());if(filter==='mastered')data=data.filter(x=>x.status==='mastered');if(!data.length){list.innerHTML='<div class="empty">Aucune fiche dans cette section pour le moment. Les traces apparaîtront au fil de tes vrais cours.</div>';return}const all=read();list.innerHTML=data.slice().reverse().map(x=>{const idx=all.findIndex(v=>v.id===x.id&&v.completedMarker===x.completedMarker),due=x.status!=='mastered'&&x.dueMarker<=seq();return `<article class="card" data-i="${idx}"><div class="head"><div><div class="ey" style="color:#a85363">${esc(x.category)}</div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.teacher||'')} · ${status(x)}</div></div>${due?'<div class="due">Révision maintenant</div>':''}</div>${evalHTML(x)}<div class="grid"><div class="box"><b>À retenir</b><ul>${(x.remember||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="box"><b>Exemples</b><ul>${(x.examples||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="box"><b>À retravailler</b><ul>${(x.errors||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div></div>${due&&x.review?`<div class="review"><b>${esc(x.review.q)}</b><div class="answers">${x.review.a.map((a,i)=>`<button class="answer" data-answer="${idx}:${i}">${esc(a)}</button>`).join('')}</div><div class="feedback" id="fb-${idx}">${x.lastResult==='good'?'Tu as retrouvé la notion sans aide.':x.lastResult==='retry'?'Cette notion mérite encore un passage.':''}</div></div>`:''}</article>`}).join('');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b))}function answer(b){const [idxS,aS]=b.dataset.answer.split(':'),idx=Number(idxS),a=Number(aS),data=read(),x=data[idx];const root=b.closest('.answers');root.querySelectorAll('.answer').forEach((n,i)=>n.classList.toggle(i===x.review.ok?'good':i===a?'bad':false));const fb=document.getElementById('fb-'+idx);if(a===x.review.ok){x.status='mastered';x.lastResult='good';fb.textContent='Bien. La notion est consolidée pour l’instant.'}else{x.lastResult='retry';x.dueMarker=seq()+1;fb.textContent='Pas encore. Relis le retour du professeur et les exemples : cette notion reviendra après une autre séance.'}data[idx]=x;save(data);setTimeout(render,900)}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{filter=t.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()});render()})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
