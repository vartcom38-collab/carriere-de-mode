<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Mes révisions</title><style>:root{--ink:#251d19;--paper:#f7efe7;--card:#fffaf5;--muted:#76665e;--rose:#b96f68;--line:#e1d2c7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.wrap{width:min(1220px,92vw);margin:0 auto;padding:38px 0 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:30px}.ey{font:800 10px Arial;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}h1{font:54px/.98 Georgia,serif;font-weight:400;margin:9px 0 10px}.sub{color:var(--muted);font-size:16px;max-width:720px;line-height:1.55}.back{border:1px solid var(--line);background:var(--card);padding:11px 15px;border-radius:999px;cursor:pointer}.tabs{display:flex;gap:8px;margin:22px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:#2a211c;color:#fff}.list{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(44,29,23,.06)}.head{display:flex;justify-content:space-between;gap:18px}.card h2{font:31px/1.05 Georgia,serif;font-weight:400;margin:6px 0}.meta{font:12px Arial;color:var(--muted)}.due{font:800 9px Arial;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-top:18px}.box{padding:15px;border-radius:17px;background:#f2e8df}.box b{display:block;font:800 9px Arial;letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}.box ul{margin:0;padding-left:18px}.box li{margin:6px 0;line-height:1.45}.review{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.answers{display:grid;gap:8px;margin-top:12px}.answer{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}.answer.good{background:#edf5f1;border-color:#9db7ad}.answer.bad{background:#fff0ed;border-color:#d7a69f}.feedback{margin-top:10px;font-style:italic;color:#5d4e47}.empty{padding:40px;background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{display:block}.back{margin-top:18px}h1{font-size:42px}}</style></head><body><main class="wrap"><div class="top"><div><div class="ey">École · carnet d'apprentissage</div><h1>Mes révisions</h1><div class="sub">Tes cours laissent des traces : notions, exemples, erreurs typiques. Certaines reviennent après quelques autres séances pour vérifier que tu les maîtrises vraiment.</div></div><button class="back" onclick="location.href='../school-day/'">Retour à ma journée</button></div><div class="tabs"><button class="tab active" data-filter="all">Toutes</button><button class="tab" data-filter="due">À revoir</button><button class="tab" data-filter="mastered">Consolidées</button></div><section class="list" id="list"></section></main><script src="../school/after-course-review-v1.js"></script><script>(function(){const S='haute-couture-school-review-v1',Q='haute-couture-school-review-seq-v1',list=document.getElementById('list');let filter='all';const read=()=>{try{return JSON.parse(localStorage.getItem(S)||'[]')||[]}catch(_){return[]}},save=v=>localStorage.setItem(S,JSON.stringify(v)),seq=()=>Number(localStorage.getItem(Q)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function status(x){return x.status==='mastered'?'Consolidée':x.dueMarker<=seq()?'À revoir':'Fiche disponible'}function render(){let data=read();if(filter==='due')data=data.filter(x=>x.status!=='mastered'&&x.dueMarker<=seq());if(filter==='mastered')data=data.filter(x=>x.status==='mastered');if(!data.length){list.innerHTML='<div class="empty">Aucune fiche dans cette section pour le moment.</div>';return}list.innerHTML=data.slice().reverse().map((x,ri)=>{const idx=read().findIndex(v=>v.id===x.id&&v.completedMarker===x.completedMarker),due=x.status!=='mastered'&&x.dueMarker<=seq();return `<article class="card" data-i="${idx}"><div class="head"><div><div class="ey">${esc(x.category)}</div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.teacher||'')} · ${status(x)}</div></div>${due?'<div class="due">Révision maintenant</div>':''}</div><div class="grid"><div class="box"><b>À retenir</b><ul>${(x.remember||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="box"><b>Exemples</b><ul>${(x.examples||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="box"><b>À surveiller</b><ul>${(x.errors||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div></div>${due&&x.review?`<div class="review"><b>${esc(x.review.q)}</b><div class="answers">${x.review.a.map((a,i)=>`<button class="answer" data-answer="${idx}:${i}">${esc(a)}</button>`).join('')}</div><div class="feedback" id="fb-${idx}">${x.lastResult==='good'?'Tu as retrouvé la notion sans aide.':x.lastResult==='retry'?'Cette notion mérite encore un passage.':''}</div></div>`:''}</article>`}).join('');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b))}function answer(b){const [idxS,aS]=b.dataset.answer.split(':'),idx=Number(idxS),a=Number(aS),data=read(),x=data[idx];const root=b.closest('.answers');root.querySelectorAll('.answer').forEach((n,i)=>n.classList.toggle(i===x.review.ok?'good':i===a?'bad':false));const fb=document.getElementById('fb-'+idx);if(a===x.review.ok){x.status='mastered';x.lastResult='good';fb.textContent='Bien. La notion est consolidée pour l’instant.'}else{x.lastResult='retry';x.dueMarker=seq()+1;fb.textContent='Pas encore. Relis les exemples : cette notion reviendra après une autre séance.'}data[idx]=x;save(data);setTimeout(render,900)}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{filter=t.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()});render()})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
