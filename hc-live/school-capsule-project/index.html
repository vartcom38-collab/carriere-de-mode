<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 06 mini-capsule</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:8px 0}.lead{font:14px/1.6 Georgia,serif;color:var(--muted);max-width:860px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:#fff}.work textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:13px;padding:12px;font:13px/1.55 Georgia,serif}.brief{padding:14px;background:#edf4f2;border-radius:14px;font:13px/1.55 Georgia,serif;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.actions .dark{background:#29211d}.mini{font:11px/1.5 Georgia,serif;color:var(--muted);margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · PROJET 06 · MINI-CAPSULE</div><h1>Penser trois silhouettes ensemble</h1><p class="lead">Tu développes une série, pas trois vêtements indépendants. L’école te demande de construire une cohérence, mais elle ne te donne pas la recette de ta propre identité.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="work"><div class="brief" id="brief"></div><textarea id="notes" placeholder="Tes croquis décrits, choix, hésitations, matière, corrections, ordre de série…"></textarea><div class="actions"><button id="save">ENREGISTRER</button><button id="next">ÉTAPE SUIVANTE</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="mini"></div></section></div></main><script>(function(){const KEY='haute-couture-school-capsule-project-v1';const school=(()=>{try{return JSON.parse(localStorage.getItem('haute-couture-school-choice-v1')||'{}')}catch(_){return{}}})();const id=school.id||'esmod-lyon';const flavor=id==='ifm-paris'?'principe spatial et relation au corps':id==='duperre-paris'?'surface, motif et volume':'silhouette, construction et usage';const steps=[['01 · Règle commune','Écris en une phrase la règle qui doit relier toute la série : '+flavor+'.'],['02 · Six propositions','Développe six silhouettes rapides. Elles doivent partager la règle sans être des copies.'],['03 · Sélection de trois','Choisis trois silhouettes qui fonctionnent ensemble. Note pourquoi les trois autres sortent de la série.'],['04 · Rôles dans la série','Attribue un rôle : pilier, transition, contraste. Explique ce que chaque silhouette apporte.'],['05 · Matières connues','Associe uniquement des matières déjà apprises ou découvertes. Une matière inconnue peut rester une piste, pas un usage maîtrisé.'],['06 · Construction / volume','Décris ce qui doit être vérifié techniquement ou volumétriquement pour chaque look.'],['07 · Cohérence visuelle','Compare proportions, couleurs, surfaces, détails et rythmes. Cherche les répétitions trop évidentes et les ruptures inutiles.'],['08 · Corrections','Choisis au moins une correction pour chaque silhouette et une correction qui concerne la série entière.'],['09 · Ordre de présentation','Décide dans quel ordre montrer les trois silhouettes et explique pourquoi.'],['10 · Bilan','Écris ce que cette mini-capsule révèle de ton regard actuel et ce que tu veux encore apprendre.']];let current=0;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}function render(){const d=read();document.getElementById('steps').innerHTML=steps.map((s,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${s[0]}</b></div>`).join('');document.getElementById('brief').innerHTML='<b>'+steps[current][0]+'</b><br>'+steps[current][1];document.getElementById('notes').value=d[current]?.notes||'';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{save(false);current=Number(x.dataset.i);render()})}function save(show=true){const d=read();d[current]={notes:document.getElementById('notes').value,savedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d));if(show)document.getElementById('msg').textContent='Étape enregistrée.';if(window.HCKnowledge)HCKnowledge.practice('project:capsule:'+current,{source:'school',label:steps[current][0]})}document.getElementById('save').onclick=()=>save(true);document.getElementById('next').onclick=()=>{save(false);if(current<steps.length-1)current++;render()};render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
