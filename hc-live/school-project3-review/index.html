<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Critique Projet 03</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:44px 18px 84px}.eyebrow{font:900 9px Arial;letter-spacing:.15em;color:var(--coral)}h1{font:44px Georgia,serif;margin:8px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}.card h2{font:25px Georgia,serif;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 80px;gap:10px;border-top:1px solid var(--line);padding:11px 0;align-items:center}.row label{font:13px/1.45 Georgia,serif}.row select{padding:8px;border:1px solid var(--line);border-radius:9px;background:white}.card textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.score{font:36px Georgia,serif;margin:12px 0}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.dark{background:#29211d}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · CRITIQUE · PROJET 03</div><h1>Présenter, écouter, reprendre</h1><p class="lead">La note n’est pas une fin. Elle sert à identifier ce qui fonctionne, ce qui reste fragile et ce que tu dois retravailler ensuite.</p><div class="grid"><section class="card"><h2>Grille d’évaluation</h2><div id="rubric"></div><div class="score" id="score">0 / 20</div><button class="btn" id="save">ENREGISTRER L’ÉVALUATION</button></section><section class="card"><h2>Retour critique</h2><textarea id="feedback" placeholder="Points forts, problème principal, correction prioritaire, piste à poursuivre…"></textarea><h2 style="margin-top:16px">Ma reprise</h2><textarea id="response" placeholder="Ce que je vais changer après cette critique…"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="saveText">ENREGISTRER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div></section></div></main><script>(function(){const KEY='haute-couture-school-project3-review-v1',criteria=[['Intention','Le projet répond-il clairement à son intention ?'],['Recherche','Les recherches servent-elles vraiment le projet ?'],['Développement','Les variantes montrent-elles une vraie exploration ?'],['Matière / surface','Le comportement de matière ou de surface est-il compris ?'],['Construction / volume','La construction ou le volume est-il cohérent ?'],['Diagnostic','Les défauts ont-ils été lus avant correction ?'],['Finitions','Le niveau de finition est-il cohérent avec le projet ?'],['Présentation','Le chemin de travail est-il compréhensible ?']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}const d=read();document.getElementById('rubric').innerHTML=criteria.map(([n,q],i)=>`<div class="row"><label><b>${n}</b><br>${q}</label><select data-i="${i}"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="2.5">2,5</option></select></div>`).join('');document.querySelectorAll('[data-i]').forEach(x=>{x.value=d.scores?.[x.dataset.i]??'0';x.onchange=calc});document.getElementById('feedback').value=d.feedback||'';document.getElementById('response').value=d.response||'';function calc(){let sum=0;document.querySelectorAll('[data-i]').forEach(x=>sum+=Number(x.value)||0);document.getElementById('score').textContent=sum.toFixed(sum%1?1:0)+' / 20';return sum}document.getElementById('save').onclick=()=>{const x=read(),scores={};document.querySelectorAll('[data-i]').forEach(s=>scores[s.dataset.i]=Number(s.value)||0);x.scores=scores;x.total=calc();x.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(x));if(window.HCSchoolAcademic)HCSchoolAcademic.grade('project3',x.total,'Évaluation Projet 03');};document.getElementById('saveText').onclick=()=>{const x=read();x.feedback=document.getElementById('feedback').value;x.response=document.getElementById('response').value;x.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(x));if(window.HCKnowledge)HCKnowledge.practice('critique:project3',{source:'school',label:'Critique Projet 03'});};calc()})();</script><script src="../school/school-academic-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
