<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 12</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:46px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:860px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.lookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h2{font:24px Georgia,serif;margin:0 0 8px}.card h3{font:20px Georgia,serif;margin:0 0 8px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral);margin-bottom:7px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:820px){.grid,.lookgrid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · ANNÉE 2 · PROJET 12</div><h1 id="title">Mini-collection</h1><p class="lead" id="lead"></p><section class="hero"><h2>Trois silhouettes, une seule pensée</h2><p>Chaque look doit avoir une raison d’exister. Le projet n’est terminé que si les trois fonctionnent séparément et si leur mise côte à côte produit une lecture plus forte.</p></section><section class="grid" id="common"></section><section class="lookgrid" id="looks"></section><section class="grid" id="edit"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year2-project12-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 12 — mini-collection construite · 3 silhouettes',lead:'Développe trois silhouettes reliées par une logique constructive commune, avec des fonctions, volumes ou intensités distinctes.'};else if(id==='ifm-paris')profile={title:'Projet 12 — mini-collection matérielle · 3 états du corps',lead:'Développe trois silhouettes comme trois degrés d’un même système matériel en relation avec le corps.'};else profile={title:'Projet 12 — surface, volume et rythme · 3 silhouettes',lead:'Développe trois silhouettes où langage visuel, coupe et volume varient tout en restant identifiables comme une même famille.'};const common=[['question','01 · QUESTION DE COLLECTION','Quelle question ou tension relie les trois silhouettes ?'],['constants','02 · CONSTANTES','Quels principes doivent rester lisibles dans toute la série ?'],['variables','03 · VARIABLES','Qu’est-ce qui peut varier : volume, proportion, matière, surface, usage, intensité ?'],['lineup','04 · LINE-UP INITIAL','Dans quel ordre présentes-tu les trois silhouettes et pourquoi ?']];const looks=[['look1','LOOK 01','Rôle du look, silhouette, construction/matière/surface, détail clé et ce qu’il apporte à la série.'],['look2','LOOK 02','Rôle du look, silhouette, construction/matière/surface, détail clé et ce qu’il apporte à la série.'],['look3','LOOK 03','Rôle du look, silhouette, construction/matière/surface, détail clé et ce qu’il apporte à la série.']];const edit=[['compare','08 · COMPARAISON','Compare les trois looks selon les mêmes critères. Où y a-t-il répétition, faiblesse ou rupture ?'],['change','09 · DÉCISION D’ÉDITION','Quelle décision as-tu modifiée ou retirée pour renforcer l’ensemble ?'],['finalLineup','10 · LINE-UP RÉVISÉ','Quel est l’ordre final et quel rythme veux-tu créer ?'],['jury','11 · PRÉPARATION JURY','Présente question, méthode, trois looks, décision d’édition, progrès démontré, fragilité et prochaine étape.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}function esc(v){return String(v||'').replace(/</g,'&lt;')}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('common').innerHTML=common.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('?')[0]}</h2><p>${p}</p><textarea data-key="${k}">${esc(s[k])}</textarea></section>`).join('');document.getElementById('looks').innerHTML=looks.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h3>${n}</h3><p>${p}</p><textarea data-key="${k}">${esc(s[k])}</textarea></section>`).join('');document.getElementById('edit').innerHTML=edit.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('?')[0]}</h2><p>${p}</p><textarea data-key="${k}">${esc(s[k])}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,9000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const all=[...common,...looks,...edit],filled=all.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${all.length} parties documentées.`;try{window.HCKnowledge?.practice?.('collection-series-method',{source:'school-year2-project12'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
