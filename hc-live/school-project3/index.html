<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 03</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:42px 18px 84px}.eyebrow{font:900 9px Arial;letter-spacing:.15em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:8px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:860px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:white}.step b{font-size:11px}.step p{font:11px/1.45 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.82}.brief,.task,.rule{padding:14px;border-radius:14px;font:13px/1.58 Georgia,serif}.brief{background:#edf4f2}.task{background:#f4ece6;margin-top:10px}.rule{background:#fff1ec;border:1px solid #ebc9bc;margin-top:10px;color:#674f45}.work textarea{width:100%;min-height:170px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.checks{display:grid;gap:7px;margin-top:12px}.checks label{font:12px/1.4 Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.actions .dark{background:#29211d}.progress{margin-top:16px;background:#f4ece6;border-radius:12px;padding:12px}.bar{height:8px;background:#e5d7cc;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · PROJET 03</div><h1 id="title">Projet 03</h1><p class="lead" id="lead"></p><div class="grid"><aside class="panel"><div class="eyebrow">DOSSIER DE PROJET</div><div id="steps"></div><div class="progress"><b id="pct">0%</b><div class="bar"><span id="bar" style="width:0%"></span></div></div></aside><section class="work"><div class="brief" id="brief"></div><div class="task" id="task"></div><div class="checks" id="checks"></div><textarea id="notes" placeholder="Recherche, décisions, essais, problèmes, hypothèses, corrections…"></textarea><div class="rule">Tu ne peux utiliser ici que des matières, techniques ou familles que ton personnage a déjà rencontrées ou apprises. Le projet ne révèle rien de nouveau automatiquement.</div><div class="actions"><button id="save">ENREGISTRER</button><button id="next">ÉTAPE SUIVANTE</button><button class="dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-school-project3-v1';let school={};try{school=JSON.parse(localStorage.getItem('haute-couture-school-choice-v1')||'{}')}catch(_){}const id=school.id||'esmod-lyon';const profiles={esmod:{title:'Projet 03 — ouverture, fermeture et usage',lead:'Concevoir un vêtement simple dont l’ouverture, la fermeture, l’usage et les finitions sont pensés dès le départ.',brief:'Le vêtement doit s’ouvrir et se fermer de façon cohérente avec son usage. L’intérieur compte autant que l’extérieur.'},ifm:{title:'Projet 03 — une forme, trois comportements de matière',lead:'Développer une même intention à travers plusieurs comportements de matière puis sélectionner la version la plus juste.',brief:'Tu gardes une intention commune et tu fais varier uniquement le comportement de matière parmi ce que tu connais déjà.'},duperre:{title:'Projet 03 — système de surface porté',lead:'Créer un système de surface qui réagit au corps, au mouvement, aux plis et aux découpes.',brief:'La surface doit fonctionner portée. Elle peut se répéter, se rompre, changer d’échelle ou être recomposée par la coupe.'}};const p=id==='ifm-paris'?profiles.ifm:id==='duperre-paris'?profiles.duperre:profiles.esmod;document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.lead;document.getElementById('brief').innerHTML='<b>BRIEF</b><br>'+p.brief;const steps=[{id:'intent',title:'01 · Intention',desc:'Dire ce que tu cherches.',task:'Écris ton intention en 3 à 5 phrases. Quel problème veux-tu résoudre ou quelle sensation veux-tu produire ?',checks:['intentionClaire','contrainteIdentifiee']},{id:'research',title:'02 · Recherche',desc:'Chercher sans accumuler.',task:'Sélectionne 3 à 6 références ou observations maximum. Pour chacune, note ce qu’elle t’apporte concrètement.',checks:['referencesSelectionnees','questionsRecherche']},{id:'variants',title:'03 · Variantes',desc:'Explorer avant de choisir.',task:'Développe au moins trois propositions différentes. Compare-les sur usage, volume, matière et faisabilité.',checks:['troisVariantes','comparaisonFaite']},{id:'select',title:'04 · Sélection',desc:'Choisir et renoncer.',task:'Choisis une proposition. Explique pourquoi elle sert mieux l’intention et ce que tu abandonnes volontairement.',checks:['choixJustifie','renoncementsNotes']},{id:'material',title:'05 · Matière connue',desc:'Choisir sans tricher.',task:'Choisis une matière ou une famille déjà rencontrée. Décris poids, main, tombé, stabilité et ce que cela implique pour ton projet.',checks:['matiereConnue','comportementAnalyse']},{id:'prototype',title:'06 · Prototype / toile',desc:'Tester avant le final.',task:'Prépare une toile, un prototype papier ou un test de volume selon ton école. Note au moins trois choses qui ne fonctionnent pas encore.',checks:['prototypeFait','troisDefauts']},{id:'fitting',title:'07 · Diagnostic',desc:'Lire avant de corriger.',task:'Pour chaque défaut observé, écris au moins deux causes possibles puis choisis une correction à tester.',checks:['hypothesesFormulees','correctionsTestees']},{id:'finish',title:'08 · Finitions',desc:'Prévoir l’intérieur.',task:'Décris l’ordre de montage et les finitions principales. Si ton projet comporte une ouverture, précise comment elle est intégrée.',checks:['ordreMontage','finitionsPrevues']},{id:'final',title:'09 · Rendu final',desc:'Finaliser sans tout ajouter.',task:'Réalise ou formalise la version finale. Vérifie qu’elle reste fidèle à l’intention et n’accumule pas des détails gratuits.',checks:['versionFinale','coherenceVerifiee']},{id:'present',title:'10 · Présentation',desc:'Expliquer le chemin.',task:'Prépare une présentation courte : intention, recherches, essais abandonnés, problème principal, correction majeure et résultat final.',checks:['presentationPrete','erreurExpliquee','correctionExpliquee']}];let current=0;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}function save(show=true){const d=read(),s=steps[current],checks={};document.querySelectorAll('[data-k]').forEach(x=>checks[x.dataset.k]=x.checked);d[s.id]={notes:document.getElementById('notes').value,checks,savedAt:new Date().toISOString()};d.schoolId=id;localStorage.setItem(KEY,JSON.stringify(d));if(window.HCKnowledge)HCKnowledge.practice('school-project3:'+s.id,{source:'school',label:s.title,schoolId:id});if(show)document.getElementById('msg').textContent='Étape enregistrée.'}function render(){const d=read(),s=steps[current];document.getElementById('steps').innerHTML=steps.map((x,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${x.title}</b><p>${x.desc}</p></div>`).join('');document.getElementById('task').innerHTML='<b>TRAVAIL À FAIRE</b><br>'+s.task;document.getElementById('checks').innerHTML=s.checks.map(k=>`<label><input type="checkbox" data-k="${k}" ${d[s.id]?.checks?.[k]?'checked':''}> ${k.replace(/([A-Z])/g,' $1').toLowerCase()}</label>`).join('');document.getElementById('notes').value=d[s.id]?.notes||'';const done=steps.filter(x=>d[x.id]&&Object.values(d[x.id].checks||{}).every(Boolean)&&String(d[x.id].notes||'').trim()).length,pct=Math.round(done/steps.length*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{save(false);current=Number(x.dataset.i);render()})}document.getElementById('save').onclick=()=>save(true);document.getElementById('next').onclick=()=>{save(false);if(current<steps.length-1)current++;render()};render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
