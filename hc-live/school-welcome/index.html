<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Rentrée</title><style>
:root{--paper:#fffaf5;--ink:#241b17;--muted:#75655d;--rose:#bb746d;--dark:#241c18;--line:rgba(76,54,43,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17110e;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.scene{min-height:100vh;position:relative;background:center/cover no-repeat;transition:background-image .35s ease}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,11,9,.14),rgba(17,11,9,.28) 48%,rgba(17,11,9,.72))}.top{position:absolute;z-index:3;left:38px;top:34px;display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.34);background:rgba(26,18,14,.36);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:9px 12px;font:800 9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}.place{position:absolute;z-index:3;left:5vw;bottom:7vh;color:#fff;max-width:620px}.place .ey{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f0c5c0}.place h1{font:clamp(55px,7vw,96px)/.9 Georgia,serif;font-weight:400;letter-spacing:-.04em;margin:12px 0}.place p{font:16px/1.55 Georgia,serif;color:rgba(255,255,255,.88);max-width:540px}.panel{position:absolute;z-index:4;right:38px;top:38px;bottom:38px;width:min(440px,38vw);background:rgba(255,250,245,.96);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.72);border-radius:28px;padding:30px;display:flex;flex-direction:column;box-shadow:0 28px 90px rgba(0,0,0,.32)}.progress{display:flex;gap:6px}.bar{height:4px;flex:1;border-radius:99px;background:#ded1c8}.bar.done,.bar.active{background:var(--dark)}.step{font:800 9px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);margin-top:28px}.who{display:flex;gap:12px;align-items:center;margin-top:18px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#eadbd0;border:1px solid #d7c3b6;font-size:18px}.who b{font:21px/1.1 Georgia,serif;font-weight:400}.who span{display:block;margin-top:3px;font:11px Arial,sans-serif;color:var(--muted)}.say{margin:20px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:italic 19px/1.55 Georgia,serif;color:#4f4038}.why{font:13px/1.55 Georgia,serif;color:var(--muted)}.why b{color:var(--ink)}.action{margin-top:auto;border:0;border-radius:999px;background:var(--dark);color:white;padding:15px 18px;font:800 10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.action:hover{background:var(--rose)}@media(max-width:900px){.scene{min-height:100vh;padding-top:45vh}.scene:after{background:linear-gradient(0deg,rgba(17,11,9,.68),rgba(17,11,9,.08) 58%)}.panel{position:relative;right:auto;top:auto;bottom:auto;width:min(92vw,650px);margin:0 auto 24px;border-radius:24px}.place{left:24px;right:24px;top:22vh;bottom:auto}.place h1{font-size:56px}.top{left:22px;top:20px}}</style></head>
<body><main class="scene" id="scene"><div class="top" id="top"></div><div class="place"><div class="ey">Premier jour · arrivée</div><h1 id="placeTitle">Le hall</h1><p id="placeText"></p></div><aside class="panel"><div class="progress" id="progress"></div><div class="step" id="step"></div><div class="who"><div class="avatar" id="avatar">A</div><div><b id="guide">Accueil</b><span id="role">Équipe pédagogique</span></div></div><div class="say" id="say"></div><div class="why" id="why"></div><button class="action" id="next">Continuer</button></aside></main>
<script>(function(){
const TOUR='haute-couture-school-first-tour-v1',FLOW='haute-couture-school-day1-flow-v1',SCREEN='haute-couture-current-screen';
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}};const school=read('haute-couture-school-choice-v1')||{};
const guide=school.name?.includes('IFM')?'Camille':school.name?.includes('Duperré')?'Anaïs':'Louise';
const lens=school.name?.includes('IFM')?'recherche, matière et méthode':school.name?.includes('Duperré')?'expérimentation, volume et regard':'construction, technique et métier';
const steps=[
 {place:'Le hall',img:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&fm=jpg&q=86&w=2200',desc:'Tu viens d’entrer. Des étudiants passent, certains cherchent leur salle, d’autres retrouvent déjà des connaissances.',say:'« Bienvenue. Aujourd’hui, je ne vais pas te montrer toute l’école. Je vais juste te donner les trois repères dont tu as besoin pour commencer sans te perdre. »',why:'<b>À retenir :</b> le hall est ton point d’arrivée. Tu découvriras le reste au moment où ta journée en aura besoin.',button:'Suivre Louise vers les ateliers'},
 {place:'Les ateliers',img:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&fm=jpg&q=86&w=2200',desc:'Tables de travail, mannequins, papiers, tissus, outils : ici, les cours passent rapidement de l’explication à la pratique.',say:`« Ici, on va beaucoup te demander de regarder, tester et recommencer. Dans cette école, tu vas particulièrement apprendre par ${lens}. »`,why:'<b>Pas besoin de mémoriser les salles.</b> Quand un cours commence, Ma journée t’indiquera directement où aller.',button:'Voir le dernier repère'},
 {place:'Ton fil conducteur',img:'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&fm=jpg&q=86&w=2200',desc:'Tu n’as pas encore vu la bibliothèque, la matériauthèque, les autres étages ni la ville autour. C’est volontaire.',say:'« Si tu ne sais plus quoi faire, ouvre Ma journée. Ton prochain cours, une sortie en ville ou le retour chez toi apparaîtra là. Le reste, tu le découvriras en vivant. »',why:'<b>C’est tout pour aujourd’hui.</b> Ton premier cours t’attend maintenant.',button:'Aller à mon premier cours'}
];
let i=0;const scene=document.getElementById('scene'),next=document.getElementById('next');document.getElementById('guide').textContent=guide;document.getElementById('avatar').textContent=guide[0];document.getElementById('role').textContent='Accueil · '+(school.name||'Mon école');document.getElementById('top').innerHTML=[school.name,school.city,'Jour 1'].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('');
function render(){const s=steps[i];scene.style.backgroundImage=`url('${s.img}')`;document.getElementById('placeTitle').textContent=s.place;document.getElementById('placeText').textContent=s.desc;document.getElementById('say').textContent=s.say.replace('Louise',guide);document.getElementById('why').innerHTML=s.why;document.getElementById('step').textContent=`Repère ${i+1} sur ${steps.length}`;document.getElementById('progress').innerHTML=steps.map((_,n)=>`<span class="bar ${n<i?'done':n===i?'active':''}"></span>`).join('');next.textContent=s.button.replace('Louise',guide)}
function finish(){localStorage.setItem(TOUR,JSON.stringify({completed:true,completedAt:new Date().toISOString()}));let f=read(FLOW)||{};f.phase='course';localStorage.setItem(FLOW,JSON.stringify(f));localStorage.setItem(SCREEN,'school-day');location.href='../school-day/'}
next.onclick=()=>{if(i<steps.length-1){i++;render()}else finish()};localStorage.setItem(SCREEN,'school-welcome');render();})();</script><script src="../server-save-bridge-v1.js" defer></script></body></html>
