<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Première visite</title><style>
:root{--ink:#241b17;--paper:#fffaf5;--muted:#78685f;--rose:#b96f69;--dark:#241c18}*{box-sizing:border-box}body{margin:0;background:#eee5dd;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(400px,.8fr)}.visual{position:relative;min-height:100vh;background:center/cover no-repeat}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,18,15,.08),rgba(25,18,15,.45))}.caption{position:absolute;z-index:2;left:6vw;bottom:7vh;color:#fff;max-width:600px}.caption .small,.school,.step-label{font:800 10px Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase}.caption .small{color:#f3d1ca}.caption h1{font:clamp(48px,6vw,84px)/.92 Georgia,serif;font-weight:400;margin:13px 0}.panel{min-height:100vh;background:rgba(255,250,245,.98);padding:50px 52px;display:flex;flex-direction:column}.school,.step-label{color:var(--rose)}.progress{display:flex;gap:7px;margin:22px 0 42px}.dot{height:4px;flex:1;border-radius:99px;background:#dfd3cb}.dot.done,.dot.active{background:var(--dark)}h2{font:42px/1 Georgia,serif;font-weight:400;margin:12px 0 18px}.text{font:17px/1.67 Georgia,serif;color:var(--muted)}.tip{margin-top:24px;padding:17px 19px;border-left:3px solid #c88980;background:#f4eae4;font:14px/1.55 Georgia,serif;color:#625249}.actions{margin-top:auto;padding-top:34px;display:flex;justify-content:flex-end}.primary{border:0;border-radius:999px;background:var(--dark);color:#fff;padding:15px 22px;font:800 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.primary:hover{background:var(--rose)}@media(max-width:900px){.screen{grid-template-columns:1fr}.visual{min-height:42vh}.panel{min-height:58vh;padding:32px 28px}.caption{left:28px;bottom:28px}.progress{margin:18px 0 28px}h2{font-size:36px}}
</style></head><body><main class="screen"><section class="visual" id="visual"><div class="caption"><div class="small">Jour 1 · Accueil</div><h1 id="visualTitle">Bienvenue.</h1></div></section><section class="panel"><div class="school" id="school">MON ÉCOLE</div><div class="progress" id="progress"></div><div class="step-label" id="stepLabel"></div><h2 id="title"></h2><div class="text" id="text"></div><div class="tip" id="tip"></div><div class="actions"><button class="primary" id="next">Continuer</button></div></section></main>
<script>(function(){
const TOUR='haute-couture-school-first-tour-v1',FLOW='haute-couture-school-day1-flow-v1',SCREEN='haute-couture-current-screen';let school=null;try{school=JSON.parse(localStorage.getItem('haute-couture-school-choice-v1')||'null')}catch(_){}
const steps=[
 {label:'01 · LE HALL',title:'Ton premier repère.',visual:'Le hall',img:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'Tu n’as pas besoin de connaître toute l’école aujourd’hui. Le hall est simplement ton point d’arrivée et ton premier repère.',tip:'Si tu ne sais plus quoi faire, retourne dans « Ma journée ». C’est toujours elle qui te donne la prochaine étape.'},
 {label:'02 · LES ATELIERS',title:'Là où tu vas apprendre en faisant.',visual:'Les ateliers',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'Dessin, textile, construction, volume : les matières auront leurs propres espaces. Tu découvriras les autres salles seulement quand le jeu en aura besoin.',tip:'Pas besoin d’explorer maintenant. Ton premier cours va apparaître juste après cette visite.'},
 {label:'03 · TON FIL CONDUCTEUR',title:'C’est tout ce qu’il faut retenir aujourd’hui.',visual:'Ma journée',img:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'Pendant tes études, « Ma journée » te dira quoi faire dans l’ordre : partir, aller en cours, sortir en ville quand une consigne le demande, puis rentrer chez toi.',tip:'Tu peux oublier les autres menus pour le moment. Ils apparaîtront quand ils deviendront utiles.'}
];
let i=0;const visual=document.getElementById('visual'),title=document.getElementById('title'),text=document.getElementById('text'),tip=document.getElementById('tip'),label=document.getElementById('stepLabel'),next=document.getElementById('next');document.getElementById('school').textContent=school?`${school.name} · ${school.city}`:'MON ÉCOLE';
function render(){const s=steps[i];visual.style.backgroundImage=`url('${s.img}')`;document.getElementById('visualTitle').textContent=s.visual;label.textContent=s.label;title.textContent=s.title;text.textContent=s.text;tip.textContent=s.tip;document.getElementById('progress').innerHTML=steps.map((_,n)=>`<span class="dot ${n<i?'done':n===i?'active':''}"></span>`).join('');next.textContent=i===steps.length-1?'Voir mon premier cours':'Continuer'}
function finish(){localStorage.setItem(TOUR,JSON.stringify({completed:true,completedAt:new Date().toISOString()}));let f={};try{f=JSON.parse(localStorage.getItem(FLOW)||'{}')||{}}catch(_){}f.phase='course';localStorage.setItem(FLOW,JSON.stringify(f));localStorage.setItem(SCREEN,'school-day');location.href='../school-day/'}
next.onclick=()=>{if(i<steps.length-1){i++;render()}else finish()};localStorage.setItem(SCREEN,'school-welcome');render();})();</script><script src="../server-save-bridge-v1.js" defer></script></body></html>
