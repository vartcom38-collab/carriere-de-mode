<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haute Couture Live — Première visite</title>
<style>
:root{--ink:#241b17;--paper:#fffaf5;--muted:#78685f;--line:rgba(62,43,34,.15);--rose:#b96f69;--dark:#241c18}
*{box-sizing:border-box}body{margin:0;background:#eee5dd;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,.85fr)}.visual{position:relative;min-height:100vh;background:center/cover no-repeat;transition:background-image .35s ease}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,18,15,.08),rgba(25,18,15,.42))}.caption{position:absolute;z-index:2;left:6vw;bottom:7vh;color:white;max-width:640px;text-shadow:0 2px 20px rgba(0,0,0,.35)}.caption .small{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f3d1ca}.caption h1{font:clamp(48px,6vw,86px)/.92 Georgia,serif;font-weight:400;margin:13px 0}.panel{min-height:100vh;background:rgba(255,250,245,.97);padding:54px 56px;display:flex;flex-direction:column}.school{font:800 10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}.progress{display:flex;gap:7px;margin:24px 0 46px}.dot{height:4px;flex:1;border-radius:99px;background:#dfd3cb}.dot.done,.dot.active{background:var(--dark)}.step-label{font:800 10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}h2{font:44px/1 Georgia,serif;font-weight:400;margin:12px 0 18px}.text{font:17px/1.68 Georgia,serif;color:var(--muted);max-width:620px}.tip{margin-top:26px;padding:18px 20px;border-left:3px solid #c88980;background:#f4eae4;font:14px/1.55 Georgia,serif;color:#625249}.actions{margin-top:auto;padding-top:34px;display:flex;align-items:center;justify-content:space-between;gap:14px}.secondary{border:0;background:transparent;text-decoration:underline;color:#7d6b61;font:13px Georgia,serif;cursor:pointer}.primary{border:0;border-radius:999px;background:var(--dark);color:white;padding:15px 22px;font:800 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.primary:hover{background:var(--rose)}@media(max-width:900px){.screen{grid-template-columns:1fr}.visual{min-height:44vh}.visual:after{background:linear-gradient(0deg,rgba(25,18,15,.42),rgba(25,18,15,.05))}.panel{min-height:56vh;padding:34px 28px}.caption{left:28px;bottom:28px}.progress{margin:18px 0 30px}h2{font-size:38px}}
</style>
</head>
<body><main class="screen"><section class="visual" id="visual"><div class="caption"><div class="small">Premier jour</div><h1 id="visualTitle">Bienvenue.</h1></div></section><section class="panel"><div class="school" id="school">MON ÉCOLE</div><div class="progress" id="progress"></div><div class="step-label" id="stepLabel"></div><h2 id="title"></h2><div class="text" id="text"></div><div class="tip" id="tip"></div><div class="actions"><button class="secondary" id="skip">Passer la visite</button><button class="primary" id="next">Continuer</button></div></section></main>
<script>
(function(){
const TOUR='haute-couture-school-first-tour-v1',SCREEN='haute-couture-current-screen',SCHOOL='haute-couture-school-choice-v1';
let school=null;try{school=JSON.parse(localStorage.getItem(SCHOOL)||'null')}catch(_){}
const steps=[
 {label:'01 · LE HALL',title:'Voici ton premier repère.',visual:'Le hall',img:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'C’est ici que tu prends tes marques. Affichage, changements de salle, annonces et premiers visages : tu n’as pas besoin de connaître toute l’école dès maintenant.',tip:'À retenir : quand tu ne sais plus où aller, « Ma journée » te montre toujours la prochaine étape utile.'},
 {label:'02 · LES ATELIERS',title:'C’est ici que les cours deviennent concrets.',visual:'Les ateliers',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'Dessin, textile, construction, volume… chaque matière aura son propre espace et sa propre façon de travailler. Tu n’auras pas une longue liste de cours abstraits : tu entreras dans un lieu pour apprendre et pratiquer.',tip:'La salle de ton prochain cours sera toujours mise en avant. Tu pourras y aller directement sans chercher dans plusieurs menus.'},
 {label:'03 · RECHERCHE',title:'Tout ne s’apprend pas en cours.',visual:'Bibliothèque & matières',img:'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'La bibliothèque et la matériauthèque servent à observer, comparer et garder des traces dans ton carnet. Certaines références restent inconnues tant que tu ne les as pas réellement rencontrées.',tip:'L’école te donne des bases, mais elle ne révèle pas toute la ville ni tout le métier. Une partie du jeu restera à découvrir dehors.'},
 {label:'04 · TA JOURNÉE',title:'Tu sais maintenant par où commencer.',visual:'Ton premier cours',img:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&fm=jpg&q=84&w=1800',text:'Depuis ta chambre ou depuis l’école, « Ma journée » devient ton fil conducteur : prochain cours, salle, ce qui est à rendre et les personnes que tu croises. Le reste reste accessible quand tu en as besoin.',tip:'Tu n’as pas à mémoriser les menus. Commence simplement par le prochain cours, puis laisse la journée se construire autour de toi.'}
];
let i=0;const visual=document.getElementById('visual'),title=document.getElementById('title'),text=document.getElementById('text'),tip=document.getElementById('tip'),label=document.getElementById('stepLabel'),next=document.getElementById('next');
document.getElementById('school').textContent=school?`${school.name} · ${school.city}`:'MON ÉCOLE';
function render(){const s=steps[i];visual.style.backgroundImage=`url('${s.img}')`;document.getElementById('visualTitle').textContent=s.visual;label.textContent=s.label;title.textContent=s.title;text.textContent=s.text;tip.textContent=s.tip;document.getElementById('progress').innerHTML=steps.map((_,n)=>`<span class="dot ${n<i?'done':n===i?'active':''}"></span>`).join('');next.textContent=i===steps.length-1?'Voir ma journée':'Continuer'}
function finish(){localStorage.setItem(TOUR,JSON.stringify({completed:true,completedAt:new Date().toISOString()}));localStorage.setItem(SCREEN,'school-day');location.href='../school-day/'}
next.onclick=()=>{if(i<steps.length-1){i++;render()}else finish()};document.getElementById('skip').onclick=finish;localStorage.setItem(SCREEN,'school-welcome');render();
})();
</script><script src="../server-save-bridge-v1.js" defer></script>
</body></html>
