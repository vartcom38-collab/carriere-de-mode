<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 11</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:46px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:840px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:23px Georgia,serif;margin:0 0 8px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:128px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · ANNÉE 2 · PROJET 11</div><h1 id="title">Commande extérieure</h1><p class="lead" id="lead"></p><section class="hero"><h2>Le principe</h2><p>Cette fois, le brief ne vient pas de toi. Tu dois comprendre une demande, clarifier les zones floues, proposer plusieurs réponses, recevoir un retour et décider ce que tu modifies, négocies ou défends.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year2-project11-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 11 — commande portée',lead:'Réponds à une personne, un usage et des contraintes précises sans perdre ton identité de conception.'};else if(id==='ifm-paris')profile={title:'Projet 11 — commande contextuelle',lead:'Développe une forme portée à partir d’un contexte imposé où corps, matière et environnement interagissent.'};else profile={title:'Projet 11 — commande visuelle',lead:'Réponds à un univers imposé en le transformant en langage de surface, coupe et volume plutôt qu’en le copiant.'};const defs=[['rawbrief','01 · BRIEF REÇU','Note la demande telle qu’elle t’est donnée : personne ou contexte, usage, contraintes, attentes.'],['reframe','02 · REFORMULATION','Réécris la commande avec tes mots. Qu’as-tu compris ? Qu’est-ce qui reste flou ?'],['nonneg','03 · NON-NÉGOCIABLES','Liste les contraintes réellement obligatoires : usage, mobilité, contexte, identité, matière, délai ou autre.'],['questions','04 · QUESTIONS À POSER','Quelles informations te manquent avant de proposer une réponse ?'],['directions','05 · TROIS DIRECTIONS','Décris au moins trois réponses différentes au même brief.'],['choice','06 · DIRECTION RETENUE','Pourquoi cette piste répond-elle mieux au besoin sans être la solution la plus évidente ?'],['known','07 · MATIÈRES / TECHNIQUES CONNUES','Qu’utilises-tu parmi ce que tu as réellement appris ou découvert ? Pourquoi ?'],['prototype','08 · PROTOTYPE / TEST PORTÉ','Que testes-tu concrètement : usage, mouvement, construction, comportement, surface ou lisibilité ?'],['feedback','09 · RETOUR EXTÉRIEUR','Note plusieurs retours reçus. Sépare problème concret, préférence, question de compréhension et faisabilité.'],['decision','10 · ARBITRAGES','Quel retour acceptes-tu ? Lequel reformules-tu ? Quelle décision défends-tu et pourquoi ?'],['revision','11 · VERSION RÉVISÉE','Décris précisément ce que tu modifies après le retour et ce que tu conserves.'],['final','12 · RENDU / RESTITUTION','Prépare : brief reformulé, choix principaux, retour intégré, décision maintenue, résultat actuel et limite du projet.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${String(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('external-brief',{source:'school-year2-project11'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
