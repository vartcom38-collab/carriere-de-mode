<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Opportunités de carrière</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#78675e;--line:#e3d4c9;--coral:#e17b64;--dark:#291f1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.top,.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px #3b281d12}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.hero{padding:18px;margin-top:14px}.hero h2{font:36px Georgia,serif;margin:5px 0}.meta{font:11px/1.5 Georgia,serif;color:var(--muted)}.meter{height:10px;background:#eadfd7;border-radius:999px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:var(--dark)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.card{padding:15px}.card.locked{opacity:.58}.card h3{font:25px Georgia,serif;margin:5px 0}.badge{display:inline-block;border-radius:999px;background:#efe3db;padding:6px 9px;font:900 7px Arial}.badge.ok{background:#eef5ee;color:#55745b}.card p{font:11px/1.5 Georgia,serif;color:var(--muted)}.card button{width:100%;margin-top:9px}.note{margin-top:9px;padding:10px;border-radius:12px;background:#fff1e7;font:10px/1.45 Georgia,serif}@media(max-width:950px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>OPPORTUNITÉS <em>de carrière</em></h1></div><div class="nav"><button class="btn" onclick="location.href='../image-publique/'">IMAGE PUBLIQUE</button><button class="btn" onclick="location.href='../concours/'">CONCOURS</button><button class="btn" onclick="location.href='../defiles/index-v2.html'">DÉFILÉS</button><button class="btn dark" onclick="location.href='../chez-moi/'">CHEZ MOI</button></div></header><section class="hero"><div class="k">PROGRESSION PROFESSIONNELLE</div><h2 id="repTitle">Notoriété</h2><p class="meta" id="repText"></p><div class="meter"><i id="meter"></i></div></section><section class="grid" id="grid"></section></div><script src="../game-engine.js?v=20260903-career2"></script><script src="../career-opportunities-v1.js?v=20260903-career2"></script><script>(function(){const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function goTarget(r){if(r.target==='atelier'){location.href='../atelier-raster/index-v2.html?v=20260903-career2';return}if(r.target==='./concours/'){location.href='../concours/';return}if(r.target==='./defiles/'){location.href='../defiles/index-v2.html';return}if(r.target)location.href=r.target}function render(){const api=window.HCCareerOpportunities;if(!api){setTimeout(render,100);return}const list=api.list(),rep=api.rep(),next=list.find(x=>!x.unlocked);document.getElementById('repTitle').textContent=`Notoriété : ${rep}`;document.getElementById('repText').textContent=next?`Prochain palier : ${next.rep} — ${next.title}`:'Tous les paliers actuels sont débloqués.';document.getElementById('meter').style.width=(next?Math.min(100,Math.round(rep/next.rep*100)):100)+'%';document.getElementById('grid').innerHTML=list.map(x=>{const st=x.state?.status||'locked',locked=!x.unlocked,activeOrder=x.type==='client'&&api.activeOrder();let label=locked?`DÉBLOQUÉ À ${x.rep}`:st==='accepted'?'ACCEPTÉ':x.type==='client'?'ACCEPTER LA COMMANDE':x.type==='collaboration'?'ACCEPTER LA COLLABORATION':'VOIR L’OPPORTUNITÉ';const disabled=locked||st==='accepted'||!!activeOrder;return`<article class="card ${locked?'locked':''}"><div class="k">PALIER ${x.rep} · ${esc(x.type.toUpperCase())}</div><h3>${esc(x.title)}</h3><span class="badge ${x.unlocked?'ok':''}">${locked?'VERROUILLÉ':st==='accepted'?'EN COURS':'DISPONIBLE'}</span><p>${esc(x.subtitle)}</p><p>${esc(x.desc)}</p>${activeOrder?'<div class="note">Une commande cliente est déjà active. Termine-la avant d’accepter une nouvelle cliente.</div>':''}<button class="btn ${x.unlocked&&!disabled?'dark':''}" data-id="${esc(x.id)}" ${disabled?'disabled':''}>${esc(label)}</button></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const r=api.accept(b.dataset.id);if(!r.ok){render();return}goTarget(r)})}render()})();</script></body></html>
