<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 18</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:46px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.16em;color:var(--coral)}h1{font:50px/1 Georgia,serif;margin:10px 0}.lead{max-width:850px;font:15px/1.65 Georgia,serif;color:var(--muted)}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:white}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:23px Georgia,serif;margin:0 0 7px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:125px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · ANNÉE 3 · PROJET 18</div><h1 id="title">Commande avancée</h1><p class="lead" id="lead"></p><section class="hero"><h2>Le principe</h2><p>Ce projet ne mesure pas ta capacité à dire oui à tout. Il mesure ta capacité à comprendre un besoin, proposer plusieurs réponses crédibles, négocier ce qui doit l’être, corriger avec méthode et rester claire sur tes limites.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year3-project18-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 18 — commande avancée · capsule 3 looks',lead:'Réponds à un brief extérieur complexe avec trois looks cohérents, un vrai arbitrage technique et une direction d’auteur.'};else if(id==='ifm-paris')profile={title:'Projet 18 — commande avancée · système matière 3 états',lead:'Construis trois états portés répondant à un contexte imposé sans réduire la matière à une simple solution fonctionnelle.'};else profile={title:'Projet 18 — commande avancée · identité & capsule 3 looks',lead:'Interprète une identité imposée sans imitation et construis trois looks suffisamment personnels et cohérents avec le brief.'};const defs=[['brief','01 · BRIEF REÇU','Reformule le besoin, le destinataire et le contexte en tes propres mots.'],['constraints','02 · CONTRAINTES','Classe les contraintes : obligatoires, négociables, préférences, points flous.'],['questions','03 · QUESTIONS','Liste les questions à poser avant de proposer une direction.'],['contradictions','04 · CONTRADICTIONS','Repère les exigences qui entrent en tension et pourquoi.'],['direction1','05 · DIRECTION A','Intention, avantage, risque, compromis.'],['direction2','06 · DIRECTION B','Intention, avantage, risque, compromis.'],['direction3','07 · DIRECTION C','Intention, avantage, risque, compromis.'],['selection','08 · DIRECTION RETENUE','Pourquoi cette direction a-t-elle été choisie ? Quels critères ont compté ?'],['negotiation','09 · NÉGOCIATION','Quel point as-tu négocié ou reformulé ? Quelle alternative as-tu proposée ?'],['look1','10 · LOOK / ÉTAT 01','Rôle dans la capsule, décisions principales, contraintes respectées.'],['look2','11 · LOOK / ÉTAT 02','Rôle dans la capsule, décisions principales, contraintes respectées.'],['look3','12 · LOOK / ÉTAT 03','Rôle dans la capsule, décisions principales, contraintes respectées.'],['tests','13 · TESTS / PROTOTYPE','Quels tests ou prototypes permettent de vérifier les risques principaux ?'],['feedback','14 · RETOUR EXTÉRIEUR','Note les retours reçus et classe-les : problème, préférence, demande nouvelle, contradiction.'],['accepted','15 · CORRECTIONS ACCEPTÉES','Qu’as-tu modifié et pourquoi ?'],['defended','16 · DÉCISION DÉFENDUE','Quelle décision as-tu maintenue ? Sur quelles preuves ou arguments ?'],['revised','17 · VERSION RÉVISÉE','Décris l’état du projet après arbitrages et corrections.'],['limits','18 · LIMITES','Qu’est-ce qui reste fragile, non testé ou nécessiterait une compétence supplémentaire ?'],['restitution','19 · RESTITUTION','Prépare la présentation finale : brief, choix, négociation, capsule, corrections, résultat, limites.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,9000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('advanced-external-brief',{source:'school-year3-project18'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
