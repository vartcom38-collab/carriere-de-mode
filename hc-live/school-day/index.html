<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Ma journée</title><style>
:root{--ink:#241b17;--muted:#75655c;--paper:#fffaf5;--line:rgba(74,51,41,.14);--rose:#b97069;--dark:#241c18;--green:#4d8d86;--shadow:0 20px 60px rgba(48,31,24,.12)}*{box-sizing:border-box}body{margin:0;background:#efe6de;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.hero{position:relative;min-height:330px;background:linear-gradient(90deg,rgba(25,18,15,.62),rgba(25,18,15,.2)),url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&fm=jpg&q=84&w=2200') center/cover no-repeat;color:white}.hero-in{width:min(1180px,92vw);margin:auto;padding:52px 0 72px}.eyebrow{font:800 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f1c9c3}.hero h1{font:clamp(52px,6vw,82px)/.92 Georgia,serif;font-weight:400;margin:12px 0 14px}.hero p{font:16px/1.55 Georgia,serif;color:rgba(255,255,255,.85);max-width:740px}.wrap{width:min(1180px,92vw);margin:-48px auto 0;position:relative;z-index:3;padding-bottom:80px}.next{background:rgba(255,250,245,.98);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:28px 30px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}.label{font:800 10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--rose)}.next h2{font:38px/1.03 Georgia,serif;font-weight:400;margin:9px 0}.next p{margin:0;color:var(--muted);font:14px/1.5 Georgia,serif}.go{border:0;border-radius:999px;background:var(--dark);color:#fff;padding:16px 22px;font:800 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.timeline{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px 24px}.timeline h3{font:30px/1 Georgia,serif;font-weight:400;margin:0 0 18px}.step{display:grid;grid-template-columns:90px 24px 1fr;gap:12px;min-height:68px;position:relative}.step:not(:last-child):after{content:'';position:absolute;left:101px;top:25px;width:2px;height:48px;background:#ded2ca}.time{font:13px/1.4 Georgia,serif;color:var(--muted);padding-top:3px}.dot{width:16px;height:16px;border-radius:50%;margin-top:3px;background:#ddd0c8;border:3px solid #f7efe9;box-shadow:0 0 0 1px #d2c4bb}.step.done .dot{background:#79a094}.step.active .dot{background:var(--rose)}.step b{display:block;font:19px/1.15 Georgia,serif;font-weight:400}.step span{display:block;margin-top:4px;font:12px/1.45 Georgia,serif;color:var(--muted)}.normal{margin-top:22px}.course{display:grid;grid-template-columns:95px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:8px 0}.course.current{border-color:rgba(185,112,105,.4);box-shadow:0 14px 38px rgba(47,31,24,.09)}.course button{border:0;border-radius:999px;background:var(--green);color:white;padding:11px 14px;font:800 10px Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}.hidden{display:none!important}.footer{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.soft{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 15px;cursor:pointer}.msg{margin-top:12px;color:var(--muted);font:13px/1.5 Georgia,serif}@media(max-width:800px){.next{grid-template-columns:1fr}.course{grid-template-columns:75px 1fr}.course button{grid-column:1/-1;justify-self:start}.step{grid-template-columns:70px 22px 1fr}.step:not(:last-child):after{left:81px}}
</style></head><body>
<header class="hero"><div class="hero-in"><div class="eyebrow">École · Aujourd’hui</div><h1>Ma journée</h1><p id="dayTitle">Tu n’as pas besoin de chercher : une seule prochaine étape est active.</p></div></header>
<main class="wrap"><section class="next"><div><div class="label">À faire maintenant</div><h2 id="nextTitle">Préparer ma rentrée</h2><p id="nextMeta">Le jeu te dira quoi faire ensuite.</p></div><button class="go" id="nextAction">Continuer</button></section>
<section class="timeline" id="timeline"><h3>Jour 1 · Ma rentrée</h3><div id="steps"></div></section>
<section class="normal hidden" id="normal"><div class="label" style="margin-bottom:12px">Cours du jour</div><div id="courses"></div><div class="footer"><button class="soft" onclick="location.href='../school-home/'">Retour chez moi</button><button class="soft" onclick="location.href='../school-planning/'">Voir l’emploi du temps</button></div><div class="msg" id="msg"></div></section>
</main>
<script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/year1-week8-v1.js"></script><script src="../school/year1-week9-v1.js"></script><script src="../school/year1-week10-v1.js"></script><script src="../school/year1-weeks11-12-v1.js"></script><script src="../school/year1-weeks13-16-v1.js"></script><script src="../school/year1-weeks17-20-v1.js"></script><script src="../school/year1-weeks21-24-v1.js"></script><script src="../school/year1-weeks25-28-v1.js"></script><script src="../school/year1-weeks29-32-v1.js"></script><script src="../school/year2-weeks1-4-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../game-engine.js"></script>
<script>(function(){
localStorage.setItem('haute-couture-current-screen','school-day');const FLOW='haute-couture-school-day1-flow-v1',TOUR='haute-couture-school-first-tour-v1',L=window.HCSchoolLife,A=window.HCSchoolAcademic,G=window.HCSchoolGameplay;let flow=null,tour=null;try{flow=JSON.parse(localStorage.getItem(FLOW)||'null');tour=JSON.parse(localStorage.getItem(TOUR)||'null')}catch(_){}if(!flow){flow={phase:tour?.completed?'done':'morning'};localStorage.setItem(FLOW,JSON.stringify(flow))}const savePhase=p=>{flow.phase=p;localStorage.setItem(FLOW,JSON.stringify(flow))};
function todays(){const a=A.state();return L.courses.filter(c=>Number(c.year||1)===Number(a.year)&&Number(c.day)===Number(a.day))}function nextCourse(){const l=L.state();return todays().find(c=>!l.completed[c.id]&&L.isUnlocked(c,l))}function allDone(){const cs=todays(),l=L.state();return cs.length&&cs.every(c=>!!l.completed[c.id])}
function drawSteps(active){const cs=todays(),first=cs[0];const rows=[['08:30','Quitter mon logement','Le jeu t’emmène vers ton école.'],['09:00','Accueil et visite','Découvre seulement les repères essentiels.'],[first?.time||'10:00','Premier cours',first?`${first.title} · ${first.teacher}`:'Ton premier cours de la journée.'],['Après les cours','Finir ma journée','Une fois les cours obligatoires terminés.'],['Soir','Rentrer chez moi','Retour à ta chambre, ta coloc ou ton studio.']];const order=['depart','tour','course','finish','home'];document.getElementById('steps').innerHTML=rows.map((r,i)=>`<div class="step ${i<active?'done':i===active?'active':''}"><div class="time">${r[0]}</div><div class="dot"></div><div><b>${r[1]}</b><span>${r[2]}</span></div></div>`).join('')}
function render(){const a=A.state(),btn=document.getElementById('nextAction'),title=document.getElementById('nextTitle'),meta=document.getElementById('nextMeta'),normal=document.getElementById('normal'),timeline=document.getElementById('timeline');document.getElementById('dayTitle').textContent=flow.phase==='done'?`Année ${a.year} · Semaine ${a.week} · Jour ${a.day}. Commence par la prochaine étape.`:'Jour 1 · Une seule chose à faire à la fois.';
 if(flow.phase==='morning'){drawSteps(0);title.textContent='Partir à l’école';meta.textContent='Ta journée commence. Tu n’as rien d’autre à ouvrir pour le moment.';btn.textContent='Partir à l’école';btn.onclick=()=>{savePhase('tour');location.href='../school-welcome/'};return}
 if(flow.phase==='tour'&&!tour?.completed){drawSteps(1);title.textContent='Faire la visite d’accueil';meta.textContent='Tu vas voir uniquement le hall, les ateliers et le repère « Ma journée ».';btn.textContent='Commencer la visite';btn.onclick=()=>location.href='../school-welcome/';return}
 if(flow.phase!=='done'){
  const n=nextCourse();if(n){savePhase('course');drawSteps(2);title.textContent=n.title;meta.textContent=`${n.time} · ${n.teacher} · ${n.category}`;btn.textContent='Entrer en cours';btn.onclick=()=>location.href=`../school-course/?id=${encodeURIComponent(n.id)}`;return}
  if(allDone()){drawSteps(3);title.textContent='Rentrer chez moi';meta.textContent='Tes cours obligatoires du jour sont terminés. Le jeu clôture la journée et te ramène à ton logement.';btn.textContent='Rentrer chez moi';btn.onclick=()=>{const r=G.closeDay();if(r.ok||A.state().dayClosed){savePhase('recap');location.href='../school-home/'}else meta.textContent='Il reste encore une étape obligatoire aujourd’hui.'};return}
 }
 timeline.classList.add('hidden');normal.classList.remove('hidden');const cs=todays(),l=L.state(),n=nextCourse();title.textContent=n?n.title:(cs.length?'Cours du jour terminés':'Temps libre');meta.textContent=n?`${n.time} · ${n.teacher} · ${n.category}`:'Tu peux rentrer chez toi, explorer ou consulter ton planning.';btn.textContent=n?'Aller au cours':'Retour chez moi';btn.onclick=()=>n?location.href=`../school-course/?id=${encodeURIComponent(n.id)}`:location.href='../school-home/';document.getElementById('courses').innerHTML=cs.length?cs.map(c=>{const done=!!l.completed[c.id],un=L.isUnlocked(c,l),current=n&&n.id===c.id;return`<article class="course ${current?'current':''}"><div>${c.time}</div><div><b>${c.title}</b><div style="font-size:12px;color:#75655c;margin-top:4px">${c.teacher} · ${c.category}</div></div><button ${un?'':'disabled'} onclick="location.href='../school-course/?id=${c.id}'">${done?'Revoir':current?'Y aller':'Commencer'}</button></article>`}).join(''):'Aucun cours obligatoire aujourd’hui.'}
render();})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
