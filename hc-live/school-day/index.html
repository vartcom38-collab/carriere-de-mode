<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Ma journée d'école</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:48px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:820px}.hero{background:#2d2723;color:#fff;border-radius:26px;padding:24px;margin:22px 0}.hero b{font:36px/1 Georgia,serif}.hero p{font:13px/1.5 Georgia,serif;color:#ddcfc6}.course,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.course{display:grid;grid-template-columns:95px 1fr auto;gap:14px;align-items:center}.time{font:14px Georgia,serif}.title{font:20px Georgia,serif}.meta{font:11px/1.45 Georgia,serif;color:var(--muted);margin-top:4px}.status{font-size:9px;font-weight:900;padding:7px 9px;border-radius:999px;background:#f0e8e1}.done{background:#e7f0ea;color:#4c705c}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.btn:disabled{opacity:.35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:25px Georgia,serif;margin:0 0 10px}.row{border-top:1px solid var(--line);padding:10px 0;font:13px/1.5 Georgia,serif}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.msg{margin-top:12px;font:13px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.course{grid-template-columns:70px 1fr}.course button{grid-column:1/-1}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · JOURNÉE EN COURS</div><h1>Ma journée</h1><p class="lead">Rien ne se déroule sans toi. Tu peux rester des heures ou plusieurs jours réels sur cette journée. L'heure de jeu change seulement quand tu termines une activité.</p><section class="hero"><b id="dayTitle">Jour 1</b><p id="clock">Ton rythme, ton temps.</p></section><section id="courses"></section><section class="grid"><div class="card"><h2>À rendre</h2><div id="due"></div></div><div class="card"><h2>Présence</h2><div id="attendance"></div></div></section><div class="actions"><button class="btn" onclick="location.href='../school/'">VOIR L'ÉCOLE</button><button class="btn" onclick="location.href='../school-planning/'">PLANNING & NOTES</button><button class="btn dark" id="close">TERMINER MA JOURNÉE</button><button class="btn dark" id="next">COMMENCER LE JOUR SUIVANT</button></div><div class="msg" id="msg"></div></main><script src="../school/school-life-v1.js"></script><script src="../school/school-specialties-v1.js"></script><script src="../knowledge-registry-v1.js"></script><script src="../school/school-month1-v1.js"></script><script src="../school/year1-extension-v1.js"></script><script src="../school/year1-project2-v1.js"></script><script src="../school/year1-week6-v1.js"></script><script src="../school/year1-week7-v1.js"></script><script src="../school/school-academic-v1.js"></script><script src="../school/school-gameplay-v1.js"></script><script src="../game-engine.js"></script><script>(function(){localStorage.setItem('haute-couture-current-screen','school-day');const L=HCSchoolLife,A=HCSchoolAcademic,G=HCSchoolGameplay;function render(){const a=A.state(),l=L.state(),check=G.dayChecklist();document.getElementById('dayTitle').textContent=`Année ${a.year} · Semaine ${a.week} · Jour ${a.day}`;try{const g=HCGame.get();document.getElementById('clock').textContent='Heure de jeu · '+HCGame.formatDateTime(g)}catch(_){document.getElementById('clock').textContent='Le temps avance uniquement avec tes actions.'}const cs=L.courses.filter(c=>Number(c.day)===Number(a.day));document.getElementById('courses').innerHTML=cs.length?cs.map(c=>{const done=!!l.completed[c.id],un=L.isUnlocked(c,l);return`<div class="course"><div class="time">${c.time}<br>${c.duration} min jeu</div><div><div class="title">${c.title}</div><div class="meta">${c.teacher} · ${c.category}</div></div><span class="status ${done?'done':''}">${done?'TERMINÉ':un?'À FAIRE':'VERROUILLÉ'}</span><button class="btn" ${un?'':'disabled'} onclick="location.href='../school-course/?id=${c.id}'">${done?'REVOIR':'COMMENCER'}</button></div>`}).join(''):'<div class="card">Aucun cours obligatoire prévu aujourd’hui. Tu peux travailler tes devoirs, explorer ou clôturer la journée.</div>';const due=check?.due||[];document.getElementById('due').innerHTML=due.length?due.map(x=>`<div class="row"><b>${x.title}</b><br>${x.brief}</div>`).join(''):'<div class="row">Rien n’est à rendre aujourd’hui.</div>';const att=Object.entries(a.attendance).filter(([id,v])=>v.gameDay===a.day);document.getElementById('attendance').innerHTML=att.length?att.map(([id,v])=>`<div class="row">✓ ${L.courses.find(c=>c.id===id)?.title||id} · ${v.status}</div>`).join(''):'<div class="row">Aucune présence enregistrée aujourd’hui.</div>';document.getElementById('close').disabled=a.dayClosed;document.getElementById('next').disabled=!a.dayClosed;if(check&&!check.canClose&&!a.dayClosed)document.getElementById('msg').textContent=`Il reste ${check.missing.length} cours obligatoire(s) aujourd’hui. Tu gardes cependant tout ton temps réel pour les faire.`;else document.getElementById('msg').textContent=a.dayClosed?'Journée clôturée. Le monde attend que tu choisisses de commencer la suivante.':'Tous les cours obligatoires du jour sont terminés.'}document.getElementById('close').onclick=()=>{const r=G.closeDay();if(!r.ok){document.getElementById('msg').textContent='Tu as encore des cours obligatoires à terminer avant de clôturer cette journée.';return}render()};document.getElementById('next').onclick=()=>{const r=A.startNextDay();document.getElementById('msg').textContent=r.ok?'Nouveau jour commencé.':'La journée actuelle doit être clôturée.';render()};render()})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
