<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Couture Live — Téléphone</title>
<style>
:root{--bg:#f7efe5;--paper:#fffaf3;--ink:#221b17;--muted:#7c6a60;--coral:#e97b63;--teal:#4b8f89;--line:#ead9ca;--soft:#f6e3d9;--shadow:0 18px 45px rgba(86,57,41,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{min-height:100vh;padding:18px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.brand{font-weight:900;letter-spacing:.16em;line-height:.9;font-size:13px}.brand small{display:block;color:var(--coral);font-size:8px;margin-top:5px}.title h1{margin:0;font:700 clamp(42px,5vw,72px)/.88 Georgia,serif}.title h1 em{font-weight:400;color:var(--coral)}.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid var(--line);background:#fffaf5;border-radius:999px;padding:8px 11px;font-size:10px}.chip b{color:var(--teal)}.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 290px;gap:12px;min-height:720px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.sidebar{padding:15px}.tabs{display:grid;gap:7px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;text-align:left;font-weight:900;cursor:pointer}.tab.active{background:var(--soft);color:#a84f3d}.tab .count{float:right;background:var(--coral);color:white;border-radius:999px;padding:2px 6px;font-size:9px}.section-label{font-size:8px;letter-spacing:.12em;font-weight:900;color:#8d776b;margin:15px 0 8px}.conversation-list{display:grid;gap:5px}.conversation{width:100%;border:0;background:transparent;border-radius:14px;padding:10px;display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;text-align:left;cursor:pointer}.conversation:hover,.conversation.active{background:#f8eadf}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ead7c8;font-weight:900}.conversation b{display:block;font-size:11px}.conversation span{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}.dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}.phone{display:flex;flex-direction:column;min-width:0}.phone-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.phone-head .avatar{width:44px;height:44px}.phone-head h2{font:24px Georgia,serif;margin:0}.phone-head p{font-size:9px;color:var(--muted);margin:3px 0 0}.thread{flex:1;padding:22px;overflow:auto;background:linear-gradient(180deg,#fffaf4,#fbf2e8);display:flex;flex-direction:column;gap:11px}.bubble{max-width:74%;padding:12px 14px;border-radius:17px;font:14px/1.45 Georgia,serif;box-shadow:0 5px 14px rgba(80,54,39,.05)}.bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}.bubble.me{align-self:flex-end;background:#dfeeea;border:1px solid #c9dfda;border-bottom-right-radius:5px}.bubble small{display:block;font:8px Arial,sans-serif;color:#917c70;margin-top:5px}.choices{padding:13px 18px;border-top:1px solid var(--line);display:grid;gap:7px;background:#fffaf5}.choice{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 13px;text-align:left;cursor:pointer;font-weight:800}.choice:hover{border-color:#d8b8a7;background:#fff8f1}.choice.primary{background:#2b2420;color:white;border-color:#2b2420}.empty{margin:auto;text-align:center;padding:40px;max-width:390px}.empty h2{font:32px Georgia,serif;margin:0 0 8px}.empty p{font:14px/1.5 Georgia,serif;color:var(--muted)}.right{padding:15px;display:grid;align-content:start;gap:10px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px}.card h3{font:19px Georgia,serif;margin:0 0 8px}.card p{font:11px/1.5 Georgia,serif;color:#66574f;margin:0}.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0e3da;font-size:10px}.stat:last-child{border-bottom:0}.stat strong{color:var(--teal)}.mission{background:#fff1e9}.mission b{display:block;font:15px Georgia,serif}.mission span{font-size:9px;color:var(--muted)}.back{margin-top:12px;width:100%;border:0;background:#2b2420;color:#fff;border-radius:14px;padding:12px;font-weight:900;cursor:pointer}@media(max-width:980px){.layout{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:700px){.app{padding:9px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr;min-height:auto}.sidebar{max-height:280px;overflow:auto}.phone{min-height:620px}.bubble{max-width:88%}.meta{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">HAUTE<br>COUTURE<small>✦ LIVE ✦</small></div><div class="title"><h1>MON <em>téléphone</em></h1></div></div><div class="meta"><div class="chip">ARGENT <b id="money">—</b></div><div class="chip">RÉPUTATION <b id="rep">0</b></div><div class="chip">JOUR / HEURE <b id="time">—</b></div></div></header>
<main class="layout">
<aside class="panel sidebar"><div class="tabs"><button class="tab active" data-tab="messages">MESSAGES <span class="count" id="unreadCount">0</span></button><button class="tab" data-tab="opportunities">OPPORTUNITÉS</button><button class="tab" data-tab="contacts">CONTACTS</button></div><div class="section-label" id="listLabel">CONVERSATIONS</div><div class="conversation-list" id="conversationList"></div></aside>
<section class="panel phone"><div class="phone-head" id="phoneHead"></div><div class="thread" id="thread"></div><div class="choices" id="choices"></div></section>
<aside class="panel right"><div class="card"><h3>TA VIE SOCIALE</h3><div id="relationCard"></div></div><div class="card mission"><h3>OPPORTUNITÉ ACTIVE</h3><div id="missionCard"></div></div><button class="back" id="backHome">← RETOUR CHEZ MOI</button></aside>
</main>
</div>
<script src="../game-engine.js?v=20260822-phone1"></script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);
if(!window.HCGame){location.href='../chez-moi/';return}
let tab='messages',selected=null;
function state(){return HCGame.get()}
function contacts(s){const names=new Set(s.messages.map(m=>m.from));Object.keys(s.relationships||{}).forEach(n=>names.add(n));return [...names]}
function messageForContact(s,name){return s.messages.filter(m=>m.from===name).sort((a,b)=>new Date(a.receivedAt)-new Date(b.receivedAt))}
function ensureSelected(){const s=state();const list=contacts(s);if(!selected||!list.includes(selected))selected=list[0]||null}
function renderTop(s){$('#money').textContent=money(s.player.money);$('#rep').textContent=s.player.reputation;$('#time').textContent=HCGame.formatDateTime(s,true);$('#unreadCount').textContent=HCGame.unreadCount(s)}
function renderList(s){let html='';if(tab==='messages'){const list=contacts(s);$('#listLabel').textContent='CONVERSATIONS';html=list.map(name=>{const msgs=messageForContact(s,name),last=msgs[msgs.length-1],unread=msgs.some(m=>!m.read);return `<button class="conversation ${selected===name?'active':''}" data-contact="${esc(name)}"><div class="avatar">${esc((last?.avatar||name[0]||'•').slice(0,1))}</div><div><b>${esc(name)}</b><span>${esc(last?.subject||last?.text||'')}</span></div>${unread?'<i class="dot"></i>':''}</button>`}).join('')}else if(tab==='opportunities'){const missions=s.missions.filter(m=>['offered','accepted','in_progress'].includes(m.status));$('#listLabel').textContent='OPPORTUNITÉS';html=missions.length?missions.map(m=>`<button class="conversation" data-mission="${esc(m.id)}"><div class="avatar">✦</div><div><b>${esc(m.title)}</b><span>${esc(m.client)} · ${money(m.reward)}</span></div></button>`).join(''):'<div class="empty"><p>Aucune opportunité pour le moment.</p></div>'}else{$('#listLabel').textContent='CONTACTS';html=contacts(s).map(name=>`<button class="conversation" data-contact="${esc(name)}"><div class="avatar">${esc(name[0]||'•')}</div><div><b>${esc(name)}</b><span>${s.relationships[name]?'Relation suivie':'Contact'}</span></div></button>`).join('')}$('#conversationList').innerHTML=html}
function replyText(choice){return choice==='yes'?'Oui, je peux regarder ça. Envoie-moi les détails ✨':choice==='bold'?'Oui — et j’ai peut-être une idée pour la transformer vraiment.':choice==='later'?'Je suis un peu prise là, mais je te redis très vite.' : choice}
function renderConversation(s){if(!selected){$('#phoneHead').innerHTML='';$('#thread').innerHTML='<div class="empty"><h2>Ton téléphone</h2><p>Les messages, clientes, proches et opportunités professionnelles apparaîtront ici au fil de ta carrière.</p></div>';$('#choices').innerHTML='';return}const msgs=messageForContact(s,selected);const last=msgs[msgs.length-1];$('#phoneHead').innerHTML=`<div class="avatar">${esc((last?.avatar||selected[0]||'•').slice(0,1))}</div><div><h2>${esc(selected)}</h2><p>${s.relationships[selected]?'Relation suivie':'Contact professionnel'}</p></div>`;let bubbles=msgs.map(m=>`<div class="bubble them"><div>${esc(m.text)}</div><small>${HCGame.formatTime(m.receivedAt)}</small></div>`).join('');const replies=(s.phoneReplies||[]).filter(r=>r.to===selected);bubbles+=replies.map(r=>`<div class="bubble me"><div>${esc(r.text)}</div><small>${HCGame.formatTime(r.at)}</small></div>`).join('');$('#thread').innerHTML=bubbles||'<div class="empty"><p>Aucun message.</p></div>';msgs.filter(m=>!m.read).forEach(m=>HCGame.markMessageRead(m.id));const intro=msgs.find(m=>m.action==='offer-first-mission');const mission=s.missions.find(m=>m.id==='mission-ines-robe');let buttons=[];if(intro&&(!mission||mission.status==='offered'))buttons=[['yes','ACCEPTER LA DEMANDE'],['bold','PROPOSER UNE TRANSFORMATION PLUS AMBITIEUSE'],['later','RÉPONDRE PLUS TARD']];else if(mission?.status==='accepted')buttons=[['atelier','OUVRIR LA COMMANDE DANS L’ATELIER']];$('#choices').innerHTML=buttons.map(([v,l],i)=>`<button class="choice ${i===0?'primary':''}" data-reply="${v}">${l}</button>`).join('')}
function renderRight(s){const r=s.relationships[selected];$('#relationCard').innerHTML=r?`<div class="stat"><span>Affinité</span><strong>${r.affinity}</strong></div><div class="stat"><span>Confiance</span><strong>${r.trust}</strong></div><div class="stat"><span>Historique</span><strong>${(r.history||[]).length}</strong></div>`:'<p>Cette relation se développera selon tes choix.</p>';const m=s.missions.find(m=>['offered','accepted','in_progress'].includes(m.status));$('#missionCard').innerHTML=m?`<b>${esc(m.title)}</b><span>${esc(m.client)} · ${money(m.reward)} · ${m.status==='accepted'?'acceptée':'proposée'}</span>`:'<p>Aucune mission active.</p>'}
function render(){const s=state();ensureSelected();renderTop(s);renderList(s);renderConversation(s);renderRight(state())}
function storeReply(to,text){HCGame.mutate(s=>{s.phoneReplies=s.phoneReplies||[];s.phoneReplies.push({id:'reply-'+Date.now(),to,text,at:s.clock.iso})})}
function choose(v){if(v==='atelier'){location.href='../atelier/';return}const s=state();if(v==='yes'||v==='bold'){HCGame.offerFirstMission();HCGame.acceptMission('mission-ines-robe');storeReply('Inès',replyText(v));HCGame.advanceTime(10,'Réponse à Inès');HCGame.mutate(st=>{const r=st.relationships.Inès||(st.relationships.Inès={affinity:0,trust:0,history:[]});if(v==='bold'){r.affinity+=1;r.trust+=1;r.history.push('A proposé une transformation plus ambitieuse')}else{r.trust+=1;r.history.push('A accepté sa demande rapidement')}});HCGame.addMessage({from:'Inès',avatar:'I',subject:'Merci !',text:v==='bold'?"Oh j’adore l’idée. Fais-toi plaisir, j’ai confiance en toi.":"Merci ! Je savais que je pouvais compter sur toi 💛"});}else if(v==='later'){storeReply('Inès',replyText(v));HCGame.advanceTime(5,'Réponse à Inès');HCGame.mutate(st=>{const r=st.relationships.Inès;if(r){r.affinity=Math.max(0,r.affinity-1);r.history.push('A repoussé sa demande')}})}render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render();return}const c=e.target.closest('[data-contact]');if(c){selected=c.dataset.contact;tab='messages';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));render();return}const m=e.target.closest('[data-mission]');if(m){const s=state(),mission=s.missions.find(x=>x.id===m.dataset.mission);if(mission){selected=mission.client;tab='messages';render()}return}const r=e.target.closest('[data-reply]');if(r)choose(r.dataset.reply)});$('#backHome').onclick=()=>location.href='../chez-moi/';render();
})();
</script>
</body>
</html>
