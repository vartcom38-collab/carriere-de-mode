<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eee7">
<title>Haute Couture Live — Téléphone</title>
<style>
:root{--bg:#f5eee7;--paper:#fffaf4;--ink:#241d19;--muted:#806e63;--coral:#e77a68;--rose:#f3d7d1;--teal:#4b8f89;--green:#dfeee8;--line:#eadbcf;--dark:#27211d;--gold:#b99050;--shadow:0 22px 56px rgba(76,53,42,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#fffaf5 0,#f5eee7 52%,#eee3d9 100%);color:var(--ink);font-family:Arial,sans-serif}button{font:inherit}.page{max-width:1580px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:13px}.back{border:1px solid var(--line);background:#fffaf5;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:900;cursor:pointer}.brand h1{margin:0;font:700 clamp(36px,4.2vw,64px)/.9 Georgia,serif}.brand h1 em{font-weight:400;color:var(--coral)}.version{background:#e2f0eb;border-radius:999px;padding:7px 10px;font-size:8px;font-weight:900;color:#3c766f}.shell{display:grid;grid-template-columns:210px minmax(650px,1fr) 300px;gap:12px;min-height:790px}.side,.right{background:rgba(255,250,244,.9);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);padding:13px}.phone-wrap{display:grid;place-items:center;min-width:0}.phone{width:min(100%,760px);height:790px;border:10px solid #28221f;border-radius:42px;background:#fffaf5;box-shadow:0 26px 70px rgba(33,24,20,.22);overflow:hidden;display:flex;flex-direction:column;position:relative}.notch{position:absolute;z-index:20;top:7px;left:50%;transform:translateX(-50%);width:110px;height:20px;border-radius:0 0 15px 15px;background:#28221f}.phonebar{height:47px;padding:11px 17px 7px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #efe2d7;background:#fffdf9;font-size:9px;font-weight:900;position:relative;z-index:5}.screen{flex:1;min-height:0;overflow:auto;background:#fffaf5}.dock{height:72px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf9;padding:6px 8px}.loading{padding:42px 22px;text-align:center;font:17px/1.45 Georgia,serif;color:var(--muted)}.side:empty:before{content:'Chargement des applications…';font:14px Georgia,serif;color:var(--muted)}.right:empty:before{content:'Synchronisation du réseau…';font:14px Georgia,serif;color:var(--muted)}
@media(max-width:980px){.right{display:none}.shell{grid-template-columns:190px minmax(0,1fr)}}
@media(max-width:720px){.page{padding:0}.top,.side,.right{display:none}.shell{display:block;min-height:100vh}.phone-wrap{min-height:100vh}.phone{width:100%;height:100vh;border-width:0;border-radius:0;box-shadow:none}.notch{display:none}.phonebar{padding-top:max(11px,env(safe-area-inset-top));height:calc(47px + env(safe-area-inset-top))}.dock{padding-bottom:max(6px,env(safe-area-inset-bottom));height:calc(72px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><button class="back" onclick="location.href='../chez-moi/'">← CHEZ MOI</button><h1>Téléphone <em>& réseau</em></h1></div>
    <span class="version">SOCIAL V3 · 0 CRÉDIT</span>
  </header>
  <main class="shell">
    <aside class="side"></aside>
    <section class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="phonebar"><span id="hc-clock">09:00</span><span>HC SOCIAL · 0 CRÉDIT</span></div>
        <div class="screen"><div class="loading">Ouverture de ton téléphone…<br><small>Messages, réseau, médias, tendances et opportunités.</small></div></div>
        <nav class="dock"></nav>
      </div>
    </section>
    <aside class="right"></aside>
  </main>
</div>
<script src="../game-engine.js?v=20260823-social-v3"></script>
<script>
(function(){
  const refreshClock=()=>{try{const s=window.HCGame&&HCGame.get();const el=document.getElementById('hc-clock');if(el&&s)el.textContent=HCGame.formatTime(s.clock.iso)}catch(e){}};
  refreshClock();window.addEventListener('hc-game-state',refreshClock);
  setTimeout(()=>{if(!window.HCPhone){const el=document.querySelector('.screen .loading');if(el)el.innerHTML='Le module social tarde à se charger.<br><small>Recharge la page pour relancer la synchronisation.</small>'}},3500);
})();
</script>
</body>
</html>
