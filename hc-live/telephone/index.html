<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Haute Couture Live — Téléphone</title>
<style>
:root{--ink:#111;--muted:#777;--line:#ececec}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f4f1ee;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}.page{height:100dvh;display:grid;place-items:center;padding:12px}.phone{width:min(100%,480px);height:min(900px,calc(100dvh - 24px));background:#fff;border:10px solid #1d1d1f;border-radius:42px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative}.phonebar{height:48px;flex:0 0 auto;display:grid;grid-template-columns:92px 1fr 72px;align-items:end;padding:9px 10px 7px;border-bottom:1px solid var(--line);background:#fff;font-size:11px;font-weight:700;position:relative;z-index:1000}.phonebar .time{text-align:center}.phonebar .status{text-align:right;font-size:9px;color:#555}.homeback{display:block;text-decoration:none;border:0;background:none;text-align:left;padding:0 4px;font-size:11px;line-height:1;color:#111;font-weight:800;position:relative;z-index:1001;pointer-events:auto;touch-action:manipulation}.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:#fff;-webkit-overflow-scrolling:touch;position:relative}.dock{height:66px;flex:0 0 auto;background:#fff;border-top:1px solid var(--line);position:relative;z-index:1000;pointer-events:auto}.loading{height:100%;display:grid;place-items:center;text-align:center;padding:32px;color:#777;font:16px/1.5 Georgia,serif}.loading small{font:11px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.retry{border:0;background:#111;color:#fff;border-radius:8px;padding:10px 14px;margin-top:14px;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}@media(max-width:720px){html,body,.page{background:#fff}.page{padding:0}.phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.phonebar{height:calc(48px + env(safe-area-inset-top));padding-top:max(9px,env(safe-area-inset-top))}.dock{height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}}
</style>
<script>
window.HC_PHONE_MODERN_UI=true;
(function(){const original=Element.prototype.appendChild;Element.prototype.appendChild=function(node){try{if(node&&node.tagName==='SCRIPT'){const src=String(node.src||'');if(src.includes('phone-ui-v2.js')||src.includes('phone-social-ui.js')){if(typeof node.onload==='function')setTimeout(()=>node.onload(),0);return node}}}catch(e){}return original.call(this,node)}})();
</script>
</head>
<body>
<main class="page"><section class="phone"><div class="phonebar"><a class="homeback" id="hc-backlink" href="../chez-moi/">‹ Chez moi</a><span class="time" id="hc-clock">09:00</span><span class="status">TÉLÉPHONE</span></div><div class="screen"><div class="loading" id="hc-loading"><div>Ouverture du téléphone…<br><small>Messages, appels, répondeur, photos et Ateliergram.</small></div></div></div><nav class="dock" id="hc-dock"></nav></section></main>
<script src="../game-engine.js?v=20260824-phone-os1"></script>
<script>
(function(){if(!window.HCGame||!HCGame.storageKey)return;const originalGet=HCGame.get.bind(HCGame);HCGame.get=function(){try{const raw=localStorage.getItem(HCGame.storageKey);if(raw)return JSON.parse(raw)}catch(e){}return originalGet()};const updateClock=()=>{try{const s=HCGame.get(),el=document.getElementById('hc-clock');if(s&&el)el.textContent=HCGame.formatTime(s.clock.iso)}catch(e){}};updateClock();window.addEventListener('hc-game-state',updateClock)})();
</script>
<script src="./phone-photo-bank.js?v=20260824-bank3"></script>
<script src="./phone-photo-bank-v2.js?v=20260824-bank4"></script>
<script src="./phone-personal-media.js?v=20260824-personal1"></script>
<script src="./phone-career-live.js?v=20260824-career2"></script>
<script src="./phone-content-suggestions.js?v=20260824-suggest3"></script>
<script src="./phone-os-v1.js?v=20260824-os1"></script>
<script src="./phone-career-profile-v1.js?v=20260827-career-profile1"></script>
<script src="./phone-responsive-v5.js?v=20260824-responsive6"></script>
<script>setTimeout(()=>{if(!window.__HC_PHONE_OS__){const el=document.getElementById('hc-loading');if(el)el.innerHTML='<div>Le téléphone n\'a pas fini de démarrer.<br><small>Tu peux relancer sans quitter ta partie.</small><br><button class="retry" onclick="location.reload()">Réessayer</button></div>'}},5500)</script>
</body>
</html>
