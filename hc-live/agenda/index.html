<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Couture Live — Agenda</title>
<style>
:root{--paper:#fffaf0;--paper2:#f8ecdc;--ink:#2b211c;--muted:#806f64;--line:#e8d7c6;--coral:#e97b63;--teal:#4b8f89;--gold:#cda15f;--violet:#8c7694;--blue:#6f8ba8;--green:#78947b;--shadow:0 18px 45px rgba(74,48,34,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eadbc9;color:var(--ink);font-family:Arial,sans-serif}body{padding:18px}.book{max-width:1500px;margin:auto;background:var(--paper);border:1px solid #d9c5b1;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;padding:18px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fffaf1,#f9eddf)}.brand{font-weight:900;letter-spacing:.16em;font-size:11px}.title h1{font:48px/.9 Georgia,serif;margin:5px 0}.title h1 em{color:var(--coral);font-weight:400}.subtitle{font:13px Georgia,serif;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.controls button{border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.controls button.active{background:#302721;color:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);background:#fffdf7}.pill{font-size:11px;border:1px dashed #d7c2ad;border-radius:999px;padding:7px 10px}.layout{display:grid;grid-template-columns:58px minmax(0,1fr)}.timecol{border-right:1px solid var(--line);background:#fbf1e5}.timecol .blank{height:66px;border-bottom:1px solid var(--line)}.time{height:64px;border-bottom:1px solid #efe2d6;text-align:center;padding-top:7px;font:11px Georgia,serif;color:#8b776b}.weekWrap{overflow:auto}.week{min-width:900px}.days{display:grid;grid-template-columns:repeat(7,1fr);height:66px;position:sticky;top:0;z-index:8;background:#fffaf0;border-bottom:1px solid var(--line)}.dayHead{padding:9px 8px;border-right:1px solid var(--line);text-align:center}.dayHead b{display:block;font:17px Georgia,serif}.dayHead span{font-size:10px;color:var(--muted)}.dayHead.today{background:#f7ddd2}.grid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:896px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,#efe2d6 64px)}.col{position:relative;border-right:1px solid var(--line)}.event{position:absolute;left:5px;right:5px;border-radius:10px;padding:6px 7px;font-size:10px;line-height:1.2;overflow:hidden;border:1px solid rgba(0,0,0,.08);cursor:pointer;box-shadow:0 3px 8px rgba(80,50,30,.08)}.event b{display:block;font-size:10px;margin-bottom:2px}.event span{font-size:9px}.event.deadline{background:#f3c8bf}.event.activity{background:#d9e7dc}.event.exploration{background:#dbe3ed}.event.mission,.event.work{background:#d4e5e2}.event.personal{background:#eee0ef}.event.important{background:#f1dfb9}.event.past{opacity:.5;filter:saturate(.7)}.month{display:none;padding:18px 22px}.month.open{display:block}.weekView.hidden{display:none}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fffdf8}.monthCell{min-height:120px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}.monthCell.muted{background:#f7efe6;color:#aa988c}.monthCell.today{background:#f7ddd2}.dateNum{font:18px Georgia,serif}.mini{margin-top:5px;padding:4px 6px;border-radius:7px;background:#eee0d4;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend{display:flex;gap:7px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line);background:#fffaf3}.legend span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.back{margin-left:auto;background:#302721!important;color:white!important}.overlay{position:fixed;inset:0;background:#241a1577;display:none;place-items:center;padding:20px;z-index:50}.overlay.open{display:grid}.card{width:min(520px,92vw);background:#fffaf0;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.card h2{font:30px Georgia,serif;margin:0 0 7px}.card p{font:14px/1.5 Georgia,serif;color:#65564d;white-space:pre-line}.card button{width:100%;border:0;border-radius:12px;background:#302721;color:#fff;padding:11px;font-weight:900;cursor:pointer;margin-top:12px}@media(max-width:700px){body{padding:8px}.top{align-items:flex-start;flex-direction:column}.title h1{font-size:40px}.layout{grid-template-columns:48px}.timecol .blank{height:62px}.days{height:62px}.monthCell{min-height:90px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<div class="book">
<header class="top"><div><div class="brand">HAUTE COUTURE ✦ LIVE</div><div class="title"><h1>MON <em>agenda</em></h1></div><div class="subtitle" id="rangeLabel">Ma semaine</div></div><div class="controls"><button id="prev">‹</button><button id="todayBtn">AUJOURD’HUI</button><button id="next">›</button><button id="weekBtn" class="active">SEMAINE</button><button id="monthBtn">MOIS</button><button class="back" id="back">⌂ CHEZ MOI</button></div></header>
<div class="stats"><div class="pill" id="clock">—</div><div class="pill" id="city">—</div><div class="pill" id="count">0 événement</div></div>
<section class="weekView" id="weekView"><div class="layout"><div class="timecol" id="times"><div class="blank"></div></div><div class="weekWrap"><div class="week"><div class="days" id="days"></div><div class="grid" id="grid"></div></div></div></div></section>
<section class="month" id="monthView"><div class="monthGrid" id="monthGrid"></div></section>
<div class="legend"><span>🧵 Travail / mission</span><span>⏰ Deadline</span><span>☕ Personnel</span><span>⌖ Sortie / exploration</span><span>✦ Important</span></div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 id="evTitle"></h2><p id="evBody"></p><button id="close">FERMER</button></div></div>
<script src="../game-engine.js?v=20260822-agenda1"></script>
<script>
(function(){
const $=s=>document.querySelector(s),DAY=86400000;let mode='week',cursor=new Date(HCGame.get().clock.iso);cursor.setHours(12,0,0,0);
const monday=d=>{const x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x};
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const fmtDay=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'short'}).format(d);
const cat=e=>{const t=(e.type||'').toLowerCase();if(t.includes('deadline'))return'deadline';if(t.includes('explor'))return'exploration';if(t.includes('mission')||t.includes('work')||t.includes('activity'))return t==='activity'?'activity':'mission';if(t.includes('important'))return'important';return'personal'};
function renderTimes(){let h='';for(let i=8;i<22;i++)h+=`<div class="time">${String(i).padStart(2,'0')}:00</div>`;$('#times').innerHTML='<div class="blank"></div>'+h}
function renderWeek(){const s=HCGame.get(),start=monday(cursor),now=new Date(s.clock.iso);$('#clock').textContent='🕒 '+HCGame.formatDateTime(s,true);$('#city').textContent='⌖ '+s.player.city;$('#rangeLabel').textContent=`Semaine du ${new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'long'}).format(start)}`;let heads='',cols='';for(let i=0;i<7;i++){const d=new Date(start.getTime()+i*DAY);heads+=`<div class="dayHead ${same(d,now)?'today':''}"><b>${fmtDay(d).split(' ')[0]}</b><span>${new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short'}).format(d)}</span></div>`;cols+=`<div class="col" data-day="${i}"></div>`}$('#days').innerHTML=heads;$('#grid').innerHTML=cols;const events=s.calendar||[];let shown=0;events.forEach(e=>{const d=new Date(e.start);const idx=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/DAY);if(idx<0||idx>6)return;const hour=d.getHours()+d.getMinutes()/60;if(hour<8||hour>=22)return;const end=e.end?new Date(e.end):new Date(d.getTime()+60*60000);const dur=Math.max(.5,(end-d)/3600000);const top=(hour-8)*64,height=Math.max(30,dur*64-4),cl=cat(e);const el=document.createElement('button');el.className=`event ${cl} ${d<now?'past':''}`;el.style.top=top+'px';el.style.height=height+'px';el.dataset.id=e.id;el.innerHTML=`<b>${e.title}</b><span>${HCGame.formatTime(e.start)}${e.location?' · '+e.location:''}</span>`;$('#grid').children[idx].appendChild(el);shown++});$('#count').textContent=shown+' événement'+(shown>1?'s':'')}
function renderMonth(){const s=HCGame.get(),base=new Date(cursor.getFullYear(),cursor.getMonth(),1),first=monday(base),now=new Date(s.clock.iso);$('#rangeLabel').textContent=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(base);let html='';for(let i=0;i<42;i++){const d=new Date(first.getTime()+i*DAY),inside=d.getMonth()===base.getMonth(),ev=(s.calendar||[]).filter(e=>same(new Date(e.start),d)).slice(0,3);html+=`<div class="monthCell ${inside?'':'muted'} ${same(d,now)?'today':''}"><div class="dateNum">${d.getDate()}</div>${ev.map(e=>`<div class="mini" data-id="${e.id}">${e.title}</div>`).join('')}</div>`}$('#monthGrid').innerHTML=html;$('#count').textContent=(s.calendar||[]).filter(e=>new Date(e.start).getMonth()===base.getMonth()&&new Date(e.start).getFullYear()===base.getFullYear()).length+' événements'}
function render(){if(mode==='week')renderWeek();else renderMonth()}
function openEvent(id){const s=HCGame.get(),e=(s.calendar||[]).find(x=>x.id===id);if(!e)return;$('#evTitle').textContent=e.title;$('#evBody').textContent=`${HCGame.formatDateTime({clock:{iso:e.start}},true)}${e.end?'\nFin : '+HCGame.formatDateTime({clock:{iso:e.end}},true):''}${e.location?'\nLieu : '+e.location:''}\nType : ${e.type||'événement'}\nStatut : ${e.status||'prévu'}`;$('#overlay').classList.add('open')}
$('#prev').onclick=()=>{cursor.setDate(cursor.getDate()+(mode==='week'?-7:-30));render()};$('#next').onclick=()=>{cursor.setDate(cursor.getDate()+(mode==='week'?7:30));render()};$('#todayBtn').onclick=()=>{cursor=new Date(HCGame.get().clock.iso);render()};$('#weekBtn').onclick=()=>{mode='week';$('#weekBtn').classList.add('active');$('#monthBtn').classList.remove('active');$('#weekView').classList.remove('hidden');$('#monthView').classList.remove('open');render()};$('#monthBtn').onclick=()=>{mode='month';$('#monthBtn').classList.add('active');$('#weekBtn').classList.remove('active');$('#weekView').classList.add('hidden');$('#monthView').classList.add('open');render()};$('#back').onclick=()=>location.href='../chez-moi/';document.addEventListener('click',e=>{const n=e.target.closest('[data-id]');if(n)openEvent(n.dataset.id)});$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')};window.addEventListener('hc-game-state',render);renderTimes();render();
})();
</script>
</body></html>
