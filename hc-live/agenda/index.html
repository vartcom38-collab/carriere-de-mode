<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haute Couture Live — Agenda</title>
<style>
:root{--paper:#fffaf0;--paper2:#f8ecdc;--ink:#2b211c;--muted:#806f64;--line:#e8d7c6;--coral:#e97b63;--teal:#4b8f89;--gold:#cda15f;--violet:#8c7694;--blue:#6f8ba8;--green:#78947b;--shadow:0 18px 45px rgba(74,48,34,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eadbc9;color:var(--ink);font-family:Arial,sans-serif}body{padding:18px}.book{max-width:1500px;margin:auto;background:var(--paper);border:1px solid #d9c5b1;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;padding:18px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fffaf1,#f9eddf)}.brand{font-weight:900;letter-spacing:.16em;font-size:11px}.title h1{font:48px/.9 Georgia,serif;margin:5px 0}.title h1 em{color:var(--coral);font-weight:400}.subtitle{font:13px Georgia,serif;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.controls button{border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.controls button.active{background:#302721;color:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);background:#fffdf7}.pill{font-size:11px;border:1px dashed #d7c2ad;border-radius:999px;padding:7px 10px}.layout{display:grid;grid-template-columns:58px minmax(0,1fr)}.timecol{border-right:1px solid var(--line);background:#fbf1e5}.timecol .blank{height:66px;border-bottom:1px solid var(--line)}.time{height:64px;border-bottom:1px solid #efe2d6;text-align:center;padding-top:7px;font:11px Georgia,serif;color:#8b776b}.weekWrap{overflow:auto}.week{min-width:900px}.days{display:grid;grid-template-columns:repeat(7,1fr);height:66px;position:sticky;top:0;z-index:8;background:#fffaf0;border-bottom:1px solid var(--line)}.dayHead{padding:9px 8px;border-right:1px solid var(--line);text-align:center}.dayHead b{display:block;font:17px Georgia,serif}.dayHead span{font-size:10px;color:var(--muted)}.dayHead.today{background:#f7ddd2}.grid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:896px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,#efe2d6 64px)}.col{position:relative;border-right:1px solid var(--line)}.col.dropzone{background:#f6ede2}.event{position:absolute;left:5px;right:5px;border-radius:10px;padding:6px 7px;font-size:10px;line-height:1.2;overflow:hidden;border:1px solid rgba(0,0,0,.08);cursor:grab;box-shadow:0 3px 8px rgba(80,50,30,.08);touch-action:none;user-select:none}.event:active{cursor:grabbing}.event.dragging{opacity:.55;outline:2px solid #302721;z-index:20}.event b{display:block;font-size:10px;margin-bottom:2px}.event span{font-size:9px}.event.deadline{background:#f3c8bf}.event.activity{background:#d9e7dc}.event.exploration{background:#dbe3ed}.event.mission,.event.work{background:#d4e5e2}.event.personal{background:#eee0ef}.event.important{background:#f1dfb9}.event.past{opacity:.5;filter:saturate(.7)}.month{display:none;padding:18px 22px}.month.open{display:block}.weekView.hidden{display:none}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fffdf8}.monthCell{min-height:120px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}.monthCell.muted{background:#f7efe6;color:#aa988c}.monthCell.today{background:#f7ddd2}.dateNum{font:18px Georgia,serif}.mini{margin-top:5px;padding:4px 6px;border-radius:7px;background:#eee0d4;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.legend{display:flex;gap:7px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line);background:#fffaf3}.legend span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.back{margin-left:auto;background:#302721!important;color:white!important}.overlay{position:fixed;inset:0;background:#241a1577;display:none;place-items:center;padding:20px;z-index:50}.overlay.open{display:grid}.card{width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fffaf0;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.card h2{font:30px Georgia,serif;margin:0 0 7px}.meta{display:grid;gap:7px;margin:12px 0}.meta div{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}.desc{font:14px/1.5 Georgia,serif;color:#65564d;white-space:pre-line}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{border:0;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}.primary{background:#302721;color:#fff}.soft{background:#efe2d6;color:#302721}.danger{background:#f3c8bf;color:#6f2d24}.editor{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.editor.open{display:block}.editor label{display:block;font-size:10px;font-weight:800;margin:8px 0 4px}.editor input,.editor textarea{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:10px;padding:9px}.hint{font-size:10px;color:var(--muted);padding:7px 22px 0}@media(max-width:700px){body{padding:8px}.top{align-items:flex-start;flex-direction:column}.title h1{font-size:40px}.layout{grid-template-columns:48px}.timecol .blank{height:62px}.days{height:62px}.monthCell{min-height:90px}.controls{justify-content:flex-start}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="book">
<header class="top"><div><div class="brand">HAUTE COUTURE ✦ LIVE</div><div class="title"><h1>MON <em>agenda</em></h1></div><div class="subtitle" id="rangeLabel">Ma semaine</div></div><div class="controls"><button id="prev">‹</button><button id="todayBtn">AUJOURD’HUI</button><button id="next">›</button><button id="weekBtn" class="active">SEMAINE</button><button id="monthBtn">MOIS</button><button class="back" id="back">⌂ CHEZ MOI</button></div></header>
<div class="stats"><div class="pill" id="clock">—</div><div class="pill" id="city">—</div><div class="pill" id="count">0 événement</div></div>
<div class="hint">Astuce : attrape un rendez-vous et fais-le glisser vers un autre jour ou une autre heure. Tu peux aussi cliquer dessus pour le modifier ou l’annuler.</div>
<section class="weekView" id="weekView"><div class="layout"><div class="timecol" id="times"><div class="blank"></div></div><div class="weekWrap"><div class="week"><div class="days" id="days"></div><div class="grid" id="grid"></div></div></div></div></section>
<section class="month" id="monthView"><div class="monthGrid" id="monthGrid"></div></section>
<div class="legend"><span>🧵 Travail / mission</span><span>⏰ Échéance</span><span>☕ Personnel</span><span>⌖ Sortie / exploration</span><span>✦ Important</span></div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 id="evTitle"></h2><p class="desc" id="evDesc"></p><div class="meta" id="evMeta"></div><div class="actions"><button class="soft" id="editBtn">MODIFIER</button><button class="danger" id="cancelBtn">ANNULER L’ÉVÉNEMENT</button><button class="primary" id="close">FERMER</button></div><div class="editor" id="editor"><label>Début</label><input type="datetime-local" id="editStart"><label>Fin</label><input type="datetime-local" id="editEnd"><label>Lieu</label><input id="editLocation"><label>Notes</label><textarea id="editNotes" rows="4"></textarea><button class="primary" id="saveEdit" style="width:100%;margin-top:10px">ENREGISTRER</button></div></div></div>
<script src="../game-engine.js?v=20260824-agenda2"></script>
<script>
(function(){
const $=s=>document.querySelector(s),DAY=86400000;let mode='week',cursor=new Date(HCGame.get().clock.iso),openId=null,drag=null;cursor.setHours(12,0,0,0);
const monday=d=>{const x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x};
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const fmtDay=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'short'}).format(d);
const typeFR=t=>{t=String(t||'').toLowerCase();if(t.includes('deadline'))return'Échéance';if(t.includes('explor'))return'Sortie / exploration';if(t.includes('mission'))return'Mission';if(t.includes('work'))return'Travail';if(t.includes('activity'))return'Activité';if(t.includes('important'))return'Important';return'Personnel'};
const statusFR=s=>({planned:'Prévu',scheduled:'Prévu',accepted:'Accepté',in_progress:'En cours',done:'Terminé',completed:'Terminé',cancelled:'Annulé',canceled:'Annulé'})[s]||'Prévu';
const cat=e=>{const t=(e.type||'').toLowerCase();if(t.includes('deadline'))return'deadline';if(t.includes('explor'))return'exploration';if(t.includes('mission')||t.includes('work')||t.includes('activity'))return t==='activity'?'activity':'mission';if(t.includes('important'))return'important';return'personal'};
const toLocalInput=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function renderTimes(){let h='';for(let i=8;i<22;i++)h+=`<div class="time">${String(i).padStart(2,'0')}:00</div>`;$('#times').innerHTML='<div class="blank"></div>'+h}
function renderWeek(){const s=HCGame.get(),start=monday(cursor),now=new Date(s.clock.iso);$('#clock').textContent='🕒 '+HCGame.formatDateTime(s,true);$('#city').textContent='⌖ '+s.player.city;$('#rangeLabel').textContent=`Semaine du ${new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'long'}).format(start)}`;let heads='',cols='';for(let i=0;i<7;i++){const d=new Date(start.getTime()+i*DAY);heads+=`<div class="dayHead ${same(d,now)?'today':''}"><b>${fmtDay(d).split(' ')[0]}</b><span>${new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short'}).format(d)}</span></div>`;cols+=`<div class="col" data-day="${i}"></div>`}$('#days').innerHTML=heads;$('#grid').innerHTML=cols;let shown=0;(s.calendar||[]).filter(e=>!['cancelled','canceled'].includes(e.status)).forEach(e=>{const d=new Date(e.start),idx=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/DAY);if(idx<0||idx>6)return;const hour=d.getHours()+d.getMinutes()/60;if(hour<8||hour>=22)return;const end=e.end?new Date(e.end):new Date(d.getTime()+60*60000),dur=Math.max(.5,(end-d)/3600000),top=(hour-8)*64,height=Math.max(30,dur*64-4);const el=document.createElement('div');el.className=`event ${cat(e)} ${d<now?'past':''}`;el.style.top=top+'px';el.style.height=height+'px';el.dataset.id=e.id;el.innerHTML=`<b>${e.title}</b><span>${HCGame.formatTime(e.start)}${e.location?' · '+e.location:''}</span>`;bindDrag(el,e,start);$('#grid').children[idx].appendChild(el);shown++});$('#count').textContent=shown+' événement'+(shown>1?'s':'')}
function bindDrag(el,e,startWeek){el.addEventListener('pointerdown',ev=>{if(ev.button!==undefined&&ev.button!==0)return;drag={id:e.id,startX:ev.clientX,startY:ev.clientY,moved:false,startWeek};el.setPointerCapture?.(ev.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',ev=>{if(!drag||drag.id!==e.id)return;if(Math.hypot(ev.clientX-drag.startX,ev.clientY-drag.startY)>7)drag.moved=true;if(drag.moved){document.querySelectorAll('.col').forEach(c=>c.classList.remove('dropzone'));const under=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.col');under?.classList.add('dropzone')}});el.addEventListener('pointerup',ev=>{if(!drag||drag.id!==e.id)return;el.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('dropzone'));const moved=drag.moved;const under=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.col');if(moved&&under){const rect=under.getBoundingClientRect(),day=Number(under.dataset.day),mins=Math.max(0,Math.min(13*60,Math.round(((ev.clientY-rect.top)/64*60)/15)*15)),hour=8+Math.floor(mins/60),minute=mins%60,newStart=new Date(drag.startWeek.getTime()+day*DAY);newStart.setHours(hour,minute,0,0);reschedule(e.id,newStart)}else if(!moved)openEvent(e.id);drag=null})}
function reschedule(id,newStart){HCGame.mutate(s=>{const e=(s.calendar||[]).find(x=>x.id===id);if(!e)return;const oldStart=new Date(e.start),oldEnd=e.end?new Date(e.end):new Date(oldStart.getTime()+3600000),dur=Math.max(15*60000,oldEnd-oldStart);e.start=newStart.toISOString();e.end=new Date(newStart.getTime()+dur).toISOString();e.status=e.status==='cancelled'?'planned':e.status;e.updatedAt=s.clock?.iso||new Date().toISOString()});render()}
function renderMonth(){const s=HCGame.get(),base=new Date(cursor.getFullYear(),cursor.getMonth(),1),first=monday(base),now=new Date(s.clock.iso);$('#rangeLabel').textContent=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(base);let html='';for(let i=0;i<42;i++){const d=new Date(first.getTime()+i*DAY),inside=d.getMonth()===base.getMonth(),ev=(s.calendar||[]).filter(e=>!['cancelled','canceled'].includes(e.status)&&same(new Date(e.start),d)).slice(0,4);html+=`<div class="monthCell ${inside?'':'muted'} ${same(d,now)?'today':''}"><div class="dateNum">${d.getDate()}</div>${ev.map(e=>`<div class="mini" data-id="${e.id}">${HCGame.formatTime(e.start)} · ${e.title}</div>`).join('')}</div>`}$('#monthGrid').innerHTML=html;$('#count').textContent=(s.calendar||[]).filter(e=>!['cancelled','canceled'].includes(e.status)&&new Date(e.start).getMonth()===base.getMonth()&&new Date(e.start).getFullYear()===base.getFullYear()).length+' événements'}
function render(){if(mode==='week')renderWeek();else renderMonth()}
function openEvent(id){const s=HCGame.get(),e=(s.calendar||[]).find(x=>x.id===id);if(!e)return;openId=id;$('#evTitle').textContent=e.title;$('#evDesc').textContent=e.description||e.notes||'Aucune note supplémentaire pour cet événement.';$('#evMeta').innerHTML=`<div><b>Date et heure</b><br>${new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(e.start))}${e.end?' — '+new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date(e.end)):''}</div><div><b>Lieu</b><br>${e.location||'Non précisé'}</div><div><b>Catégorie</b><br>${typeFR(e.type)}</div><div><b>Statut</b><br>${statusFR(e.status)}</div>${e.client?`<div><b>Cliente / contact</b><br>${e.client}</div>`:''}`;$('#editStart').value=toLocalInput(e.start);$('#editEnd').value=toLocalInput(e.end);$('#editLocation').value=e.location||'';$('#editNotes').value=e.notes||e.description||'';$('#editor').classList.remove('open');$('#overlay').classList.add('open')}
function saveEdit(){if(!openId)return;const st=$('#editStart').value,en=$('#editEnd').value;HCGame.mutate(s=>{const e=(s.calendar||[]).find(x=>x.id===openId);if(!e)return;if(st)e.start=new Date(st).toISOString();if(en)e.end=new Date(en).toISOString();e.location=$('#editLocation').value.trim();e.notes=$('#editNotes').value.trim();e.description=e.notes;e.updatedAt=s.clock?.iso||new Date().toISOString()});$('#overlay').classList.remove('open');render()}
function cancelEvent(){if(!openId)return;if(!confirm('Annuler cet événement ? Il disparaîtra de l’agenda, mais restera mémorisé dans la partie.'))return;HCGame.mutate(s=>{const e=(s.calendar||[]).find(x=>x.id===openId);if(e){e.status='cancelled';e.cancelledAt=s.clock?.iso||new Date().toISOString()}});$('#overlay').classList.remove('open');render()}
$('#prev').onclick=()=>{cursor.setDate(cursor.getDate()+(mode==='week'?-7:-30));render()};$('#next').onclick=()=>{cursor.setDate(cursor.getDate()+(mode==='week'?7:30));render()};$('#todayBtn').onclick=()=>{cursor=new Date(HCGame.get().clock.iso);render()};$('#weekBtn').onclick=()=>{mode='week';$('#weekBtn').classList.add('active');$('#monthBtn').classList.remove('active');$('#weekView').classList.remove('hidden');$('#monthView').classList.remove('open');render()};$('#monthBtn').onclick=()=>{mode='month';$('#monthBtn').classList.add('active');$('#weekBtn').classList.remove('active');$('#weekView').classList.add('hidden');$('#monthView').classList.add('open');render()};$('#back').onclick=()=>location.href='../chez-moi/';document.addEventListener('click',e=>{const n=e.target.closest('.mini[data-id]');if(n)openEvent(n.dataset.id)});$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#editBtn').onclick=()=>$('#editor').classList.toggle('open');$('#saveEdit').onclick=saveEdit;$('#cancelBtn').onclick=cancelEvent;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')};window.addEventListener('hc-game-state',render);renderTimes();render();
})();
</script>
</body></html>
