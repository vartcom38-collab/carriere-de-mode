<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Finitions</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86}*{box-sizing:border-box}body{margin:0;background:#efe5dc;color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:#df7864}h1{font:44px/1 Georgia,serif;margin:9px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:840px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:#fff}.theory,.task{padding:14px;border-radius:14px;font:13px/1.55 Georgia,serif}.theory{background:#edf4f2}.task{background:#f4ece6;margin-top:12px}.notes{width:100%;min-height:160px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.dark{background:#29211d!important}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · CONSTRUCTION · FINITIONS</div><h1>Une finition est une décision de construction</h1><p class="lead">On apprend à choisir une finition en fonction de la matière, de l’usage, de l’épaisseur et de l’ordre de montage. Le but n’est pas de mémoriser toutes les finitions existantes.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="work"><div id="theory" class="theory"></div><div id="task" class="task"></div><textarea id="notes" class="notes" placeholder="Tes essais, comparaisons, raisons de choix…"></textarea><div class="actions"><button id="save">ENREGISTRER</button><button class="dark" onclick="location.href='../school-day/'">RETOUR</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const KEY='haute-couture-finishings-lab-v1';const steps=[{id:'hem',title:'01 · Ourlet',theory:'Un ourlet stabilise un bord et ajoute de l’épaisseur. Sa largeur, son mode de fixation et le comportement de la matière changent le tombé.',task:'Compare mentalement ou physiquement un ourlet étroit, moyen et large sur une matière souple. Note lequel risque de rigidifier le plus le bas du vêtement.'},{id:'facing',title:'02 · Parementure',theory:'La parementure reproduit une zone du vêtement pour finir proprement un bord, par exemple une encolure. Elle doit être stabilisée et ne pas rouler vers l’extérieur.',task:'Dessine une encolure simple et imagine la forme de la parementure correspondante. Note les zones où des crans ou dégarnissages seraient utiles.'},{id:'bias',title:'03 · Biais',theory:'Une bande coupée dans le biais peut épouser une courbe grâce à sa déformabilité. Elle peut border, finir ou enfermer un bord.',task:'Sur papier, trace une courbe d’encolure et explique pourquoi une bande droite serait moins adaptée qu’une bande coupée dans le biais.'},{id:'zip',title:'04 · Fermeture à glissière',theory:'Une fermeture à glissière demande une ouverture préparée, des valeurs de couture cohérentes et un ordre de montage précis. Son type dépend aussi de l’usage et de la matière.',task:'Compare une fermeture visible et une fermeture discrète sur un même vêtement. Note ce que cela change visuellement et techniquement.'},{id:'buttons',title:'05 · Boutonnage',theory:'Un boutonnage impose recouvrement, maintien, espacement et résistance. Le bouton et la boutonnière doivent être dimensionnés ensemble.',task:'Imagine une chemise avec 5 puis 8 boutons. Qu’est-ce que cela change dans le rythme visuel, l’ouverture et la tenue ?'},{id:'inside',title:'06 · Intérieur du vêtement',theory:'L’intérieur révèle la qualité du montage : marges maîtrisées, fils coupés, coutures régulières, finitions compatibles avec l’usage.',task:'Crée ta propre checklist de 8 points pour juger l’intérieur d’un vêtement avant rendu.'}];let current=0;function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}}function render(){const d=read(),s=steps[current];document.getElementById('steps').innerHTML=steps.map((x,i)=>`<div class="step ${i===current?'active':''}" data-i="${i}"><b>${x.title}</b></div>`).join('');theory.innerHTML='<b>À COMPRENDRE</b><br>'+s.theory;task.innerHTML='<b>EXERCICE</b><br>'+s.task;notes.value=d[s.id]?.notes||'';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{current=Number(x.dataset.i);render()})}save.onclick=()=>{const d=read(),s=steps[current];d[s.id]={notes:notes.value,savedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d));msg.textContent='Travail enregistré.';if(window.HCKnowledge)HCKnowledge.practice('construction:finish:'+s.id,{source:'school',label:s.title})};render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
