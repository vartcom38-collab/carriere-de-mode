<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Dossier scolaire de Marion</title><style>:root{--ink:#251e1a;--muted:#75665d;--line:#dfd0c4;--paper:#fffaf4;--coral:#df7864;--teal:#4d8d86}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f1ea,#ede1d6);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:48px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.18em;color:var(--coral)}h1{font:50px/1 Georgia,serif;margin:10px 0}.lead{font:16px/1.6 Georgia,serif;color:var(--muted);max-width:800px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}.stat b{display:block;font:31px Georgia,serif}.stat span{font:10px Arial;font-weight:900;color:var(--muted);letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card h2{font:27px Georgia,serif;margin:0 0 12px}.item{border-top:1px solid var(--line);padding:13px 0}.item:first-of-type{border-top:0}.meta{font:900 9px Arial;letter-spacing:.08em;color:var(--coral)}.title{font:18px Georgia,serif;margin:5px 0}.text{font:13px/1.55 Georgia,serif;color:var(--muted);white-space:pre-wrap}.rubric{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-top:8px;font:12px Georgia,serif}.pill{display:inline-block;border-radius:999px;background:#edf4f1;color:#426d63;padding:6px 9px;font:800 9px Arial;margin:4px 4px 0 0}.empty{font:13px/1.6 Georgia,serif;color:var(--muted);padding:12px 0}.btn{border:0;border-radius:11px;padding:9px 11px;background:#29211d;color:white;font-weight:900;cursor:pointer;margin-top:8px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:41px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · PARCOURS DE MARION</div><h1>Mon dossier scolaire</h1><p class="lead">Ce dossier ne résume pas Marion à une moyenne. Il garde les travaux rendus, les corrections, ce que les professeurs voient progresser et les points qui reviennent encore.</p><section class="stats" id="stats"></section><section class="grid"><article class="card"><h2>Évaluations</h2><div id="grades"></div></article><article class="card"><h2>Mémoire des professeurs</h2><div id="teachers"></div></article><article class="card"><h2>Projets & portfolio</h2><div id="projects"></div></article><article class="card"><h2>Table de semestre</h2><div id="semester"></div></article></section></main><script src="../school/school-academic-v1.js"></script><script src="../school/school-learning-memory-v1.js"></script><script>(function(){const A=window.HCSchoolAcademic,M=window.HCSchoolLearningMemory,a=A.state(),m=M.state();const avg=a.grades.length?Math.round(a.grades.reduce((n,g)=>n+Number(g.value||0),0)/a.grades.length*10)/10:'—';const portfolio=m.projectHistory.filter(p=>p.portfolio).length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${a.year}</b><span>ANNÉE</span></div><div class="stat"><b>${avg}</b><span>MOYENNE /20</span></div><div class="stat"><b>${a.grades.length}</b><span>ÉVALUATIONS</span></div><div class="stat"><b>${portfolio}</b><span>PROJETS AU PORTFOLIO</span></div>`;const grades=document.getElementById('grades');if(!a.grades.length)grades.innerHTML='<div class="empty">Les évaluations apparaîtront ici avec leurs commentaires et leurs grilles.</div>';else a.grades.slice(0,20).forEach(g=>{const d=document.createElement('div');d.className='item';const rub=g.rubric&&typeof g.rubric==='object'?Object.entries(g.rubric):[];d.innerHTML=`<div class="meta">ANNÉE ${g.year||1}${g.teacher?' · '+g.teacher:''}</div><div class="title"></div><div><strong>${g.value}/20</strong></div><div class="text"></div><div class="rubric"></div>`;d.querySelector('.title').textContent=g.title;d.querySelector('.text').textContent=g.feedback||'';const r=d.querySelector('.rubric');rub.forEach(([k,v])=>{const a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=String(v);r.append(a,b)});grades.appendChild(d)});const teachers=document.getElementById('teachers'),ts=Object.values(m.teacherMemory);if(!ts.length)teachers.innerHTML='<div class="empty">Les professeurs commenceront à se souvenir des forces, difficultés et progrès de Marion au fil des corrections.</div>';else ts.forEach(t=>{const d=document.createElement('div');d.className='item';const strengths=Object.entries(t.strengths||{}).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]),watch=Object.entries(t.watch||{}).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]);d.innerHTML=`<div class="meta">PROFESSEUR</div><div class="title"></div><div class="text latest"></div><div class="chips"></div>`;d.querySelector('.title').textContent=t.teacher;d.querySelector('.latest').textContent=t.notes?.[0]?.text||'Mémoire pédagogique en construction.';const c=d.querySelector('.chips');strengths.forEach(x=>{const p=document.createElement('span');p.className='pill';p.textContent='Force · '+x;c.appendChild(p)});watch.forEach(x=>{const p=document.createElement('span');p.className='pill';p.textContent='À travailler · '+x;c.appendChild(p)});teachers.appendChild(d)});const projects=document.getElementById('projects');if(!m.projectHistory.length)projects.innerHTML='<div class="empty">Les grands projets seront conservés ici : brief, pistes abandonnées, rendu, note et feedback.</div>';else m.projectHistory.slice(0,20).forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="meta">ANNÉE ${p.year}</div><div class="title"></div><div class="text"></div><button class="btn"></button>`;d.querySelector('.title').textContent=p.title;d.querySelector('.text').textContent=p.feedback||p.brief||'Projet conservé dans le parcours.';const b=d.querySelector('.btn');b.textContent=p.portfolio?'RETIRER DU PORTFOLIO':'GARDER POUR LE PORTFOLIO';b.onclick=()=>{M.togglePortfolio(p.id);location.reload()};projects.appendChild(d)});const semester=document.getElementById('semester'),existing=m.semesterTables.find(x=>x.year===a.year&&x.semester===a.semester);if(existing){semester.innerHTML=`<div class="item"><div class="meta">ANNÉE ${existing.year} · SEMESTRE ${existing.semester}</div><div class="title">Table de travail enregistrée</div><div class="text">${existing.projects.length} projets · ${existing.research.length} traces de recherche · ${existing.teacherNotes.length} retours de professeurs.</div></div>`}else{semester.innerHTML='<div class="empty">À la fin du semestre, Marion pourra figer une table de travail représentant ce qu’elle a réellement vécu.</div><button class="btn" id="build">CRÉER MA TABLE DE SEMESTRE</button>';document.getElementById('build').onclick=()=>{M.buildSemesterTable(a.year,a.semester);location.reload()}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
