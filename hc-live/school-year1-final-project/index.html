<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet final Année 1</title><style>body{margin:0;background:#f3ece5;color:#2a211d;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:42px 18px 80px}h1{font:44px Georgia,serif;margin:8px 0 20px}.lead{font:15px/1.6 Georgia,serif;color:#6f6058}.step{background:#fffaf5;border:1px solid #ddcec3;border-radius:18px;padding:18px;margin:12px 0}.step h2{font:23px Georgia,serif;margin:0 0 8px}.step p{font:13px/1.55 Georgia,serif;color:#6a5b53}.step textarea{width:100%;min-height:120px;border:1px solid #dacbc0;border-radius:12px;padding:12px;background:white;font:14px/1.5 Georgia,serif;box-sizing:border-box}.done{background:#edf4ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#2d2723;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#4d8d86}.note{padding:12px 14px;border-radius:14px;background:#2d2723;color:#fff;font:12px/1.5 Georgia,serif}</style></head><body><main class="wrap"><div class="lead">ÉCOLE · ANNÉE 1 · PROJET FINAL</div><h1>Projet 08 — dossier final</h1><div class="note">Tu peux prendre autant de temps réel que tu veux. Rien n’avance automatiquement. Les matières ou techniques inconnues peuvent être notées comme pistes, mais pas considérées comme maîtrisées.</div><div id="steps"></div><div class="actions"><button class="btn alt" id="save">ENREGISTRER</button><button class="btn" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div></main><script>(function(){const key='haute-couture-school-year1-final-project-v1';const defs=[['question','Question de départ','Quelle question veux-tu vraiment explorer ?'],['research','Recherche sélectionnée','Quelles références, observations ou découvertes servent vraiment cette question ?'],['directions','Directions','Développe au moins trois directions différentes avant de choisir.'],['choice','Sélection','Quelle direction gardes-tu et pourquoi ?'],['materials','Matières connues','Quelles matières déjà rencontrées peux-tu utiliser ? Quelles pistes restent encore inconnues ?'],['tests','Essais / prototypes','Quels essais vas-tu faire avant la version finale ?'],['construction','Construction / volume','Comment la pièce ou la silhouette tient-elle techniquement ?'],['fitting','Essayage / diagnostic','Quels défauts ou tensions observes-tu ?'],['corrections','Corrections','Qu’est-ce que tu modifies après les essais ?'],['final','Version finale','Décris le résultat final sans effacer le processus.'],['presentation','Présentation','Quels éléments montreras-tu au jury et dans quel ordre ?'],['reflection','Bilan personnel','Qu’as-tu appris, et qu’est-ce qui reste encore à découvrir ?']];let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){state={}}const root=document.getElementById('steps');root.innerHTML=defs.map(([id,t,p])=>`<section class="step ${state[id]?'done':''}"><h2>${t}</h2><p>${p}</p><textarea data-id="${id}">${state[id]||''}</textarea></section>`).join('');function save(){document.querySelectorAll('textarea[data-id]').forEach(x=>state[x.dataset.id]=x.value.trim());state.updatedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(state));document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('done',!!state[defs[i][0]]));}document.getElementById('save').onclick=save;})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
