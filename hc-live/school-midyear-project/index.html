<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet mi-année</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:9px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:850px}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-top:20px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}.step{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.step.active{background:#2d2723;color:white}.work textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.55 Georgia,serif}.theory{padding:14px;background:#edf4f2;border-radius:14px;font:13px/1.55 Georgia,serif;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900}.dark{background:#29211d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · PROJET MI-ANNÉE</div><h1>Un projet complet, pas juste une belle image</h1><p class="lead">Le dossier conserve la recherche, les essais, les décisions, le prototype et les corrections. Le résultat final n’efface pas le chemin.</p><div class="grid"><aside class="panel" id="steps"></aside><section class="work"><div class="theory" id="theory"></div><textarea id="notes" placeholder="Ton travail, tes choix, tes essais, tes corrections…"></textarea><div class="actions"><button class="btn" id="save">ENREGISTRER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div id="msg" class="lead"></div></section></div></main><script>(function(){const K='haute-couture-school-midyear-project-v1';const steps=[['brief','01 · Brief','Reformule le projet avec tes mots. Qu’est-ce qui est obligatoire ? Qu’est-ce qui reste libre ?'],['research','02 · Recherche','Sélectionne des références utiles et écris ce qu’elles t’apportent réellement.'],['directions','03 · Trois directions','Développe au moins trois pistes distinctes avant de choisir.'],['selection','04 · Sélection','Explique pourquoi tu retiens une piste et ce que tu abandonnes.'],['material','05 · Matière','Choisis uniquement parmi les matières déjà apprises ou découvertes. Note comportement, contraintes et raison du choix.'],['prototype','06 · Prototype / toile','Documente le premier essai : ce qui fonctionne, ce qui ne fonctionne pas, ce qui surprend.'],['fitting','07 · Essayage / volume','Observe aplomb, tensions, équilibre, volume, confort ou comportement de surface selon le projet.'],['corrections','08 · Corrections','Écris les corrections décidées et pourquoi.'],['final','09 · Version finale','Décris le résultat obtenu et ce qui a changé depuis l’intention de départ.'],['presentation','10 · Présentation','Prépare une présentation courte : intention, deux essais importants, une erreur, une correction, un apprentissage.']];let cur=0;function load(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(_){return{}}}function render(){const d=load(),s=steps[cur];document.getElementById('steps').innerHTML=steps.map((x,i)=>`<div class="step ${i===cur?'active':''}" data-i="${i}"><b>${x[1]}</b></div>`).join('');document.getElementById('theory').innerHTML='<b>'+s[1]+'</b><br>'+s[2];document.getElementById('notes').value=d[s[0]]?.notes||'';document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{save(false);cur=Number(x.dataset.i);render()})}function save(show=true){const d=load(),s=steps[cur];d[s[0]]={notes:document.getElementById('notes').value,savedAt:new Date().toISOString()};localStorage.setItem(K,JSON.stringify(d));if(show)document.getElementById('msg').textContent='Étape enregistrée.';if(window.HCKnowledge)HCKnowledge.practice('school:midyear:'+s[0],{source:'school',label:s[1]})}document.getElementById('save').onclick=()=>save(true);render()})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
