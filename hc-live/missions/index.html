<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Mes missions</title><style>:root{--bg:#ede4da;--paper:#fffaf5;--ink:#241d19;--muted:#77665d;--line:#ddcec2;--wine:#7b3f4a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(rgba(28,19,16,.28),rgba(28,19,16,.28)),url('https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&fm=jpg&q=86&w=2200') center/cover fixed;font-family:Arial,sans-serif;color:var(--ink)}.shell{min-height:100vh;padding:28px}.panel{max-width:1180px;margin:auto;background:rgba(255,250,245,.96);border:1px solid rgba(255,255,255,.5);border-radius:28px;box-shadow:0 30px 90px rgba(28,19,16,.25);padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.ey{font:900 9px Arial;letter-spacing:.18em;color:var(--wine)}h1{font:46px/1 Georgia,serif;margin:7px 0 6px}.sub{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:680px}.btn{border:1px solid var(--line);background:white;border-radius:999px;padding:11px 15px;font:800 9px Arial;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}.kind{font:900 8px Arial;letter-spacing:.13em;color:var(--wine)}h2{font:27px Georgia,serif;margin:6px 0}.status{font:11px Georgia,serif;color:var(--muted);margin-bottom:10px}.steps{display:grid;gap:7px;margin:12px 0}.step{font:12px/1.45 Georgia,serif;padding:9px 11px;border-radius:12px;background:#f6efe9}.step.done{text-decoration:line-through;opacity:.55}.hint{margin-top:10px;background:#f2e7df;border-radius:13px;padding:11px;font:12px/1.5 Georgia,serif}.empty{padding:40px;text-align:center;font:italic 18px Georgia,serif;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:18px}h1{font-size:36px}}</style></head><body><main class="shell"><section class="panel"><div class="top"><div><div class="ey">FIL CONDUCTEUR</div><h1>Mes missions</h1><div class="sub">Des objectifs qui t’orientent sans jouer à ta place. Plus tu demandes d’aide, plus les indices deviennent précis.</div></div><button class="btn" onclick="history.back()">RETOUR</button></div><div class="grid" id="grid"></div></section></main><script src="../game-engine.js"></script><script src="mission-engine-v1.js?v=20260908-missions1"></script><script>(function(){const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const api=window.HCMissionEngineV1;if(!api)return setTimeout(render,80);const list=api.active();const g=document.getElementById('grid');if(!list.length){g.innerHTML='<div class="empty">Rien ne réclame ton attention maintenant.</div>';return}g.innerHTML=list.map(m=>`<article class="card"><div class="kind">${esc((m.kind||'mission').toUpperCase())}</div><h2>${esc(m.title)}</h2><div class="status">${m.status==='waiting'?'En attente':m.status==='ready'?'Prête à conclure':'En cours'}</div><div class="sub">${esc(m.summary||'')}</div>${(m.steps||[]).length?`<div class="steps">${m.steps.map(s=>`<div class="step ${s.done?'done':''}">${s.done?'✓ ':'• '}${esc(s.label||s.title||'Étape')}</div>`).join('')}</div>`:''}${(m.hints||[]).slice(0,m.hintLevel||0).map((h,i)=>`<div class="hint"><b>Indice ${i+1}</b><br>${esc(h)}</div>`).join('')}${(m.hints||[]).length>(m.hintLevel||0)?`<button class="btn" data-hint="${esc(m.id)}">ME DONNER UN INDICE</button>`:''}</article>`).join('');g.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{api.hint(b.dataset.hint);render()})}window.addEventListener('hc-mission-state',render);render()})();</script></body></html>
