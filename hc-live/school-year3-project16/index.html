<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 16</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:46px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.16em;color:var(--coral)}h1{font:50px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.65 Georgia,serif;color:var(--muted);max-width:850px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:31px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:23px Georgia,serif;margin:0 0 7px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:125px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · ANNÉE 3 · PROJET 16</div><h1 id="title">Projet 16</h1><p class="lead" id="lead"></p><section class="hero"><h2>Une capsule, pas quatre projets séparés</h2><p>Le dossier garde ton architecture de collection, tes risques, tes essais et tes corrections. Les quatre looks doivent pouvoir être lus individuellement et comme un système.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year3-project16-v1',school=HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 16 — capsule construite · 4 looks',lead:'Développe quatre looks liés par une architecture constructive commune, avec rôles distincts, prototypes et contrôles.'};else if(id==='ifm-paris')profile={title:'Projet 16 — capsule matière & corps · 4 états',lead:'Développe quatre états portés issus d’un même système matière et compare leurs comportements sur le corps.'};else profile={title:'Projet 16 — capsule surface, coupe & volume · 4 looks',lead:'Développe quatre silhouettes reliées par un langage commun qui évolue entre surface, coupe, volume et séquence.'};const defs=[['question','01 · QUESTION','Quelle question organise toute la capsule ?'],['invariants','02 · CONSTANTES','Qu’est-ce qui doit rester lisible dans les quatre looks ?'],['variables','03 · VARIABLES','Qu’est-ce qui peut changer : proportion, matière, construction, intensité, usage ou surface ?'],['lineup0','04 · PREMIER LINE-UP','Décris l’ordre initial et le rôle de chaque look.'],['look1','05 · LOOK 01','Rôle, silhouette, matière/support, décision principale et problème à tester.'],['look2','06 · LOOK 02','Rôle, silhouette, matière/support, décision principale et problème à tester.'],['look3','07 · LOOK 03','Rôle, silhouette, matière/support, décision principale et problème à tester.'],['look4','08 · LOOK 04','Rôle, silhouette, matière/support, décision principale et problème à tester.'],['risks','09 · RISQUES','Quels sont les trois risques qui peuvent bloquer la capsule ?'],['prototype','10 · PROTOTYPE CLÉ','Quel test ou prototype résout le risque principal ?'],['compare','11 · COMPARAISON','Quelles répétitions sont utiles ? Lesquelles deviennent redondantes ?'],['weak','12 · LOOK LE PLUS FAIBLE','Lequel affaiblit l’ensemble actuellement et pourquoi ?'],['corrections','13 · CORRECTIONS','Qu’as-tu modifié après comparaison ou critique ?'],['lineup1','14 · LINE-UP RÉVISÉ','Nouvel ordre et nouvelle fonction des quatre looks.'],['presentation','15 · PRÉSENTATION','Question, système, 4 looks, risque, prototype, correction, faiblesse restante et suite.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p}</h2><textarea data-key="${k}">${String(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('collection-system',{source:'school-year3-project16'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
