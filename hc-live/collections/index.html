<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Collections</title><style>
:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#7a685e;--line:#e4d5ca;--coral:#e37d66;--dark:#291f1b;--green:#6f8d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.panel,.collection{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 36px rgba(61,42,31,.08)}.top{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand h1 em{font-weight:400;color:var(--coral)}button,input,textarea,select{font:inherit}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2,.collection h2{font:30px Georgia,serif;margin:5px 0}.field{display:grid;gap:5px;margin:9px 0}.field label{font:900 8px Arial;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}.field textarea{min-height:90px;resize:vertical}.list{display:grid;gap:8px;margin-top:14px}.collection{padding:14px;cursor:pointer}.collection.active{outline:2px solid var(--dark)}.collection small{color:var(--muted);font:10px Georgia,serif}.progress{height:8px;border-radius:999px;background:#eadfd7;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--dark)}.workspace{min-width:0}.hero{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 36px rgba(61,42,31,.08)}.hero-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.hero h2{font:40px/.95 Georgia,serif;margin:5px 0}.meta{font:12px/1.5 Georgia,serif;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.stat small{font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:24px Georgia,serif;margin-top:3px}.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.look{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:9px;cursor:grab}.look.drag{opacity:.45}.look img,.placeholder{width:100%;aspect-ratio:3/4;border-radius:12px;background:#eee5df;object-fit:cover}.placeholder{display:grid;place-items:center;font:38px Georgia,serif}.look b{display:block;font:17px Georgia,serif;margin:8px 0 2px}.look small{font-size:9px;color:var(--muted)}.look-actions{display:flex;gap:5px;margin-top:7px}.look-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;font:800 7px Arial;cursor:pointer}.library{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px}.library h3{font:28px Georgia,serif;margin:5px 0}.library-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.file{border:1px solid var(--line);background:#fff;border-radius:15px;padding:8px}.file img,.file .placeholder{width:100%;aspect-ratio:3/4;border-radius:10px;object-fit:cover}.file b{display:block;font:14px Georgia,serif;margin:6px 0}.file button{width:100%;border:0;border-radius:9px;background:var(--dark);color:#fff;padding:7px;font:800 7px Arial;cursor:pointer}.empty{border:1px dashed #d7bfb1;border-radius:18px;padding:25px;text-align:center;font:16px Georgia,serif;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.looks{grid-template-columns:repeat(2,1fr)}.library-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>MES <em>collections</em></h1></div><div class="nav"><button class="btn" onclick="location.href='../creations/?view=tracking'">MES CRÉATIONS</button><button class="btn" onclick="location.href='../creations/?view=folders'">MES DOSSIERS</button><button class="btn dark" onclick="location.href='../atelier-raster/index-v2.html'">ATELIER</button></div></header><div class="layout"><aside class="panel"><div class="k">NOUVELLE COLLECTION</div><h2>Créer une collection</h2><div class="field"><label>NOM</label><input id="name" placeholder="Ex. Éclosion"></div><div class="field"><label>SAISON / ANNÉE</label><input id="season" placeholder="Printemps–Été 2027"></div><div class="field"><label>NOMBRE DE LOOKS CIBLE</label><input id="target" type="number" min="1" max="60" value="8"></div><div class="field"><label>INTENTION DE COLLECTION</label><textarea id="idea" placeholder="Ligne, histoire, palette, matière, émotion..."></textarea></div><button class="btn coral" id="create">CRÉER LA COLLECTION</button><div class="list" id="list"></div></aside><main class="workspace" id="workspace"></main></div></div><script>
(function(){'use strict';const CKEY='haute-couture-collections-v1',PKEY='haute-couture-creative-projects-v1',CREA='haute-couture-atelier-creations-v1',ACTIVE='haute-couture-atelier-active-project-v1';const $=s=>document.querySelector(s),read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeId=null,dragId=null;function collections(){const x=read(CKEY,[]);return Array.isArray(x)?x:[]}function creations(){const x=read(CREA,[]);return Array.isArray(x)?x:[]}function saveCollections(a){write(CKEY,a)}function syncProject(c){let p=read(PKEY,[]);const obj={id:c.id,name:c.name,type:'collection',subtitle:(c.season||'Collection')+' · '+c.targetLooks+' looks',season:c.season,targetLooks:c.targetLooks,idea:c.idea,status:c.status||'active',source:'collection',updatedAt:new Date().toISOString()};const i=p.findIndex(x=>String(x.id)===String(c.id));if(i>=0)p[i]={...p[i],...obj};else p.unshift(obj);write(PKEY,p.slice(0,200))}function statusOf(c){const s=String(c.status||'').toLowerCase();if(/termin|livr|complete/.test(s))return'Terminée';if(/production|fabric/.test(s))return'Production';if(/croquis|choisi/.test(s))return'Croquis';return c.status||'Concept'}function pct(c){const ids=c.lookIds||[],all=creations().filter(x=>ids.includes(x.id));if(!c.targetLooks)return 0;const done=all.filter(x=>/termin|livr|complete|fabrication planifiée|production/.test(String(x.status||'').toLowerCase())).length;return Math.min(100,Math.round((done/c.targetLooks)*100))}function renderList(){const a=collections();$('#list').innerHTML=a.length?a.map(c=>`<article class="collection ${c.id===activeId?'active':''}" data-id="${esc(c.id)}"><small>${esc(c.season||'Collection')}</small><h2>${esc(c.name)}</h2><small>${(c.lookIds||[]).length}/${c.targetLooks} looks · ${pct(c)}%</small><div class="progress"><i style="width:${pct(c)}%"></i></div></article>`).join(''):'<div class="empty">Aucune collection pour le moment.</div>';document.querySelectorAll('.collection[data-id]').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function lookCard(c,i){const img=c.sketch?.url||c.image||c.url||'';return`<article class="look" draggable="true" data-look="${esc(c.id)}"><div class="k">LOOK ${i+1}</div>${img?`<img src="${esc(img)}">`:'<div class="placeholder">✦</div>'}<b>${esc(c.name||'Création')}</b><small>${esc(statusOf(c))}</small><div class="look-actions"><button data-up="${esc(c.id)}">↑</button><button data-down="${esc(c.id)}">↓</button><button data-remove="${esc(c.id)}">RETIRER</button></div></article>`}function renderWorkspace(){const c=collections().find(x=>x.id===activeId);if(!c){$('#workspace').innerHTML='<div class="hero empty">Crée ou choisis une collection pour commencer.</div>';return}const all=creations(),looks=(c.lookIds||[]).map(id=>all.find(x=>x.id===id)).filter(Boolean),available=all.filter(x=>!(c.lookIds||[]).includes(x.id));$('#workspace').innerHTML=`<section class="hero"><div class="hero-head"><div><div class="k">COLLECTION ACTIVE</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.season||'Saison libre')} · ${c.targetLooks} looks cible<br>${esc(c.idea||'Aucune intention écrite')}</div></div><div class="actions"><button class="btn" id="edit">MODIFIER</button><button class="btn dark" id="atelier">TRAVAILLER DANS L’ATELIER</button></div></div><div class="stats"><div class="stat"><small>LOOKS</small><b>${looks.length}/${c.targetLooks}</b></div><div class="stat"><small>CROQUIS</small><b>${looks.filter(x=>/croquis|concept|collection/.test(String(x.status||'').toLowerCase())).length}</b></div><div class="stat"><small>PRODUCTION</small><b>${looks.filter(x=>/production|fabrication planifiée/.test(String(x.status||'').toLowerCase())).length}</b></div><div class="stat"><small>AVANCEMENT</small><b>${pct(c)}%</b></div></div><div class="looks" id="looks">${looks.length?looks.map(lookCard).join(''):'<div class="empty" style="grid-column:1/-1">Aucun look dans cette collection. Ajoute une création existante ou ouvre la collection dans l’Atelier.</div>'}</div></section><section class="library"><div class="k">MES CRÉATIONS DISPONIBLES</div><h3>Ajouter un look existant</h3><div class="library-grid">${available.length?available.map(x=>{const img=x.sketch?.url||x.image||x.url||'';return`<article class="file">${img?`<img src="${esc(img)}">`:'<div class="placeholder">✦</div>'}<b>${esc(x.name||'Création')}</b><button data-add="${esc(x.id)}">AJOUTER À LA COLLECTION</button></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">Toutes tes créations sont déjà utilisées ici.</div>'}</div></section>`;$('#atelier').onclick=()=>{write(ACTIVE,{id:c.id,name:c.name,type:'collection',subtitle:(c.season||'Collection')+' · '+c.targetLooks+' looks',source:'collection',idea:c.idea,selectedAt:new Date().toISOString()});location.href='../atelier-raster/index-v2.html?v=20260902-collection1'};$('#edit').onclick=()=>{const n=prompt('Nom de la collection',c.name);if(n===null)return;const s=prompt('Saison / année',c.season||'');if(s===null)return;const t=Number(prompt('Nombre de looks cible',c.targetLooks)||c.targetLooks);const i=prompt('Intention de collection',c.idea||'');Object.assign(c,{name:n.trim()||c.name,season:s.trim(),targetLooks:Math.max(1,t||c.targetLooks),idea:i??c.idea,updatedAt:new Date().toISOString()});const a=collections(),idx=a.findIndex(x=>x.id===c.id);a[idx]=c;saveCollections(a);syncProject(c);render()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addLook(c,b.dataset.add));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeLook(c,b.dataset.remove));document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(c,b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(c,b.dataset.down,1));document.querySelectorAll('.look[draggable]').forEach(el=>{el.ondragstart=()=>{dragId=el.dataset.look;el.classList.add('drag')};el.ondragend=()=>{dragId=null;el.classList.remove('drag')};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(!dragId||dragId===el.dataset.look)return;const ids=c.lookIds||[],a=ids.indexOf(dragId),b=ids.indexOf(el.dataset.look);if(a<0||b<0)return;ids.splice(b,0,ids.splice(a,1)[0]);saveOne(c);render()}})}function saveOne(c){const a=collections(),i=a.findIndex(x=>x.id===c.id);if(i>=0)a[i]=c;saveCollections(a);syncProject(c)}function addLook(c,id){c.lookIds=c.lookIds||[];if(!c.lookIds.includes(id))c.lookIds.push(id);const all=creations(),x=all.find(v=>v.id===id);if(x){x.collectionIds=Array.from(new Set([...(x.collectionIds||[]),c.id]));write(CREA,all)}saveOne(c);render()}function removeLook(c,id){c.lookIds=(c.lookIds||[]).filter(x=>x!==id);const all=creations(),x=all.find(v=>v.id===id);if(x){x.collectionIds=(x.collectionIds||[]).filter(z=>z!==c.id);write(CREA,all)}saveOne(c);render()}function move(c,id,d){const ids=c.lookIds||[],i=ids.indexOf(id),j=i+d;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];saveOne(c);render()}function create(){const name=$('#name').value.trim(),season=$('#season').value.trim(),target=Math.max(1,Number($('#target').value)||8),idea=$('#idea').value.trim();if(!name){$('#name').focus();return}const c={id:'collection-'+Date.now().toString(36),name,season,targetLooks:target,idea,lookIds:[],status:'active',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const a=collections();a.unshift(c);saveCollections(a);syncProject(c);activeId=c.id;$('#name').value='';$('#idea').value='';render()}function render(){renderList();renderWorkspace()}$('#create').onclick=create;const q=new URLSearchParams(location.search),add=q.get('add');const a=collections();activeId=q.get('id')||a[0]?.id||null;render();if(add&&activeId){const c=collections().find(x=>x.id===activeId);if(c)addLook(c,add)}})();
</script></body></html>
