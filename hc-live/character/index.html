<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Haute Couture Live — Personnage</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf7f1}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fbf7f1}</style></head><body><iframe id="game" src="../character-live.html?v=route-character-live-start-choice" title="Création du personnage"></iframe><script>(function(){const KEY='haute-couture-current-screen';localStorage.setItem(KEY,'character');const timer=setInterval(function(){const s=localStorage.getItem(KEY);if(s==='location'||s==='logement'){localStorage.setItem(KEY,'start-choice');localStorage.setItem('haute-couture-screen','start-choice');clearInterval(timer);location.replace('../start-choice/');}},120);})();</script></body></html>
