<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 20</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:46px 20px 90px}.eye{font:900 10px Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.65 Georgia,serif;color:var(--muted);max-width:860px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:15px}.hero{background:#2d2723;color:#fff}.hero h2{font:30px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ded1c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.step{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--coral)}h2{font:23px Georgia,serif;margin:7px 0}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:13px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eye">ÉCOLE · ANNÉE 3 · PROJET 20</div><h1 id="title">Mission professionnelle avancée</h1><p class="lead" id="lead"></p><section class="hero"><h2>Règle du projet</h2><p>Le niveau de sortie ne se prouve pas en prétendant tout savoir. Il se voit dans la qualité du diagnostic, des décisions, des validations demandées, des contrôles, des limites reconnues et de la transmission.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year3-project20-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 20 — mission professionnelle avancée · pièce critique',lead:'Diagnostique, propose, fais valider, corrige, contrôle et transmets une pièce à enjeu comme dans une mission de sortie.'};else if(id==='ifm-paris')profile={title:'Projet 20 — mission professionnelle avancée · système matière critique',lead:'Gère un protocole sensible, ses écarts et ses décisions sans confondre résultat intéressant et résultat validé.'};else profile={title:'Projet 20 — mission professionnelle avancée · système visuel confié',lead:'Fais évoluer un système existant en protégeant ses constantes, en validant les ruptures importantes et en préparant une vraie passation.'};const defs=[['mission','01 · MISSION REÇUE','Quel est l’objectif réel de la mission et quel résultat est attendu ?'],['scope','02 · PÉRIMÈTRE','Que peux-tu décider seule ? Qu’est-ce qui exige une validation ?'],['inputs','03 · ÉLÉMENTS REÇUS','Quelles informations, contraintes, versions ou ressources t’ont été transmises ?'],['diagnosis','04 · DIAGNOSTIC','Quels problèmes observes-tu avant de proposer une solution ?'],['risks','05 · RISQUES','Quels risques techniques, créatifs, d’usage ou de transmission dois-tu signaler tôt ?'],['proposal','06 · PROPOSITION','Quelle évolution proposes-tu et sur quelles preuves t’appuies-tu ?'],['validation1','07 · VALIDATION DEMANDÉE','Quelle décision importante demandes-tu explicitement à faire valider ?'],['version1','08 · VERSION 1','Décris l’état produit après la première série de décisions.'],['controls','09 · CONTRÔLES','Quels contrôles effectues-tu, à quel moment et avec quels critères ?'],['issues','10 · ÉCARTS / PROBLÈMES','Qu’est-ce qui ne correspond pas au résultat prévu ou reste incertain ?'],['decisions','11 · DÉCISIONS AUTONOMES','Quelles décisions peux-tu assumer dans ton périmètre ? Pourquoi ?'],['validation2','12 · SECONDE VALIDATION','Qu’est-ce qui dépasse ton périmètre ou modifie suffisamment le projet pour exiger un nouvel accord ?'],['corrections','13 · CORRECTIONS PRIORITAIRES','Qu’as-tu corrigé en premier et pourquoi ?'],['version2','14 · VERSION RÉVISÉE','Décris l’état après corrections et validations.'],['limits','15 · LIMITES','Qu’est-ce qui n’est pas encore vérifié, maîtrisé ou résolu ?'],['handoff','16 · PASSATION','Que doit savoir la personne qui reprend le dossier après toi ?'],['next','17 · PROCHAINE ACTION','Quelle est la prochaine action concrète, et qui devrait la réaliser ou la valider ?'],['final','18 · RESTITUTION','Résume mission, résultat, décisions, contrôles, validations, limites et suite.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('?')[0].split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${String(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('professional-handoff',{source:'school-year3-project20'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
