<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 09</title><style>:root{--ink:#261f1b;--muted:#75665d;--paper:#fffaf4;--line:#dfd1c6;--teal:#4d8d86}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf6f1,#efe4da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:48px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:#c76858}h1{font:46px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:800px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.card h2{font:25px Georgia,serif;margin:0 0 8px}.card p{font:14px/1.6 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;font:14px/1.5 Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#2d2723}.progress{height:10px;background:#eadfd7;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#4d8d86;width:0}.msg{font:13px/1.5 Georgia,serif;color:var(--muted);margin-top:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}h1{font-size:38px}}</style></head><body><main class="wrap"><div class="eyebrow">ANNÉE 2 · PROJET 09</div><h1>Premier projet autonome</h1><p class="lead" id="brief"></p><div class="progress"><div class="bar" id="bar"></div></div><section id="steps"></section><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn" id="save">ENREGISTRER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="msg" id="msg"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year2-project9-v1',school=HCSchoolLife.school()?.id||'esmod-lyon';const profiles=school==='ifm-paris'?{brief:'Construire une proposition portée à partir d’un système matériel documenté.',steps:['Question de recherche','Protocole d’essais','Essai 01','Essai 02','Essai 03','Comparaison','Sélection de deux directions','Test sur corps / mouvement','Correction','Proposition finale','Méthode : ce que j’ai appris']} : school==='duperre-paris'?{brief:'Construire une silhouette où surface, coupe et volume appartiennent au même langage.',steps:['Question de recherche','Vocabulaire visuel','Règles de combinaison','Direction 01','Direction 02','Direction 03','Sélection','Test sur volume / mouvement','Correction','Silhouette finale','Méthode : ce que j’ai appris']}:{brief:'Développer une silhouette construite plus ambitieuse où la technique sert une intention claire.',steps:['Question de recherche','Références utiles','Direction 01','Direction 02','Direction 03','Sélection','Plan technique','Toile / prototype','Essayage et diagnostic','Corrections','Silhouette finale','Méthode : ce que j’ai appris']};let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){state={}};document.getElementById('brief').textContent=profiles.brief;const host=document.getElementById('steps');host.innerHTML=profiles.steps.map((s,i)=>`<div class="card"><h2>${String(i+1).padStart(2,'0')} — ${s}</h2><textarea data-k="s${i}" placeholder="Écris tes observations, décisions, essais ou corrections…">${(state['s'+i]||'').replace(/</g,'&lt;')}</textarea></div>`).join('');function update(){const vals=[...document.querySelectorAll('textarea')].map(x=>x.value.trim());const done=vals.filter(Boolean).length;document.getElementById('bar').style.width=Math.round(done/vals.length*100)+'%';document.getElementById('msg').textContent=`Dossier ${done}/${vals.length} étapes renseignées.`}document.querySelectorAll('textarea').forEach(t=>t.oninput=update);document.getElementById('save').onclick=()=>{document.querySelectorAll('textarea').forEach(t=>state[t.dataset.k]=t.value);state.schoolId=school;state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));update();document.getElementById('msg').textContent+=' Enregistré.'};update()})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
