<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Image publique</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#7a685d;--line:#e3d4c9;--coral:#e17b64;--dark:#291f1b;--green:#6f8b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.panel,.card,.article{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px #3c281d12}.top{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark,.tabs button.active{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.tabs{margin:14px 0}.panel{padding:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.stat small{font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:24px Georgia,serif;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{padding:9px}.card img,.ph{width:100%;aspect-ratio:3/4;border-radius:12px;background:#eee5df;object-fit:cover}.ph{display:grid;place-items:center;font:38px Georgia,serif}.card h3{font:19px Georgia,serif;margin:8px 0 3px}.card p,.meta{font:10px/1.45 Georgia,serif;color:var(--muted)}.tag{display:inline-block;border-radius:999px;background:#f1e6df;padding:5px 8px;font:900 7px Arial}.card-actions{display:grid;gap:5px;margin-top:8px}.card-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font:800 7px Arial;cursor:pointer}.card-actions button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.feed{display:grid;gap:10px}.post,.article{padding:14px}.post{background:#fff;border:1px solid var(--line);border-radius:18px}.posthead{display:flex;justify-content:space-between;gap:10px}.post h3,.article h3{font:24px Georgia,serif;margin:4px 0}.post img{width:min(340px,100%);aspect-ratio:3/4;object-fit:cover;border-radius:13px;margin-top:10px}.article strong{font:21px Georgia,serif}.empty{border:1px dashed #d5bdb0;border-radius:18px;padding:28px;text-align:center;font:16px Georgia,serif;color:var(--muted)}.hidden{display:none!important}@media(max-width:1000px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>IMAGE <em>publique</em></h1></div><div class="nav"><button class="btn" onclick="location.href='../creations/?view=tracking'">MES CRÉATIONS</button><button class="btn" onclick="location.href='../concours/'">CONCOURS</button><button class="btn" onclick="location.href='../defiles/index-v2.html'">DÉFILÉS</button><button class="btn dark" onclick="location.href='../chez-moi/'">CHEZ MOI</button></div></header><div class="tabs"><button class="active" data-tab="book">BOOK</button><button data-tab="gram">ATELIERGRAM</button><button data-tab="press">PRESSE</button></div><section class="summary" id="summary"></section><section class="panel" id="bookView"></section><section class="panel hidden" id="gramView"></section><section class="panel hidden" id="pressView"></section></div><script src="../game-engine.js?v=20260902-publicimage2"></script><script>(function(){'use strict';const BOOK='haute-couture-book-v1',GRAM='haute-couture-ateliergram-v1',PRESS='haute-couture-press-v1',CREA='haute-couture-atelier-creations-v1',ORD='haute-couture-client-orders-v1',SHOW='haute-couture-runway-shows-v1';const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function arr(k){const a=read(k,[]);return Array.isArray(a)?a:[]}function book(){return arr(BOOK)}function gram(){return arr(GRAM)}function press(){return arr(PRESS)}function creations(){return arr(CREA)}function orders(){return arr(ORD)}function shows(){return arr(SHOW)}function img(x){return x?.image||x?.img||x?.sketch?.url||x?.url||x?.selectedSketch?.url||x?.design?.sketch?.url||''}function addUnique(k,item,fn){let a=arr(k);if(!a.some(fn))a.unshift(item);write(k,a.slice(0,400))}function allPotential(){const out=[];for(const c of creations()){if(/termin|livr|complete|fabrication planifiée|production/i.test(String(c.status||'')))out.push({id:'creation:'+c.id,creationId:c.id,name:c.name||'Création',image:img(c),source:c.collectionIds?.length?'Collection':'Création personnelle',context:c.status||'',type:'creation'})}for(const o of orders()){if(/delivered|completed/.test(String(o.status||'')))out.push({id:'order:'+o.id,orderId:o.id,name:o.garment||o.name||'Création sur mesure',image:img(o),source:'Cliente',context:o.clientName||o.client||'',type:'order'})}return out}function isInBook(x){return book().some(b=>(x.creationId&&b.creationId===x.creationId)||(x.orderId&&b.orderId===x.orderId)||b.sourceId===x.id)}function isOnGram(x){return gram().some(b=>(x.creationId&&b.creationId===x.creationId)||(x.orderId&&b.orderId===x.orderId)||b.sourceId===x.id)}function addBook(x){addUnique(BOOK,{id:'book-'+Date.now().toString(36),sourceId:x.id,creationId:x.creationId||null,orderId:x.orderId||null,name:x.name,image:x.image,source:x.source,context:x.context,addedAt:new Date().toISOString()},b=>b.sourceId===x.id);try{window.HCGame?.mutate?.(g=>{g.portfolio=g.portfolio||[];if(!g.portfolio.some(p=>p.sourceId===x.id))g.portfolio.push({id:'portfolio-'+Date.now().toString(36),sourceId:x.id,name:x.name,type:x.type,date:g.clock.iso,notable:false})})}catch(_){}renderAll()}function publish(x){addUnique(GRAM,{id:'post-'+Date.now().toString(36),sourceId:x.id,creationId:x.creationId||null,orderId:x.orderId||null,name:x.name,image:x.image,source:x.source,caption:x.source==='Cliente'?`${x.name} — création sur mesure`:`${x.name} — nouvelle création`,likes:Math.max(12,Math.round(Number(window.HCGame?.get?.().player?.reputation||0)*1.3+18)),createdAt:new Date().toISOString()},b=>b.sourceId===x.id);renderAll()}function card(x,actions=false){const im=img(x);return`<article class="card">${im?`<img src="${esc(im)}">`:'<div class="ph">✦</div>'}<span class="tag">${esc(x.source||x.type||'Création')}</span><h3>${esc(x.name||x.title||'Création')}</h3><p>${esc(x.context||x.client||x.showName||x.status||'')}</p>${actions?`<div class="card-actions"><button class="primary" data-book="${esc(x.id)}" ${isInBook(x)?'disabled':''}>${isInBook(x)?'✓ DANS LE BOOK':'AJOUTER AU BOOK'}</button><button data-gram="${esc(x.id)}" ${isOnGram(x)?'disabled':''}>${isOnGram(x)?'✓ PUBLIÉ':'PUBLIER SUR ATELIERGRAM'}</button></div>`:''}</article>`}function renderSummary(){const rep=Number(window.HCGame?.get?.().player?.reputation||0);document.getElementById('summary').innerHTML=`<div class="stat"><small>BOOK</small><b>${book().length}</b></div><div class="stat"><small>ATELIERGRAM</small><b>${gram().length}</b></div><div class="stat"><small>ARTICLES</small><b>${press().length}</b></div><div class="stat"><small>NOTORIÉTÉ</small><b>${rep}</b></div>`}function renderBook(){const b=book(),pot=allPotential();document.getElementById('bookView').innerHTML=`<div class="k">PORTFOLIO PROFESSIONNEL</div><h2 style="font:32px Georgia,serif;margin:5px 0">Mon Book</h2><p class="meta">Sélection professionnelle de tes créations et événements. Aucun shooting séparé : le Book utilise les visuels déjà liés aux créations.</p><div class="grid">${b.length?b.map(x=>card(x,false)).join(''):'<div class="empty" style="grid-column:1/-1">Ton Book est encore vide.</div>'}</div>${pot.length?`<h3 style="font:25px Georgia,serif;margin:22px 0 8px">Créations disponibles</h3><div class="grid">${pot.slice(0,30).map(x=>card(x,true)).join('')}</div>`:''}`;const map=new Map(pot.map(x=>[x.id,x]));document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>addBook(map.get(b.dataset.book)));document.querySelectorAll('[data-gram]').forEach(b=>b.onclick=()=>publish(map.get(b.dataset.gram)))}function renderGram(){const a=gram().slice().reverse();document.getElementById('gramView').innerHTML=`<div class="k">RÉSEAU CRÉATIF</div><h2 style="font:32px Georgia,serif;margin:5px 0">Ateliergram</h2><p class="meta">Tes publications proviennent de tes vraies créations et événements.</p><div class="feed">${a.length?a.map(p=>`<article class="post"><div class="posthead"><div><span class="tag">${esc(p.source||'Publication')}</span><h3>${esc(p.name||p.caption||'Publication')}</h3><p class="meta">${esc(p.caption||p.showName||'')}</p></div><small class="meta">${p.createdAt?new Date(p.createdAt).toLocaleDateString('fr-FR'):''}</small></div>${img(p)?`<img src="${esc(img(p))}">`:''}</article>`).join(''):'<div class="empty">Aucune publication Ateliergram pour le moment.</div>'}</div>`}function renderPress(){const a=press().slice().reverse();document.getElementById('pressView').innerHTML=`<div class="k">RETOMBÉES MÉDIA</div><h2 style="font:32px Georgia,serif;margin:5px 0">Presse</h2><p class="meta">Articles et mentions générés par tes événements et résultats de carrière.</p><div class="feed">${a.length?a.map(p=>`<article class="article"><span class="tag">${esc(p.media||'Presse mode')}</span><h3>${esc(p.headline||p.title||'Mention presse')}</h3><p class="meta">${esc(p.text||p.summary||'')}</p>${p.showName||p.contestName?`<strong>${esc(p.showName||p.contestName)}</strong>`:''}</article>`).join(''):'<div class="empty">Aucune retombée presse enregistrée.</div>'}</div>`}function setTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.getElementById('bookView').classList.toggle('hidden',t!=='book');document.getElementById('gramView').classList.toggle('hidden',t!=='gram');document.getElementById('pressView').classList.toggle('hidden',t!=='press')}function renderAll(){renderSummary();renderBook();renderGram();renderPress()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));renderAll()})();</script></body></html>
