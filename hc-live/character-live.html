<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crée ton personnage</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf7f1}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./character-v4.html?v=20260822-alias2"></iframe><script>const frame=document.getElementById('app');function fix(){try{const d=frame.contentDocument;if(!d)return;const apply=()=>{d.querySelectorAll('img[alt^="Look "]').forEach(img=>{const m=img.alt.match(/Look\s+(\d+)/);if(!m)return;const n=String(+m[1]).padStart(2,'0');const wanted='./character-assets/look-'+n+'.jpg?v=20260822-alias2';if(!img.getAttribute('src')||!img.getAttribute('src').includes('look-'+n+'.jpg'))img.src=wanted})};apply();new MutationObserver(apply).observe(d.documentElement,{childList:true,subtree:true});}catch(e){}}frame.addEventListener('load',fix);</script></body></html>
