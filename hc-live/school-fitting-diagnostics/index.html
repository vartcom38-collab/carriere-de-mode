<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Diagnostic d'essayage</title><style>:root{--ink:#251e1a;--muted:#74645b;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#faf5ef,#eee3da);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:42px 18px 80px}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}h1{font:44px/1 Georgia,serif;margin:8px 0}.lead{font:14px/1.55 Georgia,serif;color:var(--muted);max-width:850px}.case{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.case h2{font:26px Georgia,serif;margin:0 0 8px}.symptom{background:#fff1ec;border-radius:14px;padding:13px;font:13px/1.55 Georgia,serif}.options{display:grid;gap:8px;margin-top:12px}.option{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.45 Georgia,serif}.notes{width:100%;min-height:120px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 Georgia,serif}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:white;font-weight:900;margin-top:10px}.feedback{margin-top:10px;padding:12px;border-radius:12px;background:#edf4f2;font:13px/1.5 Georgia,serif}.dark{background:#29211d}@media(max-width:760px){h1{font-size:38px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · ESSAYAGE · DIAGNOSTIC</div><h1>Lire un défaut avant de le corriger</h1><p class="lead">Un pli, une tension ou une couture qui dévie est un symptôme. Ici, tu apprends à formuler plusieurs hypothèses avant d’agir.</p><div id="cases"></div><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></main><script>(function(){const KEY='haute-couture-fitting-diagnostics-v1';const cases=[{id:'neck',title:'Encolure qui baille',symptom:'L’encolure s’écarte du corps au milieu devant.',hyp:['Trop de longueur sur le bord d’encolure','Mauvaise position ou transfert de pince','Problème d’équilibre du devant'],best:0,feedback:'Commence par vérifier longueur et équilibre. Une encolure qui baille peut venir de plusieurs causes : ne retire pas immédiatement de la matière sans vérifier le reste du corsage.'},{id:'side',title:'Couture côté vers l’avant',symptom:'La couture côté n’est plus verticale : elle bascule vers le devant.',hyp:['Répartition avant/dos déséquilibrée','Problème de carrure ou de longueur','Simple choix décoratif sans effet'],best:0,feedback:'Une couture qui quitte l’aplomb signale souvent un déséquilibre entre volumes avant et dos. Observe aussi les tensions voisines.'},{id:'arm',title:'Plis sous l’emmanchure',symptom:'Des plis diagonaux apparaissent sous l’aisselle vers la poitrine ou le dos.',hyp:['Emmanchure trop basse ou trop creuse','Aisance ou longueur mal répartie','Toujours un problème de manche'],best:1,feedback:'Les plis peuvent venir de plusieurs causes. Regarde leur direction, l’emmanchure, l’aisance et l’équilibre général avant d’accuser uniquement la manche.'},{id:'waist',title:'Plis horizontaux à la taille',symptom:'Le vêtement remonte ou crée des plis horizontaux autour de la taille.',hyp:['Longueur insuffisante ou blocage vertical','Toujours trop de largeur','Couleur trop sombre'],best:0,feedback:'Un pli horizontal peut signaler que le vêtement manque de longueur ou ne peut pas descendre correctement. Vérifie d’abord l’équilibre vertical.'}];let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}const root=document.getElementById('cases');root.innerHTML=cases.map((c,ci)=>`<section class="case"><h2>${c.title}</h2><div class="symptom"><b>SYMPTÔME</b><br>${c.symptom}</div><div class="options">${c.hyp.map((h,i)=>`<label class="option"><input type="radio" name="${c.id}" value="${i}" ${saved[c.id]?.choice==i?'checked':''}> ${h}</label>`).join('')}</div><textarea class="notes" id="notes-${c.id}" placeholder="Tes autres hypothèses et ce que tu vérifierais avant de modifier le patron…">${saved[c.id]?.notes||''}</textarea><button class="btn" data-case="${c.id}">ENREGISTRER MON DIAGNOSTIC</button><div class="feedback" id="fb-${c.id}" style="display:${saved[c.id]?'block':'none'}">${saved[c.id]?.feedback||''}</div></section>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{const c=cases.find(x=>x.id===b.dataset.case),q=document.querySelector(`input[name="${c.id}"]:checked`);if(!q){alert('Choisis d’abord une hypothèse principale.');return}const choice=Number(q.value),notes=document.getElementById('notes-'+c.id).value;const feedback=(choice===c.best?'Bonne piste de départ. ':'Cette hypothèse peut parfois arriver, mais ce n’est pas la piste la plus solide ici. ')+c.feedback;saved[c.id]={choice,notes,feedback,savedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(saved));const fb=document.getElementById('fb-'+c.id);fb.textContent=feedback;fb.style.display='block';if(window.HCKnowledge)HCKnowledge.practice('fitting:'+c.id,{source:'school',label:c.title})})})();</script><script src="../knowledge-registry-v1.js"></script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
