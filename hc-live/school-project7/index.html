<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 07</title><style>body{margin:0;background:#f4eee7;color:#241d19;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:44px 20px 90px}.ey{font-size:10px;font-weight:900;letter-spacing:.16em;color:#b45e52}h1{font:46px/1 Georgia,serif}.lead{font:15px/1.6 Georgia,serif;color:#6f6158}.card{background:#fffaf4;border:1px solid #decfc2;border-radius:18px;padding:18px;margin:12px 0}.card h2{font:25px Georgia,serif;margin-top:0}.card p{font:13px/1.55 Georgia,serif;color:#65564e}.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#2d2723;color:#fff;font-weight:900}.field{width:100%;min-height:95px;border:1px solid #d9c9bc;border-radius:12px;padding:11px;background:#fff;font:14px/1.5 Georgia,serif}.btn{border:0;border-radius:12px;padding:12px 14px;background:#4f8c84;color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#2d2723}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hint{font:12px/1.5 Georgia,serif;color:#7a685d}</style></head><body><main class="wrap"><div class="ey">ANNÉE 1 · PROJET 07</div><h1 id="title">Projet 07</h1><p class="lead" id="brief"></p><div id="steps"></div><div class="actions"><button class="btn" id="save">ENREGISTRER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><p class="hint">Tu peux travailler autant de temps réel que tu veux. Ce dossier ne fait pas avancer l’horloge à lui seul : le temps est compté quand tu valides le cours Projet 07.</p></main><script src="../school/school-life-v1.js"></script><script>(function(){const L=HCSchoolLife,id=L.school()?.id||'esmod-lyon',KEY='haute-couture-school-project7-v1';const profile=id==='ifm-paris'?{title:'Projet 07 — corps, interface et usage',brief:'Développe un dispositif porté où le contact, l’équilibre, le mouvement et l’usage sont au cœur du projet.',steps:['Question de départ','5 essais rapides','Choix de 2 pistes','Test de contact au corps','Test en mouvement','Matière/support connu','Prototype sélectionné','Correction principale','Version finale','Ce que tu retiens']} : id==='duperre-paris'?{title:'Projet 07 — détail-signature et silhouette',brief:'Construis un détail-signature issu de ton système de surface et teste comment il transforme réellement la silhouette portée.',steps:['Principe graphique','4 silhouettes','3 placements du détail','3 échelles du détail','Test sur volume','Support connu','Sélection finale','Élément supprimé','Version finale','Ce que tu retiens']}:{title:'Projet 07 — silhouette + détail fonctionnel',brief:'Développe une silhouette où un détail fonctionnel ou un petit accessoire est intégré dès le départ à la construction et à l’usage.',steps:['Usage visé','4 silhouettes','2 détails possibles','Placement et proportion','Schéma de construction','Matière connue','Test d’usage','Correction principale','Version finale','Ce que tu retiens']};let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){};document.getElementById('title').textContent=profile.title;document.getElementById('brief').textContent=profile.brief;const box=document.getElementById('steps');box.innerHTML=profile.steps.map((s,i)=>`<section class="card step"><div class="num">${i+1}</div><div><h2>${s}</h2><textarea class="field" data-i="${i}" placeholder="Travaille ici : notes, choix, essais, correction…">${(state.steps&&state.steps[i])||''}</textarea></div></section>`).join('');document.getElementById('save').onclick=()=>{state={schoolId:id,updatedAt:new Date().toISOString(),steps:[...document.querySelectorAll('.field')].map(x=>x.value)};localStorage.setItem(KEY,JSON.stringify(state));alert('Projet 07 enregistré.');};})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
