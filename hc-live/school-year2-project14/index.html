<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Projet 14</title><style>:root{--ink:#251e1a;--muted:#75655c;--line:#dfd0c4;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf5ef,#eee2d9);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:46px 20px 90px}.eyebrow{font:900 10px/1 Arial;letter-spacing:.16em;color:var(--coral)}h1{font:48px/1 Georgia,serif;margin:10px 0}.lead{font:15px/1.6 Georgia,serif;color:var(--muted);max-width:840px}.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:21px;margin-top:16px}.hero{background:#2d2723;color:#fff}.hero h2{font:30px Georgia,serif;margin:0 0 8px}.hero p{font:13px/1.6 Georgia,serif;color:#ddd0c7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:24px Georgia,serif;margin:0 0 8px}.card p{font:13px/1.55 Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:125px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:13px/1.5 Georgia,serif;resize:vertical}.step{font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--coral)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.dark{background:#29211d}.status{margin-top:12px;font:12px/1.5 Georgia,serif;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:39px}}</style></head><body><main class="wrap"><div class="eyebrow">ÉCOLE · ANNÉE 2 · PROJET 14</div><h1 id="title">Mission professionnelle</h1><p class="lead" id="lead"></p><section class="hero"><h2>Tu es en immersion, pas seule aux commandes</h2><p>Le dossier distingue ce que tu fais, ce qui t’est transmis, ce qui doit être validé et ce qui reste hors de ton niveau actuel. Signaler une limite fait partie du travail professionnel.</p></section><section class="grid" id="steps"></section><div class="actions"><button class="btn" id="save">ENREGISTRER LE DOSSIER</button><button class="btn dark" onclick="location.href='../school-day/'">RETOUR À MA JOURNÉE</button></div><div class="status" id="status"></div></main><script src="../school/school-life-v1.js"></script><script>(function(){const KEY='haute-couture-school-year2-project14-v1',school=window.HCSchoolLife?.school?.()||{},id=school.id||'esmod-lyon',esmod=id.startsWith('esmod-');let profile;if(esmod)profile={title:'Projet 14 — mission atelier',lead:'Faire évoluer une proposition dans un périmètre défini, documenter les versions et rendre un dossier contrôlé.'};else if(id==='ifm-paris')profile={title:'Projet 14 — mission matière',lead:'Reprendre un protocole transmis, analyser ses écarts puis proposer une variation contrôlée et validable.'};else profile={title:'Projet 14 — mission image',lead:'Décliner une identité existante, introduire une variation cohérente et rendre visibles les règles respectées.'};const defs=[['mission','01 · MISSION','Que t’est-il demandé exactement ? Quel est le livrable attendu ?'],['scope','02 · PÉRIMÈTRE','Ce que tu peux modifier, ce que tu ne dois pas toucher et ce qui doit être validé.'],['received','03 · ÉLÉMENTS REÇUS','Informations, base, protocole, système ou références qui te sont transmis.'],['questions','04 · QUESTIONS','Ce qui est ambigu ou incomplet avant de travailler.'],['plan','05 · PLAN DE TRAVAIL','Ordre des tâches, priorités et points de contrôle.'],['version1','06 · VERSION 1','Première proposition ou première exécution documentée.'],['controls','07 · CONTRÔLES','Ce que tu vérifies et selon quels critères.'],['supervisor','08 · RETOUR ENCADRANT','Retour reçu : erreur, non-conformité, préférence, amélioration ou question.'],['priorities','09 · PRIORITÉS','Quels retours traites-tu en premier et pourquoi ?'],['version2','10 · VERSION RÉVISÉE','Ce qui change après le retour et ce qui reste volontairement identique.'],['validation','11 · VALIDATIONS','Ce qui a été validé, par qui dans la simulation et ce qui reste en attente.'],['limits','12 · LIMITES','Ce que tu ne sais pas encore faire ou ce qui demanderait un autre niveau de compétence.'],['delivery','13 · RESTITUTION','Mission, décisions, contrôles, retours intégrés, résultat et limites.'],['reflection','14 · BILAN PERSONNEL','Ce que cette immersion change dans ta manière de travailler.']];function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}const s=read();document.getElementById('title').textContent=profile.title;document.getElementById('lead').textContent=profile.lead;document.getElementById('steps').innerHTML=defs.map(([k,n,p])=>`<section class="card"><div class="step">${n}</div><h2>${p.split('.')[0]}</h2><p>${p}</p><textarea data-key="${k}">${(s[k]||'').replace(/</g,'&lt;')}</textarea></section>`).join('');document.getElementById('save').onclick=()=>{const n=read();document.querySelectorAll('[data-key]').forEach(el=>n[el.dataset.key]=el.value.slice(0,8000));n.schoolId=id;n.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(n));const filled=defs.filter(([k])=>(n[k]||'').trim()).length;document.getElementById('status').textContent=`Dossier enregistré · ${filled}/${defs.length} étapes documentées.`;try{window.HCKnowledge?.practice?.('professional-immersion-method',{source:'school-year2-project14'})}catch(_){}}})();</script><script src="../server-save-bridge-v1.js" defer></script><script src="../global-menu-v1.js" defer></script></body></html>
