<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Après le show</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#77675e;--line:#e3d4c9;--coral:#e17b64;--dark:#291f1b;--green:#6f8d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top,.side,.hero,.look,.press{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px #3b281d12}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 20px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:44px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px;margin-top:14px}.side{padding:15px}.side h2,.hero h2{font:30px Georgia,serif;margin:5px 0}.list{display:grid;gap:8px;margin-top:12px}.pick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;cursor:pointer}.pick.active{outline:2px solid var(--dark)}.pick b{display:block;font:17px Georgia,serif}.pick small,.meta{font:10px/1.45 Georgia,serif;color:var(--muted)}.hero{padding:18px}.herohead{display:flex;justify-content:space-between;gap:12px}.hero h2{font-size:38px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px}.stat small{font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:20px Georgia,serif;margin-top:3px}.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.look{padding:9px}.look img,.ph{width:100%;aspect-ratio:3/4;border-radius:12px;background:#eee5df;object-fit:cover}.ph{display:grid;place-items:center;font:36px Georgia,serif}.look b{display:block;font:16px Georgia,serif;margin:7px 0 2px}.look small{font-size:9px;color:var(--muted)}.toggles{display:grid;gap:5px;margin-top:8px}.toggle{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font:800 7px Arial;cursor:pointer}.toggle.on{background:#eff6ef;border-color:#b8ceb9;color:#4e7154}.press{padding:15px;margin-top:14px}.press h3{font:28px Georgia,serif;margin:5px 0}.empty{border:1px dashed #d4bdb0;border-radius:17px;padding:24px;text-align:center;font:16px Georgia,serif;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.looks{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>APRÈS <em>le show</em></h1></div><div class="nav"><button class="btn" onclick="location.href='./index-v2.html'">← DÉFILÉS</button><button class="btn" onclick="location.href='../creations/?view=tracking'">MES CRÉATIONS</button><button class="btn" onclick="location.href='../image-publique/'">IMAGE PUBLIQUE</button><button class="btn dark" onclick="location.href='../chez-moi/'">CHEZ MOI</button></div></header><div class="layout"><aside class="side"><div class="k">DÉFILÉS TERMINÉS</div><h2>Retombées</h2><p class="meta">Choisis un show terminé pour sélectionner ses images fortes et gérer ses retombées.</p><div class="list" id="list"></div></aside><main id="main"></main></div></div><script src="../game-engine.js?v=20260902-postshow2"></script><script>(function(){'use strict';const SK='haute-couture-runway-shows-v1',CK='haute-couture-collections-v1',CR='haute-couture-atelier-creations-v1',BK='haute-couture-book-v1',AG='haute-couture-ateliergram-v1',PR='haute-couture-press-v1';const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shows(){return read(SK,[]).filter(x=>x.status==='completed'&&x.dayOfShow?.result)}function collections(){return read(CK,[])}function creations(){return read(CR,[])}function saveShow(s){const all=read(SK,[]),i=all.findIndex(x=>x.id===s.id);if(i>=0)all[i]=s;write(SK,all)}function lineup(s){const col=collections().find(x=>x.id===s.collectionId),ids=s.runOrder?.length?s.runOrder:(col?.lookIds||[]),by=new Map(creations().map(x=>[x.id,x]));return ids.map(id=>by.get(id)).filter(Boolean).slice(0,s.looks)}function ensurePost(s){s.postShow=s.postShow||{bookIds:[],ateliergramIds:[],pressDone:false,archived:false};return s.postShow}function addUnique(key,item,match){let a=read(key,[]);if(!Array.isArray(a))a=[];if(!a.some(match))a.unshift(item);write(key,a.slice(0,300))}let activeId=new URLSearchParams(location.search).get('show')||null;function renderList(){const a=shows();if(!activeId)activeId=a[0]?.id||null;document.getElementById('list').innerHTML=a.length?a.map(s=>`<div class="pick ${s.id===activeId?'active':''}" data-id="${esc(s.id)}"><b>${esc(s.name)}</b><small>${esc(s.place)} · ${s.dayOfShow.result.label} · ${s.dayOfShow.result.score}/100</small></div>`).join(''):'<div class="empty">Aucun défilé terminé pour le moment.</div>';document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function toggleBook(s,c){const p=ensurePost(s),on=p.bookIds.includes(c.id);p.bookIds=on?p.bookIds.filter(x=>x!==c.id):[...p.bookIds,c.id];if(!on){addUnique(BK,{id:'book-'+s.id+'-'+c.id,creationId:c.id,showId:s.id,name:c.name||'Look',image:c.sketch?.url||c.image||c.url||'',source:'Défilé',context:s.name,showName:s.name,score:s.dayOfShow.result.score,addedAt:new Date().toISOString()},x=>x.showId===s.id&&x.creationId===c.id);try{window.HCGame?.mutate?.(g=>{g.portfolio=g.portfolio||[];if(!g.portfolio.some(x=>x.showId===s.id&&x.creationId===c.id))g.portfolio.push({id:'portfolio-'+s.id+'-'+c.id,name:c.name||'Look',type:'runway',showId:s.id,creationId:c.id,date:g.clock.iso,notable:true})})}catch(_){}}saveShow(s);render()}function toggleAteliergram(s,c){const p=ensurePost(s),on=p.ateliergramIds.includes(c.id);p.ateliergramIds=on?p.ateliergramIds.filter(x=>x!==c.id):[...p.ateliergramIds,c.id];if(!on)addUnique(AG,{id:'post-'+s.id+'-'+c.id,creationId:c.id,showId:s.id,name:c.name||'Look',showName:s.name,source:'Défilé',image:c.sketch?.url||c.image||c.url||'',caption:`${c.name||'Look'} — ${s.name}`,likes:Math.max(18,Math.round(s.dayOfShow.result.score*1.7+s.prestige*12)),createdAt:new Date().toISOString()},x=>x.showId===s.id&&x.creationId===c.id);saveShow(s);render()}function press(s){const p=ensurePost(s);if(p.pressDone)return;const r=s.dayOfShow.result,headline=r.score>=90?`Une nouvelle signature remarquée à ${s.place}`:r.score>=78?`${s.name} : une collection qui retient l’attention`:`Retour sur ${s.name}`;const text=r.score>=90?'La collection séduit par sa cohérence et sa présence scénique. Plusieurs looks sont remarqués à la sortie du show.':r.score>=78?'Le show confirme une identité créative de plus en plus lisible et attire de nouveaux regards professionnels.':'Le défilé apporte de la visibilité et une expérience précieuse pour la suite de la carrière.';addUnique(PR,{id:'press-'+s.id,showId:s.id,showName:s.name,media:'Presse mode',headline,text,score:r.score,createdAt:new Date().toISOString()},x=>x.showId===s.id);p.pressDone=true;saveShow(s);window.HCGame?.addMessage?.({from:'Presse mode',avatar:'P',subject:headline,text});render()}function renderMain(){const s=shows().find(x=>x.id===activeId),main=document.getElementById('main');if(!s){main.innerHTML='<div class="empty">Choisis un défilé terminé.</div>';return}const p=ensurePost(s),r=s.dayOfShow.result,looks=lineup(s);main.innerHTML=`<section class="hero"><div class="herohead"><div><div class="k">${esc(s.place)} · APRÈS-SHOW</div><h2>${esc(s.name)}</h2><div class="meta">${esc(r.label)} · score ${r.score}/100 · +${r.repGain} réputation<br>${esc(r.incident)}</div></div><div class="actions"><button class="btn coral" id="press" ${p.pressDone?'disabled':''}>${p.pressDone?'✓ PRESSE ENREGISTRÉE':'GÉNÉRER LA RETOMBÉE PRESSE'}</button><button class="btn dark" onclick="location.href='../image-publique/'">OUVRIR IMAGE PUBLIQUE</button></div></div><div class="stats"><div class="stat"><small>LOOKS DU SHOW</small><b>${looks.length}</b></div><div class="stat"><small>DANS LE BOOK</small><b>${p.bookIds.length}</b></div><div class="stat"><small>ATELIERGRAM</small><b>${p.ateliergramIds.length}</b></div><div class="stat"><small>PRESSE</small><b>${p.pressDone?'OUI':'—'}</b></div></div><div class="looks">${looks.map((c,i)=>{const img=c.sketch?.url||c.image||c.url||'';return`<article class="look"><div class="k">LOOK ${i+1}</div>${img?`<img src="${esc(img)}">`:'<div class="ph">✦</div>'}<b>${esc(c.name||'Look')}</b><small>${esc(c.status||'Création')}</small><div class="toggles"><button class="toggle ${p.bookIds.includes(c.id)?'on':''}" data-book="${esc(c.id)}">${p.bookIds.includes(c.id)?'✓ DANS LE BOOK':'AJOUTER AU BOOK'}</button><button class="toggle ${p.ateliergramIds.includes(c.id)?'on':''}" data-ag="${esc(c.id)}">${p.ateliergramIds.includes(c.id)?'✓ PUBLIÉ':'PUBLIER SUR ATELIERGRAM'}</button></div></article>`}).join('')}</div></section>${p.pressDone?`<section class="press"><div class="k">RETOMBÉE PRESSE</div><h3>Couverture enregistrée</h3><p class="meta">La presse liée à ce show est sauvegardée dans ton espace Image publique.</p></section>`:''}`;document.getElementById('press')?.addEventListener('click',()=>press(s));document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>toggleBook(s,looks.find(x=>x.id===b.dataset.book)));document.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>toggleAteliergram(s,looks.find(x=>x.id===b.dataset.ag)))}function render(){renderList();renderMain()}render();})();</script></body></html>
