<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Jour J</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#78675d;--line:#e3d4c9;--coral:#e17b64;--dark:#291f1b;--green:#6f8d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.panel,.hero,.look,.result{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px #3b281d12}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 20px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:44px/.9 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.btn:disabled{opacity:.4;cursor:not-allowed}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:14px}.panel{padding:15px}.panel h2,.hero h2{font:30px Georgia,serif;margin:5px 0}.showlist{display:grid;gap:8px;margin-top:12px}.showpick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;cursor:pointer}.showpick.active{outline:2px solid var(--dark)}.showpick b{display:block;font:17px Georgia,serif}.showpick small,.meta{font:10px/1.45 Georgia,serif;color:var(--muted)}.hero{padding:18px}.herohead{display:flex;justify-content:space-between;gap:12px}.hero h2{font-size:38px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px}.stat small{font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:20px Georgia,serif;margin-top:3px}.checkbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.bigcheck{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;font:11px Georgia,serif}.bigcheck.ok{background:#f2f7f2;border-color:#bbd0bf}.looks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.look{padding:10px}.lookhead{display:grid;grid-template-columns:88px 1fr;gap:10px}.look img,.ph{width:88px;height:118px;border-radius:11px;background:#eee5df;object-fit:cover}.ph{display:grid;place-items:center;font:34px Georgia,serif}.look h3{font:21px Georgia,serif;margin:3px 0}.field{margin:8px 0}.field label{display:block;font:900 7px Arial;margin-bottom:4px}.field select{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:10px}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.toggle{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font:800 8px Arial;cursor:pointer}.toggle.on{background:#eff6ef;border-color:#b8ceb9;color:#4e7154}.result{padding:18px;margin-top:14px}.result h2{font:36px Georgia,serif;margin:4px 0}.empty{border:1px dashed #d4bdb0;border-radius:17px;padding:24px;text-align:center;font:16px Georgia,serif;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.looks{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.checkbar{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>JOUR <em>J</em></h1></div><div class="nav"><button class="btn" onclick="location.href='./'">← DÉFILÉS</button><button class="btn" onclick="location.href='../collections/'">COLLECTIONS</button><button class="btn dark" onclick="location.href='../agenda/'">AGENDA</button></div></header><div class="layout"><aside class="panel"><div class="k">SHOWS PRÊTS</div><h2>Backstage</h2><p class="meta">Les défilés validés apparaissent ici pour préparer le Jour J.</p><div class="showlist" id="showList"></div></aside><main id="main"></main></div></div><script src="../game-engine.js?v=20260902-runwayday1"></script><script>(function(){'use strict';const SK='haute-couture-runway-shows-v1',CK='haute-couture-collections-v1',CR='haute-couture-atelier-creations-v1';const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const models=[['m1','Alba Martin','éditoriale','36'],['m2','Jade Robert','élancée','34'],['m3','Mina Diallo','couture','36'],['m4','Lou Garcia','androgyn e','38'],['m5','Inès Vidal','romantique','34'],['m6','Nora Benali','graphique','36'],['m7','Éva Laurent','classique','38'],['m8','Sofia Rossi','dramatique','36'],['m9','Clara Nguyen','moderne','34'],['m10','Lina Morel','défilé','38'],['m11','Aya Petit','haute couture','36'],['m12','Maya Cohen','éditoriale','34']].map(x=>({id:x[0],name:x[1],style:x[2],size:x[3]}));function shows(){const a=read(SK,[]);return Array.isArray(a)?a:[]}function collections(){return read(CK,[])}function creations(){return read(CR,[])}function saveShow(s){const a=shows(),i=a.findIndex(x=>x.id===s.id);if(i>=0)a[i]=s;write(SK,a)}function game(){return window.HCGame||null}function currentDate(){return new Date(game()?.get?.().clock?.iso||Date.now())}function ensureDay(s){s.dayOfShow=s.dayOfShow||{assignments:{},fittings:{},accessories:{},rehearsalDone:false,backstageReady:false,scheduled:false,result:null};return s.dayOfShow}function lineUp(s){const c=collections().find(x=>x.id===s.collectionId),ids=s.runOrder?.length?s.runOrder:(c?.lookIds||[]),by=new Map(creations().map(x=>[x.id,x]));return ids.map(id=>by.get(id)).filter(Boolean).slice(0,s.looks)}function eligibleShows(){return shows().filter(s=>['ready','completed'].includes(s.status))}let activeId=new URLSearchParams(location.search).get('show')||null;function renderList(){const a=eligibleShows();if(!activeId)activeId=a[0]?.id||null;document.getElementById('showList').innerHTML=a.length?a.map(s=>`<div class="showpick ${s.id===activeId?'active':''}" data-id="${esc(s.id)}"><b>${esc(s.name)}</b><small>${esc(s.place)} · ${esc(s.date)} · ${s.status==='completed'?'terminé':'prêt'}</small></div>`).join(''):'<div class="empty">Aucun défilé validé pour le moment.</div>';document.querySelectorAll('.showpick').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function check(s){const d=ensureDay(s),looks=lineUp(s),assigned=looks.filter(x=>d.assignments[x.id]).length,fit=looks.filter(x=>d.fittings[x.id]).length,acc=looks.filter(x=>d.accessories[x.id]).length;return{looks,assigned,fit,acc,allAssigned:assigned===looks.length&&looks.length>=s.looks,allFit:fit===looks.length&&looks.length>=s.looks,allAcc:acc===looks.length&&looks.length>=s.looks,ready:assigned===looks.length&&fit===looks.length&&acc===looks.length&&looks.length>=s.looks&&d.rehearsalDone&&d.backstageReady}}function scheduleShow(s){const d=ensureDay(s);if(d.scheduled)return;const start=s.date+'T18:30:00',end=s.date+'T21:00:00';game()?.schedule?.({id:'runway-event-'+s.id,title:'Défilé — '+s.name,type:'runway',start,end,status:'planned',location:s.place});d.scheduled=true;saveShow(s)}function resultFor(s,prep){const d=ensureDay(s);if(d.result)return d.result;const roll=Math.random(),incident=roll<.14?'Un accessoire casse juste avant un passage.':roll<.25?'Un changement de tenue prend du retard en coulisses.':'Aucun incident majeur.';let score=55+s.prestige*3+(prep.ready?25:0)+(roll>.5?8:0);score=Math.max(0,Math.min(100,Math.round(score)));const label=score>=90?'Triomphe':score>=78?'Très beau succès':score>=65?'Défilé réussi':'Accueil mitigé';const repGain=Math.max(2,Math.round(s.prestige*2+(score-60)/10));d.result={score,label,incident,repGain,playedAt:new Date().toISOString()};s.status='completed';saveShow(s);game()?.addReputation?.(repGain,s.prestige>=3?'prestige':'scene','Défilé — '+s.name);game()?.addMessage?.({from:'Presse mode',avatar:'P',subject:'Retour — '+s.name,text:`${label}. Score du show : ${score}/100. ${incident} Ta visibilité progresse de ${repGain} points.`});return d.result}function renderMain(){const s=shows().find(x=>x.id===activeId),main=document.getElementById('main');if(!s){main.innerHTML='<div class="empty">Choisis un défilé prêt.</div>';return}const d=ensureDay(s),p=check(s),dateReached=currentDate()>=new Date(s.date+'T00:00:00');main.innerHTML=`<section class="hero"><div class="herohead"><div><div class="k">${esc(s.place)} · ${esc(s.date)}</div><h2>${esc(s.name)}</h2><div class="meta">${esc(s.theme)} · ${s.looks} passages · prestige ${s.prestige}/5</div></div><div class="actions">${!d.scheduled?'<button class="btn" id="schedule">AJOUTER À L’AGENDA</button>':'<button class="btn" disabled>✓ DANS L’AGENDA</button>'}</div></div><div class="stats"><div class="stat"><small>MANNEQUINS</small><b>${p.assigned}/${s.looks}</b></div><div class="stat"><small>ESSAYAGES</small><b>${p.fit}/${s.looks}</b></div><div class="stat"><small>ACCESSOIRES</small><b>${p.acc}/${s.looks}</b></div><div class="stat"><small>RÉPÉTITION</small><b>${d.rehearsalDone?'OK':'—'}</b></div><div class="stat"><small>BACKSTAGE</small><b>${d.backstageReady?'OK':'—'}</b></div></div><div class="checkbar"><div class="bigcheck ${p.allAssigned?'ok':''}">${p.allAssigned?'✓':'○'} Casting complet</div><div class="bigcheck ${p.allFit?'ok':''}">${p.allFit?'✓':'○'} Tous les essayages validés</div><div class="bigcheck ${p.allAcc?'ok':''}">${p.allAcc?'✓':'○'} Chaussures & accessoires préparés</div></div><div class="actions"><button class="btn ${d.rehearsalDone?'dark':''}" id="rehearsal">${d.rehearsalDone?'✓ RÉPÉTITION FAITE':'FAIRE LA RÉPÉTITION'}</button><button class="btn ${d.backstageReady?'dark':''}" id="backstage">${d.backstageReady?'✓ BACKSTAGE PRÊT':'PRÉPARER LE BACKSTAGE'}</button><button class="btn coral" id="launch" ${p.ready&&dateReached&&s.status!=='completed'?'':'disabled'}>${s.status==='completed'?'DÉFILÉ TERMINÉ':dateReached?'LANCER LE DÉFILÉ':'EN ATTENTE DU JOUR J'}</button></div><div class="looks">${p.looks.map((c,i)=>{const img=c.sketch?.url||c.image||c.url||'',used=new Set(Object.entries(d.assignments).filter(([id])=>id!==c.id).map(([,v])=>v));return`<article class="look"><div class="lookhead">${img?`<img src="${esc(img)}">`:'<div class="ph">✦</div>'}<div><div class="k">PASSAGE ${i+1}</div><h3>${esc(c.name||'Look')}</h3><div class="field"><label>MANNEQUIN</label><select data-model="${esc(c.id)}"><option value="">— Choisir —</option>${models.map(m=>`<option value="${m.id}" ${d.assignments[c.id]===m.id?'selected':''} ${used.has(m.id)?'disabled':''}>${esc(m.name)} · ${esc(m.style)} · T${m.size}</option>`).join('')}</select></div></div></div><div class="toggles"><button class="toggle ${d.fittings[c.id]?'on':''}" data-fit="${esc(c.id)}">${d.fittings[c.id]?'✓ ESSAYAGE OK':'ESSAYAGE'}</button><button class="toggle ${d.accessories[c.id]?'on':''}" data-acc="${esc(c.id)}">${d.accessories[c.id]?'✓ ACCESSOIRES OK':'ACCESSOIRES'}</button></div></article>`}).join('')}</div></section>${d.result?`<section class="result"><div class="k">RÉSULTAT DU SHOW</div><h2>${esc(d.result.label)}</h2><p class="meta">Score : <b>${d.result.score}/100</b> · +${d.result.repGain} réputation<br>${esc(d.result.incident)}</p></section>`:''}`;document.getElementById('schedule')?.addEventListener('click',()=>{scheduleShow(s);render()});document.querySelectorAll('[data-model]').forEach(sel=>sel.onchange=()=>{d.assignments[sel.dataset.model]=sel.value||null;saveShow(s);render()});document.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{d.fittings[b.dataset.fit]=!d.fittings[b.dataset.fit];saveShow(s);render()});document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{d.accessories[b.dataset.acc]=!d.accessories[b.dataset.acc];saveShow(s);render()});document.getElementById('rehearsal').onclick=()=>{d.rehearsalDone=!d.rehearsalDone;saveShow(s);render()};document.getElementById('backstage').onclick=()=>{d.backstageReady=!d.backstageReady;saveShow(s);render()};document.getElementById('launch').onclick=()=>{const q=check(s);if(!q.ready||currentDate()<new Date(s.date+'T00:00:00')||s.status==='completed')return;resultFor(s,q);render()}}function render(){renderList();renderMain()}render();})();</script></body></html>
