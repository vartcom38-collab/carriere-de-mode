<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Défilés</title><style>
:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#241c18;--muted:#7b685e;--line:#e3d4c9;--coral:#e17b64;--dark:#291f1b;--green:#6e8a72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.panel,.show,.workspace{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 36px rgba(60,42,31,.08)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px}.brand small,.k{font:900 8px Arial;letter-spacing:.14em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.layout{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2,.workspace h2{font:30px Georgia,serif;margin:5px 0}.list{display:grid;gap:9px;margin-top:12px}.show{padding:13px;cursor:pointer}.show.active{outline:2px solid var(--dark)}.show small{font:10px Georgia,serif;color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:5px 8px;background:#f1e6df;font:900 7px Arial;margin-top:7px}.workspace{padding:18px;min-height:420px}.hero{display:flex;justify-content:space-between;gap:14px}.hero h2{font:42px/.95 Georgia,serif}.meta{font:12px/1.55 Georgia,serif;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.stat small{font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:23px Georgia,serif;margin-top:3px}.field{margin:11px 0}.field label{display:block;font:900 8px Arial;margin-bottom:5px}.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.checks{display:grid;gap:7px;margin:12px 0}.check{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;font:11px/1.45 Georgia,serif}.check.ok{border-color:#bcd0bf;background:#f4f8f4}.looks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:12px}.look{border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px;cursor:grab}.look img,.ph{width:100%;aspect-ratio:3/4;border-radius:11px;background:#eee5df;object-fit:cover}.ph{display:grid;place-items:center;font:36px Georgia,serif}.look b{display:block;font:15px Georgia,serif;margin-top:7px}.look small{font-size:9px;color:var(--muted)}.order{display:flex;gap:5px;margin-top:6px}.order button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;font:800 7px Arial}.empty{border:1px dashed #d6bfb2;border-radius:18px;padding:24px;text-align:center;font:16px Georgia,serif;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.looks{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>MES <em>défilés</em></h1></div><div class="nav"><button class="btn" onclick="location.href='../collections/'">COLLECTIONS</button><button class="btn" onclick="location.href='../creations/?view=tracking'">MES CRÉATIONS</button><button class="btn dark" onclick="location.href='../atelier-raster/index-v2.html'">ATELIER</button></div></header><div class="layout"><aside class="panel"><div class="k">OPPORTUNITÉS</div><h2>Défilés</h2><p class="meta">Choisis un événement, inscris-toi puis prépare une collection complète.</p><div class="list" id="list"></div></aside><main class="workspace" id="workspace"></main></div></div><script>
(function(){'use strict';const SK='haute-couture-runway-shows-v1',CK='haute-couture-collections-v1',CR='haute-couture-atelier-creations-v1',PK='haute-couture-creative-projects-v1',AK='haute-couture-atelier-active-project-v1';const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function game(){try{return window.HCGame||window.parent?.HCGame||null}catch(_){return null}}function rep(){return Number(game()?.get?.().player?.reputation||0)}const seed=[{id:'runway-nimes-atelier',name:'Nîmes Créateurs — Présentation Atelier',place:'Nîmes',date:'2026-10-18',prestige:1,minRep:0,looks:6,theme:'Signature personnelle',notes:'Présenter une mini-collection cohérente de 6 looks.',reward:'Visibilité locale · presse régionale'},{id:'runway-occitanie',name:'Scène Mode Occitanie',place:'Montpellier',date:'2027-02-12',prestige:2,minRep:25,looks:8,theme:'Matière & mouvement',notes:'Au moins 8 looks, ligne cohérente et pièces réellement réalisées.',reward:'Notoriété régionale · nouveaux contacts'},{id:'runway-paris-emerging',name:'Paris Emerging Designers Show',place:'Paris',date:'2027-09-24',prestige:4,minRep:80,looks:12,theme:'Vision de maison',notes:'Collection complète, 12 looks, niveau de finition élevé.',reward:'Presse nationale · invitations professionnelles'}];function shows(){let a=read(SK,null);if(!Array.isArray(a)){a=seed.map(x=>({...x,status:'available',collectionId:null,runOrder:[]}));write(SK,a)}return a}function collections(){const a=read(CK,[]);return Array.isArray(a)?a:[]}function creations(){const a=read(CR,[]);return Array.isArray(a)?a:[]}function save(a){write(SK,a)}function syncProject(s){let p=read(PK,[]);const o={id:s.id,name:s.name,type:'defile',subtitle:s.place+' · '+s.date,source:'runway',eventName:s.name,showId:s.id,status:['registered','preparing'].includes(s.status)?'active':s.status,collectionId:s.collectionId,idea:s.theme};const i=p.findIndex(x=>String(x.id)===String(s.id));if(i>=0)p[i]={...p[i],...o};else p.unshift(o);write(PK,p.slice(0,200))}let activeId=null;function eligible(s){return rep()>=s.minRep}function readyLook(c){return /termin|livr|complete|fabrication planifiée|production/i.test(String(c?.status||''))}function analysis(s){const col=collections().find(x=>x.id===s.collectionId),ids=col?.lookIds||[],all=creations(),looks=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean),ready=looks.filter(readyLook);return{col,looks,ready,countOk:looks.length>=s.looks,readyOk:ready.length>=s.looks}}function statusLabel(s){return({available:'Disponible',registered:'Inscrite',preparing:'En préparation',ready:'Prêt pour le défilé',completed:'Défilé terminé'})[s.status]||s.status}function renderList(){const a=shows();document.getElementById('list').innerHTML=a.map(s=>`<article class="show ${s.id===activeId?'active':''}" data-id="${esc(s.id)}"><small>${esc(s.place)} · ${esc(s.date)}</small><h2>${esc(s.name)}</h2><small>${s.looks} looks · prestige ${s.prestige}/5</small><div class="tag">${esc(statusLabel(s))}</div></article>`).join('');document.querySelectorAll('.show').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function lookCard(c,i){const img=c?.sketch?.url||c?.image||c?.url||'';return`<article class="look" data-id="${esc(c.id)}"><div class="k">PASSAGE ${i+1}</div>${img?`<img src="${esc(img)}">`:'<div class="ph">✦</div>'}<b>${esc(c.name||'Look')}</b><small>${readyLook(c)?'Prêt / en production':'À réaliser'}</small><div class="order"><button data-up="${esc(c.id)}">↑</button><button data-down="${esc(c.id)}">↓</button></div></article>`}function renderWorkspace(){const s=shows().find(x=>x.id===activeId);const w=document.getElementById('workspace');if(!s){w.innerHTML='<div class="empty">Choisis un défilé pour voir les conditions.</div>';return}const a=analysis(s),eligibleNow=eligible(s),cols=collections();const order=(s.runOrder?.length?s.runOrder:(a.col?.lookIds||[]));const byId=new Map(creations().map(x=>[x.id,x])),looks=order.map(id=>byId.get(id)).filter(Boolean);w.innerHTML=`<div class="hero"><div><div class="k">${esc(s.place)} · PRESTIGE ${s.prestige}/5</div><h2>${esc(s.name)}</h2><div class="meta">${esc(s.date)} · thème : ${esc(s.theme)}<br>${esc(s.notes)}<br><b>Récompense :</b> ${esc(s.reward)}</div></div><div class="actions">${s.status==='available'?`<button class="btn coral" id="register" ${eligibleNow?'':'disabled'}>${eligibleNow?'S’INSCRIRE':'NOTORIÉTÉ INSUFFISANTE'}</button>`:''}${['registered','preparing','ready'].includes(s.status)?'<button class="btn dark" id="atelier">TRAVAILLER DANS L’ATELIER</button>':''}</div></div><div class="stats"><div class="stat"><small>NOTORIÉTÉ</small><b>${rep()}/${s.minRep}</b></div><div class="stat"><small>LOOKS REQUIS</small><b>${a.looks.length}/${s.looks}</b></div><div class="stat"><small>PRÊTS</small><b>${a.ready.length}/${s.looks}</b></div><div class="stat"><small>STATUT</small><b style="font-size:16px">${esc(statusLabel(s))}</b></div></div>${s.status!=='available'?`<div class="field"><label>COLLECTION PRÉSENTÉE</label><select id="collection"><option value="">— Choisir une collection —</option>${cols.map(c=>`<option value="${esc(c.id)}" ${c.id===s.collectionId?'selected':''}>${esc(c.name)} · ${(c.lookIds||[]).length}/${c.targetLooks||'?'} looks</option>`).join('')}</select></div><div class="checks"><div class="check ${a.countOk?'ok':''}">${a.countOk?'✓':'○'} Nombre de looks : ${a.looks.length}/${s.looks}</div><div class="check ${a.readyOk?'ok':''}">${a.readyOk?'✓':'○'} Looks prêts ou en production : ${a.ready.length}/${s.looks}</div><div class="check ${s.collectionId?'ok':''}">${s.collectionId?'✓':'○'} Collection sélectionnée</div></div><div class="actions"><button class="btn" id="sync">ACTUALISER L’ORDRE</button><button class="btn coral" id="ready" ${a.countOk&&a.readyOk?'':'disabled'}>VALIDER LA PRÉPARATION</button></div><div class="looks">${looks.length?looks.map(lookCard).join(''):'<div class="empty" style="grid-column:1/-1">Choisis une collection pour préparer l’ordre de passage.</div>'}</div>`:''}`;if(document.getElementById('register'))document.getElementById('register').onclick=()=>{s.status='registered';const arr=shows(),i=arr.findIndex(x=>x.id===s.id);arr[i]=s;save(arr);syncProject(s);render()};const sel=document.getElementById('collection');if(sel)sel.onchange=()=>{s.collectionId=sel.value||null;s.status=s.collectionId?'preparing':'registered';s.runOrder=[];const arr=shows(),i=arr.findIndex(x=>x.id===s.id);arr[i]=s;save(arr);syncProject(s);render()};if(document.getElementById('atelier'))document.getElementById('atelier').onclick=()=>{write(AK,{id:s.id,name:s.name,type:'defile',subtitle:s.place+' · '+s.date,source:'runway',showId:s.id,collectionId:s.collectionId,idea:s.theme,selectedAt:new Date().toISOString()});location.href='../atelier-raster/index-v2.html?v=20260902-runway1'};if(document.getElementById('sync'))document.getElementById('sync').onclick=()=>{s.runOrder=[...(a.col?.lookIds||[])];const arr=shows(),i=arr.findIndex(x=>x.id===s.id);arr[i]=s;save(arr);render()};if(document.getElementById('ready'))document.getElementById('ready').onclick=()=>{if(!(a.countOk&&a.readyOk))return;s.status='ready';const arr=shows(),i=arr.findIndex(x=>x.id===s.id);arr[i]=s;save(arr);syncProject(s);render()};document.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const id=b.dataset.up||b.dataset.down,d=b.dataset.up?-1:1,ids=s.runOrder?.length?s.runOrder:[...(a.col?.lookIds||[])],i=ids.indexOf(id),j=i+d;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];s.runOrder=ids;const arr=shows(),k=arr.findIndex(x=>x.id===s.id);arr[k]=s;save(arr);render()})}function render(){renderList();renderWorkspace()}const all=shows();activeId=all[0]?.id||null;render();})();
</script></body></html>
