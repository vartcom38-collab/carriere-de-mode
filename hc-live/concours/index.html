<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Concours</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#251d19;--muted:#78665c;--line:#e4d4c8;--coral:#e47e68;--dark:#2a211d;--green:#708d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1480px;margin:auto;padding:18px}.top,.card,.detail{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 38px rgba(65,43,31,.08)}.top{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.layout{display:grid;grid-template-columns:390px 1fr;gap:14px;margin-top:14px}.list{display:grid;gap:10px}.card{padding:15px;cursor:pointer}.card.active{outline:2px solid var(--dark)}.card h2{font:28px Georgia,serif;margin:4px 0}.meta{font:11px/1.5 Georgia,serif;color:var(--muted)}.badge{display:inline-block;margin-top:8px;border-radius:999px;padding:7px 10px;background:#eee3db;font:900 8px Arial}.badge.good{background:#edf5ee;color:#55745b}.badge.warn{background:#fff0e4;color:#9a634e}.detail{padding:20px}.detail h2{font:42px/.95 Georgia,serif;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat,.req,.slot{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px}.stat small,.req small,.slot small{display:block;font:900 7px Arial;color:var(--muted)}.stat b{display:block;font:23px Georgia,serif;margin-top:3px}.reqs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.req.ok{border-color:#c9ddcd;background:#f1f7f2}.req.no{border-color:#e7c8bc;background:#fff4ef}.selection{margin-top:16px}.selection h3{font:28px Georgia,serif;margin:5px 0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#eee}.slot b{display:block;font:16px Georgia,serif;margin:6px 0}.library{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.file{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px}.file img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}.file b{display:block;font:14px Georgia,serif;margin:6px 0}.file button{width:100%;border:0;border-radius:9px;padding:7px;background:var(--dark);color:#fff;font:800 7px Arial;cursor:pointer}.msg{margin:12px 0;padding:12px;border-radius:14px;background:#f5ebe3;font:12px/1.5 Georgia,serif}.empty{border:1px dashed #d8c1b4;border-radius:18px;padding:26px;text-align:center;font:16px Georgia,serif;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.stats,.reqs,.slots,.library{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><small>HAUTE COUTURE ✦ LIVE</small><h1>MES <em>concours</em></h1></div><div class="nav"><button class="btn" onclick="location.href='../creations/?view=tracking'">MES CRÉATIONS</button><button class="btn" onclick="location.href='../collections/'">COLLECTIONS</button><button class="btn dark" onclick="location.href='../atelier-raster/index-v2.html'">ATELIER</button></div></header><div class="layout"><aside class="list" id="list"></aside><main class="detail" id="detail"></main></div></div><script src="../game-engine.js?v=20260902-contest1"></script><script>(function(){'use strict';const $=s=>document.querySelector(s),read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const SKEY='haute-couture-contests-v1',PKEY='haute-couture-creative-projects-v1',CKEY='haute-couture-atelier-creations-v1',AKEY='haute-couture-atelier-active-project-v1';const defs=[{id:'concours-nimes-jeunes-talents',name:'Jeunes Talents de Nîmes',level:'Local',deadline:'2026-10-10',theme:'Mouvement méditerranéen',looks:2,minRep:0,constraint:'Au moins une silhouette doit intégrer un drapé ou un travail de matière.',reward:'Exposition locale + 500 €'},{id:'concours-nouvelle-silhouette',name:'Nouvelle Silhouette France',level:'National',deadline:'2026-11-20',theme:'Réinventer le vêtement de cérémonie',looks:3,minRep:25,constraint:'Trois silhouettes cohérentes ; au moins une pièce réalisée.',reward:'Presse + 2 500 €'},{id:'prix-jeune-createur',name:'Prix Jeune Créateur',level:'Sélectif',deadline:'2027-02-15',theme:'Signature personnelle',looks:5,minRep:60,constraint:'Mini-collection de cinq silhouettes et dossier artistique complet.',reward:'Résidence + défilé invité'}];function game(){try{return window.HCGame||window.parent?.HCGame||null}catch(_){return window.HCGame||null}}function rep(){return Number(game()?.get?.().player?.reputation||0)}function states(){let s=read(SKEY,null);if(!Array.isArray(s)){s=defs.map(x=>({...x,status:'available',creationIds:[]}));write(SKEY,s)}else{for(const d of defs){if(!s.some(x=>x.id===d.id))s.push({...d,status:'available',creationIds:[]})}write(SKEY,s)}return s}function creations(){const x=read(CKEY,[]);return Array.isArray(x)?x:[]}function saveAll(a){write(SKEY,a)}function syncProject(c){let p=read(PKEY,[]);const obj={id:c.id,name:c.name,type:'concours',subtitle:c.level+' · '+c.theme,source:'contest',status:['registered','preparing'].includes(c.status)?'active':c.status,eventName:c.name,idea:`Thème : ${c.theme}. Contrainte : ${c.constraint}`,deadline:c.deadline,targetLooks:c.looks};const i=p.findIndex(x=>x.id===c.id);if(i>=0)p[i]={...p[i],...obj};else p.unshift(obj);write(PKEY,p.slice(0,250))}function eligible(c){return rep()>=Number(c.minRep||0)}function complete(c){return (c.creationIds||[]).length>=c.looks}function submitted(c){return c.status==='submitted'||c.status==='result'}function human(c){return({available:'Disponible',registered:'Inscrite',preparing:'Dossier en préparation',submitted:'Dossier envoyé',result:'Résultat reçu'})[c.status]||c.status}let activeId=states()[0]?.id;function renderList(){const a=states();$('#list').innerHTML=a.map(c=>`<article class="card ${c.id===activeId?'active':''}" data-id="${esc(c.id)}"><div class="k">${esc(c.level)}</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.theme)}<br>Échéance : ${esc(c.deadline)}</div><span class="badge ${submitted(c)?'good':eligible(c)?'':'warn'}">${esc(human(c))}</span></article>`).join('');document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function renderDetail(){const a=states(),c=a.find(x=>x.id===activeId);if(!c){$('#detail').innerHTML='<div class="empty">Aucun concours.</div>';return}const all=creations(),sel=(c.creationIds||[]).map(id=>all.find(x=>x.id===id)).filter(Boolean),avail=all.filter(x=>!(c.creationIds||[]).includes(x.id)),ok=eligible(c),done=complete(c);$('#detail').innerHTML=`<div class="k">${esc(c.level)}</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.theme)} · dépôt avant ${esc(c.deadline)}</div><div class="stats"><div class="stat"><small>SILHOUETTES</small><b>${sel.length}/${c.looks}</b></div><div class="stat"><small>NOTORIÉTÉ REQUISE</small><b>${c.minRep}</b></div><div class="stat"><small>TA NOTORIÉTÉ</small><b>${rep()}</b></div><div class="stat"><small>STATUT</small><b>${esc(human(c))}</b></div></div><div class="reqs"><div class="req ${ok?'ok':'no'}"><small>ÉLIGIBILITÉ</small><b>${ok?'Condition remplie':'Notoriété insuffisante'}</b></div><div class="req ${done?'ok':'no'}"><small>DOSSIER CRÉATIF</small><b>${done?'Nombre de silhouettes atteint':`${sel.length}/${c.looks} silhouettes`}</b></div><div class="req"><small>CONTRAINTE</small><b>${esc(c.constraint)}</b></div><div class="req"><small>RÉCOMPENSE</small><b>${esc(c.reward)}</b></div></div>${c.status==='available'?`<div class="actions" style="margin-top:14px"><button class="btn coral" id="register" ${ok?'':'disabled'}>${ok?'S’INSCRIRE':'NON ÉLIGIBLE POUR LE MOMENT'}</button></div>`:`<div class="actions" style="margin-top:14px"><button class="btn dark" id="atelier" ${submitted(c)?'disabled':''}>TRAVAILLER DANS L’ATELIER</button>${!submitted(c)?`<button class="btn coral" id="submit" ${done?'':'disabled'}>${done?'ENVOYER LE DOSSIER':'DOSSIER INCOMPLET'}</button>`:''}</div>`}<section class="selection"><div class="k">DOSSIER DE CANDIDATURE</div><h3>Silhouettes sélectionnées</h3><div class="slots">${sel.length?sel.map((x,i)=>`<article class="slot">${x.sketch?.url||x.image||x.url?`<img src="${esc(x.sketch?.url||x.image||x.url)}">`:''}<small>SILHOUETTE ${i+1}</small><b>${esc(x.name||'Création')}</b>${!submitted(c)?`<button class="btn" data-remove="${esc(x.id)}">RETIRER</button>`:''}</article>`).join(''):'<div class="empty" style="grid-column:1/-1">Aucune création sélectionnée.</div>'}</div>${!submitted(c)?`<div class="library">${avail.map(x=>`<article class="file">${x.sketch?.url||x.image||x.url?`<img src="${esc(x.sketch?.url||x.image||x.url)}">`:''}<b>${esc(x.name||'Création')}</b><button data-add="${esc(x.id)}">AJOUTER AU DOSSIER</button></article>`).join('')}</div>`:''}</section>`;$('#register')?.addEventListener('click',()=>{c.status='registered';c.registeredAt=new Date().toISOString();syncProject(c);saveAll(a);render()});$('#atelier')?.addEventListener('click',()=>{write(AKEY,{id:c.id,name:c.name,type:'concours',subtitle:c.level+' · '+c.theme,source:'contest',idea:`Thème : ${c.theme}. Contrainte : ${c.constraint}`,selectedAt:new Date().toISOString()});location.href='../atelier-raster/index-v2.html?v=20260902-contest1'});$('#submit')?.addEventListener('click',()=>{if(!complete(c))return;c.status='submitted';c.submittedAt=new Date().toISOString();syncProject(c);saveAll(a);render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if((c.creationIds||[]).length>=c.looks)return;c.creationIds=c.creationIds||[];c.creationIds.push(b.dataset.add);c.status='preparing';saveAll(a);syncProject(c);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{c.creationIds=(c.creationIds||[]).filter(id=>id!==b.dataset.remove);saveAll(a);render()})}function render(){renderList();renderDetail()}render()})();</script></body></html>
