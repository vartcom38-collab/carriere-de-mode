<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haute Couture Live — Concours</title><style>:root{--bg:#efe6dc;--paper:#fffaf4;--ink:#251d19;--muted:#78665c;--line:#e4d4c8;--coral:#e47e68;--dark:#2a211d;--green:#708d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1480px;margin:auto;padding:18px}.top,.card,.detail{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 38px rgba(65,43,31,.08)}.top{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small,.k{font:900 8px Arial;letter-spacing:.15em;color:var(--coral)}.brand h1{font:46px/.92 Georgia,serif;margin:4px 0}.brand em{font-weight:400;color:var(--coral)}.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:900 8px Arial;cursor:pointer}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.coral{background:var(--coral);color:#fff;border-color:var(--coral)}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:390px 1fr;gap:14px;margin-top:14px}.list{display:grid;gap:10px}.card{padding:15px;cursor:pointer}.card.active{outline:2px solid var(--dark)}.card h2{font:28px Georgia,serif;margin:4px 0}.meta{font:11px/1.5 Georgia,serif;color:var(--muted)}.badge{display:inline-block;margin-top:8px;border-radius:999px;padding:7px 10px;background:#eee3db;font:900 8px Arial}.badge.good{background:#edf5ee;color:#55745b}.badge.warn{background:#fff0e4;color:#9a634e}.detail{padding:20px}.detail h2{font:42px/.95 Georgia,serif;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat,.req,.slot,.result{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px}.stat small,.req small,.slot small{display:b e-engine.js?v=20260902-contest2"></script><script>(function(){'use strict';const $=s=>document.querySelector(s),read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??f}catch(_){return f}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const SKEY='haute-couture-contests-v1',PKEY='haute-couture-creative-projects-v1',CKEY='haute-couture-atelier-creations-v1',AKEY='haute-couture-atelier-active-project-v1',PRESS='haute-couture-press-v1';const defs=[{id:'concours-nimes-jeunes-talents',name:'Jeunes Talents de Nîmes',level:'Local',deadline:'2026-10-10',theme:'Mouvement méditerranéen',looks:2,minRep:0,constraint:'Au moins une silhouette doit intégrer un drapé ou un travail de matière.',reward:'Exposition locale + 500 €',prizeAmount:500},{id:'concours-nouvelle-silhouette',name:'Nouvelle Silhouette France',level:'National',deadline:'2026-11-20',theme:'Réinventer le vêtement de cérémonie',looks:3,minRep:25,constraint:'Trois silhouettes cohérentes ; au moins une pièce réalisée.',reward:'Presse + 2 500 €',prizeAmount:2500},{id:'prix-jeune-createur',name:'Prix Jeune Créateur',level:'Sélectif',deadline:'2027-02-15',theme:'Signature personnelle',looks:5,minRep:60,constraint:'Mini-collection de cinq silhouettes et dossier artistique complet.',reward:'Résidence + défilé invité',prizeAmount:0}];function game(){try{return window.HCGame||window.parent?.HCGame||null}catch(_){return window.HCGame||null}}function gameNow(){return new Date(game()?.get?.().clock?.iso||Date.now())}function rep(){return Number(game()?.get?.().player?.reputation||0)}function states(){let s=read(SKEY,null);if(!Array.isArray(s)){s=defs.map(x=>({...x,status:'available',creationIds:[]}));write(SKEY,s)}else{for(const d of defs){const old=s.find(x=>x.id===d.id);if(!old)s.push({...d,status:'available',creationIds:[]});else Object.assign(old,{...d,status:old.status,creationIds:old.creationIds||[],result:old.result||null})}write(SKEY,s)}return s}function creations(){const x=read(CKEY,[]);return Array.isArray(x)?x:[]}function saveAll(a){write(SKEY,a)}function syncProject(c){let p=read(PKEY,[]);const obj={id:c.id,name:c.name,type:'concours',subtitle:c.level+' · '+c.theme,source:'contest',status:['registered','preparing'].includes(c.status)?'active':c.status,eventName:c.name,idea:`Thème : ${c.theme}. Contrainte : ${c.constraint}`,deadline:c.deadline,targetLooks:c.looks};const i=p.findIndex(x=>String(x.id)===String(c.id));if(i>=0)p[i]={...p[i],...obj};else p.unshift(obj);write(PKEY,p.slice(0,250))}function eligible(c){return rep()>=Number(c.minRep||0)}function complete(c){return (c.creationIds||[]).length>=c.looks}function submitted(c){return c.status==='submitted'||c.status==='result'}function deadlineReached(c){return gameNow()>=new Date(c.deadline+'T00:00:00')}function human(c){return({available:'Disponible',registered:'Inscrite',preparing:'Dossier en préparation',submitted:'Dossier envoyé',result:'Résultat reçu'})[c.status]||c.status}function addPress(c,r){let a=read(PRESS,[]);if(!Array.isArray(a))a=[];if(a.some(x=>x.contestId===c.id))return;let headline,text;if(r.placement===1){headline=`${c.name} : une jeune créatrice remporte le prix`;text=`Le jury distingue la cohérence du dossier autour de « ${c.theme} ». Cette victoire installe une nouvelle étape dans la carrière.`}else if(r.placement<=3){headline=`${c.name} : une place remarquée parmi les finalistes`;text=`Le dossier se classe ${r.placement}e et attire l’attention du jury sur l’identité créative présentée.`}else{headline=`Sélection remarquée au ${c.name}`;text=`Le concours apporte une nouvelle visibilité professionnelle et enrichit le parcours de la créatrice.`}a.unshift({id:'press-contest-'+c.id,contestId:c.id,contestName:c.name,media:c.level==='Local'?'Presse locale':'Presse mode',headline,text,score:r.score,createdAt:new Date().toISOString()});write(PRESS,a.slice(0,300))}function revealResult(c){if(c.status!=='submitted'||!deadlineReached(c)||c.result)return;const selected=(c.creationIds||[]).map(id=>creations().find(x=>x.id===id)).filter(Boolean),finished=selected.filter(x=>/termin|livr|complete|fabrication planifiée|production/i.test(String(x.status||''))).length;const prep=selected.length?finished/selected.length:0;const levelBonus=c.level==='Sélectif'?4:c.level==='National'?2:0;const score=Math.max(45,Math.min(98,Math.round(52+Math.min(22,rep()*.18)+prep*18+levelBonus+Math.random()*12)));const placement=score>=91?1:score>=83?2:score>=76?3:score>=68?5:8;const label=placement===1?'Lauréate':placement<=3?'Finaliste primée':placement<=5?'Finaliste':'Participation remarquée';const repGain=placement===1?12:placement<=3?8:placement<=5?5:2;c.result={score,placement,label,repGain,revealedAt:new Date().toISOString()};c.status='result';syncProject(c);addPress(c,c.result);game()?.addReputation?.(repGain,placement===1?'prestige':'professional','Résultat concours — '+c.name);if(placement===1&&Number(c.prizeAmount)>0)game()?.transact?.(Number(c.prizeAmount),'Prix — '+c.name,'concours');game()?.addMessage?.({from:'Organisation du concours',avatar:'✦',subject:'Résultat — '+c.name,text:`${label} · ${placement}e place · score ${score}/100. +${repGain} réputation.${placement===1&&c.prizeAmount?' Prix : '+c.prizeAmount+' €.':''}`})}let activeId=states()[0]?.id;function renderList(){const a=states();$('#list').innerHTML=a.map(c=>`<article class="card ${c.id===activeId?'active':''}" data-id="${esc(c.id)}"><div class="k">${esc(c.level)}</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.theme)}<br>Échéance : ${esc(c.deadline)}</div><span class="badge ${submitted(c)?'good':eligible(c)?'':'warn'}">${esc(human(c))}</span></article>`).join('');document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;render()})}function renderDetail(){const a=states(),c=a.find(x=>x.id===activeId);if(!c){$('#detail').innerHTML='<div class="empty">Aucun concours.</div>';return}const all=creations(),sel=(c.creationIds||[]).map(id=>all.find(x=>x.id===id)).filter(Boolean),avail=all.filter(x=>!(c.creationIds||[]).includes(x.id)),ok=eligible(c),done=complete(c),canResult=c.status==='submitted'&&deadlineReached(c);$('#detail').innerHTML=`<div class="k">${esc(c.level)}</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.theme)} · dépôt avant ${esc(c.deadline)}</div><div class="stats"><div class="stat"><small>SILHOUETTES</small><b>${sel.length}/${c.looks}</b></div><div class="stat"><small>NOTORIÉTÉ REQUISE</small><b>${c.minRep}</b></div><div class="stat"><small>TA NOTORIÉTÉ</small><b>${rep()}</b></div><div class="stat"><small>STATUT</small><b>${esc(human(c))}</b></div></div><div class="reqs"><div class="req ${ok?'ok':'no'}"><small>ÉLIGIBILITÉ</small><b>${ok?'Condition remplie':'Notoriété insuffisante'}</b></div><div class="req ${done?'ok':'no'}"><small>DOSSIER CRÉATIF</small><b>${done?'Nombre de silhouettes atteint':`${sel.length}/${c.looks} silhouettes`}</b></div><div class="req"><small>CONTRAINTE</small><b>${esc(c.constraint)}</b></div><div class="req"><small>RÉCOMPENSE</small><b>${esc(c.reward)}</b></div></div>${c.status==='available'?`<div class="actions" style="margin-top:14px"><button class="btn coral" id="register" ${ok?'':'disabled'}>${ok?'S’INSCRIRE':'NON ÉLIGIBLE POUR LE MOMENT'}</button></div>`:`<div class="actions" style="margin-top:14px">${['registered','preparing'].includes(c.status)?'<button class="btn dark" id="atelier">TRAVAILLER DANS L’ATELIER</button>':''}${!submitted(c)?`<button class="btn coral" id="submit" ${done?'':'disabled'}>${done?'ENVOYER LE DOSSIER':'DOSSIER INCOMPLET'}</button>`:''}${c.status==='submitted'?`<button class="btn coral" id="result" ${canResult?'':'disabled'}>${canResult?'VOIR LE RÉSULTAT':'EN ATTENTE DU JURY'}</button>`:''}${c.status==='result'?'<button class="btn dark" onclick="location.href=\'../image-publique/?tab=press\'">VOIR LES RETOMBÉES</button>':''}</div>`}${c.result?`<section class="result"><div class="k">RÉSULTAT OFFICIEL</div><h3>${esc(c.result.label)}</h3><strong>${c.result.placement}e place · ${c.result.score}/100</strong><p class="meta">+${c.result.repGain} réputation${c.result.placement===1&&c.prizeAmount?' · '+c.prizeAmount+' € remportés':''}. La retombée presse est enregistrée dans Image publique.</p></section>`:''}<section class="selection"><div class="k">DOSSIER DE CANDIDATURE</div><h3>Silhouettes sélectionnées</h3><div class="slots">${sel.length?sel.map((x,i)=>`<article class="slot">${x.sketch?.url||x.image||x.url?`<img src="${esc(x.sketch?.url||x.image||x.url)}">`:''}<small>SILHOUETTE ${i+1}</small><b>${esc(x.name||'Création')}</b>${!submitted(c)?`<button class="btn" data-remove="${esc(x.id)}">RETIRER</button>`:''}</article>`).join(''):'<div class="empty" style="grid-column:1/-1">Aucune création sélectionnée.</div>'}</div>${!submitted(c)?`<div class="library">${avail.map(x=>`<article class="file">${x.sketch?.url||x.image||x.url?`<img src="${esc(x.sketch?.url||x.image||x.url)}">`:''}<b>${esc(x.name||'Création')}</b><button data-add="${esc(x.id)}">AJOUTER AU DOSSIER</button></article>`).join('')}</div>`:''}</section>`;$('#register')?.addEventListener('click',()=>{c.status='registered';c.registeredAt=new Date().toISOString();syncProject(c);saveAll(a);render()});$('#atelier')?.addEventListener('click',()=>{write(AKEY,{id:c.id,name:c.name,type:'concours',subtitle:c.level+' · '+c.theme,source:'contest',idea:`Thème : ${c.theme}. Contrainte : ${c.constraint}`,selectedAt:new Date().toISOString()});location.href='../atelier-raster/index-v2.html?v=20260902-contest2'});$('#submit')?.addEventListener('click',()=>{if(!complete(c))return;c.status='submitted';c.submittedAt=new Date().toISOString();syncProject(c);saveAll(a);render()});$('#result')?.addEventListener('click',()=>{revealResult(c);saveAll(a);render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if((c.creationIds||[]).length>=c.looks)return;c.creationIds=c.creationIds||[];c.creationIds.push(b.dataset.add);c.status='preparing';saveAll(a);syncProject(c);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{c.creationIds=(c.creationIds||[]).filter(id=>id!==b.dataset.remove);saveAll(a);render()})}function render(){renderList();renderDetail()}render()})();</script></body></html>
