<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Haute Couture Live — Atelier dessin</title><style>:root{--ink:#251e1a;--muted:#75665d;--line:#ddd0c5;--paper:#fffaf4;--teal:#4d8d86;--coral:#df7864}*{box-sizing:border-box}body{margin:0;background:#efe5dc;color:var(--ink);font-family:Arial,sans-serif;touch-action:manipulation}.wrap{max-width:1180px;margin:auto;padding:28px 16px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.eyebrow{font:900 9px/1 Arial;letter-spacing:.15em;color:var(--coral)}h1{font:42px/1 Georgia,serif;margin:9px 0}.lead{font:13px/1.5 Georgia,serif;color:var(--muted);max-width:700px}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-top:18px}.panel,.paper{background:var(--paper);border:1px solid var(--line);border-radius:20px}.panel{padding:16px}.lesson{padding:12px;border-radius:13px;background:#f4ece6;margin:8px 0;cursor:pointer}.lesson.active{background:#2d2723;color:#fff}.lesson b{font-size:11px}.lesson p{font:11px/1.4 Georgia,serif;margin:5px 0 0;color:inherit;opacity:.8}.paper{padding:12px;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.toolbar button,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:800}.canvasWrap{position:relative;width:100%;aspect-ratio:4/5;background:white;border:1px solid #e7ddd5;border-radius:12px;overflow:hidden;touch-action:none}.guide,.draw{position:absolute;inset:0;width:100%;height:100%}.guide{pointer-events:none}.draw{touch-action:none}.task{margin-top:12px;padding:14px;border-radius:14px;background:#edf4f2;font:13px/1.5 Georgia,serif}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:12px;padding:11px 13px;background:var(--teal);color:#fff;font-weight:900}.actions button.dark{background:#29211d}.saved{font:11px Georgia,serif;color:var(--muted);margin-top:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{display:block}h1{font-size:36px}.panel{order:2}.paper{order:1}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">ÉCOLE · DESSIN AU STYLET</div><h1>Apprendre à dessiner la mode</h1><p class="lead">Pas à pas : geste, axe, proportions, attitude, silhouette puis vêtement. Le but est d’entraîner ton regard et ta main, pas de produire immédiatement un dessin parfait.</p></div></div><div class="layout"><aside class="panel" id="lessons"></aside><section class="paper"><div class="toolbar"><select id="width"><option value="2">Trait fin</option><option value="4" selected>Trait moyen</option><option value="7">Trait épais</option></select><button id="undo">ANNULER</button><button id="clear">EFFACER</button><button id="guideBtn">GUIDE ON/OFF</button></div><div class="canvasWrap"><canvas class="guide" id="guide"></canvas><canvas class="draw" id="draw"></canvas></div><div class="task" id="task"></div><div class="actions"><button id="save">ENREGISTRER L’EXERCICE</button><button class="dark" onclick="location.href='../school/'">RETOUR ÉCOLE</button></div><div class="saved" id="saved"></div></section></div></main><script>(function(){const KEY='haute-couture-drawing-practice-v1';const lessons=[{id:'gesture',title:'01 · Libérer la main',desc:'Traits longs, continus, sans gomme.',task:'Fais 20 lignes longues d’un seul geste. Puis 10 courbes en S. Ne cherche pas à dessiner un vêtement.',guide:'lines'},{id:'axis',title:'02 · Ligne d’action',desc:'Trouver l’énergie de la pose.',task:'Trace 8 lignes d’action différentes : debout, inclinée, marche, torsion. Ajoute seulement épaules et bassin.',guide:'axis'},{id:'proportion',title:'03 · Proportions',desc:'Construire une figure cohérente.',task:'Construis une silhouette avec repères tête, épaules, taille, bassin, genoux et pieds. Allonge-la ensuite légèrement sans perdre la cohérence.',guide:'proportion'},{id:'weight',title:'04 · Appuis & attitude',desc:'Comprendre où passe le poids.',task:'Dessine 4 poses. Pour chacune, décide quelle jambe porte le poids et fais réagir bassin et épaules.',guide:'weight'},{id:'silhouette',title:'05 · Masse du vêtement',desc:'Voir grand avant les détails.',task:'Sur une figure simple, dessine 6 silhouettes de vêtement uniquement par contour extérieur : ajustée, A, droite, ample, asymétrique, volumineuse.',guide:'figure'},{id:'fabric',title:'06 · Tombé',desc:'Faire sentir une matière.',task:'Dessine le même vêtement 3 fois : une version souple, une version raide, une version lourde. Change seulement plis, tension et tombé.',guide:'figure'}];let current=0,strokes=[],stroke=null,guideOn=true;const draw=document.getElementById('draw'),guide=document.getElementById('guide'),ctx=draw.getContext('2d'),g=guide.getContext('2d');function resize(){for(const c of [draw,guide]){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0)}redraw()}new ResizeObserver(resize).observe(draw.parentElement);function point(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||.5}}function start(e){e.preventDefault();stroke=[point(e)];strokes.push(stroke);draw.setPointerCapture?.(e.pointerId)}function move(e){if(!stroke)return;e.preventDefault();stroke.push(point(e));redraw()}function end(){stroke=null}draw.addEventListener('pointerdown',start);draw.addEventListener('pointermove',move);draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);function redraw(){const r=draw.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2c2622';for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.lineWidth=Number(document.getElementById('width').value)||4;ctx.stroke()}drawGuide()}function drawGuide(){const r=guide.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);if(!guideOn)return;g.strokeStyle='rgba(86,120,115,.22)';g.lineWidth=1.5;g.setLineDash([6,6]);const type=lessons[current].guide;if(type==='lines'){for(let y=50;y<r.height;y+=55){g.beginPath();g.moveTo(40,y);g.lineTo(r.width-40,y);g.stroke()}}else{const cx=r.width/2;g.beginPath();g.moveTo(cx,30);g.lineTo(cx,r.height-30);g.stroke();if(['proportion','weight','figure','axis'].includes(type)){const ys=[.12,.25,.38,.52,.72,.92].map(v=>r.height*v);ys.forEach(y=>{g.beginPath();g.moveTo(cx-55,y);g.lineTo(cx+55,y);g.stroke()});g.beginPath();g.ellipse(cx,r.height*.09,22,28,0,0,Math.PI*2);g.stroke()}}}function renderLessons(){document.getElementById('lessons').innerHTML=lessons.map((l,i)=>`<div class="lesson ${i===current?'active':''}" data-i="${i}"><b>${l.title}</b><p>${l.desc}</p></div>`).join('');document.getElementById('task').innerHTML='<b>EXERCICE</b><br>'+lessons[current].task;document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{current=Number(x.dataset.i);strokes=[];renderLessons();redraw()})}document.getElementById('undo').onclick=()=>{strokes.pop();redraw()};document.getElementById('clear').onclick=()=>{strokes=[];redraw()};document.getElementById('guideBtn').onclick=()=>{guideOn=!guideOn;drawGuide()};document.getElementById('save').onclick=()=>{const data=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return {}}})();data[lessons[current].id]={savedAt:new Date().toISOString(),image:draw.toDataURL('image/png'),strokeCount:strokes.length};localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saved').textContent='Exercice enregistré dans ta progression.';if(window.HCKnowledge)window.HCKnowledge.learn('drawing:'+lessons[current].id,{source:'school',label:lessons[current].title})};renderLessons();resize()})();</script><script src="../school/knowledge-registry-v1.js?v=20260903-draw1"></script><script src="../server-save-bridge-v1.js?v=20260903-draw1" defer></script><script src="../global-menu-v1.js?v=20260903-draw1" defer></script></body></html>
